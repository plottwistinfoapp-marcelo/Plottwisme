<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila, Cartelera Global & Comunidad</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains+Mono', monospace; }
  </style>
</head>
<body class="antialiased bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // USUARIOS INICIALES (MANTIENE PRIVILEGIOS DE ADMINISTRADOR DE MARCELO)
    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Marcelo Buttice',
        email: 'marbuttice@gmail.com',
        age: 57,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
        location: 'Oberá, Misiones, Argentina',
        distanceKm: 2.5,
        role: 'admin',
        roleLabel: 'Administrador General',
        isPremium: true,
        isCritic: true,
        verified: true,
        bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@marbuttice', radio: 'Frecuencia Cine', tv: 'Canal 12 Misiones' },
        receivedLikes: 14
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        email: 'elena@gmail.com',
        age: 24,
        sex: 'Femenino',
        lookingFor: 'Amigos Cinéfilos',
        location: 'Posadas, Misiones, Argentina',
        distanceKm: 85.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro & Crítica',
        isPremium: false,
        isCritic: true,
        verified: true,
        bio: 'Directora de cortos amateur y crítica de cine asiático y de autor.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@elenamonterok', radio: 'Columnista Radio LT3', tv: 'Canal 12 Misiones' },
        receivedLikes: 29
      },
      {
        id: 'u3',
        name: 'Mateo Fernández',
        email: 'mateo@gmail.com',
        age: 31,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja',
        location: 'Encarnación, Itapúa, Paraguay',
        distanceKm: 140.0,
        role: 'general',
        roleLabel: 'Cinéfilo Pro',
        isPremium: false,
        isCritic: false,
        verified: false,
        bio: 'Coleccionista de Blu-ray y apasionado del cine de culto y Neo-Noir.',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@mateocine', radio: '', tv: '' },
        receivedLikes: 8
      }
    ];

    // CATÁLOGO BASE DE ENTRADA (MIENTRAS SE CONECTA API TMDB)
    const FALLBACK_TMDB_MOVIES = [
      {
        id: 693134,
        title: 'Dune: Parte Dos',
        overview: 'Paul Atreides se une a Chani y los Fremen mientras busca venganza contra los conspiradores que destruyeron a su familia.',
        poster_path: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80',
        vote_average: 8.5,
        release_date: '2024-02-27',
        genre: 'Ciencia Ficción'
      },
      {
        id: 872585,
        title: 'Oppenheimer',
        overview: 'La historia del físico J. Robert Oppenheimer y su papel en el desarrollo de la bomba atómica.',
        poster_path: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600&auto=format&fit=crop&q=80',
        vote_average: 8.1,
        release_date: '2023-07-19',
        genre: 'Drama / Historia'
      },
      {
        id: 792307,
        title: 'Pobres Criaturas',
        overview: 'La fantástica historia y evolución de Bella Baxter, una joven resucitada por un brillante científico.',
        poster_path: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop&q=80',
        vote_average: 7.8,
        release_date: '2023-12-07',
        genre: 'Comedia Negra'
      }
    ];

    const INITIAL_REVIEWS = [
      {
        id: 'r1',
        author: 'Elena Montero',
        movieTitle: 'Dune: Parte Dos',
        rating: 10,
        content: 'Villeneuve logra una de las obras maestras de la ciencia ficción moderna. El diseño de sonido y la fotografía en IMAX son monumentales.',
        mediaOutlet: 'Columnista Radio LT3 / Canal 12 Misiones',
        date: '2026-06-10'
      }
    ];

    const COUNTRY_CODES = [
      { code: 'AR', name: 'Argentina 🇦🇷' },
      { code: 'ES', name: 'España 🇪🇸' },
      { code: 'MX', name: 'México 🇲🇽' },
      { code: 'US', name: 'Estados Unidos 🇺🇸' },
      { code: 'CL', name: 'Chile 🇨🇱' },
      { code: 'CO', name: 'Colombia 🇨🇴' },
      { code: 'PY', name: 'Paraguay 🇵🇾' },
      { code: 'UY', name: 'Uruguay 🇺🇾' },
      { code: 'BR', name: 'Brasil 🇧🇷' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => INITIAL_USERS[0]);
      const [activeTab, setActiveTab] = useState('radar');
      const [currentIndex, setCurrentIndex] = useState(0);

      // ESTADOS DE UBICACIÓN GLOBAL
      const [userCity, setUserCity] = useState('Oberá, Misiones');
      const [userCountryCode, setUserCountryCode] = useState('AR');

      // ESTADOS DE TMDB & CARTELERA DINÁMICA GLOBAL
      const [tmdbApiKey, setTmdbApiKey] = useState('');
      const [moviesList, setMoviesList] = useState(FALLBACK_TMDB_MOVIES);
      const [isLoadingTmdb, setIsLoadingTmdb] = useState(false);
      const [showSubscriptionModal, setShowSubscriptionModal] = useState(false);

      const [usersList, setUsersList] = useState(INITIAL_USERS);
      const [reviewsList, setReviewsList] = useState(INITIAL_REVIEWS);

      // ESTADOS FORMULARIO RESEÑA
      const [newReviewMovie, setNewReviewMovie] = useState('');
      const [newReviewRating, setNewReviewRating] = useState(10);
      const [newReviewText, setNewReviewText] = useState('');

      // ESTADOS PERFIL
      const [editBio, setEditBio] = useState(currentUser.bio);
      const [editAvatar, setEditAvatar] = useState(currentUser.avatar);
      const [editRadio, setEditRadio] = useState(currentUser.socialLinks.radio);
      const [editTv, setEditTv] = useState(currentUser.socialLinks.tv);
      const [editTwitter, setEditTwitter] = useState(currentUser.socialLinks.twitter);

      // Cargar cartelera global activa en cines (TMDB now_playing por país)
      const fetchTmdbNowPlaying = async (key, country) => {
        if (!key) return;
        setIsLoadingTmdb(true);
        try {
          // Endpoint 'now_playing' filtrado por el código de país exacto del usuario
          const res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${key}&language=es-ES&region=${country}&page=1`);
          const data = await res.json();

          if (data.results && data.results.length > 0) {
            const formatted = data.results.map(m => ({
              id: m.id,
              title: m.title || m.original_title,
              overview: m.overview || 'Sin descripción disponible para esta película.',
              poster_path: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop&q=80',
              vote_average: m.vote_average ? m.vote_average.toFixed(1) : '8.0',
              release_date: m.release_date || 'En cartelera',
              genre: 'Estreno en Cines'
            }));
            setMoviesList(formatted);
            alert(`🍿 Cartelera actualizada: mostrando estrenos activos en ${country}!`);
          } else {
            alert('No se encontraron películas activas para esa combinación. Manteniendo catálogo base.');
          }
        } catch (err) {
          alert('Error al conectar con TMDb. Revisa tu API Key.');
        } finally {
          setIsLoadingTmdb(false);
        }
      };

      // Auto-reconsultar si cambia el país y hay API Key
      useEffect(() => {
        if (tmdbApiKey) {
          fetchTmdbNowPlaying(tmdbApiKey, userCountryCode);
        }
      }, [userCountryCode]);

      // Redirección en tiempo real a Google / Google Maps
      const handleOpenGoogleTheaters = (movieTitle) => {
        const query = `cartelera cine ${movieTitle} en ${userCity}`;
        const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        window.open(url, '_blank');
      };

      const maxDistance = currentUser.isPremium ? 500 : 100;
      const filteredCandidates = useMemo(() => {
        return usersList.filter(u => u.email !== currentUser.email && u.distanceKm <= maxDistance);
      }, [usersList, currentUser, maxDistance]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleUpgradePlan = (isPrem) => {
        const updated = { 
          ...currentUser, 
          isPremium: isPrem, 
          roleLabel: isPrem ? 'Cinéfilo Premium ⭐' : 'Cinéfilo Estándar' 
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        setShowSubscriptionModal(false);
        alert(isPrem ? '🎉 ¡Plan Premium Activo ($4.99 USD)! Cobertura de radar hasta 500 km.' : 'ℹ️ Has cambiado al Plan Estándar (100 km).');
      };

      const handleLikeCandidate = () => {
        if (!currentCandidate) return;
        alert(`🍿 ¡Le diste Me Gusta a ${currentCandidate.name}!`);
        setCurrentIndex(prev => prev + 1);
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const updated = {
          ...currentUser,
          bio: editBio,
          avatar: editAvatar,
          socialLinks: { radio: editRadio, tv: editTv, twitter: editTwitter }
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        alert('✅ ¡Perfil actualizado correctamente!');
      };

      const handlePublishReview = (e) => {
        e.preventDefault();
        if (!newReviewMovie || !newReviewText) return;
        const newRev = {
          id: 'r_' + Date.now(),
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: currentUser.socialLinks.radio || currentUser.roleLabel,
          date: new Date().toISOString().split('T')[0]
        };
        setReviewsList([newRev, ...reviewsList]);
        setNewReviewMovie('');
        setNewReviewText('');
        alert('📝 ¡Reseña publicada!');
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* HEADER PRINCIPAL */}
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('radar')}>
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                <div>
                  <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                  <p className="text-[10px] uppercase text-slate-400 font-bold">{currentUser.isPremium ? '⭐ Plan Premium (500 km)' : '👤 Plan Estándar (100 km)'}</p>
                </div>
              </div>

              {/* BARRA DE UBICACIÓN DINÁMICA CIUDAD + PAÍS */}
              <div className="flex flex-wrap items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-2xl text-xs w-full lg:w-auto justify-center">
                <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ubicación:</span>
                <input 
                  type="text" 
                  value={userCity} 
                  onChange={(e) => setUserCity(e.target.value)} 
                  className="bg-transparent border-0 px-1 py-0.5 font-bold w-36 text-amber-300 focus:outline-none" 
                  placeholder="Ciudad (Ej: Oberá)..." 
                />
                <span className="text-slate-600">|</span>
                <select 
                  value={userCountryCode} 
                  onChange={(e) => setUserCountryCode(e.target.value)}
                  className="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer"
                >
                  {COUNTRY_CODES.map(c => (
                    <option key={c.code} value={c.code}>{c.name}</option>
                  ))}
                </select>
              </div>

              {/* NAVEGACIÓN */}
              <nav className="flex items-center gap-1 p-1 rounded-2xl border border-slate-800 bg-slate-900 overflow-x-auto max-w-full">
                <button onClick={() => setActiveTab('radar')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎯 Radar</button>
                <button onClick={() => setActiveTab('cinema')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎬 Cartelera</button>
                <button onClick={() => setActiveTab('critics')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>📰 Críticos</button>
                <button onClick={() => setActiveTab('profile')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>👤 Mi Perfil</button>
                
                {/* BOTÓN PLANES DE SUSCRIPCIÓN */}
                <button onClick={() => setShowSubscriptionModal(true)} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600/20 text-rose-300 border border-rose-500/40 hover:bg-rose-600 hover:text-white transition-all whitespace-nowrap">
                  💳 Planes
                </button>

                {/* BOTÓN ADMIN EXCLUSIVO */}
                {currentUser.role === 'admin' && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950' : 'bg-amber-500/20 text-amber-300 border border-amber-500/50'}`}>
                    🛡️ Admin
                  </button>
                )}
              </nav>

            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {/* TAB 1: RADAR CINÉFILO */}
            {activeTab === 'radar' && (
              <div className="flex flex-col items-center">
                <div className="mb-4 bg-amber-500/10 border border-amber-500/30 px-4 py-2 rounded-2xl text-xs text-amber-500 text-center flex items-center gap-2 flex-wrap justify-center">
                  <span>🎯 Buscando cinéfilos cerca de <b>{userCity}</b></span>
                  <span className="bg-amber-500/20 px-2 py-0.5 rounded-lg border border-amber-500/40">Radio: <b>{currentUser.isPremium ? '500 km' : '100 km'}</b></span>
                  {!currentUser.isPremium && (
                    <button onClick={() => setShowSubscriptionModal(true)} className="underline text-amber-300 font-bold hover:text-amber-200">Ampliar a 500 km</button>
                  )}
                </div>

                {currentCandidate ? (
                  <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                    <div className="relative h-96 w-full bg-slate-950">
                      <img src={currentCandidate.avatar} alt={currentCandidate.name} className="w-full h-full object-cover" />
                      <div className="absolute top-4 left-4 bg-rose-600 px-3 py-1 rounded-full text-xs font-bold text-white">{currentCandidate.lookingFor}</div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <h2 className="text-2xl font-black text-white">{currentCandidate.name}, {currentCandidate.age}</h2>
                        <p className="text-xs text-amber-300 font-medium">📍 {currentCandidate.location} • A {currentCandidate.distanceKm} km</p>
                      </div>
                    </div>
                    <div className="p-6 space-y-4">
                      <p className="text-xs italic text-slate-300">"{currentCandidate.bio}"</p>
                      {currentCandidate.socialLinks?.radio && (
                        <p className="text-[11px] text-slate-400">🎙️ {currentCandidate.socialLinks.radio}</p>
                      )}
                      <div className="flex justify-center gap-6 pt-4 border-t border-slate-800">
                        <button onClick={() => setCurrentIndex(prev => prev + 1)} className="w-14 h-14 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center text-xl font-bold hover:bg-slate-700 transition-all">✖</button>
                        <button onClick={handleLikeCandidate} className="w-16 h-16 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20 hover:scale-105 transition-all">🍿</button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="text-center py-20 space-y-4 max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                    <div className="text-4xl">🎟️</div>
                    <h3 className="text-xl font-bold">No hay más perfiles cercanos dentro de tu rango.</h3>
                    <p className="text-xs text-slate-400">Prueba ampliando tu radio de búsqueda a 500 km con el Plan Premium.</p>
                    <button onClick={() => { setCurrentIndex(0); }} className="bg-slate-800 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold">Reiniciar Vista</button>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: CARTELERA GLOBAL CON TMDB NOW_PLAYING & GOOGLE REAL TIME */}
            {activeTab === 'cinema' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-5 rounded-3xl">
                  <div>
                    <h2 className="text-2xl font-black">🎬 Estrenos en Cines: <span className="text-amber-500">{userCity} ({userCountryCode})</span></h2>
                    <p className="text-xs text-slate-400">Películas actualmente en salas en tu país. El botón "Ver Salas" te lleva directo a las funciones en tu ciudad.</p>
                  </div>

                  {/* CONFIGURADOR DE TMDB API KEY */}
                  <div className="flex items-center gap-2 text-xs bg-slate-950 p-2 rounded-2xl border border-slate-800 w-full sm:w-auto">
                    <input 
                      type="text" 
                      placeholder="API Key TMDb (Opcional)" 
                      value={tmdbApiKey} 
                      onChange={(e) => setTmdbApiKey(e.target.value)} 
                      className="bg-transparent border-0 px-2 text-slate-200 focus:outline-none w-40 text-[11px]"
                    />
                    <button 
                      onClick={() => fetchTmdbNowPlaying(tmdbApiKey, userCountryCode)} 
                      disabled={isLoadingTmdb}
                      className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl font-bold whitespace-nowrap"
                    >
                      {isLoadingTmdb ? 'Sincronizando...' : 'Sincronizar TMDb'}
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {moviesList.map(m => (
                    <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden p-4 flex flex-col justify-between space-y-4 shadow-xl hover:border-slate-700 transition-all">
                      <div className="space-y-3">
                        <div className="relative h-72 rounded-2xl overflow-hidden bg-slate-950">
                          <img src={m.poster_path} alt={m.title} className="w-full h-full object-cover" />
                          <span className="absolute top-2 right-2 bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md shadow">
                            ★ {m.vote_average}
                          </span>
                        </div>
                        <div>
                          <span className="text-[10px] font-bold text-rose-500 uppercase">{m.genre || 'Cine'}</span>
                          <h3 className="text-base font-black">{m.title}</h3>
                          <p className="text-xs text-slate-400 line-clamp-3 pt-1">{m.overview}</p>
                        </div>
                      </div>

                      {/* BOTÓN REDIRECCIÓN A GOOGLE REAL TIME PARA LA CIUDAD DEL USUARIO */}
                      <button 
                        onClick={() => handleOpenGoogleTheaters(m.title)} 
                        className="w-full bg-amber-500/10 hover:bg-amber-500 hover:text-slate-950 text-amber-400 font-bold py-3 rounded-xl text-xs transition-all border border-amber-500/40 flex items-center justify-center gap-2"
                      >
                        <span>🏛️ Ver Salas y Horarios en Google ({userCity})</span>
                        <span>↗</span>
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: CRÍTICOS & MEDIOS */}
            {activeTab === 'critics' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <h2 className="text-2xl font-black">📰 Panel de Críticos & Medios</h2>
                
                <form onSubmit={handlePublishReview} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                  <h3 className="text-sm font-black text-amber-500">✍️ Publicar Reseña en la Red</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="block mb-1 text-slate-400">Película:</label>
                      <input type="text" value={newReviewMovie} onChange={(e) => setNewReviewMovie(e.target.value)} placeholder="Ej: Dune: Parte Dos" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500" required />
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Calificación (1-10):</label>
                      <input type="number" min="1" max="10" step="0.5" value={newReviewRating} onChange={(e) => setNewReviewRating(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500" required />
                    </div>
                  </div>
                  <div className="text-xs">
                    <label className="block mb-1 text-slate-400">Análisis / Reseña:</label>
                    <textarea rows="3" value={newReviewText} onChange={(e) => setNewReviewText(e.target.value)} placeholder="Escribe tu reseña crítica..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-amber-500" required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase hover:bg-amber-400 transition-all">Publicar Reseña</button>
                </form>

                <div className="space-y-4 pt-2">
                  {reviewsList.map(rev => (
                    <div key={rev.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-3 shadow-md">
                      <div className="flex justify-between items-start text-xs">
                        <div>
                          <span className="font-bold text-amber-500">{rev.author}</span>
                          <p className="text-[10px] text-slate-400">🎙️ {rev.mediaOutlet}</p>
                        </div>
                        <span className="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs">★ {rev.rating}/10</span>
                      </div>
                      <div>
                        <h4 className="text-base font-black">{rev.movieTitle}</h4>
                        <p className="text-xs pt-1 text-slate-300 leading-relaxed">{rev.content}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: MI PERFIL */}
            {activeTab === 'profile' && (
              <form onSubmit={handleSaveProfile} className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div>
                    <h2 className="text-xl font-black">{currentUser.name}</h2>
                    <p className="text-xs text-amber-500">{currentUser.roleLabel}</p>
                  </div>
                  <button type="button" onClick={() => setShowSubscriptionModal(true)} className="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs">
                    {currentUser.isPremium ? '⭐ Plan Premium Activo' : '🚀 Cambiar Plan'}
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400">URL Foto de Perfil:</label>
                    <input type="url" value={editAvatar} onChange={(e) => setEditAvatar(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>

                  <div>
                    <label className="block mb-1 text-slate-400">Biografía Cinéfila:</label>
                    <textarea rows="3" value={editBio} onChange={(e) => setEditBio(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" />
                  </div>

                  <div className="pt-2 border-t border-slate-800 space-y-3">
                    <h3 className="font-bold text-amber-500">🎙️ Medios & Redes Sociales</h3>
                    <div>
                      <label className="block mb-1 text-slate-400">Programa de Radio / Podcast:</label>
                      <input type="text" value={editRadio} onChange={(e) => setEditRadio(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Canal de Televisión / Columna:</label>
                      <input type="text" value={editTv} onChange={(e) => setEditTv(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" />
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">Guardar Cambios</button>
                </div>
              </form>
            )}

            {/* TAB 5: PANEL DE ADMINISTRADOR */}
            {activeTab === 'admin' && currentUser.role === 'admin' && (
              <div className="max-w-4xl mx-auto bg-slate-900 border border-amber-500/40 rounded-3xl p-6 space-y-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h2 className="text-2xl font-black text-white">🛡️ Panel Administrador General</h2>
                    <p className="text-xs text-amber-400 mt-1">Sesión activa: <b>{currentUser.name}</b> ({currentUser.email})</p>
                  </div>
                  <span className="bg-amber-500/20 border border-amber-500/50 text-amber-300 px-3 py-1 rounded-xl text-xs font-bold">
                    Control Total Plottwisme
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Usuarios Registrados</p>
                    <p className="text-2xl font-black text-white mt-1">{usersList.length}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Reseñas Publicadas</p>
                    <p className="text-2xl font-black text-white mt-1">{reviewsList.length}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Películas en Cartelera</p>
                    <p className="text-2xl font-black text-white mt-1">{moviesList.length}</p>
                  </div>
                </div>

                <div className="space-y-3">
                  <h3 className="font-bold text-sm text-amber-500">👥 Gestión de Usuarios</h3>
                  <div className="space-y-2">
                    {usersList.map(u => (
                      <div key={u.id} className="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                        <div>
                          <span className="font-bold text-white">{u.name}</span> ({u.email})
                          <span className="ml-2 text-[10px] text-slate-400">{u.location}</span>
                        </div>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${u.isPremium ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>
                          {u.isPremium ? '⭐ Premium' : 'Estándar'}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL SELECCIÓN DE PLANES DE SUSCRIPCIÓN */}
          {showSubscriptionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-lg w-full p-6 space-y-6 shadow-2xl relative">
                
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-black text-white">💳 Selecciona tu Suscripción</h3>
                  <button onClick={() => setShowSubscriptionModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  
                  {/* PLAN ESTÁNDAR */}
                  <div className={`p-5 rounded-2xl border ${!currentUser.isPremium ? 'border-slate-600 bg-slate-950' : 'border-slate-800 bg-slate-950/50'} flex flex-col justify-between space-y-4`}>
                    <div>
                      <h4 className="font-bold text-sm text-slate-200">Plan Estándar</h4>
                      <p className="text-2xl font-black text-white mt-1">Gratis</p>
                      <ul className="text-xs text-slate-400 mt-3 space-y-2">
                        <li>• Radar hasta <b>100 km</b></li>
                        <li>• Búsqueda de salas en Google</li>
                        <li>• Publicación de reseñas</li>
                      </ul>
                    </div>
                    <button 
                      onClick={() => handleUpgradePlan(false)} 
                      className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-xs"
                    >
                      Usar Estándar
                    </button>
                  </div>

                  {/* PLAN PREMIUM */}
                  <div className={`p-5 rounded-2xl border ${currentUser.isPremium ? 'border-amber-500 bg-amber-500/10' : 'border-amber-500/50 bg-slate-950'} flex flex-col justify-between space-y-4`}>
                    <div>
                      <div className="flex justify-between items-center">
                        <h4 className="font-bold text-sm text-amber-400">Plan Premium</h4>
                        <span className="bg-amber-500 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded">RECOMENDADO</span>
                      </div>
                      <p className="text-2xl font-black text-amber-400 mt-1">$4.99 USD <span className="text-xs font-normal text-slate-400">/mes</span></p>
                      <ul className="text-xs text-slate-300 mt-3 space-y-2">
                        <li>• Radar ampliado hasta <b>500 km</b></li>
                        <li>• Insignia ⭐ Premium en Perfil</li>
                        <li>• Prioridad en el Radar de Citas</li>
                        <li>• Acceso ilimitado a funciones</li>
                      </ul>
                    </div>
                    <button 
                      onClick={() => handleUpgradePlan(true)} 
                      className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs uppercase shadow-lg shadow-amber-500/20"
                    >
                      Activar Premium
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
