<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plottwisme - Red Social Cinéfila, Cartelera & Comunidad</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains+Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
  </style>
</head>
<body class="antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Marcelo Buttice',
        email: 'marbuttice@gmail.com',
        age: 56,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
        location: 'Oberá, Misiones, Argentina',
        distanceKm: 2.5,
        role: 'admin',
        roleLabel: 'Administrador General',
        isPremium: true,
        isCritic: true,
        verified: true,
        bio: 'Devoto del cine de autor y la ciencia ficción dura. Creador de Plottwisme.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],
        socialLinks: { twitter: '@marbuttice', radio: 'Frecuencia Cine (Misiones)', tv: '' },
        receivedLikes: 14,
        affinity: 100
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        email: 'elena@gmail.com',
        age: 24,
        sex: 'Femenino',
        lookingFor: 'Amigos Cinéfilos',
        location: 'Posadas, Misiones',
        distanceKm: 85.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro & Crítica',
        isPremium: false,
        isCritic: true,
        verified: true,
        bio: 'Directora de cortos amateur y crítica de cine asiático.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80'],
        socialLinks: { twitter: '@elenamonterok', radio: 'Columnista Radio LT3', tv: 'Canal 12 Misiones' },
        receivedLikes: 29,
        affinity: 93
      },
      {
        id: 'u3',
        name: 'Camila Valenzuela',
        email: 'camila@gmail.com',
        age: 28,
        sex: 'Femenino',
        lookingFor: 'Cita / Pareja',
        location: 'Corrientes Capital',
        distanceKm: 180.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro',
        isPremium: false,
        isCritic: false,
        verified: true,
        bio: 'Amante del terror clásico y festivales independientes.',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=80'],
        socialLinks: { twitter: '', radio: '', tv: '' },
        receivedLikes: 8,
        affinity: 88
      }
    ];

    const BASE_MOVIES = [
      {
        id: 'm1',
        title: 'Dune: Parte Dos',
        director: 'Denis Villeneuve',
        genre: 'Ciencia Ficción / Épica',
        duration: '166 min',
        rating: '9.4',
        poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80',
        synopsis: 'Paul Atreides se une a Chani y a los Fremen buscando venganza contra los conspiradores.'
      },
      {
        id: 'm2',
        title: 'Oppenheimer',
        director: 'Christopher Nolan',
        genre: 'Drama / Biografía',
        duration: '180 min',
        rating: '9.1',
        poster: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600&auto=format&fit=crop&q=80',
        synopsis: 'La historia del físico J. Robert Oppenheimer y su rol en el desarrollo de la bomba atómica.'
      },
      {
        id: 'm3',
        title: 'Pobres Criaturas',
        director: 'Yorgos Lanthimos',
        genre: 'Comedia Negra / Fantasía',
        duration: '141 min',
        rating: '8.8',
        poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop&q=80',
        synopsis: 'La fantástica evolución de Bella Baxter, una joven revivida por un científico brillante.'
      }
    ];

    const INITIAL_REVIEWS = [
      {
        id: 'r1',
        author: 'Elena Montero',
        movieTitle: 'Dune: Parte Dos',
        rating: 10,
        content: 'Villeneuve logra una de las obras maestras de la ciencia ficción moderna. El diseño de sonido y la fotografía en IMAX son monumentales.',
        mediaOutlet: 'Columnista Radio LT3 / Canal 12 Misiones',
        date: '2026-06-10'
      },
      {
        id: 'r2',
        author: 'Marcelo Buttice',
        movieTitle: 'Oppenheimer',
        rating: 9.5,
        content: 'Una tensión insoportable construida magistralmente a través del montaje y la música. Nolan en su máxima expresión intelectual.',
        mediaOutlet: 'Frecuencia Cine (Misiones)',
        date: '2026-05-20'
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_current_session');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [showWelcomeModal, setShowWelcomeModal] = useState(false);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_dark_mode');
          return saved !== null ? JSON.parse(saved) : true;
        } catch (e) {
          return true;
        }
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regAge, setRegAge] = useState(18);
      const [regSex, setRegSex] = useState('Femenino');
      const [regLookingFor, setRegLookingFor] = useState('Amigos Cinéfilos');
      const [regBio, setRegBio] = useState('');

      const [activeTab, setActiveTab] = useState('radar');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userCity, setUserCity] = useState('Oberá, Misiones');
      const [selectedMovieTheaters, setSelectedMovieTheaters] = useState(null);

      const [usersList, setUsersList] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_all_users');
          return saved ? JSON.parse(saved) : INITIAL_USERS;
        } catch (e) {
          return INITIAL_USERS;
        }
      });

      const [reviewsList, setReviewsList] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_all_reviews');
          return saved ? JSON.parse(saved) : INITIAL_REVIEWS;
        } catch (e) {
          return INITIAL_REVIEWS;
        }
      });

      // Estados para formulario de nuevo crítico / reseña
      const [newReviewMovie, setNewReviewMovie] = useState('');
      const [newReviewRating, setNewReviewRating] = useState(10);
      const [newReviewText, setNewReviewText] = useState('');

      // Estados para edición de perfil y fotos
      const [editBio, setEditBio] = useState(currentUser?.bio || '');
      const [editAvatar, setEditAvatar] = useState(currentUser?.avatar || '');
      const [editRadio, setEditRadio] = useState(currentUser?.socialLinks?.radio || '');
      const [editTv, setEditTv] = useState(currentUser?.socialLinks?.tv || '');
      const [editTwitter, setEditTwitter] = useState(currentUser?.socialLinks?.twitter || '');

      useEffect(() => {
        if (currentUser) {
          setEditBio(currentUser.bio || '');
          setEditAvatar(currentUser.avatar || '');
          setEditRadio(currentUser.socialLinks?.radio || '');
          setEditTv(currentUser.socialLinks?.tv || '');
          setEditTwitter(currentUser.socialLinks?.twitter || '');
        }
      }, [currentUser]);

      useEffect(() => {
        if (currentUser && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            () => { setUserCity('Oberá, Misiones'); },
            () => { setUserCity('Oberá, Misiones'); }
          );
        }
      }, [currentUser]);

      useEffect(() => {
        try { localStorage.setItem('plottwist_dark_mode', JSON.stringify(isDarkMode)); } catch (e) {}
      }, [isDarkMode]);

      useEffect(() => {
        try { localStorage.setItem('plottwist_all_users', JSON.stringify(usersList)); } catch (e) {}
      }, [usersList]);

      useEffect(() => {
        try { localStorage.setItem('plottwist_all_reviews', JSON.stringify(reviewsList)); } catch (e) {}
      }, [reviewsList]);

      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem('plottwist_current_session', JSON.stringify(currentUser));
          } else {
            localStorage.removeItem('plottwist_current_session');
          }
        } catch (e) {}
      }, [currentUser]);

      const dynamicBillboard = useMemo(() => {
        const cityName = userCity.trim() || 'Oberá';
        const isObera = cityName.toLowerCase().includes('oberá');

        return BASE_MOVIES.map(movie => ({
          ...movie,
          theaters: isObera ? [
            { name: 'Cine Teatro Oberá (Espacio INCAA)', distance: '0.8 km', showtimes: ['18:00', '21:00'] },
            { name: 'Casa del Bicentenario (Oberá)', distance: '2.1 km', showtimes: ['19:30'] },
            { name: 'Ciclo de Cine Independiente Misionero', distance: '1.5 km', showtimes: ['22:00'] }
          ] : [
            { name: `Cine Solar / Espacio Cultural (${cityName})`, distance: '1.2 km', showtimes: ['17:30', '20:00'] },
            { name: `Auditorio Municipal de ${cityName}`, distance: '3.5 km', showtimes: ['19:00', '21:30'] }
          ]
        }));
      }, [userCity]);

      const maxDistance = currentUser?.isPremium ? 500 : 100;
      const filteredCandidates = useMemo(() => {
        return usersList.filter(u => u.email !== currentUser?.email && u.distanceKm <= maxDistance);
      }, [usersList, currentUser, maxDistance]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usersList.find(u => u.email === loginEmail);
        if (found) {
          setCurrentUser(found);
          setActiveTab('radar');
        } else {
          alert('Usuario no encontrado. Regístrese primero.');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (Number(regAge) < 18) {
          alert('Error de verificación: Plottwisme es exclusivamente para mayores de 18 años.');
          return;
        }
        const newUser = {
          id: 'u_' + Date.now(),
          name: regName,
          email: regEmail,
          password: regPassword,
          age: Number(regAge),
          sex: regSex,
          lookingFor: regLookingFor,
          location: 'Oberá, Misiones',
          distanceKm: 45.0,
          role: regEmail === 'marbuttice@gmail.com' ? 'admin' : 'general',
          roleLabel: regEmail === 'marbuttice@gmail.com' ? 'Administrador General' : 'Cinéfilo Pro',
          isPremium: false,
          isCritic: regEmail === 'marbuttice@gmail.com', // Admin nace crítico, otros pueden solicitarlo
          verified: true,
          bio: regBio || 'Apasionado del cine.',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80',
          photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80'],
          socialLinks: { twitter: '', radio: '', tv: '' },
          receivedLikes: 0,
          affinity: 90
        };
        setUsersList([...usersList, newUser]);
        setCurrentUser(newUser);
        setShowWelcomeModal(true);
      };

      const handleUpgradeToPremium = () => {
        const updated = { ...currentUser, isPremium: true, roleLabel: currentUser.isCritic ? 'Crítico & Premium ⭐' : 'Cinéfilo Premium ⭐' };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === currentUser.email ? updated : u));
        setShowWelcomeModal(false);
        alert('🎉 ¡Bienvenido a Plottwisme Premium! Tu radar se ha ampliado a 500 km.');
        setActiveTab('radar');
      };

      const handleLikeCandidate = () => {
        if (!currentCandidate) return;
        // Dar like al candidato incrementando sus likes en la lista global
        const updatedList = usersList.map(u => {
          if (u.email === currentCandidate.email) {
            return { ...u, receivedLikes: (u.receivedLikes || 0) + 1 };
          }
          return u;
        });
        setUsersList(updatedList);
        alert(`🍿 ¡Le diste Me Gusta a ${currentCandidate.name}! Se ha registrado tu interacción.`);
        setCurrentIndex(prev => prev + 1);
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const updated = {
          ...currentUser,
          bio: editBio,
          avatar: editAvatar,
          photos: [editAvatar],
          socialLinks: {
            radio: editRadio,
            tv: editTv,
            twitter: editTwitter
          }
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === currentUser.email ? updated : u));
        alert('✅ ¡Perfil y enlaces multimedia actualizados con éxito!');
      };

      const handlePublishReview = (e) => {
        e.preventDefault();
        if (!newReviewMovie || !newReviewText) return;
        const outletStr = [currentUser.socialLinks?.radio, currentUser.socialLinks?.tv].filter(Boolean).join(' / ') || currentUser.roleLabel;
        const newRev = {
          id: 'r_' + Date.now(),
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: outletStr,
          date: new Date().toISOString().split('T')[0]
        };
        setReviewsList([newRev, ...reviewsList]);
        setNewReviewMovie('');
        setNewReviewText('');
        alert('📝 ¡Reseña publicada con éxito en el Panel de Críticos!');
      };

      const bgApp = isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900';
      const bgHeader = isDarkMode ? 'bg-slate-950/95 border-slate-800' : 'bg-white/95 border-slate-200';
      const cardBg = isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900 shadow-lg';
      const inputBg = isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-100 border-slate-300 text-slate-900';
      const navBg = isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-200 border-slate-300';

      if (!currentUser) {
        return (
          <div className={`min-h-screen ${bgApp} flex items-center justify-center p-4 transition-colors`}>
            <div className={`max-w-md w-full ${cardBg} rounded-3xl p-8 shadow-2xl space-y-6 border`}>
              <div className="text-center space-y-2">
                <h1 className="text-3xl font-black font-brand text-amber-500">Plottwisme</h1>
                <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Red Social Cinéfila, Cartelera y Match (+18)</p>
              </div>

              <div className={`flex ${inputBg} p-1 rounded-2xl border`}>
                <button type="button" onClick={() => setAuthMode('login')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${authMode === 'login' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Iniciar Sesión</button>
                <button type="button" onClick={() => setAuthMode('register')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${authMode === 'register' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Crear Cuenta</button>
              </div>

              {authMode === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400">Correo Electrónico:</label>
                    <input type="email" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Contraseña:</label>
                    <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3 border`} required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider">Entrar</button>
                </form>
              ) : (
                <form onSubmit={handleRegister} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400">Nombre Completo:</label>
                    <input type="text" value={regName} onChange={(e) => setRegName(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Correo Electrónico:</label>
                    <input type="email" value={regEmail} onChange={(e) => setRegEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Contraseña:</label>
                    <input type="password" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 text-slate-400">Edad (+18):</label>
                      <input type="number" min="18" value={regAge} onChange={(e) => setRegAge(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Sexo:</label>
                      <select value={regSex} onChange={(e) => setRegSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`}>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="No Binario">No Binario</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider mt-2">Registrarse (+18)</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={`flex flex-col min-h-screen ${bgApp} transition-colors`}>
          {showWelcomeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} rounded-3xl max-w-lg w-full p-8 space-y-6 shadow-2xl border border-amber-500/40 text-center animate-pulse`}>
                <div className="w-16 h-16 bg-amber-500 text-slate-950 rounded-3xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg">🎬</div>
                <div className="space-y-2">
                  <h2 className="text-2xl font-black text-amber-500 font-brand">¡Bienvenido a Plottwisme, {currentUser.name}!</h2>
                  <p className="text-xs text-slate-300">Tu perfil ha sido creado con éxito. Detectamos automáticamente tu ubicación en <b>{userCity}</b> y tu radar estándar de 100 km está activo.</p>
                </div>

                <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl text-left space-y-2 text-xs">
                  <p className="text-amber-400 font-bold">✨ ¿Quieres desbloquear todo el potencial de inmediato?</p>
                  <p className="text-slate-300">Actualiza a <b>Premium</b> ahora para ampliar tu radar de búsqueda a <b>500 km</b> y conectar con cinéfilos en toda la región.</p>
                </div>

                <div className="flex flex-col sm:flex-row gap-3 pt-2">
                  <button type="button" onClick={handleUpgradeToPremium} className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl uppercase tracking-wider text-xs shadow-lg">
                    ⭐ Comprar Premium (500 km)
                  </button>
                  <button type="button" onClick={() => setShowWelcomeModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3.5 rounded-xl text-xs">
                    Continuar Gratis (100 km)
                  </button>
                </div>
              </div>
            </div>
          )}

          <header className={`sticky top-0 z-40 backdrop-blur-md border-b px-4 py-3 ${bgHeader}`}>
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full sm:w-auto">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('radar')}>
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                  <div>
                    <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                    <p className={`text-[10px] uppercase ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>{currentUser.isPremium ? '⭐ Premium (Radio 500km)' : '👤 Estándar (Radio 100km)'}</p>
                  </div>
                </div>
                <button type="button" onClick={() => setCurrentUser(null)} className="sm:hidden text-xs text-rose-500 font-bold bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/30">Salir</button>
              </div>

              <div className="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-2xl text-xs w-full sm:w-auto justify-center">
                <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ubicación GPS:</span>
                <input type="text" value={userCity} onChange={(e) => setUserCity(e.target.value)} className={`bg-transparent border-0 px-1 py-0.5 font-bold w-44 focus:outline-none ${isDarkMode ? 'text-amber-300' : 'text-amber-700'}`} title="Puedes editar tu ubicación si lo deseas" />
              </div>
