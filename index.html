<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila & Cartelera Real</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
    .font-brand { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="antialiased bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen text-amber-500 font-bold text-sm">
      ⏳ Cargando Plottwisme...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Marcelo Buttice',
        email: 'marbuttice@gmail.com',
        password: 'admin',
        age: 57,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
        location: 'Oberá, Misiones, Argentina',
        distanceKm: 2.5,
        role: 'admin',
        roleLabel: 'Administrador General',
        isPremium: true,
        isCritic: true,
        criticRequested: false,
        verified: true,
        bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@marbuttice', radio: 'Frecuencia Cine', tv: 'Canal 12 Misiones' }
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        email: 'elena@gmail.com',
        password: '123',
        age: 24,
        sex: 'Femenino',
        lookingFor: 'Amigos Cinéfilos',
        location: 'Posadas, Misiones, Argentina',
        distanceKm: 85.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro & Crítica',
        isPremium: false,
        isCritic: true,
        criticRequested: false,
        verified: true,
        bio: 'Directora de cortos amateur y crítica de cine asiático y de autor.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@elenamonterok', radio: 'Columnista Radio LT3', tv: 'Canal 12 Misiones' }
      }
    ];

    const INITIAL_REVIEWS = [
      {
        id: 'r1',
        author: 'Elena Montero',
        movieTitle: 'Cine de Autor & Estrenos',
        rating: 9,
        content: 'Excelente programación en salas locales este fin de semana.',
        mediaOutlet: 'Columnista Radio LT3 / Canal 12 Misiones',
        date: '2026-08-31'
      }
    ];

    const INITIAL_FORUM_TOPICS = [
      {
        id: 'f1',
        title: '¿Cuál es el mejor Plot Twist de la historia del cine?',
        category: 'Debates Clásicos',
        author: 'Marcelo Buttice',
        date: '2026-08-30',
        repliesCount: 2,
        content: 'Abran debate: entre El Sexto Sentido, Club de la Pelea y Los Sospechosos de Siempre... ¿cuál les causó más impacto?',
        comments: [
          { id: 'c1', author: 'Elena Montero', date: '2026-08-30', text: '¡Sin dudas Los Sospechosos de Siempre!' },
          { id: 'c2', author: 'Marcelo Buttice', date: '2026-08-31', text: 'Coincido plenamente.' }
        ]
      }
    ];

    const COUNTRY_CODES = [
      { code: 'AR', name: 'Argentina 🇦🇷' },
      { code: 'US', name: 'Estados Unidos 🇺🇸' },
      { code: 'ES', name: 'España 🇪🇸' },
      { code: 'MX', name: 'México 🇲🇽' },
      { code: 'CL', name: 'Chile 🇨🇱' },
      { code: 'CO', name: 'Colombia 🇨🇴' },
      { code: 'PY', name: 'Paraguay 🇵🇾' },
      { code: 'UY', name: 'Uruguay UY' },
      { code: 'BR', name: 'Brasil 🇧🇷' }
    ];

    const SEXUALITIES_OPTIONS = [
      'Masculino',
      'Femenino',
      'No Binario',
      'Género Fluido',
      'Pansexual',
      'Queer',
      'Bisexual',
      'Homosexual',
      'Heterosexual',
      'Otro'
    ];

    const SEARCH_CATEGORIES = [
      { id: 'all', label: '🎬 Cartelera Completa', queryFormat: 'cartelera cines {city} {country}' },
      { id: 'today', label: '🍿 Funciones Hoy', queryFormat: 'horarios de cine hoy en {city} {country}' },
      { id: 'theaters', label: '🏛️ Salas & Cines Cercanos', queryFormat: 'cines cerca de {city} {country}' },
      { id: 'premieres', label: '⭐ Estrenos de la Semana', queryFormat: 'estrenos de cine en {city} {country}' }
    ];

    function App() {
      const [usersList, setUsersList] = useState(INITIAL_USERS);
      const [currentUser, setCurrentUser] = useState(() => INITIAL_USERS[0]);
      
      const [activeTab, setActiveTab] = useState('cinema');
      const [currentIndex, setCurrentIndex] = useState(0);

      const [userCity, setUserCity] = useState('');
      const [userCountryCode, setUserCountryCode] = useState('AR');

      // MODALES
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('signup');
      const [showSubscriptionModal, setShowSubscriptionModal] = useState(false);

      // ESTADOS DE REGISTRO / LOGIN
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      const [authAge, setAuthAge] = useState(25);
      const [authSex, setAuthSex] = useState('Masculino');
      const [authLookingFor, setAuthLookingFor] = useState('Amigos Cinéfilos');
      const [authWantCritic, setAuthWantCritic] = useState(false);

      // ESTADOS DE RESEÑAS Y FORO
      const [reviewsList, setReviewsList] = useState(INITIAL_REVIEWS);
      const [forumTopics, setForumTopics] = useState(INITIAL_FORUM_TOPICS);
      const [activeTopic, setActiveTopic] = useState(null);
      const [showNewTopicModal, setShowNewTopicModal] = useState(false);

      const [newTopicTitle, setNewTopicTitle] = useState('');
      const [newTopicCategory, setNewTopicCategory] = useState('Cine de Autor');
      const [newTopicContent, setNewTopicContent] = useState('');
      const [newCommentText, setNewCommentText] = useState('');

      const [newReviewMovie, setNewReviewMovie] = useState('');
      const [newReviewRating, setNewReviewRating] = useState(10);
      const [newReviewText, setNewReviewText] = useState('');

      // PERFIL
      const [editBio, setEditBio] = useState(currentUser ? currentUser.bio : '');
      const [editAvatar, setEditAvatar] = useState(currentUser ? currentUser.avatar : '');
      const [editRadio, setEditRadio] = useState(currentUser?.socialLinks?.radio || '');
      const [editTv, setEditTv] = useState(currentUser?.socialLinks?.tv || '');

      // AUTO-DETECTAR UBICACIÓN REAL AL CARGAR LA APP
      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              try {
                const { latitude, longitude } = position.coords;
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
                const data = await response.json();
                const city = data.address.city || data.address.town || data.address.village || data.address.county || 'Mi Ubicación';
                const countryCode = data.address.country_code ? data.address.country_code.toUpperCase() : 'AR';
                
                setUserCity(city);
                if (COUNTRY_CODES.some(c => c.code === countryCode)) {
                  setUserCountryCode(countryCode);
                }
              } catch (e) {
                console.error("Error geolocalización automática:", e);
                setUserCity('Buenos Aires');
              }
            },
            () => {
              setUserCity('Buenos Aires'); // Valor por defecto si rechaza el GPS
            }
          );
        } else {
          setUserCity('Buenos Aires');
        }
      }, []);

      useEffect(() => {
        if (currentUser) {
          setEditBio(currentUser.bio || '');
          setEditAvatar(currentUser.avatar || '');
          setEditRadio(currentUser.socialLinks?.radio || '');
          setEditTv(currentUser.socialLinks?.tv || '');
        }
      }, [currentUser]);

      useEffect(() => {
        if (activeTab === 'admin' && currentUser?.role !== 'admin') {
          setActiveTab('cinema');
        }
      }, [activeTab, currentUser]);

      const getCountryName = () => {
        const found = COUNTRY_CODES.find(c => c.code === userCountryCode);
        return found ? found.name.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}]/gu, '').trim() : '';
      };

      const openGoogleEngine = (customQueryFormat = 'cartelera de cines en {city} {country}') => {
        const cleanCity = userCity.trim() || 'Buenos Aires';
        const country = getCountryName();
        const query = customQueryFormat.replace('{city}', cleanCity).replace('{country}', country);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}&cs=2&hl=es`, '_blank');
      };

      // ACCIONES DE MODERACIÓN (ADMIN)
      const handleDeleteUser = (userId) => {
        if (window.confirm('⚠️ ¿Estás seguro de eliminar a este usuario permanentemente?')) {
          setUsersList(usersList.filter(u => u.id !== userId));
        }
      };

      const handleSanctionUser = (userId) => {
        if (window.confirm('🚫 ¿Suspender a este usuario?')) {
          setUsersList(usersList.map(u => u.id === userId ? { ...u, roleLabel: 'Sancionado ⛔' } : u));
        }
      };

      const handleDeletePhoto = (userId) => {
        if (window.confirm('🗑️ ¿Eliminar el avatar de este usuario por incumplir normas?')) {
          setUsersList(usersList.map(u => u.id === userId ? { ...u, avatar: 'https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=500&auto=format&fit=crop&q=80' } : u)); 
        }
      };

      const handleToggleCriticBadge = (userId) => {
        setUsersList(usersList.map(u => {
          if (u.id === userId) {
            const nextVal = !u.isCritic;
            return { 
              ...u, 
              isCritic: nextVal, 
              roleLabel: nextVal ? 'Cinéfilo Pro & Crítico' : 'Cinéfilo Estándar',
              criticRequested: false 
            };
          }
          return u;
        }));
      };

      // REGISTRO E INICIO DE SESIÓN
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        
        if (authMode === 'signup') {
          if (Number(authAge) < 18) {
            alert('🚫 Acceso denegado: Debes ser mayor de 18 años para registrarte en Plottwisme.');
            return;
          }

          const existing = usersList.find(u => u.email.toLowerCase() === authEmail.toLowerCase());
          if (existing) {
            alert('⚠️ Este email ya está registrado. Intenta iniciar sesión.');
            return;
          }
          const newUser = {
            id: 'u_' + Date.now(),
            name: authName,
            email: authEmail,
            password: authPassword,
            age: Number(authAge),
            sex: authSex,
            lookingFor: authLookingFor,
            location: `${userCity || 'Ciudad'}, ${getCountryName()}`,
            distanceKm: 5.0,
            role: 'general',
            roleLabel: authWantCritic ? 'Solicitud Crítico Pendiente' : 'Cinéfilo Estándar',
            isPremium: false,
            isCritic: false,
            criticRequested: authWantCritic,
            verified: false,
            bio: '¡Hola! Soy cinéfilo en Plottwisme.',
            avatar: `https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80`,
            socialLinks: {}
          };
          setUsersList([...usersList, newUser]);
          setCurrentUser(newUser);
          if (authWantCritic) {
            alert('🎉 ¡Cuenta creada! Tu solicitud de insignia de crítico fue enviada al Administrador.');
          } else {
            alert('🎉 ¡Cuenta creada con éxito!');
          }
        } else {
          const found = usersList.find(u => u.email.toLowerCase() === authEmail.toLowerCase() && u.password === authPassword);
          if (!found) {
            alert('❌ Credenciales incorrectas. Verifica tu email y contraseña.');
            return;
          }
          setCurrentUser(found);
          alert(`👋 ¡Bienvenido de nuevo, ${found.name}!`);
        }
        setShowAuthModal(false);
        setAuthEmail('');
        setAuthPassword('');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setActiveTab('cinema');
        alert('Sesión cerrada.');
      };

      // LÓGICA DE RADAR Y DISTANCIAS SEGÚN PLAN (Estándar 100km, Premium 500km)
      const maxDistance = currentUser?.isPremium ? 500 : 100;
      const filteredCandidates = useMemo(() => {
        return usersList.filter(u => u.email !== currentUser?.email && u.distanceKm <= maxDistance);
      }, [usersList, currentUser, maxDistance]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleUpgradePlan = (isPrem) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        const updated = { 
          ...currentUser, 
          isPremium: isPrem, 
          roleLabel: isPrem ? 'Cinéfilo Premium ⭐' : 'Cinéfilo Estándar' 
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        setShowSubscriptionModal(false);
        alert(isPrem ? '⭐ ¡Felicidades! Ahora eres Premium ($4.99 USD/mes).' : 'Cambiado a plan Estándar.');
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        if (!currentUser) return;
        const updated = {
          ...currentUser,
          bio: editBio,
          avatar: editAvatar,
          socialLinks: { radio: editRadio, tv: editTv }
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        alert('✅ ¡Perfil actualizado correctamente!');
      };

      const handlePublishReview = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        if (!currentUser.isCritic) {
          alert('🔒 Solo los usuarios con Insignia de Crítico pueden publicar reseñas oficiales.');
          return;
        }
        if (!newReviewMovie || !newReviewText) return;
        const newRev = {
          id: 'r_' + Date.now(),
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: currentUser.socialLinks?.radio || currentUser.roleLabel,
          date: new Date().toISOString().split('T')[0]
        };
        setReviewsList([newRev, ...reviewsList]);
        setNewReviewMovie('');
        setNewReviewText('');
        alert('📝 ¡Reseña publicada!');
      };

      const handleCreateTopic = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        if (!newTopicTitle || !newTopicContent) return;
        const newTopic = {
          id: 'f_' + Date.now(),
          title: newTopicTitle,
          category: newTopicCategory,
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          repliesCount: 0,
          content: newTopicContent,
          comments: []
        };
        setForumTopics([newTopic, ...forumTopics]);
        setNewTopicTitle('');
        setNewTopicContent('');
        setShowNewTopicModal(false);
        alert('💬 ¡Debate creado!');
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        if (!newCommentText || !activeTopic) return;
        const comment = {
          id: 'c_' + Date.now(),
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          text: newCommentText
        };
        const updatedTopics = forumTopics.map(t => {
          if (t.id === activeTopic.id) {
            const updatedComments = [...t.comments, comment];
            const updatedT = { ...t, comments: updatedComments, repliesCount: updatedComments.length };
            setActiveTopic(updatedT);
            return updatedT;
          }
          return t;
        });
        setForumTopics(updatedTopics);
        setNewCommentText('');
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }}>
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                <div>
                  <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                  <p className="text-[10px] uppercase text-slate-400 font-bold">
                    {currentUser ? (currentUser.isPremium ? '⭐ Plan Premium (500km)' : '👤 Plan Estándar (100km)') : '🌐 Modo Invitado'}
                  </p>
                </div>
              </div>

              {/* CONTROLES UBICACIÓN (Solo visibles o editables por Administrador en su panel, o ciudad limpia para carteleras) */}
              <div className="flex flex-wrap items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-2xl text-xs w-full lg:w-auto justify-center">
                <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ciudad Cartelera:</span>
                <input 
                  type="text" 
                  value={userCity} 
                  onChange={(e) => setUserCity(e.target.value)} 
                  placeholder="Tu Ciudad"
                  className="bg-transparent border-b border-amber-500/50 px-1 py-0.5 font-bold w-32 text-amber-300 focus:outline-none capitalize text-xs" 
                />

                {/* SELECTOR DE PAÍS SOLO VISIBLE SI ES ADMIN */}
                {currentUser?.role === 'admin' && (
                  <>
                    <span className="text-slate-600">|</span>
                    <span className="text-amber-500 font-bold whitespace-nowrap">🌎 País:</span>
                    <select 
                      value={userCountryCode} 
                      onChange={(e) => setUserCountryCode(e.target.value)}
                      className="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer"
                    >
                      {COUNTRY_CODES.map(c => (
                        <option key={c.code} value={c.code}>{c.name}</option>
                      ))}
                    </select>
                  </>
                )}
              </div>

              <nav className="flex items-center gap-1 p-1 rounded-2xl border border-slate-800 bg-slate-900 overflow-x-auto max-w-full">
                <button onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎬 Cartelera</button>
                <button onClick={() => { setActiveTab('forums'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'forums' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>💬 Foros</button>
                <button onClick={() => { setActiveTab('radar'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎯 Radar</button>
                <button onClick={() => { setActiveTab('critics'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>📰 Críticos</button>
                
                {currentUser && (
                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>👤 Perfil</button>
                )}

                {currentUser?.role === 'admin' && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950' : 'bg-amber-500/20 text-amber-300 border border-amber-500/50'}`}>
                    🛡️ Admin
                  </button>
                )}

                {currentUser ? (
                  <button onClick={handleLogout} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">
                    🚪 Salir
                  </button>
                ) : (
                  <button onClick={() => { setAuthMode('signup'); setShowAuthModal(true); }} className="px-3 py-1.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 hover:bg-amber-400 whitespace-nowrap">
                    ✨ Crear Cuenta
                  </button>
                )}
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {activeTab === 'cinema' && (
              <div className="space-y-8">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500/20 via-slate-900 to-slate-900 border border-amber-500/30 p-8 shadow-2xl">
                  <div className="max-w-2xl space-y-4">
                    <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-3 py-1 rounded-md uppercase tracking-wider">
                      Motor Oficial Geolocalizado
                    </span>
                    <h2 className="text-3xl font-black text-white leading-tight">
                      Cartelera en Tiempo Real para <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                    </h2>
                    <p className="text-sm text-slate-300 leading-relaxed">
                      Accede instantáneamente al panel interactivo oficial con las películas, complejos, horarios y salas disponibles hoy en tu zona.
                    </p>
                    <div className="pt-2">
                      <button 
                        onClick={() => openGoogleEngine()} 
                        className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-sm transition-all shadow-xl shadow-amber-500/20 flex items-center gap-3 hover:scale-105"
                      >
                        <span>🏛️ Abrir Cartelera de {userCity || 'tu ciudad'}</span>
                        <span>↗</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-black text-white flex items-center gap-2">
                    <span>⚡ Buscador Directo por Categoría en</span>
                    <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {SEARCH_CATEGORIES.map(cat => (
                      <div 
                        key={cat.id} 
                        onClick={() => openGoogleEngine(cat.queryFormat)}
                        className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all hover:-translate-y-1 shadow-lg group flex flex-col justify-between space-y-4"

                        <div>
                          <h4 className="font-bold text-white group-hover:text-amber-400 transition-colors text-sm">{cat.label}</h4>
                          <p className="text-xs text-slate-400 mt-1">Sincroniza salas y funciones en tiempo real.</p>
                        </div>
                        <div className="text-xs font-bold text-amber-500 flex items-center justify-between pt-2 border-t border-slate-800">
                          <span>Consultar Google</span>
                          <span>↗</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className="bg-slate-900 border border-slate-800 text-amber-400 hover:text-amber-300 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                      <span>← Volver a los debates</span>
                    </button>

                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <span className="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {activeTopic.category}
                        </span>
                        <span className="text-xs text-slate-400">Por <b>{activeTopic.author}</b> • {activeTopic.date}</span>
                      </div>
                      <h2 className="text-2xl font-black text-white">{activeTopic.title}</h2>
                      <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-line">{activeTopic.content}</p>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">💬 Respuestas ({activeTopic.comments.length})</h3>

                      {activeTopic.comments.map(c => (
                        <div key={c.id} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-400">
                            <span className="font-bold text-white">{c.author}</span>
                            <span>{c.date}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <textarea rows="3" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder={currentUser ? "Escribe tu respuesta..." : "Inicia sesión para responder..."} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required disabled={!currentUser} />
                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          Publicar Respuesta
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                      <div>
                        <h2 className="text-2xl font-black text-white">💬 Foros de Discusión Cinéfila</h2>
                        <p className="text-xs text-slate-400 mt-1">Intercambiá opiniones y teorías con la comunidad.</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        ✍️ Crear Nuevo Debate
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.map(topic => (
                        <div key={topic.id} onClick={() => setActiveTopic(topic)} className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all space-y-3 group">
                          <div className="flex justify-between items-center text-xs">
                            <span className="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{topic.category}</span>
                            <span className="text-slate-500 text-[10px]">{topic.date}</span>
                          </div>
                          <h3 className="text-base font-bold text-white group-hover:text-amber-400 transition-colors">{topic.title}</h3>
                          <div className="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-800">
                            <span>Por <b>{topic.author}</b></span>
                            <span className="text-amber-500 font-bold">💬 {topic.repliesCount} respuestas</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* RADAR DE MATCHES (Limitado por distancia de plan) */}
            {activeTab === 'radar' && (
              <div className="flex flex-col items-center space-y-4">
                <div className="bg-slate-900 border border-amber-500/30 px-4 py-2 rounded-xl text-xs text-amber-400 font-bold">
                  📡 Radio activo: {currentUser?.isPremium ? '500 km (Plan Premium ⭐)' : '100 km (Plan Estándar 👤)'}
                </div>

                {currentCandidate ? (
                  <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                    <div className="relative h-96 w-full bg-slate-950">
                      <img src={currentCandidate.avatar} alt={currentCandidate.name} className="w-full h-full object-cover" />
                      <div className="absolute top-4 left-4 bg-rose-600 px-3 py-1 rounded-full text-xs font-bold text-white">{currentCandidate.lookingFor}</div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <h2 className="text-2xl font-black text-white">{currentCandidate.name}, {currentCandidate.age}</h2>
                        <p className="text-xs text-amber-300 font-medium">📍 {currentCandidate.location} • Aprox. {currentCandidate.distanceKm} km</p>
                      </div>
                    </div>
                    <div className="p-6 space-y-4">
                      <p className="text-xs italic text-slate-300">"{currentCandidate.bio}"</p>
                      <div className="flex justify-center gap-6 pt-4 border-t border-slate-800">
                        <button onClick={() => setCurrentIndex(prev => prev + 1)} className="w-14 h-14 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center text-xl font-bold">✖</button>
                        <button onClick={() => { alert(`🍿 ¡Match enviado a ${currentCandidate.name}!`); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20">🍿</button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="text-center py-20 space-y-4 max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                    <div className="text-4xl">🎟️</div>
                    <h3 className="text-xl font-bold">No hay más perfiles en tu radio de {currentUser?.isPremium ? '500km' : '100km'}.</h3>
                    <p className="text-xs text-slate-400">¡Actualiza a Premium para expandir tu radar o espera nuevos cinéfilos!</p>
                    <button onClick={() => setCurrentIndex(0)} className="bg-slate-800 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold">Reiniciar Vista</button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'critics' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <h2 className="text-2xl font-black">📰 Panel de Críticos & Medios</h2>
                
                {currentUser?.isCritic ? (
                  <form onSubmit={handlePublishReview} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <h3 className="text-sm font-black text-amber-500">✍️ Publicar Reseña en la Red (Insignia Verificada 🌟)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="block mb-1 text-slate-400">Película:</label>
                        <input type="text" value={newReviewMovie} onChange={(e) => setNewReviewMovie(e.target.value)} placeholder="Ej: Película..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" required />
                      </div>
                      <div>
                        <label className="block mb-1 text-slate-400">Calificación (1-10):</label>
                        <input type="number" min="1" max="10" value={newReviewRating} onChange={(e) => setNewReviewRating(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" required />
                      </div>
                    </div>
                    <div className="text-xs">
                      <label className="block mb-1 text-slate-400">Análisis / Reseña:</label>
                      <textarea rows="3" value={newReviewText} onChange={(e) => setNewReviewText(e.target.value)} placeholder="Escribe tu reseña..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">Publicar Reseña</button>
                  </form>
                ) : (
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center space-y-2 text-xs">
                    <p className="text-amber-400 font-bold">🔒 Necesitas la Insignia de Crítico para publicar reseñas oficiales.</p>
                    <p className="text-slate-400">Puedes solicitarla o verificar el estado de tu insignia desde la configuración de tu perfil o contactando al Administrador.</p>
                  </div>
                )}

                <div className="space-y-4 pt-2">
                  {reviewsList.map(rev => (
                    <div key={rev.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-3">
                      <div className="flex justify-between items-start text-xs">
                        <div>
                          <span className="font-bold text-amber-500 flex items-center gap-1">
                            {rev.author} <span className="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">🌟 Crítico</span>
                          </span>
                          <p className="text-[10px] text-slate-400">🎙️ {rev.mediaOutlet}</p>
                        </div>
                        <span className="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs">★ {rev.rating}/10</span>
                      </div>
                      <h4 className="text-base font-black">{rev.movieTitle}</h4>
                      <p className="text-xs text-slate-300 leading-relaxed">{rev.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'profile' && currentUser && (
              <div className="max-w-xl mx-auto space-y-6">
                <form onSubmit={handleSaveProfile} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-xl font-black">{currentUser.name}</h2>
                      <p className="text-xs text-amber-500">{currentUser.roleLabel} {currentUser.isCritic ? '🌟' : ''}</p>
                    </div>
                    <button type="button" onClick={() => setShowSubscriptionModal(true)} className="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow">
                      {currentUser.isPremium ? '⭐ Premium ($4.99)' : '🚀 Ver Planes'}
                    </button>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="block mb-1 text-slate-400">Foto URL (Hasta 10 permitidas en Premium):</label>
                      <input type="url" value={editAvatar} onChange={(e) => setEditAvatar(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Biografía:</label>
                      <textarea rows="3" value={editBio} onChange={(e) => setEditBio(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">Guardar Perfil</button>
                  </div>
                </form>
              </div>
            )}

            {/* PANEL ADMIN (CON GESTIÓN DE CRÍTICOS, FOTOS Y SANCIONES) */}
            {activeTab === 'admin' && currentUser?.role === 'admin' && (
              <div className="max-w-4xl mx-auto bg-slate-900 border border-amber-500/40 rounded-3xl p-6 space-y-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h2 className="text-2xl font-black text-white">🛡️ Panel Administrador General</h2>
                    <p className="text-xs text-amber-400 mt-1">Control total de usuarios, insignias y país/ciudad global.</p>
                  </div>
                  <span className="bg-amber-500/20 border border-amber-500/50 text-amber-300 px-3 py-1 rounded-xl text-xs font-bold">
                    Acceso Restringido
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Usuarios Totales</p>
                    <p className="text-2xl font-black text-white mt-1">{usersList.length}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Hilos en Foros</p>
                    <p className="text-2xl font-black text-white mt-1">{forumTopics.length}</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <p className="text-xs text-slate-400">Seguridad Rol</p>
                    <p className="text-sm font-black text-emerald-400 mt-1">Protegido 🟢</p>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="font-bold text-sm text-amber-500">Moderación de Usuarios, Fotos e Insignias de Crítico:</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {usersList.map(u => (
                      <div key={u.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col gap-3">
                        <div className="flex gap-3 items-start">
                          <div className="relative group">
                            <img src={u.avatar} alt="Avatar" className="w-16 h-16 rounded-xl object-cover border border-slate-700" />
                            <button onClick={() => handleDeletePhoto(u.id)} className="absolute -top-2 -right-2 bg-rose-600 text-white rounded-full px-2 py-1 text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">✖ Foto</button>
                          </div>
                          <div>
                            <p className="font-bold text-white text-sm">
                              {u.name} {u.isCritic && '🌟'} <span className="text-slate-500 font-normal">({u.age}a)</span>
                            </p>
                            <p className="text-xs text-amber-400">{u.roleLabel} • {u.location}</p>
                            <p className="text-[10px] text-slate-400 break-all">{u.email}</p>
                            {u.criticRequested && (
                              <span className="inline-block mt-1 bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] px-2 py-0.5 rounded font-bold">
                                ⚠️ Solicitó Insignia de Crítico
                              </span>
                            )}
                          </div>
                        </div>
                        
                        <div className="flex flex-col gap-2 border-t border-slate-800 pt-3">
                          <button onClick={() => handleToggleCriticBadge(u.id)} className={`w-full text-[10px] font-bold py-1.5 rounded-lg border ${u.isCritic ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-300 border-slate-700'}`}>
                            {u.isCritic ? '🌟 Quitar Insignia de Crítico' : '✨ Otorgar Insignia de Crítico'}
                          </button>
                          
                          {u.role !== 'admin' && (
                            <div className="flex gap-2">
                              <button onClick={() => handleSanctionUser(u.id)} className="flex-1 bg-orange-500/20 text-orange-400 hover:bg-orange-500/30 text-[10px] font-bold py-1.5 rounded-lg border border-orange-500/30">
                                ⛔ Sancionar
                              </button>
                              <button onClick={() => handleDeleteUser(u.id)} className="flex-1 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 text-[10px] font-bold py-1.5 rounded-lg border border-rose-500/30">
                                🗑️ Eliminar
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL SUSCRIPCIÓN (BENEFICIOS Y PRECIO $4.99) */}
          {showSubscriptionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white">🚀 Planes de Suscripción Plottwisme</h3>
                  <button onClick={() => setShowSubscriptionModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-2">
                    <h4 className="font-bold text-slate-300 text-sm">👤 Plan Estándar (Gratis)</h4>
                    <p className="text-slate-400">• Radio de radar de búsqueda: <b>100 km</b></p>
                    <p className="text-slate-400">• Matches: <b>Limitado a 1 por semana</b></p>
                    <p className="text-slate-400">• Fotos de perfil: <b>1 foto</b></p>
                    <button onClick={() => handleUpgradePlan(false)} className="w-full mt-2 bg-slate-800 text-slate-300 font-bold py-2 rounded-xl">Seleccionar Estándar</button>
                  </div>

                  <div className="bg-gradient-to-br from-amber-500/20 to-slate-950 border border-amber-500/50 p-4 rounded-2xl space-y-2">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-amber-400 text-sm">⭐ Plan Premium</h4>
                      <span className="bg-amber-500 text-slate-950 font-black px-2.5 py-0.5 rounded-lg text-xs">$4.99 USD / mes</span>
                    </div>
                    <p className="text-slate-300">• Radio de radar ampliado: <b>500 km</b></p>
                    <p className="text-slate-300">• Matches: <b>Ilimitados</b></p>
                    <p className="text-slate-300">• Fotos de perfil: <b>Hasta 10 fotos</b></p>
                    <button onClick={() => handleUpgradePlan(true)} className="w-full mt-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl uppercase tracking-wider">Obtener Premium por $4.99</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL AUTENTICACIÓN (CREAR CUENTA + NUEVAS SEXUALIDADES + SOLICITUD CRÍTICO) */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white">
                    {authMode === 'signup' ? '✨ Crear Cuenta en Plottwisme' : '🔑 Iniciar Sesión'}
                  </h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                  {authMode === 'signup' && (
                    <>
                      <div>
                        <label className="block mb-1 text-slate-400 font-bold">Nombre Completo:</label>
                        <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} placeholder="Ej: Juan Pérez" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block mb-1 text-slate-400 font-bold">Edad (+18):</label>
                          <input type="number" min="18" max="99" value={authAge} onChange={(e) => setAuthAge(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                        </div>
                        <div>
                          <label className="block mb-1 text-slate-400 font-bold">Género / Sexualidad:</label>
                          <select value={authSex} onChange={(e) => setAuthSex(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200">
                            {SEXUALITIES_OPTIONS.map(opt => (
                              <option key={opt} value={opt}>{opt}</option>
                            ))}
                          </select>
                        </div>
                      </div>
                      
                      <div className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                        <div>
                          <p className="font-bold text-white">¿Solicitar Insignia de Crítico?</p>
                          <p className="text-[10px] text-slate-400">Permite postularte para publicar reseñas oficiales tras aprobación del Admin.</p>
                        </div>
                        <input type="checkbox" checked={authWantCritic} onChange={(e) => setAuthWantCritic(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" />
                      </div>
                    </>
                  )}

                  <div>
                    <label className="block mb-1 text-slate-400 font-bold">Correo Electrónico:</label>
                    <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>

                  <div>
                    <label className="block mb-1 text-slate-400 font-bold">Contraseña:</label>
                    <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>

                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                    {authMode === 'signup' ? 'Registrarme' : 'Ingresar'}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-slate-800 text-xs">
                  {authMode === 'signup' ? (
                    <p className="text-slate-400">¿Ya tienes cuenta? <button onClick={() => setAuthMode('login')} className="text-amber-400 font-bold underline">Inicia Sesión</button></p>
                  ) : (
                    <p className="text-slate-400">¿No tienes cuenta? <button onClick={() => setAuthMode('signup')} className="text-amber-400 font-bold underline">Regístrate gratis</button></p>
                  )}
                </div>
              </div>
            </div>
          )}

          {showNewTopicModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white">💬 Nuevo Debate Cinéfilo</h3>
                  <button onClick={() => setShowNewTopicModal(false)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <form onSubmit={handleCreateTopic} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400 font-bold">Título del Debate:</label>
                    <input type="text" value={newTopicTitle} onChange={(e) => setNewTopicTitle(e.target.value)} placeholder="Ej: ¿Qué opinan de...?" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400 font-bold">Categoría:</label>
                    <select value={newTopicCategory} onChange={(e) => setNewTopicCategory(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200">
                      <option value="Cine de Autor">Cine de Autor</option>
                      <option value="Debates Clásicos">Debates Clásicos</option>
                      <option value="Teorías & Spoilers">Teorías & Spoilers</option>
                      <option value="Estrenos">Estrenos</option>
                    </select>
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400 font-bold">Contenido:</label>
                    <textarea rows="4" value={newTopicContent} onChange={(e) => setNewTopicContent(e.target.value)} placeholder="Escribe el tema..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase">Publicar Debate</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) {
      console.error("Error al montar la aplicación:", e);
    }
  </script>
</body>
</html>
