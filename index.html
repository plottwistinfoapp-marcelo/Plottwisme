    const obtenerUbicacionGPS = () => {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            try {
              const respuesta = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
              const datos = await respuesta.json();
              const ciudad = datos.address.city || datos.address.town || datos.address.village || "Ciudad desconocida";
              const pais = datos.address.country || "";
              alert(`¡Ubicación detectada por GPS: ${ciudad}, ${pais}!`);
            } catch (error) {
              alert(`Coordenadas obtenidas: Lat ${lat.toFixed(2)}, Lon ${lon.toFixed(2)}`);
            }
          },
          (error) => {
            alert("No pudimos acceder a tu GPS. Revisa los permisos.");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        alert("Tu navegador no soporta geolocalización.");
      }
    };
