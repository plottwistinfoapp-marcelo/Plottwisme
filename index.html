<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila Mundial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'plottwist.infoapp@gmail.com';

    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function App() {
      const [theme, setTheme] = useState('dark');
      // Pestaña inicial: Cartelera Local para evitar el lienzo negro al abrir
      const [activeTab, setActiveTab] = useState('cartelera'); 
      const [locationStatus, setLocationStatus] = useState('Detectar mi ubicación mundial');
      const [userCoords, setUserCoords] = useState(null);
      
      // Estado de Perfil con Notificaciones de Match
      const [currentUser, setCurrentUser] = useState({
        name: 'Cinéfilo Invitado',
        email: 'invitado@plottwisme.com',
        genres: 'Cine de Autor, Sci-Fi, Thriller',
        lookingFor: 'Compañeros para ir al cine y debates',
        bio: 'Apasionado por el cine analógico y los giros de guión inesperados.',
        isPremium: false,
        isCritic: false,
        isAdmin: false,
        allowMatchNotifications: true, // Configuración de notificación
        photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'],
        avatarIndex: 0
      });

      // Notificación Emergente de Match al Abrir
      const [matchNotification, setMatchNotification] = useState(null);

      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      const [cinesGlobales, setCinesGlobales] = useState([]);
      const [cargandoCines, setCargandoCines] = useState(false);

      // Cartelera en Vivo de la Semana
      const carteleraSemanal = [
        { id: 1, title: 'Oppenheimer: Edición Especial', genre: 'Drama / Historia', runtime: '180 min', rating: '9.3/10', poster: '💣', salas: 'Cine Hoyts / Showcase', times: ['17:30', '20:45', '22:15'] },
        { id: 2, title: 'Dune: Parte Dos', genre: 'Sci-Fi / Aventura', runtime: '166 min', rating: '9.0/10', poster: '🏜️', salas: 'IMAX Cinema', times: ['16:00', '19:15', '22:30'] },
        { id: 3, title: 'Anatomía de una Caída', genre: 'Intriga / Suspenso', runtime: '150 min', rating: '8.5/10', poster: '⚖️', salas: 'Cine Arte Múltiplex', times: ['18:00', '20:30'] },
        { id: 4, title: 'Pobres Criaturas', genre: 'Comedia / Fantasía', runtime: '141 min', rating: '8.8/10', poster: '🎭', salas: 'Cinemark Local', times: ['17:15', '19:45', '22:00'] }
      ];

      // Streaming
      const [streamingFilter, setStreamingFilter] = useState('Todos');
      const streamingPlatforms = [
        { name: 'Netflix', color: 'bg-red-600', logo: '🎬 N' },
        { name: 'HBO Max', color: 'bg-purple-600', logo: '🟣 Max' },
        { name: 'Disney+', color: 'bg-blue-600', logo: '✨ D+' },
        { name: 'Prime Video', color: 'bg-sky-500', logo: '📦 PV' },
        { name: 'Apple TV+', color: 'bg-slate-700', logo: '🍏 TV+' },
        { name: 'MUBI', color: 'bg-amber-600', logo: '🎥 MUBI' }
      ];

      const streamingReleases = [
        { id: 1, title: 'Dune: Part Two', platform: 'HBO Max', genre: 'Sci-Fi / Aventura', rating: '9.0/10', poster: '🏜️' },
        { id: 2, title: 'El Problema de los 3 Cuerpos', platform: 'Netflix', genre: 'Sci-Fi / Misterio', rating: '8.4/10', poster: '🌌' },
        { id: 3, title: 'Shōgun', platform: 'Disney+', genre: 'Drama / Histórico', rating: '9.2/10', poster: '⚔️' },
        { id: 4, title: 'Fallout', platform: 'Prime Video', genre: 'Acción / Post-Apocalíptico', rating: '8.6/10', poster: '☢️' }
      ];

      // Foros
      const [forumsList, setForumsList] = useState([
        { id: 1, title: '¿Es Denis Villeneuve el mejor director de la década?', category: 'Directores', author: 'Carlos Ruiz', description: 'Debate abierto sobre el impacto visual de Dune.', replies: [{ author: 'Laura Gómez', text: 'La atmósfera sonora es impecable.' }] },
        { id: 2, title: 'Teorías sobre el final de Inception', category: 'Cine de Culto', author: 'Ana Martínez', description: '¿El tótem cayó o sigue girando?', replies: [] }
      ]);

      const [showNewForumModal, setShowNewForumModal] = useState(false);
      const [newForum, setNewForum] = useState({ title: '', category: 'General', description: '' });
      const [selectedForum, setSelectedForum] = useState(null);
      const [newReplyText, setNewReplyText] = useState('');

      // Usuarios Match
      const [usersList] = useState([
        { id: 1, name: 'Carlos Ruiz', email: 'carlos@cine.com', genres: 'Sci-Fi, Thriller', lookingFor: 'Compañero para estrenos IMAX', bio: 'Fan de Christopher Nolan.', distance: '12 km', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80' },
        { id: 2, name: 'Laura Gómez', email: 'laura@cine.com', genres: 'Drama, Romance', lookingFor: 'Pareja cinéfila', bio: 'Amante de los festivales de cine.', distance: '45 km', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80' }
      ]);

      // Alerta de Match instantánea si está activa la configuración
      useEffect(() => {
        if (currentUser.allowMatchNotifications) {
          const timer = setTimeout(() => {
            setMatchNotification({
              userName: 'Laura Gómez',
              matchPercent: '95%',
              movie: 'Anatomía de una Caída',
              avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80'
            });
          }, 1200);
          return () => clearTimeout(timer);
        }
      }, [currentUser.allowMatchNotifications]);

      const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

      const getGeoLocation = () => {
        setLocationStatus('Obteniendo GPS...');
        setCargandoCines(true);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setUserCoords({ lat, lng });
              const radio = currentUser?.isPremium ? 500 : 100;
              setLocationStatus(`GPS Activo (Radio: ${radio} km)`);
              buscarCinesMundiales(lat, lng);
            },
            () => {
              setLocationStatus('GPS no disponible.');
              setCargandoCines(false);
            }
          );
        } else {
          setLocationStatus('Sin soporte GPS.');
          setCargandoCines(false);
        }
      };

      const buscarCinesMundiales = async (lat, lng) => {
        setCargandoCines(true);
        const radioMetros = (currentUser?.isPremium ? 500 : 100) * 1000;
        
        try {
          const query = `[out:json];node["amenity"="cinema"](around:${radioMetros},${lat},${lng});out 15;`;
          const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
          const data = await response.json();

          if (data.elements && data.elements.length > 0) {
            const resultados = data.elements.map(cine => ({
              id: cine.id,
              nombre: cine.tags.name || "Cine Local",
              direccion: cine.tags["addr:street"] ? `${cine.tags["addr:street"]} ${cine.tags["addr:housenumber"] || ''}` : "Ver ubicación en mapa",
              lat: cine.lat,
              lng: cine.lon,
              distanciaKm: calcularDistanciaKm(lat, lng, cine.lat, cine.lon)
            })).sort((a, b) => a.distanciaKm - b.distanciaKm);

            setCinesGlobales(resultados);
          } else {
            setCinesGlobales([]);
          }
        } catch (error) {
          console.error("Error cines:", error);
        } finally {
          setCargandoCines(false);
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const isAdmin = authForm.email.toLowerCase() === ADMIN_EMAIL;
        setCurrentUser({ 
          ...currentUser,
          name: authForm.name || authForm.email.split('@')[0], 
          email: authForm.email, 
          isPremium: isAdmin,
          isCritic: isAdmin,
          isAdmin: isAdmin
        });
        setShowAuthModal(false);
      };

      const handleAddPhoto = (e) => {
        const file = e.target.files[0];
        if (file && currentUser.photos.length < 5) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setCurrentUser({ ...currentUser, photos: [...currentUser.photos, reader.result] });
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRemovePhoto = (index) => {
        const newPhotos = currentUser.photos.filter((_, i) => i !== index);
        setCurrentUser({
          ...currentUser,
          photos: newPhotos.length > 0 ? newPhotos : ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'],
          avatarIndex: 0
        });
      };

      const handleCreateForum = (e) => {
        e.preventDefault();
        if (!newForum.title.trim()) return;
        setForumsList([{ id: Date.now(), title: newForum.title, category: newForum.category, author: currentUser.name, description: newForum.description, replies: [] }, ...forumsList]);
        setNewForum({ title: '', category: 'General', description: '' });
        setShowNewForumModal(false);
      };

      const handleAddReply = (forumId) => {
        if (!newReplyText.trim()) return;
        setForumsList(forumsList.map(f => f.id === forumId ? { ...f, replies: [...f.replies, { author: currentUser.name, text: newReplyText }] } : f));
        if (selectedForum?.id === forumId) {
          setSelectedForum({ ...selectedForum, replies: [...selectedForum.replies, { author: currentUser.name, text: newReplyText }] });
        }
        setNewReplyText('');
      };

      const filteredStreaming = streamingFilter === 'Todos' 
        ? streamingReleases 
        : streamingReleases.filter(s => s.platform === streamingFilter);

      return (
        <div className={`min-h-screen transition-colors duration-300 ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          <header className={`border-b p-4 sticky top-0 z-40 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90 backdrop-blur'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider cursor-pointer" onClick={() => setActiveTab('cartelera')}>PLOTTWISME 🌐</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'cartelera', label: '🍿 Cartelera Local' },
                  { id: 'radar', label: '🎯 Radar Cines' },
                  { id: 'streaming', label: '📺 Streaming' },
                  { id: 'match', label: '🔥 Match' },
                  { id: 'foros', label: '💬 Foros' },
                  { id: 'perfil', label: '👤 Perfil' },
                  ...(currentUser?.isAdmin ? [{ id: 'admin', label: '⚡ Admin' }] : [])
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-800 hover:text-white'}`}>{tab.label}</button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={toggleTheme} className="p-2 bg-slate-800 text-white rounded-xl text-sm">🌓</button>
                <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow">
                  <img src={currentUser.photos[currentUser.avatarIndex] || currentUser.photos[0]} className="w-5 h-5 rounded-full object-cover border border-slate-950" />
                  <span>{currentUser.email === 'invitado@plottwisme.com' ? 'Iniciar Sesión' : currentUser.name}</span>
                </button>
              </div>
            </div>
          </header>

          {/* NOTIFICACIÓN EMERGENTE INSTANTÁNEA DE MATCH */}
          {matchNotification && (
            <div className="fixed bottom-5 right-5 z-50 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 p-4 rounded-2xl shadow-2xl flex items-center gap-4 max-w-sm border border-amber-300">
              <img src={matchNotification.avatar} className="w-12 h-12 rounded-xl object-cover border border-slate-950" />
              <div className="flex-1 text-xs">
                <p className="font-black text-sm uppercase">¡Nuevo Match Cinéfilo! 🔥</p>
                <p className="font-bold">{matchNotification.userName} ({matchNotification.matchPercent} de afinidad)</p>
                <p className="text-[10px] opacity-90">Coincidencia para ver: {matchNotification.movie}</p>
              </div>
              <button onClick={() => setMatchNotification(null)} className="font-bold text-slate-950 hover:text-white text-sm">✕</button>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-6">
            
            {/* PANTALLA INICIAL DE CARTELERA LOCAL */}
            {activeTab === 'cartelera' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center flex-wrap gap-2">
                  <div>
                    <h2 className="text-2xl font-black text-amber-500">🍿 Estrenos de la Semana en tu Área</h2>
                    <p className="text-xs text-slate-400">Cartelera en cines y salas cercanas disponibles hoy.</p>
                  </div>
                  <button onClick={() => setActiveTab('radar')} className="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 px-4 py-2 rounded-xl font-bold text-xs">
                    📍 Radar de Cines Cercanos
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {carteleraSemanal.map((film) => (
                    <div key={film.id} className={`p-6 rounded-3xl border space-y-4 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="flex justify-between items-start">
                        <span className="text-5xl">{film.poster}</span>
                        <span className="bg-amber-500/10 border border-amber-500/30 text-amber-400 font-black text-xs px-3 py-1 rounded-full">
                          ★ {film.rating}
                        </span>
                      </div>

                      <div>
                        <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-bold uppercase">{film.genre} • {film.runtime}</span>
                        <h3 className="text-xl font-black text-white mt-1">{film.title}</h3>
                        <p className="text-xs text-slate-400 mt-1">📍 {film.salas}</p>
                      </div>

                      <div className="pt-2 border-t border-slate-800">
                        <p className="text-[11px] font-bold text-slate-400 mb-2">Horarios de hoy:</p>
                        <div className="flex flex-wrap gap-2">
                          {film.times.map((t, idx) => (
                            <span key={idx} className="bg-slate-950 border border-slate-800 text-amber-400 text-xs font-mono font-bold px-3 py-1 rounded-lg">
                              🕒 {t}
                            </span>
                          ))}
                        </div>
                      </div>

                      <button onClick={() => setActiveTab('match')} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                        Buscar Compañero para esta función 🎟️
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* RADAR CINES */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <div className={`p-6 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <div className="flex justify-between items-center flex-wrap gap-2">
                    <div>
                      <h2 className="font-bold text-lg">🌍 Radar de Cines Global</h2>
                      <p className="text-xs text-slate-400">
                        {currentUser?.isPremium ? 'Modo Premium Internacional: Radio de 500 km' : 'Modo Estándar: Radio de 100 km'}
                      </p>
                    </div>
                    <button onClick={getGeoLocation} className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-xs">
                      📍 {locationStatus}
                    </button>
                  </div>
                </div>

                {cargandoCines && (
                  <div className="p-8 text-center text-amber-400 bg-slate-900 rounded-2xl border border-slate-800 animate-pulse">
                    🔍 Escaneando salas de cine cercanas...
                  </div>
                )}

                <div className="space-y-4">
                  {cinesGlobales.map((cine) => (
                    <div key={cine.id} className={`p-5 rounded-2xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="flex justify-between items-start flex-wrap gap-2">
                        <div>
                          <h4 className="font-bold text-lg text-amber-500">{cine.nombre}</h4>
                          <p className="text-xs text-slate-400">{cine.direccion}</p>
                        </div>
                        <span className="bg-slate-800 text-amber-400 text-xs px-3 py-1 rounded-full font-mono font-bold border border-slate-700">
                          📍 {cine.distanciaKm.toFixed(1)} km
                        </span>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-800">
                        <a href={`https://www.google.com/maps/search/?api=1&query=${cine.lat},${cine.lng}`} target="_blank" rel="noreferrer" className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl inline-flex items-center gap-1.5">
                          🗺️ Abrir en Google Maps
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* STREAMING */}
            {activeTab === 'streaming' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">📺 Estrenos en Plataformas</h2>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => setStreamingFilter('Todos')} className={`px-4 py-2 rounded-xl text-xs font-bold ${streamingFilter === 'Todos' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-900 border border-slate-800'}`}>
                    🌐 Todas
                  </button>
                  {streamingPlatforms.map((platform) => (
                    <button key={platform.name} onClick={() => setStreamingFilter(platform.name)} className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-2 ${streamingFilter === platform.name ? 'ring-2 ring-amber-500 bg-slate-800 text-white' : 'bg-slate-900 border border-slate-800'}`}>
                      <span className={`px-2 py-0.5 rounded text-[10px] text-white font-black ${platform.color}`}>{platform.logo}</span>
                      <span>{platform.name}</span>
                    </button>
                  ))}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {filteredStreaming.map((item) => (
                    <div key={item.id} className={`p-5 rounded-2xl border space-y-3 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <span className="text-4xl">{item.poster}</span>
                      <h3 className="font-bold text-lg text-white">{item.title}</h3>
                      <p className="text-xs text-slate-400">{item.genre}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PERFIL Y CONFIGURACIÓN NOTIFICACIONES */}
            {activeTab === 'perfil' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className={`p-8 rounded-3xl border space-y-6 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  
                  <div className="flex items-center gap-5 border-b border-slate-800 pb-6">
                    <img src={currentUser.photos[currentUser.avatarIndex] || currentUser.photos[0]} className="w-24 h-24 rounded-2xl object-cover border-2 border-amber-500" />
                    <div>
                      <h3 className="text-2xl font-black">{currentUser.name}</h3>
                      <p className="text-xs text-slate-400">{currentUser.email}</p>
                    </div>
                  </div>

                  {/* Interruptor Notificaciones de Match */}
                  <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-xs uppercase text-amber-500">🔔 Notificaciones de Match Instantáneas</h4>
                      <p className="text-[11px] text-slate-400">Recibe una alerta en tiempo real cuando encuentres afinidad cinéfila.</p>
                    </div>
                    <button 
                      onClick={() => setCurrentUser({ ...currentUser, allowMatchNotifications: !currentUser.allowMatchNotifications })}
                      className={`px-4 py-2 rounded-xl text-xs font-black transition-all ${currentUser.allowMatchNotifications ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}
                    >
                      {currentUser.allowMatchNotifications ? 'ACTIVADO' : 'DESACTIVADO'}
                    </button>
                  </div>

                  {/* Fotos de perfil (hasta 5) */}
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-xs uppercase text-slate-300">Mis Fotos de Perfil ({currentUser.photos.length}/5)</h4>
                      {currentUser.photos.length < 5 && (
                        <label className="bg-amber-500 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs cursor-pointer">
                          ➕ Subir Foto
                          <input type="file" accept="image/*" onChange={handleAddPhoto} className="hidden" />
                        </label>
                      )}
                    </div>

                    <div className="grid grid-cols-5 gap-2">
                      {currentUser.photos.map((img, index) => (
                        <div key={index} className="relative group">
                          <img 
                            src={img} 
                            onClick={() => setCurrentUser({ ...currentUser, avatarIndex: index })}
                            className={`w-full h-16 rounded-xl object-cover cursor-pointer border-2 ${currentUser.avatarIndex === index ? 'border-amber-500 scale-105' : 'border-slate-800 opacity-70'}`} 
                          />
                          {currentUser.photos.length > 1 && (
                            <button onClick={() => handleRemovePhoto(index)} className="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-4 pt-4 border-t border-slate-800 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">Mi Biografía:</label>
                      <textarea rows="3" value={currentUser.bio} onChange={(e) => setCurrentUser({ ...currentUser, bio: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-amber-500" />
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* MATCH */}
            {activeTab === 'match' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🔥 Match Cinéfilo</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {usersList.map((user) => (
                    <div key={user.id} className={`p-6 rounded-3xl border space-y-4 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="flex items-center gap-4">
                        <img src={user.avatar} className="w-14 h-14 rounded-2xl object-cover border border-amber-500" />
                        <div>
                          <h3 className="font-bold text-base text-white">{user.name}</h3>
                          <span className="text-[10px] bg-slate-800 px-2.5 py-0.5 rounded-full text-amber-400 font-bold">📍 a {user.distance}</span>
                        </div>
                      </div>
                      <p className="text-xs text-slate-300 italic">"{user.bio}"</p>
                      <button className="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase">Enviar Invitación al Cine 🎟️</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FOROS DE DEBATE */}
            {activeTab === 'foros' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-black text-amber-500">💬 Foros de Discusión</h2>
                  <button onClick={() => setShowNewForumModal(true)} className="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase">
                    ➕ Crear Nuevo Foro
                  </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="md:col-span-1 space-y-3">
                    {forumsList.map((forum) => (
                      <div key={forum.id} onClick={() => setSelectedForum(forum)} className={`p-4 rounded-2xl border cursor-pointer ${selectedForum?.id === forum.id ? 'border-amber-500 bg-amber-500/10' : 'bg-slate-900 border-slate-800'}`}>
                        <h4 className="font-bold text-sm text-white">{forum.title}</h4>
                        <span className="text-[10px] text-slate-400">Por {forum.author}</span>
                      </div>
                    ))}
                  </div>
                  <div className="md:col-span-2">
                    {selectedForum ? (
                      <div className="p-6 rounded-3xl border bg-slate-900 border-slate-800 space-y-4">
                        <h3 className="text-xl font-black text-amber-500">{selectedForum.title}</h3>
                        <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800">{selectedForum.description}</p>
                        <div className="space-y-2">
                          {selectedForum.replies.map((rep, idx) => (
                            <div key={idx} className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
                              <p className="font-bold text-amber-400">{rep.author}</p>
                              <p className="text-slate-200">{rep.text}</p>
                            </div>
                          ))}
                        </div>
                        <div className="flex gap-2">
                          <input type="text" value={newReplyText} onChange={(e) => setNewReplyText(e.target.value)} placeholder="Escribe tu opinión..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" />
                          <button onClick={() => handleAddReply(selectedForum.id)} className="bg-amber-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs">Responder</button>
                        </div>
                      </div>
                    ) : (
                      <div className="p-8 text-center text-slate-400 bg-slate-900 rounded-3xl border border-slate-800">
                        Selecciona un foro para ver el debate.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* PANEL ADMIN */}
            {activeTab === 'admin' && currentUser?.isAdmin && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">Panel de Administración</h2>
                <div className="p-6 rounded-3xl border bg-slate-900 border-slate-800 text-xs text-slate-300">
                  Panel reservado para el administrador ({currentUser.email}).
                </div>
              </div>
            )}

          </main>

          {/* MODAL NUEVO FORO */}
          {showNewForumModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 space-y-4 relative">
                <button onClick={() => setShowNewForumModal(false)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                <h3 className="text-lg font-black text-center text-amber-500">Crear Nuevo Foro</h3>
                <form onSubmit={handleCreateForum} className="space-y-3 text-xs">
                  <input type="text" required value={newForum.title} onChange={(e) => setNewForum({ ...newForum, title: e.target.value })} placeholder="Título del Tema" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <textarea required rows="3" value={newForum.description} onChange={(e) => setNewForum({ ...newForum, description: e.target.value })} placeholder="Descripción..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">Publicar</button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL AUTH */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                <h3 className="text-lg font-black text-center text-white">Iniciar Sesión / Registro</h3>
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  <input type="email" required value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} placeholder="Correo Electrónico" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <input type="password" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} placeholder="Contraseña" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">Ingresar</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
