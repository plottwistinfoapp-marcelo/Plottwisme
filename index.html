<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plottwisme</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-dark: #121824;
      --modal-bg: #222938;
      --primary-gold: #d97706;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-dark);
      border-radius: 16px;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
    }

    /* Encabezado */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: #ea580c;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .brand-info h1 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--primary-gold);
    }

    .brand-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Botón Selector de Idioma */
    .lang-btn {
      background-color: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Fondo y Modal Emergente de Idiomas */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lang-modal {
      background-color: var(--modal-bg);
      width: 85%;
      max-width: 360px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      
      /* Permite scroll si los 9 idiomas superan la altura de la pantalla */
      max-height: 75vh;
      overflow-y: auto;
    }

    .lang-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background-color 0.15s ease;
    }

    .lang-option:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .lang-option span {
      font-size: 1rem;
      font-weight: 500;
    }

    /* Radio button estilizado */
    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-option.selected .radio-circle {
      border-color: #3b82f6;
    }

    .lang-option.selected .radio-circle::after {
      content: "";
      width: 10px;
      height: 10px;
      background-color: #3b82f6;
      border-radius: 50%;
    }

    /* Estilo del contenido principal */
    .card-box {
      background-color: #1c2333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .action-btn {
      background-color: var(--primary-gold);
      color: #000;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="brand">
        <div class="avatar">P</div>
        <div class="brand-info">
          <h1>Plottwisme</h1>
          <span>🌐 GUEST</span>
        </div>
      </div>
      
      <!-- Botón que activa el Modal -->
      <button class="lang-btn" onclick="toggleModal(true)">
        <span id="current-lang-text">Español 🇪🇸</span> ▾
      </button>
    </div>

    <!-- Contenido dinamizado por idioma -->
    <div class="card-box">
      <h3 id="ui-title">Cartelera Oficial</h3>
      <p id="ui-desc" style="color: var(--text-muted); font-size: 0.9rem;">
        Horarios, salas y opciones de cines en tu ciudad.
      </p>
      <button class="action-btn" id="ui-btn">Abrir Cartelera Inteligente</button>
    </div>
  </div>

  <!-- Modal Flotante de Selección de Idioma -->
  <div class="modal-overlay" id="modal-overlay" onclick="toggleModal(false)">
    <div class="lang-modal" onclick="event.stopPropagation()">
      <div id="language-list-container">
        <!-- Se genera dinámicamente con las 9 opciones -->
      </div>
    </div>
  </div>

  <script>
    // 1. Definición de los 9 idiomas
    const availableLanguages = [
      { code: 'es', name: 'Español', flag: '🇪🇸' },
      { code: 'en', name: 'English', flag: '🇺🇸' },
      { code: 'pt', name: 'Português', flag: '🇧🇷' },
      { code: 'it', name: 'Italiano', flag: '🇮🇹' },
      { code: 'fr', name: 'Français', flag: '🇫🇷' },
      { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
      { code: 'ru', name: 'Русский', flag: '🇷🇺' },
      { code: 'pl', name: 'Polski', flag: '🇵🇱' },
      { code: 'nl', name: 'Nederlands', flag: '🇳🇱' }
    ];

    // 2. Traducciones de interfaz
    const uiTranslations = {
      es: { title: "Cartelera Oficial", desc: "Horarios, salas y opciones de cines en tu ciudad.", btn: "Abrir Cartelera Inteligente" },
      en: { title: "Official Showtime", desc: "Schedules, theaters, and cinema options in your city.", btn: "Open Smart Billboard" },
      pt: { title: "Cartaz Oficial", desc: "Horários, salas e opções de cinema na sua cidade.", btn: "Abrir Cartaz Inteligente" },
      it: { title: "Programmazione Ufficiale", desc: "Orari, sale e opzioni di cinema nella tua città.", btn: "Apri Programmazione Intelligente" },
      fr: { title: "Programme Officiel", desc: "Horaires, salles et options de cinéma dans votre ville.", btn: "Ouvrir le Programme Intelligent" },
      de: { title: "Offizielles Programm", desc: "Zeiten, Kinos und Optionen in Ihrer Stadt.", btn: "Intelligentes Programm Öffnen" },
      ru: { title: "Официальная Афиша", desc: "Расписание, залы и варианты кинотеатров в вашем городе.", btn: "Открыть Умную Афишу" },
      pl: { title: "Oficjalny Repertuar", desc: "Godziny, sale i opcje kinowe w Twoim mieście.", btn: "Otwórz Inteligentny Repertuar" },
      nl: { title: "Officiële Filmagenda", desc: "Tijden, zalen en bioscoopopties in jouw stad.", btn: "Open Slimme Filmagenda" }
    };

    let currentLang = 'es';

    // 3. Detección automática según el navegador
    function getBrowserLang() {
      const userLangs = navigator.languages || [navigator.language || navigator.userLanguage];
      for (let lang of userLangs) {
        if (!lang) continue;
        const shortLang = lang.split('-')[0].toLowerCase();
        const found = availableLanguages.find(l => l.code === shortLang);
        if (found) return found.code;
      }
      return 'es';
    }

    // 4. Muestra / Oculta el Modal
    function toggleModal(show) {
      const overlay = document.getElementById('modal-overlay');
      if (show) overlay.classList.add('active');
      else overlay.classList.remove('active');
    }

    // 5. Genera la lista de opciones dentro del modal
    function renderModalOptions() {
      const container = document.getElementById('language-list-container');
      container.innerHTML = availableLanguages.map(lang => {
        const isSelected = lang.code === currentLang;
        return `
          <div class="lang-option ${isSelected ? 'selected' : ''}" onclick="selectLanguage('${lang.code}')">
            <span>${lang.name} ${lang.flag}</span>
            <div class="radio-circle"></div>
          </div>
        `;
      }).join('');
    }

    // 6. Cambia el idioma en toda la aplicación
    function selectLanguage(code) {
      currentLang = code;
      const langObj = availableLanguages.find(l => l.code === code);
      
      // Actualiza el texto del botón principal
      document.getElementById('current-lang-text').innerText = `${langObj.name} ${langObj.flag}`;
      
      // Actualiza la interfaz
      const texts = uiTranslations[code] || uiTranslations['es'];
      document.getElementById('ui-title').innerText = texts.title;
      document.getElementById('ui-desc').innerText = texts.desc;
      document.getElementById('ui-btn').innerText = texts.btn;

      renderModalOptions();
      toggleModal(false);
    }

    // 7. Inicialización al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      const initialLang = getBrowserLang();
      selectLanguage(initialLang);
    });
  </script>
</body>
</html>
