    const SEARCH_CATEGORIES = [

    ];

    const calculateDistanceKm = (lat1, lon1, lat2, lon2) => {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    };

    function CinemaMapComponent({ userCity, userCoords, targetCoords, maxAllowedRadius, isDarkMode, cardBg, textColor }) {
      const center = targetCoords || userCoords || null;
      const defaultRadius = Math.min(maxAllowedRadius, 100);
      const [radius, setRadius] = useState(defaultRadius);
      const [debRadius, setDebRadius] = useState(defaultRadius);
      useEffect(() => { setRadius(defaultRadius); setDebRadius(defaultRadius); }, [defaultRadius]);
      const [cinemas, setCinemas] = useState([]);
      const [status, setStatus] = useState('idle');
      const [retryTick, setRetryTick] = useState(0);

      useEffect(() => {
        const t = setTimeout(() => setDebRadius(radius), 600);
        return () => clearTimeout(t);
      }, [radius]);

      useEffect(() => {
        if (!center) { setStatus('nocoords'); return; }
        const ctrl = new AbortController();
        setStatus('loading');
        const r = Math.round(debRadius * 1000);
        const q = `[out:json][timeout:40];(node["amenity"="cinema"](around:${r},${center.lat},${center.lon});way["amenity"="cinema"](around:${r},${center.lat},${center.lon}););out center tags;`;
        const mirrors = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
        const cacheKey = 'cines_' + center.lat.toFixed(2) + '_' + center.lon.toFixed(2) + '_' + Math.round(debRadius);
        const buildList = (elements) => (elements || []).map(el => {
          const lat = el.lat ?? el.center?.lat; const lon = el.lon ?? el.center?.lon;
          return { id: el.type + el.id, name: el.tags?.name || 'Cine', website: el.tags?.website || el.tags?.['contact:website'] || '', city: el.tags?.['addr:city'] || '', lat, lon, dist: calculateDistanceKm(center.lat, center.lon, lat, lon) };
        }).filter(c => c.lat && c.lon && c.dist <= debRadius).sort((a, b) => a.dist - b.dist).filter((c, i, arr) => arr.findIndex(x => x.name === c.name && x.dist === c.dist) === i).slice(0, 30);

        let cached = null;
        try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) {}
        if (cached && Array.isArray(cached.elements)) {
          setCinemas(buildList(cached.elements));
          setStatus('ok');
          if (Date.now() - cached.t < 12 * 3600 * 1000 && retryTick === 0) return;
        }

        const one = (url) => fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctrl.signal })
          .then(res => { if (!res.ok) throw new Error('http ' + res.status); return res.json(); });
        const raceAny = (promises) => new Promise((resolve, reject) => {
          let failed = 0;
          promises.forEach(pr => pr.then(resolve, () => { failed++; if (failed === promises.length) reject(new Error('all failed')); }));
        });
        raceAny(mirrors.map(one))
          .then(data => {
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), elements: data.elements || [] })); } catch (e) {}
            setCinemas(buildList(data.elements));
            setStatus('ok');
          })
          .catch(() => { if (!ctrl.signal.aborted && !cached) setStatus('error'); });
        return () => ctrl.abort();
      }, [center?.lat, center?.lon, debRadius, retryTick]);

      const zoom = Math.max(8, Math.min(14, Math.round(15 - Math.log2(Math.max(radius, 1) / 1.2))));
      const mapSrc = center
        ? `https://www.google.com/maps?q=${encodeURIComponent('cines')}&ll=${center.lat},${center.lon}&z=${zoom}&output=embed`
        : `https://www.google.com/maps?q=${encodeURIComponent('cines en ' + userCity)}&output=embed`;
      const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : '';

      return (
        <div className={`${cardBg} p-4 rounded-3xl shadow-xl space-y-3`}>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h3 className={`font-black ${textColor} text-sm`}>🗺️ Cines cerca de <span className="text-amber-500 capitalize">{userCity}</span></h3>
            <span className="text-[10px] bg-amber-500/20 text-amber-500 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">📏 Máx. de tu plan: <b>{maxAllowedRadius} km</b></span>
          </div>

          <div className="space-y-1">
            <label className={`text-xs font-bold ${textColor}`}>Radio de búsqueda: <span className="text-amber-500">{radius} km</span></label>
            <input type="range" min="1" max={maxAllowedRadius} value={radius} onChange={e => setRadius(Number(e.target.value))} className="w-full accent-amber-500" />
          </div>

          <div className="w-full h-72 rounded-2xl overflow-hidden border border-amber-500/30 relative">
            <iframe title="Google Maps Cines" src={mapSrc} width="100%" height="100%" style={{ border: 0 }} allowFullScreen="" loading="lazy" referrerPolicy="no-referrer-when-downgrade" className={isDarkMode ? 'map-dark-mode' : ''}></iframe>
          </div>

          <div className="space-y-2">
            {status === 'loading' && <p className={`text-xs ${textColor}`}>⏳ Buscando cines en {radius} km…</p>}
            {status === 'nocoords' && <p className={`text-xs ${textColor}`}>Activa tu ubicación para ver los cines del radio.</p>}
            {status === 'error' && (
              <div className="space-y-2">
                <p className="text-xs text-rose-400">No se pudo cargar la lista de cines. Con radios muy grandes el servicio puede tardar o fallar; prueba un radio menor o reintenta.</p>
                <button onClick={() => setRetryTick(n => n + 1)} className="text-xs px-3 py-1.5 rounded-xl bg-amber-500 text-black font-bold">🔄 Reintentar</button>
              </div>
            )}
            {status === 'ok' && cinemas.length === 0 && <p className={`text-xs ${textColor}`}>No encontramos cines en {debRadius} km. Prueba ampliando el radio.</p>}
            {status === 'ok' && cinemas.length > 0 && <p className={`text-xs font-bold ${textColor}`}>🎬 {cinemas.length} cine{cinemas.length > 1 ? 's' : ''} en {debRadius} km</p>}
            {cinemas.map(c => (
              <div key={c.id} className="p-3 rounded-2xl border border-amber-500/30 flex flex-wrap items-center justify-between gap-2">
                <div className="min-w-0">
                  <p className={`font-bold text-sm ${textColor} truncate`}>{c.name}</p>
                  <p className="text-xs text-amber-500 font-bold">{c.dist} km</p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <a href={`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}`} target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-1.5 rounded-xl bg-amber-500 text-black font-bold">Cómo llegar</a>
                  <a href={c.city ? `https://www.google.com/search?q=${encodeURIComponent('horarios cartelera cine ' + c.name + ' ' + c.city)}` : `https://www.google.com/maps/search/${encodeURIComponent(c.name)}/@${c.lat},${c.lon},16z`} target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-1.5 rounded-xl border border-amber-500/50 text-amber-500 font-bold">Ver horarios</a>
                  {safeUrl(c.website) && <a href={safeUrl(c.website)} target="_blank" rel="noopener noreferrer" className="text-xs px-3 py-1.5 rounded-xl border border-amber-500/50 text-amber-500 font-bold">Sitio web</a>}
                </div>
              </div>
            ))}
            <p className="text-[10px] opacity-70">Datos de OpenStreetMap; en ciudades chicas puede faltar algún cine.</p>
          </div>
        </div>

    function App() {
      const [lang, setLang] = useState(() => getBrowserLang());
      const t = TRANSLATIONS[lang] || TRANSLATIONS.es;

      const [isDarkMode, setIsDarkMode] = useState(true);
      const [usersList, setUsersList] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      
      const [activeTab, setActiveTab] = useState('cinema');

      const [profileEditing, setProfileEditing] = useState(false);

      const [currentPhotoIndex, setCurrentPhotoIndex] = useState(0);

      const [userCity, setUserCity] = useState('Detectando ubicación...');
      const [userCountryCode, setUserCountryCode] = useState('AR');
      const [userCoords, setUserCoords] = useState(null);
      const [targetCoords, setTargetCoords] = useState({ lat: -34.6037, lon: -58.3816 });
      const [matchRadiusKm, setMatchRadiusKm] = useState(100);
      const [radarFilterType, setRadarFilterType] = useState('all');

      useEffect(() => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              setUserCoords({ lat, lon });
              setTargetCoords({ lat, lon });
              
              try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=es`);
                const data = await response.json();
                if (data && data.address) {
                  const city = data.address.city || data.address.town || data.address.village || data.address.state || "Ubicación GPS";
                  const country = data.address.country || "";
                  setUserCity(`${city}, ${country}`);
                } else {
                  setUserCity(`GPS (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
                }
              } catch (err) {
                setUserCity(`GPS (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
              }
            },
            () => {
              setUserCity('Buenos Aires, Argentina');
              setUserCoords({ lat: -34.6037, lon: -58.3816 });
              setTargetCoords({ lat: -34.6037, lon: -58.3816 });
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        } else {
          setUserCity('Buenos Aires, Argentina');
          setUserCoords({ lat: -34.6037, lon: -58.3816 });
          setTargetCoords({ lat: -34.6037, lon: -58.3816 });
        }
      }, []);

      const [chatsList, setChatsList] = useState([]);
      const [activeChat, setActiveChat] = useState(null);
      const stateRef = React.useRef({});
      const knownLastMsgs = React.useRef(null);

            let width = img.width;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }

              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

                  sex: 'Masculino',
                  interestedIn: 'Todos / Cualquiera',
                  publicBio: 'Devoto del cine de autor y creador de Plottwisme.',
                  datingBio: 'Buscando citas cinéfilas.',
                  location: userCity,
                  lat: userCoords?.lat || -34.6037,
                  lon: userCoords?.lon || -58.3816,
                  distanceKm: 2.5,
                  role: 'admin',
                  roleLabel: 'Administrador General',
                  isPremium: true,
                  isCritic: true,
                  verified: true,
                  kycVerified: true,
                  muteNotifications: false,
                  photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],
                  avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
                  socialLinks: { radio: 'Frecuencia Cine', tv: 'Canal 12 Misiones' }
                };
                await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "users", "u1"), adminUser, { merge: true });
                setCurrentUser(adminUser);
                setShowAuthModal(false);
                setAuthEmail('');
                setAuthPassword('');
                return;
              } else { throw authErr; }
            }

            const uid = userCred.user.uid;
            const docSnap = await window.FirebaseFns.getDoc(window.FirebaseFns.doc(window.db, "users", uid));
            if (docSnap.exists()) {
              let loggedData = docSnap.data();
              if (cleanEmail === 'marbuttice@gmail.com') {
                loggedData.role = 'admin';
                loggedData.roleLabel = 'Administrador General';
                loggedData.isCritic = true;
                loggedData.isPremium = true;
                loggedData.kycVerified = true;
                loggedData.verified = true;
              }
              setCurrentUser(loggedData);
            } else {
              // La cuenta existe pero su ficha no se guardó: la recreamos con datos básicos
              const mail = (userCred.user.email || cleanEmail).toLowerCase();
              const recovered = {
                id: uid,
                name: userCred.user.displayName || mail.split('@')[0],
                email: mail,
                age: 18,
                birthdate: '',
                sex: 'Otro',
                interestedIn: 'Todos / Cualquiera',
                publicBio: 'Apasionado por el cine y las buenas charlas.',
                datingBio: 'Buscando conectar para citas y películas.',
                location: userCity,
                lat: Math.round((userCoords?.lat || -34.6037) * 100) / 100,
                lon: Math.round((userCoords?.lon || -58.3816) * 100) / 100,
                distanceKm: 5.0,
                role: 'general',
                roleLabel: 'Cinéfilo',
                isPremium: false,
                isCritic: false,
                verified: false,
                kycVerified: false,
                muteNotifications: false,
                photos: [],
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80',
                socialLinks: {}
              };
              await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "users", uid), recovered);
              setCurrentUser(recovered);
            }
          }
          setShowAuthModal(false);
          setAuthEmail('');
          setAuthPassword('');
        } catch (err) {
          console.error('Error de acceso:', err);
          try { window.alert('No se pudo completar el acceso: ' + (err && (err.code || err.message) || 'error desconocido')); } catch (e) {}
        }
      };

      const handleForgotSubmit = async (e) => {
        e.preventDefault();
        if (resetStep === 1) {
          const found = usersList.find(u => u.email.toLowerCase() === forgotEmail.toLowerCase());
          if (!found && forgotEmail.toLowerCase().trim() !== 'marbuttice@gmail.com') return;
          setResetStep(2);
        } else {
          setShowAuthModal(false);
          setAuthMode('login');
          setResetStep(1);
          setForgotEmail('');
        }
      };

      const handleLogout = async () => {
        try { await window.FirebaseFns.signOut(window.auth); } catch(e){}
        setCurrentUser(null);
        setActiveTab('cinema');
      };

      const filteredCandidates = useMemo(() => {
        const others = usersList.filter(u => u.email !== currentUser?.email);
        const maxLimit = isAdmin ? 1000 : (currentUser?.isPremium ? 500 : 100);
        const effectiveRadius = Math.min(matchRadiusKm, maxLimit);

        return others.filter(u => {
          if (!currentUser?.lat || !currentUser?.lon || !u.lat || !u.lon) {
            return isAdmin;
          }
          const dist = calculateDistanceKm(currentUser.lat, currentUser.lon, u.lat, u.lon);
          if (!isAdmin && (dist > effectiveRadius || dist > 1000)) return false;
          if (radarFilterType === 'verified' && !u.kycVerified) return false;
          if (radarFilterType === 'critic' && !u.isCritic) return false;

          if (currentUser?.interestedIn && currentUser.interestedIn !== 'Todos / Cualquiera') {
            const myPref = currentUser.interestedIn.toLowerCase();
            const candidateSex = (u.sex || 'Masculino').toLowerCase();
            if (myPref.includes('masculino') && !candidateSex.includes('masculino')) return false;
            if (myPref.includes('femenino') && !candidateSex.includes('femenino')) return false;
          }
          return true;
        });
      }, [usersList, currentUser, matchRadiusKm, radarFilterType, isAdmin]);

      const currentCandidate = filteredCandidates[currentIndex];

      useEffect(() => {
        setCurrentPhotoIndex(0);
      }, [currentIndex]);

      const handleUpgradePlan = async (isPrem) => {
        if (!currentUser) { setShowAuthModal(true); return; }
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "users", currentUser.id), {
            isPremium: isPrem,
            roleLabel: isPrem ? 'Cinéfilo Premium ⭐' : 'Cinéfilo Estándar'
          });
          setCurrentUser(prev => ({ ...prev, isPremium: isPrem }));
          setMatchRadiusKm(isPrem ? 500 : 100);
        } catch(err) {}
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        const primaryAvatar = editPhotos.length > 0 ? editPhotos[0] : 'https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=500&auto=format&fit=crop&q=80';
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "users", currentUser.id), {
            publicBio: editPublicBio,
            datingBio: editDatingBio,
            sex: editSex,
            interestedIn: editInterestedIn,
            photos: editPhotos,
            avatar: primaryAvatar,
            socialLinks: { radio: editRadio, tv: editTv },
            muteNotifications: editMuteNotifications
          });
          setCurrentUser(prev => ({ ...prev, muteNotifications: editMuteNotifications, photos: editPhotos, avatar: primaryAvatar, publicBio: editPublicBio, datingBio: editDatingBio, sex: editSex, interestedIn: editInterestedIn }));
          setProfileEditing(false);
          setProfileSavedMsg('✔ Perfil guardado');
          setTimeout(() => setProfileSavedMsg(''), 3500);
        } catch(err) {
          try { window.alert('No se pudo guardar el perfil: ' + (err && (err.code || err.message) || 'error')); } catch (e) {}
        }
      };

      const shareApp = async () => {
        const url = window.location.origin;
        const text = '¡Sumate a Plottwisme, la red social cinéfila! 🎬🍿';
        try {
          if (navigator.share) { await navigator.share({ title: 'Plottwisme', text, url }); return; }
        } catch (e) { return; }
        try { await navigator.clipboard.writeText(text + ' ' + url); window.alert('Enlace copiado. ¡Compartilo con tus amigos!'); } catch (e) { window.prompt('Copiá este enlace:', url); }
      };

      const handlePublishReview = async (e) => {
        e.preventDefault();
        if (!currentUser?.isCritic) return;
        if (!newReviewMovie || !newReviewText) return;
        const newRev = {
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: currentUser.socialLinks?.radio || currentUser.socialLinks?.tv || currentUser.roleLabel,
          date: new Date().toISOString().split('T')[0],
          likes: 0,
          likedBy: []
        };
        try {
          await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "reviews", 'r_' + Date.now()), newRev);
          setNewReviewMovie('');
          setNewReviewText('');
        } catch(err) {}
      };

      const handleLikeReview = async (rev) => {
        if (!currentUser) { setShowAuthModal(true); return; }
        const likedBy = rev.likedBy || [];
        const alreadyLiked = likedBy.includes(currentUser.email);
        const newLikedBy = alreadyLiked ? likedBy.filter(e => e !== currentUser.email) : [...likedBy, currentUser.email];
        const newLikes = alreadyLiked ? (rev.likes || 1) - 1 : (rev.likes || 0) + 1;
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "reviews", rev.id), { likes: newLikes, likedBy: newLikedBy });
        } catch(e) {}
      };

      const handleCreateTopic = async (e) => {
        e.preventDefault();
        if (!currentUser) { setShowAuthModal(true); return; }
        if (!newTopicTitle || !newTopicContent) return;
        const topicId = 'f_' + Date.now();
        const newTopic = {
          title: newTopicTitle,
          category: newTopicCategory,
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          repliesCount: 0,
          content: newTopicContent,
          comments: [],
          likes: 0,
          likedBy: []
        };
        try {
          await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "forums", topicId), newTopic);
          setNewTopicTitle('');
          setNewTopicContent('');
          setShowNewTopicModal(false);
        } catch(err) {}
      };

      const handleLikeTopic = async (topic) => {
        if (!currentUser) { setShowAuthModal(true); return; }
        const likedBy = topic.likedBy || [];
        const alreadyLiked = likedBy.includes(currentUser.email);
        const newLikedBy = alreadyLiked ? likedBy.filter(e => e !== currentUser.email) : [...likedBy, currentUser.email];
        const newLikes = alreadyLiked ? (topic.likes || 1) - 1 : (topic.likes || 0) + 1;
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "forums", topic.id), { likes: newLikes, likedBy: newLikedBy });
        } catch(e) {}
      };

      const handleAddComment = async (e, customText = null) => {
        if (e) e.preventDefault();
        const textToAdd = customText !== null ? customText : newCommentText;
        if (!currentUser || !textToAdd || !activeTopic) return;
        const comment = {
          id: 'c_' + Date.now(),
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          text: textToAdd
        };
        const updatedComments = [...(activeTopic.comments || []), comment];
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "forums", activeTopic.id), {
            comments: updatedComments,
            repliesCount: updatedComments.length
          });
          setActiveTopic({ ...activeTopic, comments: updatedComments, repliesCount: updatedComments.length });
          if (customText === null) setNewCommentText('');
          setShowEmojiPicker(false);
        } catch(err) {}
      };

      const lastMsgOf = (chat) => (chat.messages || [])[(chat.messages || []).length - 1];
      const isChatUnread = (chat) => {
        const last = lastMsgOf(chat);
        if (!last || !currentUser) return false;
        if (last.sender === currentUser.name) return false;
        if (activeTab === 'chats' && activeChat && activeChat.id === chat.id) return false;
        return readMap[chat.id] !== last.id;
      };
      const peerOf = (chat) => {
        const other = (chat.participants || []).find(e => e && currentUser && e.toLowerCase() !== currentUser.email.toLowerCase());
        const u = other ? usersList.find(x => x.email && x.email.toLowerCase() === other.toLowerCase()) : null;
        return {
          name: u ? u.name : (chat.userName || (other ? other.split('@')[0] : 'Chat')),
          avatar: u ? ((u.photos && u.photos[0]) || u.avatar) : (chat.userAvatar || ''),
          id: u ? u.id : chat.userId
        };
      };
      const unreadChatsCount = chatsList.filter(isChatUnread).length;

      stateRef.current = {
        activeChat, activeTab, peerOf,
        notify: triggerPushNotification,
        beep: () => {
          try {
            if (currentUser?.muteNotifications) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            const ctx = new Ctx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08;
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.18);
            setTimeout(() => { try { ctx.close(); } catch (e) {} }, 400);
          } catch (e) {}
        }
      };

      // Marcar como leído el chat abierto
      useEffect(() => {
        if (activeTab !== 'chats' || !activeChat || !currentUser) return;
        const last = lastMsgOf(activeChat);
        if (!last) return;
        setReadMap(prev => {
          if (prev[activeChat.id] === last.id) return prev;
          const next = { ...prev, [activeChat.id]: last.id };
          try { localStorage.setItem('chatRead_' + currentUser.email, JSON.stringify(next)); } catch (e) {}
          return next;
        });
      }, [activeTab, activeChat?.id, activeChat?.messages?.length]);

      // Número de mensajes sin leer en el título de la pestaña
      useEffect(() => {
        document.title = (unreadChatsCount > 0 ? `(${unreadChatsCount}) ` : '') + 'Plottwisme - Red Social Cinéfila & Citas';
      }, [unreadChatsCount]);

      const themeBg = isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-[#fbf6ec] text-slate-900';
      const navBg = isDarkMode ? 'bg-slate-950/95 border-slate-900' : 'bg-[#fffdf8]/95 border-amber-100';
      const cardBg = isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-amber-100 shadow-md';
      const subCardBg = isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-amber-50/70 border-amber-200/70';
      const textColor = isDarkMode ? 'text-slate-100' : 'text-slate-900';
      const mutedText = isDarkMode ? 'text-slate-300' : 'text-slate-700';
      const inputBg = isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-white border-amber-300/70 text-slate-900';

      return (
        <div className={`flex flex-col min-h-screen ${themeBg} ${isDarkMode ? '' : 'light-theme'} transition-colors duration-300`}>
          
          {!isAppInstalled && (
            <div className="bg-gradient-to-r from-amber-500 to-rose-500 text-slate-950 px-4 py-2 text-xs font-black flex items-center justify-between shadow-md z-50 sticky top-0">
              <span className="flex items-center gap-1.5">📱 ¡Lleva Plottwisme contigo! Instálala en tu dispositivo.</span>
              <button 
                onClick={async () => {
                  if (installPromptEvent) {
                    installPromptEvent.prompt();
                    const choiceResult = await installPromptEvent.userChoice;
                    if (choiceResult.outcome === 'accepted') setIsAppInstalled(true);
                  } else {
                    setShowInstallGuideModal(true);
                  }
                }}
                className="bg-slate-950 text-amber-400 px-3 py-1 rounded-xl uppercase tracking-wider hover:scale-105 transition-transform"
              >
                Instalar Ahora
              </button>
            </div>
          )}

          <header className={`sticky ${!isAppInstalled ? 'top-8' : 'top-0'} z-40 ${navBg} backdrop-blur-md border-b px-3 py-2 transition-colors`}>
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }}>
                <img src="icon-512x512.png" alt="Logo" className="w-8 h-8 rounded-xl object-cover shadow-md shadow-amber-500/20" />
                <h1 className="text-base font-black font-brand text-amber-500 hidden sm:block">
                  Plottwisme
                  {currentUser?.kycVerified && <span className="text-xs text-sky-400 ml-1">✔</span>}
                </h1>
              </div>

              <nav className="flex items-center gap-1 overflow-x-auto no-scrollbar py-1">
                <button onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.cinema}</button>
                <button onClick={() => { setActiveTab('forums'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'forums' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.forums}</button>
                <button onClick={() => { setActiveTab('radar'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.radar}</button>
                
                <button onClick={() => { setActiveTab('chats'); setActiveTopic(null); }} className={`relative px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'chats' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>
                  {t.chats}
                  {unreadChatsCount > 0 && (
                    <span className="absolute -top-1 -right-1 bg-rose-600 text-white font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center shadow animate-pulse">
                      {unreadChatsCount}
                    </span>
                  )}
                </button>

                <button onClick={() => { setActiveTab('critics'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.critics}</button>
                
                {currentUser && (
                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.profile}</button>
                )}

                {isAdmin && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap transition-all ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-amber-500/20 text-amber-500 border border-amber-500/40'}`}>
                    🛡️ Admin
                  </button>
                )}
              </nav>

              <div className="flex items-center gap-2 shrink-0">
                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-1.5 rounded-xl text-xs border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-slate-200 border-slate-300 text-amber-600'}`}>
                  {isDarkMode ? '☀️' : '🌙'}
                </button>

                {currentUser ? (
                  <button onClick={handleLogout} className={`p-1.5 rounded-xl text-xs border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-200 border-slate-300 text-slate-700'}`} title={t.logout}>🚪</button>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setResetStep(1); setShowAuthModal(true); }} className="px-2.5 py-1 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 shadow">
                    {t.login}
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6">
            
            {currentUser?.isPremium && activeTab !== 'chats' && (
              <div className="premium-banner bg-gradient-to-r from-amber-500/20 via-rose-500/20 border border-amber-500/50 p-4 rounded-2xl flex items-center justify-between shadow-lg mb-6">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">⭐</span>
                  <div>
                    <h4 className="font-black text-amber-500 text-sm">¡Beneficio Activo: 15 Días de Premium!</h4>
                    <p className={`text-xs ${mutedText}`}>Funciones avanzadas y radar extendido con Cloud Storage seguro.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'cinema' && (
              <div className="space-y-8">
                <div className={`flex flex-wrap items-center justify-between gap-3 ${cardBg} border border-amber-500/30 px-4 py-3 rounded-2xl text-xs shadow-lg`}>
                  <div className="flex items-center gap-2">
                    <span className="text-amber-500 font-bold">📍 Tu Ubicación:</span>
                    {isStrictAdminUser ? (
                      <input 
                        type="text" 
                        value={userCity} 
                        onChange={(e) => handleCityChangeInput(e.target.value)} 
                        className={`${inputBg} px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-500/50 w-48`}
                      />
                    ) : (
                      <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${subCardBg} ${textColor} border border-amber-500/20 capitalize`}>
                        {userCity} 🔒
                      </span>
                    )}
                  </div>
                </div>

                <CinemaMapComponent 
                  userCity={userCity}
                  userCoords={userCoords}
                  targetCoords={targetCoords}
                  maxAllowedRadius={maxAllowedMapRadius}
                  isDarkMode={isDarkMode} 
                  cardBg={cardBg} 
                  textColor={textColor} 
                />
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className={`${cardBg} text-amber-500 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all`}>
                      <span>← Volver</span>
                    </button>

                    <div className={`${cardBg} p-6 rounded-3xl space-y-4 shadow-xl`}>
                      <div className={`flex flex-wrap items-center justify-between gap-2 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-100'} pb-3`}>
                        <span className="bg-amber-500/20 text-amber-500 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {activeTopic.category}
                        </span>
                        <span className={`text-xs ${mutedText}`}>Por <b>{activeTopic.author}</b> • {activeTopic.date}</span>
                      </div>
                      <h2 className={`text-2xl font-black ${textColor}`}>{activeTopic.title}</h2>
                      <p className={`text-sm ${mutedText} leading-relaxed whitespace-pre-line`}>{activeTopic.content}</p>
                      
                      <div className="flex items-center gap-4 pt-2">
                        <button onClick={() => handleLikeTopic(activeTopic)} className={`flex items-center gap-1.5 ${subCardBg} px-3 py-1.5 rounded-xl border text-xs font-bold text-amber-500`}>
                          <span>🍿</span> <span>{activeTopic.likes || 0} Me gusta</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">💬 Respuestas ({activeTopic.comments?.length || 0})</h3>

                      {(activeTopic.comments || []).map(c => (
                        <div key={c.id} className={`${cardBg} p-4 rounded-2xl space-y-2`}>
                          <div className={`flex justify-between items-center text-xs ${mutedText}`}>
                            <span className={`font-bold ${textColor}`}>{c.author}</span>
                            <span>{c.date}</span>
                          </div>
                          <p className={`text-xs ${mutedText} leading-relaxed`}>{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className={`${cardBg} p-4 rounded-2xl space-y-3 relative`}>
                        <div className="flex items-center gap-2">
                          <textarea rows="2" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder="Escribe tu respuesta..." className={`flex-1 ${inputBg} rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500`} required disabled={!currentUser} />
                          <button type="button" onClick={() => setShowEmojiPicker(!showEmojiPicker)} className={`${subCardBg} p-2.5 rounded-xl text-base`} title="Emojis">😀</button>
                        </div>

                        {showEmojiPicker && (
                          <div className={`absolute bottom-16 right-4 ${cardBg} p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-20`}>
                            {QUICK_EMOJIS.map(em => (
                              <button key={em} type="button" onClick={() => setNewCommentText(prev => prev + em)} className="text-lg hover:scale-125 transition-transform p-1">{em}</button>
                            ))}
                          </div>
                        )}

                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          Publicar Respuesta
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className={`${cardBg} p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl`}>
                      <div>
                        <h2 className={`text-2xl font-black ${textColor}`}>💬 Foros de Discusión</h2>
                        <p className={`text-xs ${mutedText} mt-1`}>Comparte tus teorías cinéfilas.</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        ✍️ Nuevo Debate
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.length === 0 ? (
                        <p className={`text-xs ${mutedText} text-center py-6`}>Aún no hay debates. ¡Sé el primero en abrir uno!</p>
                      ) : (
                        forumTopics.map(topic => (
                          <div key={topic.id} className={`${cardBg} hover:border-amber-500/60 p-5 rounded-2xl transition-all space-y-3 group`}>
                            <div className="flex justify-between items-center text-xs">
                              <span className="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{topic.category}</span>
                              <span className={`${mutedText} text-[10px]`}>{topic.date}</span>
                            </div>
                            <h3 onClick={() => setActiveTopic(topic)} className={`text-base font-bold ${textColor} group-hover:text-amber-500 transition-colors cursor-pointer`}>{topic.title}</h3>
                            <div className={`flex justify-between items-center text-xs ${mutedText} pt-1 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                              <span>Por <b>{topic.author}</b></span>
                              <div className="flex items-center gap-3">
                                <button onClick={() => handleLikeTopic(topic)} className="flex items-center gap-1 hover:text-amber-500 font-bold">
                                  <span>🍿</span> <span>{topic.likes || 0}</span>
                                </button>
                                <span className="text-amber-500 font-bold cursor-pointer" onClick={() => setActiveTopic(topic)}>💬 {topic.repliesCount || 0}</span>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="flex flex-col items-center space-y-3">
                <div className={`w-full max-w-md flex flex-wrap items-center justify-between gap-2 ${cardBg} px-4 py-2 rounded-2xl text-xs shadow`}>
                  <div className="flex items-center gap-2">
                    <span className="text-rose-500 font-bold">🎯 Radar: <b className={textColor}>{matchRadiusKm} km</b></span>
                    <input 
                      type="range" 
                      min="10" 
                      max={maxAllowedMapRadius} 
                      step="10"
                      value={matchRadiusKm} 
                      onChange={(e) => setMatchRadiusKm(Number(e.target.value))}
                      className="w-24 accent-rose-500 cursor-pointer"
                    />
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => setRadarFilterType('all')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'all' ? 'bg-amber-500 text-slate-950' : `${subCardBg}${mutedText}`}`}>Todos</button>
                    <button onClick={() => setRadarFilterType('verified')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'verified' ? 'bg-sky-500 text-slate-950' : `${subCardBg}${mutedText}`}`}>✔ Verif.</button>
                    <button onClick={() => setRadarFilterType('critic')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'critic' ? 'bg-amber-400 text-slate-950' : `${subCardBg}${mutedText}`}`}>🌟 Críticos</button>
                  </div>
                </div>

                {currentCandidate ? (() => {
                  const candidatePhotos = currentCandidate.photos?.length > 0 ? currentCandidate.photos : [currentCandidate.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'];
                  const activePhoto = candidatePhotos[currentPhotoIndex] || candidatePhotos[0];
                  const computedDist = (currentUser?.lat && currentUser?.lon && currentCandidate.lat && currentCandidate.lon) 
                    ? calculateDistanceKm(currentUser.lat, currentUser.lon, currentCandidate.lat, currentCandidate.lon) 
                    : (currentCandidate.distanceKm || 5);

                  return (
                    <div className={`w-full max-w-md ${cardBg} rounded-3xl overflow-hidden shadow-2xl`}>
                      <div className="relative h-96 w-full bg-slate-900 select-none">
                        <img src={activePhoto} alt={currentCandidate.name} className="w-full h-full object-cover transition-opacity duration-300" />
                        
                        {candidatePhotos.length > 1 && (
                          <div className="absolute top-3 left-3 right-3 flex gap-1 z-10">
                            {candidatePhotos.map((_, pIdx) => (
                              <div key={pIdx} className={`h-1 flex-1 rounded-full transition-all ${pIdx === currentPhotoIndex ? 'bg-amber-500 shadow-md shadow-amber-500' : 'bg-white/40'}`}></div>
                            ))}
                          </div>
                        )}

                        {candidatePhotos.length > 1 && (
                          <>
                            <button onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev > 0 ? prev - 1 : candidatePhotos.length - 1)); }} className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100">‹</button>
                            <button onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev < candidatePhotos.length - 1 ? prev + 1 : 0)); }} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100">›</button>
                          </>
                        )}

                        <div className="absolute top-5 left-4 flex gap-2">
                          <span className="bg-rose-600/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-white shadow">{currentCandidate.sex || 'Perfil'} • Busca: {currentCandidate.interestedIn || 'Cualquiera'}</span>
                          {currentCandidate.kycVerified && (
                            <span className="bg-sky-500 text-slate-950 px-2.5 py-1 rounded-full text-xs font-black flex items-center gap-1 shadow">✔ Verificado</span>
                          )}
                        </div>

                        <div className="absolute bottom-4 left-4 right-4 bg-gradient-to-t from-slate-950 via-slate-950/70 to-transparent pt-10 pb-2 px-2">
                          <h2 className="text-2xl font-black text-white flex items-center gap-2 drop-shadow">
                            {currentCandidate.name}, {currentCandidate.age || 25}
                            {currentCandidate.kycVerified && <span className="text-sky-400 text-lg">✔</span>}
                          </h2>
                          <p className="text-xs text-amber-400 font-medium drop-shadow">
                            📍 {currentCandidate.location || 'Ubicación'} • 📏 A aprox. <b>{computedDist} km</b>
                          </p>
                        </div>
                      </div>

                      <div className="p-6 space-y-4">
                        <div className="bg-rose-500/10 border border-rose-500/30 p-3.5 rounded-2xl">
                          <p className="text-[10px] uppercase font-bold text-rose-500 mb-1">💬 Descripción para Citas:</p>
                          <p className={`text-xs italic ${textColor}`}>"{currentCandidate.datingBio || currentCandidate.bio || 'Amante del buen cine y buscando conectar.'}"</p>
                        </div>
                        
                        <div className="flex justify-center gap-6 pt-2">
                          <button onClick={() => setCurrentIndex(prev => prev + 1)} className={`w-14 h-14 rounded-full ${subCardBg} text-rose-500 flex items-center justify-center text-xl font-bold shadow transition-all hover:scale-105`}>✖</button>
                          <button onClick={() => { handleMatchUser(currentCandidate); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20 hover:scale-110 transition-all">🍿</button>
                        </div>
                      </div>
                    </div>
                  );
                })() : (
                  <div className={`text-center py-14 space-y-4 max-w-md ${cardBg} p-8 rounded-3xl shadow-xl`}>
                    <div className="text-4xl">{filteredCandidates.length === 0 ? '🍿' : '🎟️'}</div>
                    {filteredCandidates.length === 0 ? (
                      <>
                        <h3 className={`text-xl font-bold ${textColor}`}>Lo sentimos, todavía no hay usuarios en tu zona.</h3>
                        <p className={`text-sm ${mutedText}`}>Cada día se suman más cinéfilos. Probá ampliar el radio o volvé más tarde.</p>
                        {matchRadiusKm < maxAllowedMapRadius && (
                          <button onClick={() => setMatchRadiusKm(maxAllowedMapRadius)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-md">
                            📡 Ampliar radio a {maxAllowedMapRadius} km
                          </button>
                        )}
                        <button onClick={shareApp} className={`w-full ${subCardBg} border ${textColor} font-black py-3 rounded-xl text-xs uppercase tracking-wider`}>
                          📲 Invitar amigos cinéfilos
                        </button>
                      </>
                    ) : (
                      <>
                        <h3 className={`text-xl font-bold ${textColor}`}>Ya viste todos los perfiles cercanos.</h3>
                        <p className={`text-sm ${mutedText}`}>Volvé más tarde para ver nuevos cinéfilos, o repasá los perfiles otra vez.</p>
                        <button onClick={() => setCurrentIndex(0)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-md">
                          🔄 Volver a ver perfiles
                        </button>
                        <button onClick={shareApp} className={`w-full ${subCardBg} border ${textColor} font-black py-3 rounded-xl text-xs uppercase tracking-wider`}>
                          📲 Invitar amigos cinéfilos
                        </button>
                      </>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="max-w-4xl mx-auto space-y-4">
