<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plottwisme - Cartelera de Cines</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #38bdf8;
      --accent-premium: #f59e0b;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .user-badge {
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid var(--border);
    }

    .badge-premium {
      color: var(--accent-premium);
      border-color: var(--accent-premium);
    }

    .badge-standard {
      color: var(--accent);
    }

    .controls {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .cinema-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .cinema-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .cinema-title {
      margin: 0;
      font-size: 1.3rem;
      color: var(--accent);
    }

    .distance-tag {
      background: #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .movies-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .movie-card {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .movie-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .showtimes {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .map-btn {
      display: inline-block;
      margin-top: 10px;
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 5px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎬 Cartelera de Cines Cercanos</h1>
      <div id="userBadge" class="user-badge badge-standard">
        Plan: Estándar (Radio: 100 km)
      </div>
    </header>

    <div class="controls">
      <button onclick="obtenerUbicacionYBuscar()">📍 Detectar Mi Ubicación</button>
      <button onclick="cambiarPlan()">⚡ Cambiar Plan (Prueba)</button>
    </div>

    <div id="statusMessage" style="margin-bottom: 15px; color: #94a3b8;">
      Presiona "Detectar Mi Ubicación" para cargar las carteleras de tu zona.
    </div>

    <div id="cinemasContainer"></div>
  </div>

  <script>
    // Configuración general
    let GOOGLE_MAPS_API_KEY = ""; // Pegar tu API Key de Google Maps aquí cuando la tengas
    let esPremium = false;
    let userLat = null;
    let userLng = null;

    // Cines base (Región Misiones) para fallback y cálculo de distancia directa
    const cinesLocales = [
      {
        nombre: "Cine Teatro Oberá",
        direccion: "San Martín 1069, Oberá, Misiones",
        lat: -27.4862,
        lng: -55.1228,
        cartelera: [
          { titulo: "Avatar 3: Fire and Ash", horarios: "18:00 - 21:30" },
          { titulo: "IntensaMente 2", horarios: "16:00" }
        ]
      },
      {
        nombre: "Las Tipas Cinemas Posadas",
        direccion: "Av. Quaranta 3598, Posadas, Misiones",
        lat: -27.4045,
        lng: -55.9387,
        cartelera: [
          { titulo: "Deadpool & Wolverine", horarios: "17:30 - 20:00 - 22:30" },
          { titulo: "Mi Villano Favorito 4", horarios: "15:00 - 17:00" }
        ]
      },
      {
        nombre: "IMAX del Conocimiento",
        direccion: "Av. Ulises López, Posadas, Misiones",
        lat: -27.3821,
        lng: -55.9615,
        cartelera: [
          { titulo: "Oppenheimer (Re-estreno IMAX)", horarios: "20:00" }
        ]
      },
      {
        nombre: "Sunstar Cinemas - Posadas",
        direccion: "Plaza Shopping, Posadas, Misiones",
        lat: -27.3668,
        lng: -55.8918,
        cartelera: [
          { titulo: "Alien: Romulus", horarios: "19:00 - 21:45" }
        ]
      }
    ];

    // Cambiar entre plan Estándar (100km) y Premium (500km)
    function cambiarPlan() {
      esPremium = !esPremium;
      const badge = document.getElementById("userBadge");
      
      if (esPremium) {
        badge.className = "user-badge badge-premium";
        badge.innerText = "Plan: Premium (Radio: 500 km)";
      } else {
        badge.className = "user-badge badge-standard";
        badge.innerText = "Plan: Estándar (Radio: 100 km)";
      }

      if (userLat !== null && userLng !== null) {
        procesarBusquedaCines(userLat, userLng);
      }
    }

    // Solicitar geolocalización al navegador
    function obtenerUbicacionYBuscar() {
      const status = document.getElementById("statusMessage");
      status.innerText = "Obteniendo ubicación...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLat = position.coords.latitude;
            userLng = position.coords.longitude;
            status.innerText = `Ubicación detectada: Lat ${userLat.toFixed(3)}, Lng ${userLng.toFixed(3)}`;
            procesarBusquedaCines(userLat, userLng);
          },
          (error) => {
            status.innerText = "No se pudo obtener la ubicación GPS. Usando posición por defecto (Oberá).";
            userLat = -27.4862;
            userLng = -55.1228;
            procesarBusquedaCines(userLat, userLng);
          }
        );
      } else {
        status.innerText = "Navegador sin soporte de GPS. Usando posición por defecto.";
        userLat = -27.4862;
        userLng = -55.1228;
        procesarBusquedaCines(userLat, userLng);
      }
    }

    // Fórmula Haversine para calcular distancia en km
    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    // Filtrar cines según el radio permitido
    function procesarBusquedaCines(lat, lng) {
      const radioMaximoKm = esPremium ? 500 : 100;
      const container = document.getElementById("cinemasContainer");
      container.innerHTML = "";

      const cinesEnRango = cinesLocales.map(cine => {
        const dist = calcularDistanciaKm(lat, lng, cine.lat, cine.lng);
        return { ...cine, distanciaKm: dist };
      }).filter(cine => cine.distanciaKm <= radioMaximoKm);

      // Ordenar de más cercano a más lejano
      cinesEnRango.sort((a, b) => a.distanciaKm - b.distanciaKm);

      if (cinesEnRango.length === 0) {
        container.innerHTML = `<p>No se encontraron cines dentro del radio de ${radioMaximoKm} km.</p>`;
        return;
      }

      cinesEnRango.forEach(cine => {
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${cine.lat},${cine.lng}`;
        
        let moviesHtml = "";
        cine.cartelera.forEach(pelicula => {
          moviesHtml += `
            <div class="movie-card">
              <div class="movie-title">${pelicula.titulo}</div>
              <div class="showtimes">Horarios: ${pelicula.horarios}</div>
            </div>
          `;
        });

        const card = document.createElement("div");
        card.className = "cinema-card";
        card.innerHTML = `
          <div class="cinema-header">
            <div>
              <h2 class="cinema-title">${cine.nombre}</h2>
              <div style="font-size:0.9rem; color:#94a3b8;">${cine.direccion}</div>
            </div>
            <span class="distance-tag">📍 ${cine.distanciaKm.toFixed(1)} km</span>
          </div>
          <div class="movies-list">${moviesHtml}</div>
          <a class="map-btn" href="${mapUrl}" target="_blank">🗺️ Ver ruta en Google Maps</a>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
