<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plottwisme - Red Social Cinéfila, Cartelera & Comunidad</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains+Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
  </style>
</head>
<body class="antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Marcelo Buttice',
        email: 'marbuttice@gmail.com',
        age: 56,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
        location: 'Oberá, Misiones, Argentina',
        distanceKm: 2.5,
        role: 'admin',
        roleLabel: 'Administrador General',
        isPremium: true,
        isCritic: true,
        verified: true,
        bio: 'Devoto del cine de autor y la ciencia ficción dura. Creador de Plottwisme.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],
        topMovies: ['Dune: Parte 2', 'Blade Runner 2049'],
        favoriteGenres: ['Sci-Fi', 'Thriller', 'Drama'],
        affinity: 100
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        email: 'elena@gmail.com',
        age: 24,
        sex: 'Femenino',
        lookingFor: 'Amigos Cinéfilos',
        location: 'Posadas, Misiones',
        distanceKm: 85.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro',
        isPremium: false,
        isCritic: true,
        verified: true,
        bio: 'Directora de cortos amateur y crítica de cine asiático.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80'],
        topMovies: ['Parasite', 'Perfect Blue'],
        favoriteGenres: ['Psicológico', 'Autor'],
        affinity: 93
      },
      {
        id: 'u3',
        name: 'Camila Valenzuela',
        email: 'camila@gmail.com',
        age: 28,
        sex: 'Femenino',
        lookingFor: 'Cita / Pareja',
        location: 'Corrientes Capital',
        distanceKm: 180.0, // Fuera del estándar de 100km, requiere Premium
        role: 'general',
        roleLabel: 'Cinéfila Pro',
        isPremium: false,
        isCritic: false,
        verified: true,
        bio: 'Amante del terror clásico y festivales independientes.',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=80',
        photos: ['https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&auto=format&fit=crop&q=80'],
        topMovies: ['El Resplandor', 'Hereditary'],
        favoriteGenres: ['Terror', 'Indie'],
        affinity: 88
      }
    ];

    const BASE_MOVIES = [
      {
        id: 'm1',
        title: 'Dune: Parte Dos',
        director: 'Denis Villeneuve',
        genre: 'Ciencia Ficción / Épica',
        duration: '166 min',
        rating: '9.4',
        poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80',
        synopsis: 'Paul Atreides se une a Chani y a los Fremen buscando venganza contra los conspiradores.'
      },
      {
        id: 'm2',
        title: 'Oppenheimer',
        director: 'Christopher Nolan',
        genre: 'Drama / Biografía',
        duration: '180 min',
        rating: '9.1',
        poster: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600&auto=format&fit=crop&q=80',
        synopsis: 'La historia del físico J. Robert Oppenheimer y su rol en el desarrollo de la bomba atómica.'
      },
      {
        id: 'm3',
        title: 'Pobres Criaturas',
        director: 'Yorgos Lanthimos',
        genre: 'Comedia Negra / Fantasía',
        duration: '141 min',
        rating: '8.8',
        poster: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop&q=80',
        synopsis: 'La fantástica evolución de Bella Baxter, una joven revivida por un científico brillante.'
      },
      {
        id: 'm4',
        title: 'Anatomía de una Caída',
        director: 'Justine Triet',
        genre: 'Suspenso / Drama Judicial',
        duration: '152 min',
        rating: '8.9',
        poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=80',
        synopsis: 'Una mujer es sospechosa de la muerte de su esposo, con su hijo ciego como único testigo.'
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_current_session');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      // Estado para controlar la pantalla de bienvenida post-registro
      const [showWelcomeModal, setShowWelcomeModal] = useState(false);

      const [isDarkMode, setIsDarkMode] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_dark_mode');
          return saved !== null ? JSON.parse(saved) : true;
        } catch (e) {
          return true;
        }
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regAge, setRegAge] = useState(18);
      const [regSex, setRegSex] = useState('Femenino');
      const [regLookingFor, setRegLookingFor] = useState('Amigos Cinéfilos');
      const [regBio, setRegBio] = useState('');

      const [activeTab, setActiveTab] = useState('radar');
      const [currentIndex, setCurrentIndex] = useState(0);

      const [userCity, setUserCity] = useState('Oberá, Misiones');
      const [selectedMovieTheaters, setSelectedMovieTheaters] = useState(null);

      const [reportModalUser, setReportModalUser] = useState(null);
      const [reportReason, setReportReason] = useState('Foto falsa o inapropiada');

      const [reportsList, setReportsList] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_all_reports');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [usersList, setUsersList] = useState(() => {
        try {
          const saved = localStorage.getItem('plottwist_all_users');
          return saved ? JSON.parse(saved) : INITIAL_USERS;
        } catch (e) {
          return INITIAL_USERS;
        }
      });

      // Geolocalización automática al iniciar sesión
      useEffect(() => {
        if (currentUser && navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              // Geolocalización exitosa (simulamos lectura de coordenadas aproximadas a ciudad local o Misiones)
              setUserCity('Oberá, Misiones'); 
            },
            () => {
              // Fallback si el usuario deniega el GPS
              setUserCity('Oberá, Misiones');
            }
          );
        }
      }, [currentUser]);

      useEffect(() => {
        try {
          localStorage.setItem('plottwist_dark_mode', JSON.stringify(isDarkMode));
        } catch (e) {}
      }, [isDarkMode]);

      useEffect(() => {
        try {
          localStorage.setItem('plottwist_all_users', JSON.stringify(usersList));
        } catch (e) {}
      }, [usersList]);

      useEffect(() => {
        try {
          if (currentUser) {
            localStorage.setItem('plottwist_current_session', JSON.stringify(currentUser));
          } else {
            localStorage.removeItem('plottwist_current_session');
          }
        } catch (e) {}
      }, [currentUser]);

      const dynamicBillboard = useMemo(() => {
        const cityName = userCity.trim() || 'Oberá';
        return BASE_MOVIES.map(movie => ({
          ...movie,
          theaters: [
            { name: `Cine Center ${cityName.split(',')[0]}`, distance: '1.4 km', showtimes: ['17:00', '19:30', '22:15'] },
            { name: `Multiplex ${cityName.split(',')[0]}`, distance: '4.8 km', showtimes: ['16:15', '18:45', '21:30'] },
            { name: `Cinemark Hoyts (${cityName.split(',')[0]})`, distance: '9.2 km', showtimes: ['14:30', '18:00', '21:00'] }
          ]
        }));
      }, [userCity]);

      // FILTRO ESTRICTO DE DISTANCIA: 100km estándar o 500km si es Premium
      const maxDistance = currentUser?.isPremium ? 500 : 100;
      const filteredCandidates = useMemo(() => {
        return usersList.filter(u => u.email !== currentUser?.email && u.distanceKm <= maxDistance);
      }, [usersList, currentUser, maxDistance]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usersList.find(u => u.email === loginEmail);
        if (found) {
          setCurrentUser(found);
          setActiveTab('radar');
        } else {
          alert('Usuario no encontrado. Regístrese primero.');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (Number(regAge) < 18) {
          alert('Error de verificación: Plottwisme es exclusivamente para mayores de 18 años.');
          return;
        }
        const newUser = {
          id: 'u_' + Date.now(),
          name: regName,
          email: regEmail,
          password: regPassword,
          age: Number(regAge),
          sex: regSex,
          lookingFor: regLookingFor,
          location: 'Oberá, Misiones',
          distanceKm: 45.0,
          role: regEmail === 'marbuttice@gmail.com' ? 'admin' : 'general',
          roleLabel: regEmail === 'marbuttice@gmail.com' ? 'Administrador General' : 'Cinéfilo Pro',
          isPremium: false, // Nueva cuenta comienza como Estándar
          isCritic: false,
          verified: true,
          bio: regBio || 'Apasionado del cine.',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80',
          photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80'],
          topMovies: ['Interstellar', 'Parasite'],
          favoriteGenres: ['Drama', 'Sci-Fi'],
          affinity: 90
        };
        setUsersList([...usersList, newUser]);
        setCurrentUser(newUser);
        setShowWelcomeModal(true); // Activa el modal de bienvenida y oferta premium
      };

      const handleUpgradeToPremium = () => {
        const updated = { ...currentUser, isPremium: true, roleLabel: 'Cinéfilo Premium ⭐' };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === currentUser.email ? updated : u));
        setShowWelcomeModal(false);
        alert('🎉 ¡Bienvenido a Plottwisme Premium! Tu radar se ha ampliado a 500 km.');
        setActiveTab('radar');
      };

      const bgApp = isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900';
      const bgHeader = isDarkMode ? 'bg-slate-950/95 border-slate-800' : 'bg-white/95 border-slate-200';
      const cardBg = isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900 shadow-lg';
      const inputBg = isDarkMode ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-100 border-slate-300 text-slate-900';
      const navBg = isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-slate-200 border-slate-300';

      if (!currentUser) {
        return (
          <div className={`min-h-screen ${bgApp} flex items-center justify-center p-4 transition-colors`}>
            <div className={`max-w-md w-full ${cardBg} rounded-3xl p-8 shadow-2xl space-y-6 border`}>
              <div className="text-center space-y-2">
                <h1 className="text-3xl font-black font-brand text-amber-500">Plottwisme</h1>
                <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Red Social Cinéfila, Cartelera y Match (+18)</p>
              </div>

              <div className={`flex ${inputBg} p-1 rounded-2xl border`}>
                <button type="button" onClick={() => setAuthMode('login')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${authMode === 'login' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Iniciar Sesión</button>
                <button type="button" onClick={() => setAuthMode('register')} className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${authMode === 'register' ? 'bg-amber-500 text-slate-950' : 'text-slate-400'}`}>Crear Cuenta</button>
              </div>

              {authMode === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400">Correo Electrónico:</label>
                    <input type="email" value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Contraseña:</label>
                    <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3 border`} required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider">Entrar</button>
                </form>
              ) : (
                <form onSubmit={handleRegister} className="space-y-3 text-xs">
                  <div>
                    <label className="block mb-1 text-slate-400">Nombre Completo:</label>
                    <input type="text" value={regName} onChange={(e) => setRegName(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Correo Electrónico:</label>
                    <input type="email" value={regEmail} onChange={(e) => setRegEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Contraseña:</label>
                    <input type="password" value={regPassword} onChange={(e) => setRegPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block mb-1 text-slate-400">Edad (+18):</label>
                      <input type="number" min="18" value={regAge} onChange={(e) => setRegAge(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`} required />
                    </div>
                    <div>
                      <label className="block mb-1 text-slate-400">Sexo:</label>
                      <select value={regSex} onChange={(e) => setRegSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5 border`}>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="No Binario">No Binario</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider mt-2">Registrarse (+18)</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className={`flex flex-col min-h-screen ${bgApp} transition-colors`}>
          {/* MODAL DE BIENVENIDA Y OFERTA PREMIUM POST-REGISTRO */}
          {showWelcomeModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} rounded-3xl max-w-lg w-full p-8 space-y-6 shadow-2xl border border-amber-500/40 text-center animate-pulse`}>
                <div className="w-16 h-16 bg-amber-500 text-slate-950 rounded-3xl mx-auto flex items-center justify-center text-3xl font-black shadow-lg">🎬</div>
                <div className="space-y-2">
                  <h2 className="text-2xl font-black text-amber-500 font-brand">¡Bienvenido a Plottwisme, {currentUser.name}!</h2>
                  <p className="text-xs text-slate-300">Tu perfil ha sido creado con éxito. Detectamos automáticamente tu ubicación en <b>{userCity}</b> y tu radar estándar de 100 km está activo.</p>
                </div>

                <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl text-left space-y-2 text-xs">
                  <p className="text-amber-400 font-bold">✨ ¿Quieres desbloquear todo el potencial de inmediato?</p>
                  <p className="text-slate-300">Actualiza a <b>Premium</b> ahora para ampliar tu radar de búsqueda a <b>500 km</b> y conectar con cinéfilos en toda la región.</p>
                </div>

                <div className="flex flex-col sm:flex-row gap-3 pt-2">
                  <button type="button" onClick={handleUpgradeToPremium} className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl uppercase tracking-wider text-xs shadow-lg">
                    ⭐ Comprar Premium (500 km)
                  </button>
                  <button type="button" onClick={() => setShowWelcomeModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3.5 rounded-xl text-xs">
                    Continuar Gratis (100 km)
                  </button>
                </div>
              </div>
            </div>
          )}

          <header className={`sticky top-0 z-40 backdrop-blur-md border-b px-4 py-3 ${bgHeader}`}>
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center justify-between w-full sm:w-auto">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('radar')}>
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                  <div>
                    <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                    <p className={`text-[10px] uppercase ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>{currentUser.isPremium ? '⭐ Premium (Radio 500km)' : '👤 Estándar (Radio 100km)'}</p>
                  </div>
                </div>
                <button type="button" onClick={() => setCurrentUser(null)} className="sm:hidden text-xs text-rose-500 font-bold bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/30">Salir</button>
              </div>

              {/* Geolocalización / Ciudad detectada */}
              <div className="flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-2xl text-xs w-full sm:w-auto justify-center">
                <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ubicación GPS:</span>
                <input type="text" value={userCity} onChange={(e) => setUserCity(e.target.value)} className={`bg-transparent border-0 px-1 py-0.5 font-bold w-44 focus:outline-none ${isDarkMode ? 'text-amber-300' : 'text-amber-700'}`} title="Puedes editar tu ubicación si lo deseas" />
              </div>

              <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                <nav className={`flex items-center gap-1 p-1 rounded-2xl border overflow-x-auto ${navBg}`}>
                  <button type="button" onClick={() => setActiveTab('radar')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>🎯 Radar</button>
                  <button type="button" onClick={() => setActiveTab('cinema')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950' : isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>🎬 Cartelera</button>
                  {!currentUser.isPremium && <button type="button" onClick={() => setActiveTab('premium')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'premium' ? 'bg-amber-500 text-slate-950' : 'text-amber-500 animate-pulse'}`}>⭐ Premium</button>}
                  {currentUser.role === 'admin' && <button type="button" onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'admin' ? 'bg-amber-500 text-slate-950' : isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>🛡️ Admin</button>}
                  <button type="button" onClick={() => setActiveTab('profile')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : isDarkMode ? 'text-slate-300' : 'text-slate-700'}`}>👤 Perfil</button>
                </nav>

                <button type="button" onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2 rounded-xl border text-xs font-bold transition-all ${isDarkMode ? 'bg-slate-900 border-slate-700 text-amber-400' : 'bg-slate-200 border-slate-300 text-amber-700'}`} title="Cambiar Tema Claro/Oscuro">
                  {isDarkMode ? '☀️ Claro' : '🌙 Oscuro'}
                </button>

                <button type="button" onClick={() => setCurrentUser(null)} className="hidden sm:block text-xs text-rose-500 hover:text-rose-600 font-bold bg-rose-500/10 px-3 py-1.5 rounded-xl border border-rose-500/30">Salir</button>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {activeTab === 'radar' && (
              <div className="flex flex-col items-center">
                <div className="mb-4 bg-amber-500/10 border border-amber-500/30 px-4 py-2 rounded-2xl text-xs text-amber-500 text-center space-y-1">
                  <p>🎯 Radar activo en <b>{userCity}</b> (Radio: <b>{currentUser.isPremium ? '500 km' : '100 km'}</b>)</p>
                </div>

                {currentCandidate ? (
                  <div className={`w-full max-w-md ${cardBg} rounded-3xl overflow-hidden shadow-2xl relative border`}>
                    <div className="relative h-96 w-full bg-slate-900">
                      <img src={currentCandidate.avatar} alt={currentCandidate.name} className="w-full h-full object-cover" />
                      <div className="absolute top-4 left-4 bg-rose-600 px-3 py-1 rounded-full text-xs font-bold text-white">{currentCandidate.lookingFor}</div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <h2 className="text-2xl font-black text-white">{currentCandidate.name}, {currentCandidate.age}</h2>
                        <p className="text-xs text-amber-300">📍 {currentCandidate.location} • A {currentCandidate.distanceKm} km</p>
                      </div>
                    </div>
                    <div className="p-6 space-y-4">
                      <p className={`text-xs italic ${isDarkMode ? 'text-slate-300' : 'text-slate-600'}`}>"{currentCandidate.bio}"</p>
                      <div className="flex justify-center gap-6 pt-4 border-t border-slate-700">
                        <button type="button" onClick={() => setCurrentIndex(prev => prev + 1)} className="w-14 h-14 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center text-xl font-bold">✖</button>
                        <button type="button" onClick={() => { alert(`¡Match enviado a ${currentCandidate.name}!`); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-2xl font-black">🍿</button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="text-center py-20 space-y-4 max-w-md">
                    <h3 className="text-xl font-bold">No hay más perfiles en tu radio de {maxDistance} km.</h3>
                    {!currentUser.isPremium && (
                      <button type="button" onClick={() => setActiveTab('premium')} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider">⭐ Ampliar a 500 km (Premium)</button>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'cinema' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-black">🎬 Cartelera de Cines en {userCity}</h2>
                  <p className={`text-xs ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Salas y horarios detectados para tu ubicación actual.</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                  {dynamicBillboard.map(m => (
                    <div key={m.id} className={`${cardBg} rounded-3xl overflow-hidden p-4 flex flex-col justify-between space-y-4 border shadow-xl`}>
                      <div className="space-y-3">
                        <div className="relative h-64 rounded-2xl overflow-hidden bg-slate-900">
                          <img src={m.poster} alt={m.title} className="w-full h-full object-cover" />
                          <span className="absolute top-2 right-2 bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md">★ {m.rating}</span>
                        </div>
                        <div>
                          <span className="text-[10px] font-bold text-rose-500 uppercase">{m.genre}</span>
                          <h3 className="text-base font-black">{m.title}</h3>
                          <p className={`text-[11px] ${isDarkMode ? 'text-slate-400' : 'text-slate-600'}`}>Dir. {m.director} • {m.duration}</p>
                        </div>
                      </div>
                      <button type="button" onClick={() => setSelectedMovieTheaters(m)} className="w-full bg-amber-500/20 hover:bg-amber-500 hover:text-slate-950 text-amber-500 font-bold py-2.5 rounded-xl text-xs transition-all border border-amber-500/40">📍 Dónde ver y Cines</button>
                    </div>
                  ))}
                </div>

                {selectedMovieTheaters && (
                  <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className={`${cardBg} rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border`}>
                      <h3 className="text-base font-black">Salas para: {selectedMovieTheaters.title}</h3>
                      <div className="space-y-3">
                        {selectedMovieTheaters.theaters.map((t, idx) => (
                          <div key={idx} className={`p-3 rounded-2xl border space-y-1 ${isDarkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-300'}`}>
                            <div className="flex justify-between text-xs font-bold">
                              <span>🗺️ {t.name}</span>
                              <span className="text-amber-500">{t.distance}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                      <button type="button" onClick={() => setSelectedMovieTheaters(null)} className="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Cerrar</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'premium' && (
              <div className={`max-w-xl mx-auto ${cardBg} border-amber-500/30 rounded-3xl p-8 space-y-6 shadow-2xl text-center border`}>
                <div className="w-16 h-16 bg-amber-500 text-slate-950 rounded-3xl mx-auto flex items-center justify-center text-3xl font-black">⭐</div>
                <h2 className="text-2xl font-black text-amber-500 font-brand">Plottwisme Premium</h2>
                <div className={`p-6 rounded-2xl border text-left space-y-3 text-xs ${inputBg}`}>
                  <p>✓ <b>Radar ampliado a 500 km</b> (Ideal para conectar con otras ciudades y provincias).</p>
                  <p>✓ <b>Insignia Dorada VIP</b> en tu perfil cinéfilo.</p>
                </div>
                <button type="button" onClick={handleUpgradeToPremium} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-4 rounded-2xl uppercase tracking-wider text-sm shadow-xl">🚀 Activar Membresía Premium</button>
              </div>
            )}

            {activeTab === 'profile' && (
              <div className={`max-w-xl mx-auto ${cardBg} rounded-3xl p-6 space-y-6 border`}>
                <h2 className="text-xl font-black">👤 Mi Perfil Cinéfilo</h2>
                <div className="space-y-4 text-xs">
                  <textarea rows="3" defaultValue={currentUser.bio} className={`w-full ${inputBg} rounded-xl p-3 border`} />
                  <button type="button" onClick={() => alert('Guardado')} className="bg-amber-500 text-slate-950 font-bold px-6 py-2.5 rounded-xl">Guardar</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
