<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila Mundial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'plottwist.infoapp@gmail.com';
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function obtenerLinkCine(nombreCine, ciudad) {
      return `https://www.google.com/search?q=cartelera+de+cine+horarios+cerca+de+${encodeURIComponent(nombreCine)}+${encodeURIComponent(ciudad)}`;
    }

    function App() {
      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('cartelera'); 
      const [locationStatus, setLocationStatus] = useState('Detectar mi ubicación');
      const [userCoords, setUserCoords] = useState(null);
      const [countryCode, setCountryCode] = useState('AR'); 
      const [cityName, setCityName] = useState('Posadas');

      // Formulario de Autenticación
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      // Opciones Inclusivas
      const opcionesGenero = ['Hombre', 'Mujer', 'No Binarie', 'Género Fluido', 'Transgénero', 'Otro'];
      const opcionesBusqueda = ['Hombres', 'Mujeres', 'Personas No Binarias', 'Todos / Sin preferencia'];

      // Usuario Activo
      const [currentUser, setCurrentUser] = useState({
        name: 'Marcelo Catan',
        email: 'marcelo@plottwisme.com',
        bio: 'Apasionado por el cine analógico, sci-fi y los giros de guión inesperados.',
        genres: 'Cine de Autor, Sci-Fi, Thriller, Clásicos',
        usageMode: 'dating', // 'community', 'friends', 'dating'
        
        // DATOS PRIVADOS (Solo visibles dentro de las ventanas/tarjetas de MATCH)
        showDatingCard: true,
        genderIdentity: 'Hombre',
        interestedIn: 'Mujeres',
        datingBio: 'Busco compartir funciones nocturnas, conversaciones profundas y analizar la película tomando un café.',
        
        isPremium: true,
        isVerifiedCritic: false,
        isAdmin: false,
        photo: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'
      });

      const [isEditingProfile, setIsEditingProfile] = useState(false);
      const [profileForm, setProfileForm] = useState({ ...currentUser });

      // Usuarios simulados para el Módulo MATCH
      const [matchProfiles, setMatchProfiles] = useState([
        {
          id: 101,
          name: 'Valeria R.',
          age: 38,
          photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
          distanceKm: 4.2,
          usageMode: 'dating',
          genderIdentity: 'Mujer',
          interestedIn: 'Hombres',
          datingBio: 'Fan de Kubrick y A24. Busco alguien para ir al cine los viernes y tomar una copa a la salida.',
          genres: 'Cine Independiente, Drama, Terror Psicológico'
        },
        {
          id: 102,
          name: 'Martín G.',
          age: 42,
          photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80',
          distanceKm: 8.5,
          usageMode: 'friends',
          genderIdentity: 'Hombre',
          interestedIn: 'Todos / Sin preferencia',
          datingBio: '',
          genres: 'Ciencia Ficción, Acción, Clásicos'
        }
      ]);

      // Cartelera y Cines
      const [cartelera, setCartelera] = useState([]);
      const [cargandoCartelera, setCargandoCartelera] = useState(false);
      const [cinesGlobales, setCinesGlobales] = useState([]);

      // Watch Party
      const [watchParties, setWatchParties] = useState([
        { id: 1, title: 'Maratón Sci-Fi: Inception', host: 'Marcelo Catan', platform: 'Netflix', time: 'Hoy 21:00 hs', participants: 4 }
      ]);
      const [newParty, setNewParty] = useState({ title: '', platform: 'Netflix', time: '' });

      // Reseñas de Críticos
      const [reviews, setReviews] = useState([
        { id: 1, author: 'Lucía M.', isCritic: true, movie: 'Dune: Parte 2', rating: '5/5', text: 'Una obra maestra del cine de ciencia ficción moderno.' }
      ]);

      // Chat Flotante
      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { id: 1, user: 'Sofía', text: '¿Alguien para la función de las 20hs?', time: '18:30' }
      ]);
      const [newMessage, setNewMessage] = useState('');

      const handleSaveProfile = (e) => {
        e.preventDefault();
        setCurrentUser({ ...profileForm });
        setIsEditingProfile(false);
        alert('¡Perfil y preferencias actualizadas correctamente!');
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const isAdmin = authForm.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        const updatedUser = {
          ...currentUser,
          name: authForm.name || authForm.email.split('@')[0],
          email: authForm.email,
          isAdmin: isAdmin,
          isPremium: isAdmin ? true : currentUser.isPremium,
          isVerifiedCritic: isAdmin ? true : currentUser.isVerifiedCritic
        };
        setCurrentUser(updatedUser);
        setProfileForm(updatedUser);
        setShowAuthModal(false);
      };

      const cargarCarteleraEnCines = async (region = 'AR') => {
        setCargandoCartelera(true);
        try {
          const url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1&region=${region}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            setCartelera(data.results.slice(0, 8).map(item => ({
              id: item.id,
              title: item.title,
              rating: item.vote_average ? item.vote_average.toFixed(1) : 'N/A',
              overview: item.overview ? item.overview.substring(0, 110) + '...' : 'Sin descripción.',
              poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null
            })));
          }
        } catch (e) {
          console.error(e);
        } finally {
          setCargandoCartelera(false);
        }
      };

      useEffect(() => {
        cargarCarteleraEnCines(countryCode);
      }, [countryCode]);

      return (
        <div className={`min-h-screen ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          {/* HEADER */}
          <header className={`border-b p-4 sticky top-0 z-40 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider cursor-pointer" onClick={() => setActiveTab('cartelera')}>PLOTTWISME 🌐</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'cartelera', label: '🍿 Cartelera' },
                  { id: 'radar', label: '🎯 Radar Cines' },
                  { id: 'watchparty', label: '🎉 Watch Party' },
                  { id: 'criticos', label: '✍️ Críticos' },
                  { id: 'match', label: '🔥 Match' },
                  { id: 'perfil', label: '👤 Perfil' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-800 hover:text-white'}`}>{tab.label}</button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setChatOpen(!chatOpen)} className="bg-slate-800 text-amber-400 font-bold px-3 py-1.5 rounded-xl text-xs border border-slate-700">💬 Chat</button>
                <button onClick={() => setShowAuthModal(true)} className="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs flex items-center gap-2">
                  <span>{currentUser.name}</span>
                  {currentUser.isVerifiedCritic && <span>✍️</span>}
                  {currentUser.isPremium && <span>⭐</span>}
                </button>
              </div>
            </div>
          </header>

          {/* CHAT OPCIONAL */}
          {chatOpen && (
            <div className="max-w-5xl mx-auto px-6 pt-4">
              <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="text-xs font-black uppercase text-amber-500">💬 Chat Cinéfilo Global</h3>
                  <button onClick={() => setChatOpen(false)} className="text-xs text-slate-400">✕</button>
                </div>
                <div className="h-32 overflow-y-auto space-y-2 text-xs">
                  {chatMessages.map(m => (
                    <div key={m.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800">
                      <span className="font-bold text-amber-400">{m.user}: </span>
                      <span>{m.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-6">

            {/* CARTELERA */}
            {activeTab === 'cartelera' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🍿 Cartelera en Cines</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                  {cartelera.map(film => (
                    <div key={film.id} className="p-4 bg-slate-900 border border-slate-800 rounded-3xl space-y-3 flex flex-col justify-between">
                      {film.poster ? <img src={film.poster} className="w-full h-64 object-cover rounded-2xl" /> : <div className="w-full h-64 bg-slate-800 rounded-2xl"></div>}
                      <div className="space-y-1">
                        <h3 className="font-bold text-sm text-white">{film.title}</h3>
                        <p className="text-[11px] text-slate-400">{film.overview}</p>
                      </div>
                      <button onClick={() => setActiveTab('match')} className="w-full bg-amber-500 text-slate-950 font-black py-2 rounded-xl text-xs uppercase">
                        Buscar Compañero 🤝
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* RADAR CINES */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🎯 Radar de Cines Locales</h2>
                <p className="text-xs text-slate-400">Ubicación detectada para explorar salas de cine.</p>
              </div>
            )}

            {/* WATCH PARTY */}
            {activeTab === 'watchparty' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🎉 Watch Parties / Salas Virtuales</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {watchParties.map(party => (
                    <div key={party.id} className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-2">
                      <span className="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded font-bold">{party.platform}</span>
                      <h3 className="font-bold text-base text-white">{party.title}</h3>
                      <p className="text-xs text-slate-400">Organiza: {party.host} • {party.time}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CRÍTICOS */}
            {activeTab === 'criticos' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">✍️ Reseñas de Críticos</h2>
                {reviews.map(r => (
                  <div key={r.id} className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-2">
                    <span className="font-bold text-sm text-white">{r.author}</span>
                    <p className="text-xs text-slate-300 italic">"{r.text}"</p>
                  </div>
                ))}
              </div>
            )}

            {/* SECCIÓN MATCH: DONDE SE MUESTRA LA FICHA CERRADA DE CITAS */}
            {activeTab === 'match' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-amber-500">🔥 Match & Conexiones Cinéfilas</h2>
                  <p className="text-xs text-slate-400">Las fichas de pareja y preferencias de sexo son privadas y únicamente visibles en esta ventana.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {matchProfiles.map(person => (
                    <div key={person.id} className="p-6 bg-slate-900 border border-slate-800 rounded-3xl space-y-4">
                      <div className="flex items-center gap-4">
                        <img src={person.photo} className="w-16 h-16 rounded-2xl object-cover border-2 border-amber-500" />
                        <div>
                          <div className="flex items-center gap-2">
                            <h3 className="font-bold text-base text-white">{person.name}, {person.age}</h3>
                            <span className="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded-full font-bold">📍 {person.distanceKm} km</span>
                          </div>
                          <span className={`inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-black uppercase ${person.usageMode === 'dating' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-blue-500/20 text-blue-400'}`}>
                            {person.usageMode === 'dating' ? '❤️ Buscando Pareja' : '🤝 Solo Amigos'}
                          </span>
                        </div>
                      </div>

                      {/* APARTADO CERRADO Y EXCLUSIVO DE PREFERENCIAS Y CITAS */}
                      {person.usageMode === 'dating' && (
                        <div className="p-4 bg-rose-950/20 border border-rose-500/30 rounded-2xl space-y-2">
                          <div className="flex justify-between items-center text-[10px] text-rose-300 font-bold uppercase tracking-wider">
                            <span>Soy: {person.genderIdentity}</span>
                            <span>Busco: {person.interestedIn}</span>
                          </div>
                          {person.datingBio && (
                            <p className="text-xs text-slate-200 italic pt-1">"{person.datingBio}"</p>
                          )}
                        </div>
                      )}

                      <div>
                        <span className="text-[10px] text-slate-400 font-bold uppercase block">Géneros favoritos:</span>
                        <p className="text-xs text-amber-400">{person.genres}</p>
                      </div>

                      <button onClick={() => setChatOpen(true)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase">
                        Conectar / Iniciar Chat 💬
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PERFIL: CONFIGURACIÓN PRIVADA */}
            {activeTab === 'perfil' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="p-8 bg-slate-900 border border-slate-800 rounded-3xl space-y-6">
                  
                  {!isEditingProfile ? (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-6">
                        <div className="flex items-center gap-4">
                          <img src={currentUser.photo} className="w-20 h-20 rounded-2xl object-cover border-2 border-amber-500" />
                          <div>
                            <h3 className="text-2xl font-black">{currentUser.name}</h3>
                            <p className="text-xs text-slate-400">{currentUser.email}</p>
                          </div>
                        </div>
                        <button onClick={() => { setProfileForm({...currentUser}); setIsEditingProfile(true); }} className="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase">
                          ✏️ Editar Perfil
                        </button>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div>
                          <strong className="text-amber-500 uppercase text-[10px] block">Biografía Pública:</strong>
                          <p className="text-slate-300">{currentUser.bio}</p>
                        </div>
                        <div>
                          <strong className="text-amber-500 uppercase text-[10px] block">Géneros Favoritos:</strong>
                          <p className="text-slate-300">{currentUser.genres}</p>
                        </div>

                        {/* INDICADOR DE CONFIGURACIÓN PRIVADA DE CITAS */}
                        <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-2">
                          <div className="flex items-center justify-between">
                            <h4 className="font-black text-rose-400 text-xs uppercase flex items-center gap-2">
                              🔒 Ficha de Citas y Preferencias Sexuales (Privada)
                            </h4>
                            <span className="text-[10px] bg-rose-500/20 text-rose-300 px-2 py-0.5 rounded font-bold">
                              Solo visible en Ventana Match
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-400">
                            <strong>Identidad:</strong> {currentUser.genderIdentity} | <strong>Preferencias de búsqueda:</strong> {currentUser.interestedIn}
                          </p>
                          <p className="text-[11px] text-slate-400 italic">
                            "{currentUser.datingBio}"
                          </p>
                        </div>
                      </div>
                    </div>
                  ) : (
                    /* EDITAR PERFIL Y CONFIGURACIÓN PRIVADA */
                    <form onSubmit={handleSaveProfile} className="space-y-4 text-xs">
                      <h3 className="text-lg font-black text-amber-500">Editar Perfil & Preferencias Privadas</h3>
                      
                      <div>
                        <label className="block text-slate-400 font-bold mb-1">Nombre Completo:</label>
                        <input type="text" value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                      </div>

                      <div>
                        <label className="block text-slate-400 font-bold mb-1">Biografía General (Pública):</label>
                        <textarea rows="2" value={profileForm.bio} onChange={(e) => setProfileForm({ ...profileForm, bio: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"></textarea>
                      </div>

                      <div>
                        <label className="block text-slate-400 font-bold mb-1">Modalidad Principal:</label>
                        <select value={profileForm.usageMode} onChange={(e) => setProfileForm({ ...profileForm, usageMode: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                          <option value="community">🍿 Solo Cine / Cartelera</option>
                          <option value="friends">🤝 Hacer Amigos Cinéfilos</option>
                          <option value="dating">❤️ Buscar Pareja Cinéfila</option>
                        </select>
                      </div>

                      {/* FORMULARIO CERRADO PARA LA VENTANA DE MATCH */}
                      <div className="p-4 bg-rose-950/20 border border-rose-500/30 rounded-2xl space-y-3">
                        <h4 className="font-black text-rose-400 uppercase text-[10px]">
                          🔒 Ficha Exclusiva para la Ventana de Match
                        </h4>
                        
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="block text-slate-400 font-bold mb-1">Mi Identidad de Género:</label>
                            <select value={profileForm.genderIdentity} onChange={(e) => setProfileForm({ ...profileForm, genderIdentity: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white">
                              {opcionesGenero.map(g => <option key={g} value={g}>{g}</option>)}
                            </select>
                          </div>
                          <div>
                            <label className="block text-slate-400 font-bold mb-1">Preferencia de Sexo / Orientación:</label>
                            <select value={profileForm.interestedIn} onChange={(e) => setProfileForm({ ...profileForm, interestedIn: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white">
                              {opcionesBusqueda.map(b => <option key={b} value={b}>{b}</option>)}
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Descripción de Citas (Solo visible en Match):</label>
                          <textarea rows="2" value={profileForm.datingBio} onChange={(e) => setProfileForm({ ...profileForm, datingBio: e.target.value })} placeholder="Escribe lo que buscas en una pareja cinéfila..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"></textarea>
                        </div>
                      </div>

                      <div className="flex gap-2 pt-2">
                        <button type="submit" className="flex-1 bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">Guardar Preferencias</button>
                        <button type="button" onClick={() => setIsEditingProfile(false)} className="bg-slate-800 text-slate-300 font-bold px-4 py-2.5 rounded-xl">Cancelar</button>
                      </div>
                    </form>
                  )}

                </div>
              </div>
            )}

          </main>

          {/* MODAL AUTENTICACIÓN */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
                <h3 className="text-lg font-black text-center text-white">{isRegisterMode ? 'Crear Perfil' : 'Iniciar Sesión'}</h3>
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  <input type="email" required value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} placeholder="Correo Electrónico" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <input type="password" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} placeholder="Contraseña" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">Ingresar</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
