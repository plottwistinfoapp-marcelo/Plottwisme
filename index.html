    const LANG_INDEX = { en: 0, pt: 1, fr: 2, it: 3, de: 4 };
    const LANGS = [
      { code: 'es', label: 'Español' },
      { code: 'en', label: 'English' },
      { code: 'pt', label: 'Português' },
      { code: 'fr', label: 'Français' },
      { code: 'it', label: 'Italiano' },
      { code: 'de', label: 'Deutsch' }
    ];
    let CURRENT_LANG = 'es';
    let CURRENT_COUNTRY = '';
    // tr('texto en español', { variable: valor }) -> texto en el idioma activo
    const tr = (str, vars) => {
      let out = str;
      if (CURRENT_LANG !== 'es' && typeof str === 'string') {
        const entry = I18N[str];
        if (entry) {
          const idx = LANG_INDEX[CURRENT_LANG];
          out = (idx !== undefined && entry[idx]) ? entry[idx] : entry[0];
        }
      }
      if (vars && typeof out === 'string') {
        Object.keys(vars).forEach(k => { out = out.split('{' + k + '}').join(String(vars[k])); });
      }
      return out;
    };
    const getLocaleRegion = () => {
      try { return (new Intl.Locale(navigator.language || 'en-US').maximize().region || '').toUpperCase(); } catch (e) { return ''; }
    };
    const MILE_COUNTRIES = ['US', 'GB', 'LR', 'MM'];
    const usesMiles = () => MILE_COUNTRIES.includes((CURRENT_COUNTRY || getLocaleRegion() || '').toUpperCase());
    // Distancia en km o millas según el país del usuario
    const fmtDist = (km) => {
      const n = Number(km);
      if (!isFinite(n)) return String(km);
      if (usesMiles()) return (Math.round(n * 0.621371 * 10) / 10) + ' mi';
      return (Math.round(n * 10) / 10) + ' km';
    };
    // Fecha 'AAAA-MM-DD' en el formato del país/idioma del usuario
    const fmtDate = (d) => {
      try {
        if (!d) return '';
        const loc = (navigator.languages || []).find(l => l.toLowerCase().startsWith(CURRENT_LANG)) || CURRENT_LANG;
        const dt = new Date(String(d).length <= 10 ? d + 'T12:00:00' : d);
        if (isNaN(dt.getTime())) return d;
        return dt.toLocaleDateString(loc, { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (e) { return d; }
    };
    const authErrMsg = (err) => {
      const c = err && err.code;
      if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return tr('Correo o contraseña incorrectos.');
      if (c === 'auth/email-already-in-use') return tr('Ese correo ya tiene una cuenta. Probá iniciar sesión.');
      if (c === 'auth/weak-password') return tr('La contraseña es muy corta (mínimo 6 caracteres).');
      if (c === 'auth/invalid-email') return tr('El correo no es válido.');
      if (c === 'auth/network-request-failed') return tr('Sin conexión. Revisá tu internet.');
      if (c === 'auth/too-many-requests') return tr('Demasiados intentos. Probá de nuevo en unos minutos.');
      return (err && (err.code || err.message)) || tr('error desconocido');
    };

    const SUPPORTED_LANGS = ['es', 'en', 'pt', 'fr', 'it', 'de'];
    const getBrowserLang = () => {
      try {
        const saved = localStorage.getItem('plot_lang');
        if (saved && SUPPORTED_LANGS.includes(saved)) return saved;
      } catch (e) {}
      const languages = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
      for (let lang of languages) {
        const l = lang.toLowerCase().slice(0, 2);
        if (SUPPORTED_LANGS.includes(l)) return l;
      }
      return 'en';
    };

    const calculateDistanceKm = (lat1, lon1, lat2, lon2) => {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    };

    function CinemaMapComponent({ userCity, userCoords, targetCoords, maxAllowedRadius, isDarkMode, cardBg, textColor }) {
      const center = targetCoords || userCoords || null;
      const defaultRadius = Math.min(maxAllowedRadius, 100);
      const [radius, setRadius] = useState(defaultRadius);
      const [debRadius, setDebRadius] = useState(defaultRadius);
      useEffect(() => { setRadius(defaultRadius); setDebRadius(defaultRadius); }, [defaultRadius]);
      const [cinemas, setCinemas] = useState([]);
      const [status, setStatus] = useState('idle');
      const [retryTick, setRetryTick] = useState(0);

      useEffect(() => {
        const t = setTimeout(() => setDebRadius(radius), 600);
        return () => clearTimeout(t);
      }, [radius]);

      useEffect(() => {
        if (!center) { setStatus('nocoords'); return; }
        const ctrl = new AbortController();
        setStatus('loading');
        const r = Math.round(debRadius * 1000);
        const q = `[out:json][timeout:40];(node["amenity"="cinema"](around:${r},${center.lat},${center.lon});way["amenity"="cinema"](around:${r},${center.lat},${center.lon}););out center tags;`;
        const mirrors = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
        const cacheKey = 'cines_' + center.lat.toFixed(2) + '_' + center.lon.toFixed(2) + '_' + Math.round(debRadius);
        const buildList = (elements) => (elements || []).map(el => {
          const lat = el.lat ?? el.center?.lat; const lon = el.lon ?? el.center?.lon;
          return { id: el.type + el.id, name: el.tags?.name || tr('Cine'), website: el.tags?.website || el.tags?.['contact:website'] || '', city: el.tags?.['addr:city'] || '', lat, lon, dist: calculateDistanceKm(center.lat, center.lon, lat, lon) };
        }).filter(c => c.lat && c.lon && c.dist <= debRadius).sort((a, b) => a.dist - b.dist).filter((c, i, arr) => arr.findIndex(x => x.name === c.name && x.dist === c.dist) === i).slice(0, 30);

        let cached = null;
        try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) {}
        if (cached && Array.isArray(cached.elements)) {
          setCinemas(buildList(cached.elements));
          setStatus('ok');
          if (Date.now() - cached.t < 12 * 3600 * 1000 && retryTick === 0) return;
        }

        const one = (url) => fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctrl.signal })
          .then(res => { if (!res.ok) throw new Error('http ' + res.status); return res.json(); });
        const raceAny = (promises) => new Promise((resolve, reject) => {
          let failed = 0;
          promises.forEach(pr => pr.then(resolve, () => { failed++; if (failed === promises.length) reject(new Error('all failed')); }));
        });
        raceAny(mirrors.map(one))
          .then(data => {
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), elements: data.elements || [] })); } catch (e) {}
            setCinemas(buildList(data.elements));
            setStatus('ok');
          })
          .catch(() => { if (!ctrl.signal.aborted && !cached) setStatus('error'); });
        return () => ctrl.abort();
      }, [center?.lat, center?.lon, debRadius, retryTick]);

      const zoom = Math.max(8, Math.min(14, Math.round(15 - Math.log2(Math.max(radius, 1) / 1.2))));
      const mapSrc = center
        ? `https://www.google.com/maps?q=${encodeURIComponent(tr('cines'))}&ll=${center.lat},${center.lon}&z=${zoom}&output=embed`
        : `https://www.google.com/maps?q=${encodeURIComponent(tr('cines') + ' ' + userCity)}&output=embed`;
      const safeUrl = (u) => /^https?:\/\//i.test(u) ? u : '';

      return (
        <div className={`${cardBg} p-4 rounded-3xl shadow-xl space-y-3`}>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <h3 className={`font-black ${textColor} text-sm`}>{tr('🗺️ Cines cerca de')} <span className="text-amber-500 capitalize">{userCity}</span></h3>
            <span className="text-[10px] bg-amber-500/20 text-amber-500 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">{tr('📏 Máx. de tu plan:')} <b>{fmtDist(maxAllowedRadius)}</b></span>
          </div>

          <div className="space-y-1">
            <label className={`text-xs font-bold ${textColor}`}>{tr('Radio de búsqueda:')} <span className="text-amber-500">{fmtDist(radius)}</span></label>
            <input type="range" min="1" max={maxAllowedRadius} value={radius} onChange={e => setRadius(Number(e.target.value))} className="w-full accent-amber-500" />
          </div>

          <div className="w-full h-72 rounded-2xl overflow-hidden border border-amber-500/30 relative">
            <iframe title="Google Maps Cines" src={mapSrc} width="100%" height="100%" style={{ border: 0 }} allowFullScreen="" loading="lazy" referrerPolicy="no-referrer-when-downgrade" className={isDarkMode ? 'map-dark-mode' : ''}></iframe>
          </div>

          <div className="space-y-2">
            {status === 'loading' && <p className={`text-xs ${textColor}`}>{tr('⏳ Buscando cines en {d}…', { d: fmtDist(radius) })}</p>}
            {status === 'nocoords' && <p className={`text-xs ${textColor}`}>{tr('Activa tu ubicación para ver los cines del radio.')}</p>}
            {status === 'error' && (
              <div className="space-y-2">
                <p className="text-xs text-rose-400">{tr('No se pudo cargar la lista de cines. Con radios muy grandes el servicio puede tardar o fallar; prueba un radio menor o reintenta.')}</p>
                <button onClick={() => setRetryTick(n => n + 1)} className="text-xs px-3 py-1.5 rounded-xl bg-amber-500 text-black font-bold">{tr('🔄 Reintentar')}</button>
              </div>
            )}
            {status === 'ok' && cinemas.length === 0 && <p className={`text-xs ${textColor}`}>{tr('No encontramos cines en {d}. Prueba ampliando el radio.', { d: fmtDist(debRadius) })}</p>}
            {status === 'ok' && cinemas.length > 0 && <p className={`text-xs font-bold ${textColor}`}>{tr(cinemas.length > 1 ? '🎬 {n} cines en {d}' : '🎬 {n} cine en {d}', { n: cinemas.length, d: fmtDist(debRadius) })}</p>}

            const MAX_HEIGHT = 600;
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

          const dist = calculateDistanceKm(currentUser.lat, currentUser.lon, u.lat, u.lon);

      const lastMsgOf = (chat) => (chat.messages || [])[(chat.messages || []).length - 1];

            const ctx = new Ctx();
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.08;
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime + 0.18);

                  )}
                </button>

                <button onClick={() => { setActiveTab('critics'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.critics}</button>
                
                {currentUser && (
                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.profile}</button>
                )}

                {isAdmin && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap transition-all ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-amber-500/20 text-amber-500 border border-amber-500/40'}`}>
                    🛡️ Admin
                  </button>
                )}
              </nav>

              <div className="flex items-center gap-2 shrink-0">
                <select value={lang} onChange={(e) => setLang(e.target.value)} aria-label={tr('Idioma')} title={tr('Idioma')} className={`p-1.5 rounded-xl text-xs border max-w-[5.5rem] ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-200' : 'bg-white border-amber-300 text-slate-800'}`}>
                  {LANGS.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
                </select>
                <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-1.5 rounded-xl text-xs border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-slate-200 border-slate-300 text-amber-600'}`}>
                  {isDarkMode ? '☀️' : '🌙'}
                </button>

                {currentUser ? (
                  <button onClick={handleLogout} className={`p-1.5 rounded-xl text-xs border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-200 border-slate-300 text-slate-700'}`} title={t.logout}>🚪</button>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setResetStep(1); setShowAuthModal(true); }} className="px-2.5 py-1 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 shadow">
                    {t.login}
                  </button>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6">
            
            {currentUser?.isPremium && activeTab !== 'chats' && (
              <div className="premium-banner bg-gradient-to-r from-amber-500/20 via-rose-500/20 border border-amber-500/50 p-4 rounded-2xl flex items-center justify-between shadow-lg mb-6">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">⭐</span>
                  <div>
                    <h4 className="font-black text-amber-500 text-sm">{tr('¡Beneficio Activo: 15 Días de Premium!')}</h4>
                    <p className={`text-xs ${mutedText}`}>{tr('Funciones avanzadas y radar extendido con Cloud Storage seguro.')}</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'cinema' && (
              <div className="space-y-8">
                <div className={`flex flex-wrap items-center justify-between gap-3 ${cardBg} border border-amber-500/30 px-4 py-3 rounded-2xl text-xs shadow-lg`}>
                  <div className="flex items-center gap-2">
                    <span className="text-amber-500 font-bold">{tr('📍 Tu Ubicación:')}</span>
                    {isStrictAdminUser ? (
                      <input 
                        type="text" 
                        value={userCity} 
                        onChange={(e) => handleCityChangeInput(e.target.value)} 
                        className={`${inputBg} px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-500/50 w-48`}
                      />
                    ) : (
                      <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${subCardBg} ${textColor} border border-amber-500/20 capitalize`}>
                        {userCity || tr('Detectando ubicación...')} 🔒
                      </span>
                    )}
                  </div>
                </div>

                <CinemaMapComponent 
                  userCity={userCity || tr('Detectando ubicación...')}
                  userCoords={userCoords}
                  targetCoords={targetCoords}
                  maxAllowedRadius={maxAllowedMapRadius}
                  isDarkMode={isDarkMode} 
                  cardBg={cardBg} 
                  textColor={textColor} 
                />
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className={`${cardBg} text-amber-500 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all`}>
                      <span>{tr('← Volver')}</span>
                    </button>

                    <div className={`${cardBg} p-6 rounded-3xl space-y-4 shadow-xl`}>
                      <div className={`flex flex-wrap items-center justify-between gap-2 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-100'} pb-3`}>
                        <span className="bg-amber-500/20 text-amber-500 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {tr(activeTopic.category)}
                        </span>
                        <span className={`text-xs ${mutedText}`}>{tr('Por')} <b>{activeTopic.author}</b> • {fmtDate(activeTopic.date)}</span>
                      </div>
                      <h2 className={`text-2xl font-black ${textColor}`}>{activeTopic.title}</h2>
                      <p className={`text-sm ${mutedText} leading-relaxed whitespace-pre-line`}>{activeTopic.content}</p>
                      
                      <div className="flex items-center gap-4 pt-2">
                        <button onClick={() => handleLikeTopic(activeTopic)} className={`flex items-center gap-1.5 ${subCardBg} px-3 py-1.5 rounded-xl border text-xs font-bold text-amber-500`}>
                          <span>🍿</span> <span>{tr('{n} Me gusta', { n: activeTopic.likes || 0 })}</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">{tr('💬 Respuestas ({n})', { n: activeTopic.comments?.length || 0 })}</h3>

                      {(activeTopic.comments || []).map(c => (
                        <div key={c.id} className={`${cardBg} p-4 rounded-2xl space-y-2`}>
                          <div className={`flex justify-between items-center text-xs ${mutedText}`}>
                            <span className={`font-bold ${textColor}`}>{c.author}</span>
                            <span>{fmtDate(c.date)}</span>
                          </div>
                          <p className={`text-xs ${mutedText} leading-relaxed`}>{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className={`${cardBg} p-4 rounded-2xl space-y-3 relative`}>
                        <div className="flex items-center gap-2">
                          <textarea rows="2" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder={tr('Escribe tu respuesta...')} className={`flex-1 ${inputBg} rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500`} required disabled={!currentUser} />
                          <button type="button" onClick={() => setShowEmojiPicker(!showEmojiPicker)} className={`${subCardBg} p-2.5 rounded-xl text-base`} title="Emojis">😀</button>
                        </div>

                        {showEmojiPicker && (
                          <div className={`absolute bottom-16 right-4 ${cardBg} p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-20`}>
                            {QUICK_EMOJIS.map(em => (
                              <button key={em} type="button" onClick={() => setNewCommentText(prev => prev + em)} className="text-lg hover:scale-125 transition-transform p-1">{em}</button>
                            ))}
                          </div>
                        )}

                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          {tr('Publicar Respuesta')}
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className={`${cardBg} p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl`}>
                      <div>
                        <h2 className={`text-2xl font-black ${textColor}`}>{tr('💬 Foros de Discusión')}</h2>
                        <p className={`text-xs ${mutedText} mt-1`}>{tr('Comparte tus teorías cinéfilas.')}</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        {tr('✍️ Nuevo Debate')}
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.length === 0 ? (
                        <p className={`text-xs ${mutedText} text-center py-6`}>{tr('Aún no hay debates. ¡Sé el primero en abrir uno!')}</p>
                      ) : (
                        forumTopics.map(topic => (
                          <div key={topic.id} className={`${cardBg} hover:border-amber-500/60 p-5 rounded-2xl transition-all space-y-3 group`}>
                            <div className="flex justify-between items-center text-xs">
                              <span className="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{tr(topic.category)}</span>
                              <span className={`${mutedText} text-[10px]`}>{fmtDate(topic.date)}</span>
                            </div>
                            <h3 onClick={() => setActiveTopic(topic)} className={`text-base font-bold ${textColor} group-hover:text-amber-500 transition-colors cursor-pointer`}>{topic.title}</h3>
                            <div className={`flex justify-between items-center text-xs ${mutedText} pt-1 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                              <span>{tr('Por')} <b>{topic.author}</b></span>
                              <div className="flex items-center gap-3">
                                <button onClick={() => handleLikeTopic(topic)} className="flex items-center gap-1 hover:text-amber-500 font-bold">
                                  <span>🍿</span> <span>{topic.likes || 0}</span>
                                </button>
                                <span className="text-amber-500 font-bold cursor-pointer" onClick={() => setActiveTopic(topic)}>💬 {topic.repliesCount || 0}</span>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="flex flex-col items-center space-y-3">
                <div className={`w-full max-w-md flex flex-wrap items-center justify-between gap-2 ${cardBg} px-4 py-2 rounded-2xl text-xs shadow`}>
                  <div className="flex items-center gap-2">
                    <span className="text-rose-500 font-bold">🎯 Radar: <b className={textColor}>{fmtDist(matchRadiusKm)}</b></span>
                    <input 
                      type="range" 
                      min="10" 
                      max={maxAllowedMapRadius} 
                      step="10"
                      value={matchRadiusKm} 
                      onChange={(e) => setMatchRadiusKm(Number(e.target.value))}
                      className="w-24 accent-rose-500 cursor-pointer"
                    />
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => setRadarFilterType('all')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'all' ? 'bg-amber-500 text-slate-950' : `${subCardBg}${mutedText}`}`}>{tr('Todos')}</button>
                    <button onClick={() => setRadarFilterType('verified')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'verified' ? 'bg-sky-500 text-slate-950' : `${subCardBg}${mutedText}`}`}>{tr('✔ Verif.')}</button>
                    <button onClick={() => setRadarFilterType('critic')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'critic' ? 'bg-amber-400 text-slate-950' : `${subCardBg}${mutedText}`}`}>{tr('🌟 Críticos')}</button>
                  </div>
                </div>

                {currentCandidate ? (() => {
                  const candidatePhotos = currentCandidate.photos?.length > 0 ? currentCandidate.photos : [currentCandidate.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'];
                  const activePhoto = candidatePhotos[currentPhotoIndex] || candidatePhotos[0];
                  const computedDist = (currentUser?.lat && currentUser?.lon && currentCandidate.lat && currentCandidate.lon) 
                    ? calculateDistanceKm(currentUser.lat, currentUser.lon, currentCandidate.lat, currentCandidate.lon) 
                    : (currentCandidate.distanceKm || 5);

                  return (
                    <div className={`w-full max-w-md ${cardBg} rounded-3xl overflow-hidden shadow-2xl`}>
                      <div className="relative h-96 w-full bg-slate-900 select-none">
                        <img src={activePhoto} alt={currentCandidate.name} className="w-full h-full object-cover transition-opacity duration-300" />
                        
                        {candidatePhotos.length > 1 && (
                          <div className="absolute top-3 left-3 right-3 flex gap-1 z-10">
                            {candidatePhotos.map((_, pIdx) => (
                              <div key={pIdx} className={`h-1 flex-1 rounded-full transition-all ${pIdx === currentPhotoIndex ? 'bg-amber-500 shadow-md shadow-amber-500' : 'bg-white/40'}`}></div>
                            ))}
                          </div>
                        )}

                        {candidatePhotos.length > 1 && (
                          <>
                            <button onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev > 0 ? prev - 1 : candidatePhotos.length - 1)); }} className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100">‹</button>
                            <button onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev < candidatePhotos.length - 1 ? prev + 1 : 0)); }} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100">›</button>
                          </>
                        )}

                        <div className="absolute top-5 left-4 flex gap-2">
                          <span className="bg-rose-600/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-white shadow">{tr(currentCandidate.sex || 'Perfil')} • {tr('Busca:')} {tr(currentCandidate.interestedIn || 'Cualquiera')}</span>
                          {currentCandidate.kycVerified && (
                            <span className="bg-sky-500 text-slate-950 px-2.5 py-1 rounded-full text-xs font-black flex items-center gap-1 shadow">{tr('✔ Verificado')}</span>
                          )}
                        </div>

                        <div className="absolute bottom-4 left-4 right-4 bg-gradient-to-t from-slate-950 via-slate-950/70 to-transparent pt-10 pb-2 px-2">
                          <h2 className="text-2xl font-black text-white flex items-center gap-2 drop-shadow">
                            {currentCandidate.name}, {currentCandidate.age || 25}
                            {currentCandidate.kycVerified && <span className="text-sky-400 text-lg">✔</span>}
                          </h2>
                          <p className="text-xs text-amber-400 font-medium drop-shadow">
                            📍 {currentCandidate.location || tr('Ubicación')} • {tr('📏 A aprox.')} <b>{fmtDist(computedDist)}</b>
                          </p>
                        </div>
                      </div>

                      <div className="p-6 space-y-4">
                        <div className="bg-rose-500/10 border border-rose-500/30 p-3.5 rounded-2xl">
                          <p className="text-[10px] uppercase font-bold text-rose-500 mb-1">{tr('💬 Descripción para Citas:')}</p>
                          <p className={`text-xs italic ${textColor}`}>"{tr(currentCandidate.datingBio || currentCandidate.bio || 'Amante del buen cine y buscando conectar.')}"</p>
                        </div>
                        
                        <div className="flex justify-center gap-6 pt-2">
                          <button onClick={() => setCurrentIndex(prev => prev + 1)} className={`w-14 h-14 rounded-full ${subCardBg} text-rose-500 flex items-center justify-center text-xl font-bold shadow transition-all hover:scale-105`}>✖</button>
                          <button onClick={() => { handleMatchUser(currentCandidate); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20 hover:scale-110 transition-all">🍿</button>
                        </div>
                      </div>
                    </div>
                  );
                })() : (
                  <div className={`text-center py-14 space-y-4 max-w-md ${cardBg} p-8 rounded-3xl shadow-xl`}>
                    <div className="text-4xl">{filteredCandidates.length === 0 ? '🍿' : '🎟️'}</div>
                    {filteredCandidates.length === 0 ? (
                      <>
                        <h3 className={`text-xl font-bold ${textColor}`}>{tr('Lo sentimos, todavía no hay usuarios en tu zona.')}</h3>
                        <p className={`text-sm ${mutedText}`}>{tr('Cada día se suman más cinéfilos. Probá ampliar el radio o volvé más tarde.')}</p>
                        {matchRadiusKm < maxAllowedMapRadius && (
                          <button onClick={() => setMatchRadiusKm(maxAllowedMapRadius)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-md">
                            {tr('📡 Ampliar radio a {d}', { d: fmtDist(maxAllowedMapRadius) })}
                          </button>
                        )}
                        <button onClick={shareApp} className={`w-full ${subCardBg} border ${textColor} font-black py-3 rounded-xl text-xs uppercase tracking-wider`}>
                          {tr('📲 Invitar amigos cinéfilos')}
                        </button>
                      </>
                    ) : (
                      <>
                        <h3 className={`text-xl font-bold ${textColor}`}>{tr('Ya viste todos los perfiles cercanos.')}</h3>
                        <p className={`text-sm ${mutedText}`}>{tr('Volvé más tarde para ver nuevos cinéfilos, o repasá los perfiles otra vez.')}</p>
                        <button onClick={() => setCurrentIndex(0)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider shadow-md">
                          {tr('🔄 Volver a ver perfiles')}
                        </button>
                        <button onClick={shareApp} className={`w-full ${subCardBg} border ${textColor} font-black py-3 rounded-xl text-xs uppercase tracking-wider`}>
                          {tr('📲 Invitar amigos cinéfilos')}
                        </button>
                      </>
                    )}
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="max-w-4xl mx-auto space-y-4">
                <h2 className={`text-2xl font-black ${textColor} ${activeChat ? 'hidden md:block' : ''}`}>💬 Chats & Matches</h2>

                <div className={`grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 ${cardBg} rounded-3xl p-2 md:p-4 md:min-h-[560px]`}>
                  <div className={`${activeChat ? 'hidden md:block' : 'block'} md:border-r ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} md:pr-3 space-y-2 p-2 md:p-0`}>
                    <h3 className="text-xs font-bold text-amber-500 uppercase px-2">{t.activeChats}</h3>
                    {chatsList.length === 0 ? (
                      <p className={`text-xs ${mutedText} p-2`}>{t.noChats}</p>
                    ) : (
                      chatsList.map(chat => (
                        <div 
                          key={chat.id} 
                          onClick={() => { setActiveChat(chat); setShowEmojiPicker(false); setShowStickerPicker(false); }}
                          className={`flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all ${activeChat?.id === chat.id ? 'bg-amber-500/20 border border-amber-500/50' : `${isDarkMode ? 'hover:bg-slate-800/60' : 'hover:bg-slate-100'}`}`}
                        >
                          <img src={peerOf(chat).avatar} alt={peerOf(chat).name} className="w-12 h-12 rounded-full object-cover border border-amber-500/30" />
                          <div className="overflow-hidden flex-1">
                            <h4 className={`${isChatUnread(chat) ? 'font-black' : 'font-bold'} ${textColor} text-sm truncate`}>{peerOf(chat).name}{isChatUnread(chat) && <span className="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-rose-500 align-middle"></span>}</h4>
                            <p className={`text-xs ${mutedText} truncate`}>
                              {chat.messages[chat.messages.length - 1]?.isSticker || chat.messages[chat.messages.length - 1]?.text?.startsWith('STCK:') ? tr('🎬 [Sticker Cinéfilo]') : (chat.messages[chat.messages.length - 1]?.text || 'Match')}
                            </p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className={`md:col-span-2 ${activeChat ? 'flex' : 'hidden md:flex'} flex-col justify-between ${subCardBg} rounded-2xl border p-3 md:p-4 relative h-[calc(100dvh-150px)] md:h-[540px]`}>
                    {activeChat ? (
                      <>
                        <div className={`flex items-center justify-between gap-2 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                          <div className="flex items-center gap-3 min-w-0">
                            <button type="button" onClick={() => { setActiveChat(null); setShowEmojiPicker(false); setShowStickerPicker(false); }} className={`md:hidden shrink-0 ${cardBg} w-9 h-9 rounded-full text-lg font-black ${textColor}`} aria-label={tr('Volver')}>←</button>
                            <img src={peerOf(activeChat).avatar} alt={peerOf(activeChat).name} className="w-10 h-10 rounded-full object-cover shrink-0" />
                            <div className="min-w-0">
                              <h3 className={`font-bold ${textColor} text-sm truncate`}>{peerOf(activeChat).name}</h3>
                              <span className="text-[10px] text-emerald-500 font-bold">{tr('🟢 En línea')}</span>
                            </div>
                          </div>
                          <button onClick={() => { if (window.confirm(tr('¿Borrar este chat?'))) handleDeleteChat(activeChat.id); }} className="shrink-0 bg-rose-500/25 hover:bg-rose-500/40 text-rose-400 border border-rose-500/40 text-[10px] font-bold px-3 py-1.5 rounded-xl transition-all shadow" aria-label={tr('Borrar Chat')}>
                            🗑️<span className="hidden sm:inline"> {tr('Borrar Chat')}</span>
                          </button>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 py-4 px-1">
                          {(activeChat.messages || []).map(msg => {
                            const isMe = msg.sender === currentUser?.name;
                            const isStickerMsg = msg.isSticker || msg.text?.startsWith('STCK:');
                            const sk = isStickerMsg ? parseSticker(msg.text) : null;

                            return (
                              <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                {isStickerMsg ? (
                                  <div className={`px-6 py-4 rounded-3xl border border-white/20 shadow-xl flex flex-col items-center justify-center gap-2 bg-gradient-to-br ${sk.grad} min-w-[130px] max-w-[75%] select-none`}>
                                    <span className="text-7xl leading-none" style={{ filter: 'drop-shadow(0 4px 6px rgba(0,0,0,.35))' }}>{sk.emoji}</span>
                                    {sk.caption && <span className="text-sm font-extrabold text-white text-center leading-tight" style={{ textShadow: '0 1px 3px rgba(0,0,0,.6)' }}>{sk.caption}</span>}
                                  </div>
                                ) : (
                                  <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words ${isMe ? 'bg-amber-500 text-slate-950 font-medium rounded-br-md' : `${cardBg} ${textColor} rounded-bl-md`}`}>
                                    {msg.text}
                                  </div>
                                )}
                                <span className="text-[10px] text-slate-400 mt-1 px-1">{msg.time}</span>
                              </div>
                            );
                          })}
                          <div id="chat-end"></div>
                        </div>

                        {showEmojiPicker && (
                          <div className={`absolute bottom-20 left-4 ${cardBg} p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-20`}>
                            {QUICK_EMOJIS.map(em => (

                <h3 className="text-2xl font-black text-amber-500">{t.matchTitle}</h3>
                <div className="flex flex-col gap-2 pt-2">
                  <button onClick={() => { setShowMatchModal(false); const chat = chatsList.find(c => (c.participants || []).includes(matchedUser.email)); if (chat) setActiveChat(chat); setActiveTab('chats'); }} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">{t.openChatNow}</button>
                  <button onClick={() => setShowMatchModal(false)} className={`w-full ${subCardBg} ${textColor} font-bold py-2.5 rounded-xl text-xs`}>{t.keepSearching}</button>
                </div>
              </div>
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto`}>
                <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                  <h3 className={`text-lg font-black ${textColor}`}>{authMode === 'signup' ? tr('✨ Crear Cuenta') : (authMode === 'login' ? tr('🔑 Iniciar Sesión') : tr('🔄 Recuperar Contraseña'))}</h3>
                  <button onClick={() => { setShowAuthModal(false); setResetStep(1); }} className={`${mutedText} font-bold text-lg`}>✕</button>
                </div>

                {authMode === 'signup' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Nombre Completo:')}</label>
                      <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} placeholder={tr('Ej: Juan Pérez')} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className="block mb-1 text-amber-500 font-bold">{tr('Fotos de Perfil:')}</label>
                      <div className="grid grid-cols-3 gap-2 mb-2">
                        {authPhotos.map((photo, idx) => (
                          <div key={idx} className="relative aspect-square rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                            <img src={photo} alt="Foto" className="w-full h-full object-cover" />
                            <button type="button" onClick={() => handleRemovePhoto(idx, true)} className="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">✕</button>
                          </div>
                        ))}
                      </div>
                      <label className="block w-full text-center bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl cursor-pointer">
                        {tr('📁 Agregar Foto de Perfil')}
                        <input type="file" accept="image/*" onChange={(e) => handleFileSelected(e, true)} className="hidden" />
                      </label>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Fecha Nacimiento (+18):')}</label>
                        <input type="date" value={authBirthdate} onChange={(e) => setAuthBirthdate(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                      </div>
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Mi Género:')}</label>
                        <select value={authSex} onChange={(e) => setAuthSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                          {SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{tr(opt)}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Interesado en (Radar):')}</label>
                      <select value={authInterestedIn} onChange={(e) => setAuthInterestedIn(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                        {SEEKING_SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{tr(opt)}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Correo Electrónico:')}</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Contraseña:')}</label>
                      <div className="relative">
                        <input type={showPass ? 'text' : 'password'} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} autoCapitalize="none" spellCheck="false" className={`w-full ${inputBg} rounded-xl p-3 pr-12`} required />
                        <button type="button" onClick={() => setShowPass(v => !v)} aria-label={tr('Mostrar u ocultar contraseña')} className="absolute right-3 top-1/2 -translate-y-1/2 text-lg">{showPass ? '🙈' : '👁️'}</button>
                      </div>
                      {authPassword.length > 0 && (authPassword.length < 6
                        ? <p className="text-rose-500 font-bold mt-1">{tr('✖ Mínimo 6 caracteres (llevás {n})', { n: authPassword.length })}</p>
                        : <p className="text-emerald-500 font-bold mt-1">{tr('✔ Contraseña válida')}</p>)}
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">{tr('Registrarme')}</button>
                    <button type="button" onClick={() => setAuthMode('login')} className="w-full text-amber-500 font-bold py-2 text-xs underline">{tr('¿Ya tenés cuenta? Iniciar sesión')}</button>
                  </form>
                )}

                {authMode === 'login' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>{tr('Correo Electrónico:')}</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className={`${mutedText} font-bold block mb-1`}>{tr('Contraseña:')}</label>
                      <div className="relative">
                        <input type={showPass ? 'text' : 'password'} value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} autoCapitalize="none" spellCheck="false" className={`w-full ${inputBg} rounded-xl p-3 pr-12`} required />
                        <button type="button" onClick={() => setShowPass(v => !v)} aria-label={tr('Mostrar u ocultar contraseña')} className="absolute right-3 top-1/2 -translate-y-1/2 text-lg">{showPass ? '🙈' : '👁️'}</button>
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">{tr('Ingresar')}</button>
                    <button type="button" onClick={handleResetPassword} className="w-full text-amber-500 font-bold py-2 text-xs underline">{tr('¿Olvidaste tu contraseña?')}</button>
                    <button type="button" onClick={() => setAuthMode('signup')} className="w-full bg-slate-500/20 border border-amber-500/40 text-amber-500 font-bold py-2.5 rounded-xl text-xs">{tr('¿No tenés cuenta? Crear cuenta')}</button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) { console.error(e); }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./pwabuilder-sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
