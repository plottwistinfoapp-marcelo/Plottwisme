 проверку","🪪 सत्यापन का अनुरोध करें","🪪 인증 요청","🪪 認証をリクエスト","🪪 申请认证","🪪 ขอการยืนยัน","🪪 申請認證","🪪 Doğrulama iste"],"Pedí la verificación y el equipo de Plottwistme revisará tu perfil. Podemos escribirte por email para confirmar tu identidad con una videollamada corta. No guardamos fotos de documentos.":["Request verification and the Plottwistme team will review your profile. We may email you to confirm your identity with a short video call. We don't store ID photos.","Solicite a verificação e a equipe do Plottwistme vai revisar seu perfil. Podemos enviar um e-mail para confirmar sua identidade com uma videochamada curta. Não guardamos fotos de documentos.","Demandez la vérification et l'équipe Plottwistme examinera votre profil. Nous pourrons vous écrire pour confirmer votre identité par un court appel vidéo. Nous ne conservons aucune photo de pièce d'identité.","Richiedi la verifica e il team di Plottwistme esaminerà il tuo profilo. Potremmo scriverti per confermare la tua identità con una breve videochiamata. Non conserviamo foto di documenti.","Fordere die Verifizierung an, und das Plottwistme-Team prüft dein Profil. Wir können dir schreiben, um deine Identität per kurzem Videoanruf zu bestätigen. Wir speichern keine Ausweisfotos.","Запросите проверку, и команда Plottwistme просмотрит ваш профиль. Мы можем написать вам, чтобы подтвердить личность коротким видеозвонком. Мы не храним фото документов.","सत्यापन का अनुरोध करें, Plottwistme टीम आपकी प्रोफ़ाइल देखेगी। पहचान की पुष्टि के लिए हम ईमेल कर छोटी वीडियो कॉल कर सकते हैं। हम दस्तावेज़ों की फ़ोटो नहीं रखते।","인증을 요청하면 Plottwistme 팀이 프로필을 검토합니다. 짧은 영상 통화로 본인 확인을 위해 이메일을 드릴 수 있습니다. 신분증 사진은 저장하지 않습니다.","認証をリクエストすると、Plottwistmeチームがプロフィールを確認します。短いビデオ通話で本人確認するためメールすることがあります。身分証の写真は保存しません。","申请认证后，Plottwistme 团队会审核你的资料，并可能通过邮件联系你进行简短视频通话以确认身份。我们不保存证件照片。","ขอการยืนยัน แล้วทีม Plottwistme จะตรวจสอบโปรไฟล์ของคุณ เราอาจส่งอีเมลเพื่อยืนยันตัวตนผ่านวิดีโอคอลสั้น ๆ เราไม่เก็บรูปเอกสาร","申請認證後，Plottwistme 團隊會審核你的資料，並可能寄信聯絡你進行簡短視訊以確認身分。我們不保存證件照片。","Doğrulama iste, Plottwistme ekibi profilini inceleyecek. Kimliğini kısa bir görüntülü görüşmeyle doğrulamak için e-posta gönderebiliriz. Kimlik fotoğrafı saklamayız."],"✔ Solicitud enviada. Te vamos a contactar.":["✔ Request sent. We'll contact you.","✔ Solicitação enviada. Vamos entrar em contato.","✔ Demande envoyée. Nous vous contacterons.","✔ Richiesta inviata. Ti contatteremo.","✔ Anfrage gesendet. Wir melden uns.","✔ Запрос отправлен. Мы свяжемся с вами.","✔ अनुरोध भेजा गया। हम आपसे संपर्क करेंगे।","✔ 요청이 전송되었습니다. 연락드리겠습니다.","✔ リクエストを送信しました。ご連絡します。","✔ 申请已发送，我们会联系你。","✔ ส่งคำขอแล้ว เราจะติดต่อคุณ","✔ 申請已送出，我們會聯絡你。","✔ İstek gönderildi. Seninle iletişime geçeceğiz."],"🪪 Pidió verificación":["🪪 Requested verification","🪪 Pediu verificação","🪪 A demandé la vérification","🪪 Ha chiesto la verifica","🪪 Verifizierung angefragt","🪪 Запросил проверку","🪪 सत्यापन माँगा","🪪 인증 요청함","🪪 認証をリクエスト済み","🪪 已申请认证","🪪 ขอการยืนยันแล้ว","🪪 已申請認證","🪪 Doğrulama istedi"],"🗺️ Ver cines en Google Maps":["🗺️ See cinemas on Google Maps","🗺️ Ver cinemas no Google Maps","🗺️ Voir les cinémas sur Google Maps","🗺️ Vedi i cinema su Google Maps","🗺️ Kinos in Google Maps ansehen","🗺️ Кинотеатры в Google Картах","🗺️ Google Maps पर सिनेमाघर देखें","🗺️ Google 지도에서 영화관 보기","🗺️ Googleマップで映画館を見る","🗺️ 在 Google 地图中查看影院","🗺️ ดูโรงภาพยนตร์ใน Google Maps","🗺️ 在 Google 地圖查看影院","🗺️ Sinemaları Google Haritalar'da gör"],"Cine de Autor":["Art-house Cinema","Cinema de autor","Cinéma d'auteur","Cinema d'autore","Autorenkino","Авторское кино","आर्टहाउस सिनेमा","작가주의 영화","アートハウス映画","作者电影","หนังอาร์ต","作者電影","Bağımsız Sinema"],Todos:["All","Todos","Tous","Tutti","Alle","Все","सभी","전체","すべて","全部","ทั้งหมด","全部","Hepsi"],"✔ Verif.":["✔ Verified","✔ Verif.","✔ Vérif.","✔ Verif.","✔ Verif.","✔ Проверенные","✔ सत्यापित","✔ 인증됨","✔ 認証済み","✔ 已认证","✔ ยืนยันแล้ว","✔ 已認證","✔ Doğrul."],"🌟 Críticos":["🌟 Critics","🌟 Críticos","🌟 Critiques","🌟 Critici","🌟 Kritiker","🌟 Критики","🌟 समीक्षक","🌟 평론가","🌟 批評家","🌟
