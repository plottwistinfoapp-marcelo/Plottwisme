    const calculateDistanceKm = (lat1, lon1, lat2, lon2) => {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    };

            let width = img.width;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }
            canvas.width = width;
            canvas.height = height;

                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950 shadow' : `${mutedText} hover:${isDarkMode ? 'bg-slate-900' : 'bg-slate-200'}`}`}>{t.profile}</button>
                )}

                {isAdmin && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-2.5 py-1.5 rounded-xl text-xs font-black whitespace-nowrap transition-all ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950 shadow' : 'bg-amber-500/20 text-amber-500 border border-amber-500/40'}`}>
                    🛡️ Admin
                  </button>

              </nav>

              <div className="flex items-center gap-2 shrink-0">
                <button 
                  onClick={() => setForcedAdminTest(!forcedAdminTest)} 
                  className={`px-2 py-1 rounded-lg text-[10px] font-black border transition-all ${forcedAdminTest ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}
                  title="Interruptor rápido para alternar modo pruebas de admin"
                >
                  {forcedAdminTest ? '⚙️ Test Admin: ON' : '⚙️ Test Admin: OFF'}
                </button>

                <button 
                  onClick={() => setIsDarkMode(!isDarkMode)} 
                  className={`p-1.5 rounded-xl text-xs border transition-all ${isDarkMode ? 'bg-slate-900 border-slate-800 text-amber-400' : 'bg-slate-200 border-slate-300 text-amber-600'}`}
                  title={isDarkMode ? "Cambiar a Modo Claro" : "Cambiar a Modo Oscuro"}
                >
                  {isDarkMode ? '☀️' : '🌙'}
                </button>

                {!isAppInstalled && (
                  <button 
                    onClick={async () => {
                      if (installPromptEvent) {
                        installPromptEvent.prompt();
                        const choiceResult = await installPromptEvent.userChoice;
                        if (choiceResult.outcome === 'accepted') {
                          setIsAppInstalled(true);
                        }
                      } else {
                        setShowInstallGuideModal(true);
                      }
                    }}
                    className="bg-gradient-to-r from-amber-500 to-rose-500 text-slate-950 font-black px-2.5 py-1.5 rounded-xl text-[11px] shadow-lg shadow-amber-500/20 whitespace-nowrap hidden md:flex items-center gap-1"
                  >
                    <span>📱</span> <span>Instalar</span>
                  </button>

                {currentUser ? (
                  <button onClick={handleLogout} className={`p-1.5 rounded-xl text-xs border ${isDarkMode ? 'bg-slate-900 border-slate-800 text-slate-300' : 'bg-slate-200 border-slate-300 text-slate-700'}`} title={t.logout}>
                    🚪
                  </button>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setResetStep(1); setShowAuthModal(true); }} className="px-2.5 py-1 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 whitespace-nowrap shadow">
                    {t.login}
                  </button>
                )}
              </div>

            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6">
            
            {currentUser?.isPremium && (
              <div className="bg-gradient-to-r from-amber-500/20 via-rose-500/20 border border-amber-500/50 p-4 rounded-2xl flex items-center justify-between shadow-lg mb-6">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">⭐</span>
                  <div>
                    <h4 className="font-black text-amber-500 text-sm">¡Beneficio Activo: 15 Días de Premium!</h4>
                    <p className={`text-xs ${mutedText}`}>Estás disfrutando de todas las funciones avanzadas y radar extendido sin cargo.</p>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'cinema' && (
              <div className="space-y-8">
                
                <div className={`flex flex-wrap items-center justify-between gap-3 ${cardBg} border border-amber-500/30 px-4 py-3 rounded-2xl text-xs shadow-lg`}>
                  <div className="flex items-center gap-2">
                    <span className="text-amber-500 font-bold">📍 Ciudad Activa (Libre Admin):</span>
                    <input 
                      type="text" 
                      value={userCity} 
                      onChange={(e) => handleCityChangeInput(e.target.value)} 
                      className={`${inputBg} px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-500/50 w-48`}
                      placeholder="Ej: Madrid, Tokio..."
                      title="Escribe cualquier ciudad del mundo y el mapa se moverá allí automáticamente"
                    />
                  </div>
                  
                  <div className="flex items-center gap-2">
                    <span className="text-amber-500 font-bold">🌍 País Región:</span>
                    <select 
                      value={userCountryCode} 
                      onChange={(e) => handleAdminCountryChange(e.target.value)}
                      className={`${isDarkMode ? 'bg-slate-950' : 'bg-slate-100'} text-amber-500 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer`}
                    >
                      {COUNTRY_CODES.map(c => (
                        <option key={c.code} value={c.code}>{c.name}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <CinemaMapComponent 
                  userCity={userCity}
                  isDarkMode={isDarkMode} 
                  cardBg={cardBg} 
                  textColor={textColor} 
                />

                <div className={`relative overflow-hidden rounded-3xl bg-gradient-to-r ${isDarkMode ? 'from-amber-500/20 via-slate-900 to-slate-900 border-amber-500/30' : 'from-amber-500/30 via-white to-white border-amber-500/40'} border p-8 shadow-2xl`}>

                    <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-3 py-1 rounded-md uppercase tracking-wider">
                      {t.engineTitle}
                    </span>
                    <h2 className={`text-3xl font-black ${textColor} leading-tight`}>
                      {t.cinemaRealtime} <span className="text-amber-500 capitalize">{userCity}</span>
                    </h2>
                    <p className={`text-sm ${mutedText} leading-relaxed`}>
                      {t.cinemaSubtitle}
                    </p>
                    <div className="pt-2">
                      <button 
                        onClick={() => openGoogleAIElEngine('cartelera de cines y horarios en {city}')} 
                        className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-sm transition-all shadow-xl shadow-amber-500/20 flex items-center gap-3 hover:scale-105"
                      >
                        <span>🤖 {t.openCinema} {userCity}</span>
                        <span>↗</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className={`text-lg font-black ${textColor} flex items-center gap-2`}>
                    <span>⚡ {t.directSearch}</span>
                    <span className="text-amber-500 capitalize">{userCity}</span>
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {SEARCH_CATEGORIES.map(cat => (
                      <div 
                        key={cat.id} 
                        onClick={() => openGoogleAIElEngine(cat.queryFormat)}
                        className={`${cardBg} hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all hover:-translate-y-1 shadow-lg group flex flex-col justify-between space-y-4`}
                      >
                        <div>
                          <h4 className={`font-bold ${textColor} group-hover:text-amber-500 transition-colors text-sm`}>{cat.label}</h4>
                          <p className={`text-xs ${mutedText} mt-1`}>Con IA & Mapas Google.</p>
                        </div>
                        <div className={`text-xs font-bold text-amber-500 flex items-center justify-between pt-2 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                          <span>{t.consultGoogle}</span>
                          <span>↗</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className={`${cardBg} text-amber-500 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all`}>
                      <span>← Volver</span>
                    </button>

                    <div className={`${cardBg} p-6 rounded-3xl space-y-4 shadow-xl`}>
                      <div className={`flex flex-wrap items-center justify-between gap-2 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-100'} pb-3`}>
                        <span className="bg-amber-500/20 text-amber-500 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {activeTopic.category}
                        </span>
                        <span className={`text-xs ${mutedText}`}>Por <b>{activeTopic.author}</b> • {activeTopic.date}</span>
                      </div>
                      <h2 className={`text-2xl font-black ${textColor}`}>{activeTopic.title}</h2>
                      <p className={`text-sm ${mutedText} leading-relaxed whitespace-pre-line`}>{activeTopic.content}</p>
                      
                      <div className="flex items-center gap-4 pt-2">
                        <button onClick={() => handleLikeTopic(activeTopic)} className={`flex items-center gap-1.5 ${subCardBg} px-3 py-1.5 rounded-xl border text-xs font-bold text-amber-500`}>
                          <span>🍿</span> <span>{activeTopic.likes || 0} Me gusta</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">💬 Respuestas ({activeTopic.comments?.length || 0})</h3>

                      {(activeTopic.comments || []).map(c => (
                        <div key={c.id} className={`${cardBg} p-4 rounded-2xl space-y-2`}>
                          <div className={`flex justify-between items-center text-xs ${mutedText}`}>
                            <span className={`font-bold ${textColor}`}>{c.author}</span>
                            <span>{c.date}</span>
                          </div>
                          <p className={`text-xs ${mutedText} leading-relaxed`}>{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className={`${cardBg} p-4 rounded-2xl space-y-3 relative`}>
                        <div className="flex items-center gap-2">
                          <textarea rows="2" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder="Escribe tu respuesta..." className={`flex-1 ${inputBg} rounded-xl p-3 text-xs focus:outline-none focus:border-amber-500`} required disabled={!currentUser} />
                          <button type="button" onClick={() => setShowEmojiPicker(!showEmojiPicker)} className={`${subCardBg} p-2.5 rounded-xl text-base`} title="Emojis">😀</button>
                        </div>

                        {showEmojiPicker && (
                          <div className={`absolute bottom-16 right-4 ${cardBg} p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-20`}>
                            {QUICK_EMOJIS.map(em => (
                              <button key={em} type="button" onClick={() => setNewCommentText(prev => prev + em)} className="text-lg hover:scale-125 transition-transform p-1">{em}</button>
                            ))}
                          </div>
                        )}

                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          Publicar Respuesta
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className={`${cardBg} p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl`}>
                      <div>
                        <h2 className={`text-2xl font-black ${textColor}`}>💬 Foros de Discusión</h2>
                        <p className={`text-xs ${mutedText} mt-1`}>Comparte tus teorías cinéfilas.</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        ✍️ Nuevo Debate
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.length === 0 ? (
                        <p className={`text-xs ${mutedText} text-center py-6`}>Aún no hay debates. ¡Sé el primero en abrir uno!</p>
                      ) : (
                        forumTopics.map(topic => (
                          <div key={topic.id} className={`${cardBg} hover:border-amber-500/60 p-5 rounded-2xl transition-all space-y-3 group`}>
                            <div className="flex justify-between items-center text-xs">
                              <span className="bg-amber-500/10 text-amber-500 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{topic.category}</span>
                              <span className={`${mutedText} text-[10px]`}>{topic.date}</span>
                            </div>
                            <h3 onClick={() => setActiveTopic(topic)} className={`text-base font-bold ${textColor} group-hover:text-amber-500 transition-colors cursor-pointer`}>{topic.title}</h3>
                            <div className={`flex justify-between items-center text-xs ${mutedText} pt-1 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'}`}>
                              <span>Por <b>{topic.author}</b></span>
                              <div className="flex items-center gap-3">
                                <button onClick={() => handleLikeTopic(topic)} className="flex items-center gap-1 hover:text-amber-500 font-bold">
                                  <span>🍿</span> <span>{topic.likes || 0}</span>
                                </button>
                                <span className="text-amber-500 font-bold cursor-pointer" onClick={() => setActiveTopic(topic)}>💬 {topic.repliesCount || 0}</span>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="flex flex-col items-center space-y-3">
                
                <div className={`w-full max-w-md flex flex-wrap items-center justify-between gap-2 ${cardBg} px-4 py-2 rounded-2xl text-xs shadow`}>
                  <div className="flex items-center gap-2">
                    <span className="text-rose-500 font-bold">🎯 Radar: <b className={textColor}>{matchRadiusKm} km</b></span>
                    <input 
                      type="range" 
                      min="10" 
                      max={maxAllowedSlider} 
                      step="10"
                      value={matchRadiusKm} 
                      onChange={(e) => setMatchRadiusKm(Number(e.target.value))}
                      className="w-24 accent-rose-500 cursor-pointer"
                    />
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => setRadarFilterType('all')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'all' ? 'bg-amber-500 text-slate-950' : `${subCardBg} ${mutedText}`}`}>Todos</button>
                    <button onClick={() => setRadarFilterType('verified')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'verified' ? 'bg-sky-500 text-slate-950' : `${subCardBg} ${mutedText}`}`}>✔ Verif.</button>
                    <button onClick={() => setRadarFilterType('critic')} className={`px-2 py-1 rounded-xl font-bold transition-all ${radarFilterType === 'critic' ? 'bg-amber-400 text-slate-950' : `${subCardBg} ${mutedText}`}`}>🌟 Críticos</button>
                  </div>
                </div>

                {currentCandidate ? (() => {
                  const candidatePhotos = currentCandidate.photos?.length > 0 ? currentCandidate.photos : [currentCandidate.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'];
                  const activePhoto = candidatePhotos[currentPhotoIndex] || candidatePhotos[0];
                  const computedDist = (currentUser?.lat && currentUser?.lon && currentCandidate.lat && currentCandidate.lon) 
                    ? calculateDistanceKm(currentUser.lat, currentUser.lon, currentCandidate.lat, currentCandidate.lon) 
                    : (currentCandidate.distanceKm || 5);

                  return (
                    <div className={`w-full max-w-md ${cardBg} rounded-3xl overflow-hidden shadow-2xl`}>
                      
                      <div className="relative h-96 w-full bg-slate-900 select-none">
                        <img src={activePhoto} alt={currentCandidate.name} className="w-full h-full object-cover transition-opacity duration-300" />
                        
                        {candidatePhotos.length > 1 && (
                          <div className="absolute top-3 left-3 right-3 flex gap-1 z-10">
                            {candidatePhotos.map((_, pIdx) => (
                              <div key={pIdx} className={`h-1 flex-1 rounded-full transition-all ${pIdx === currentPhotoIndex ? 'bg-amber-500 shadow-md shadow-amber-500' : 'bg-white/40'}`}></div>
                            ))}
                          </div>
                        )}

                        {candidatePhotos.length > 1 && (
                          <>
                            <button 
                              onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev > 0 ? prev - 1 : candidatePhotos.length - 1)); }} 
                              className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100"
                            >
                              ‹
                            </button>
                            <button 
                              onClick={(e) => { e.stopPropagation(); setCurrentPhotoIndex(prev => (prev < candidatePhotos.length - 1 ? prev + 1 : 0)); }} 
                              className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center backdrop-blur-sm opacity-80 hover:opacity-100"
                            >
                              ›
                            </button>
                          </>
                        )}

                        <div className="absolute top-5 left-4 flex gap-2">
                          <span className="bg-rose-600/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-white shadow">{currentCandidate.sex || 'Perfil'} • Busca: {currentCandidate.interestedIn || 'Cualquiera'}</span>
                          {currentCandidate.kycVerified && (
                            <span className="bg-sky-500 text-slate-950 px-2.5 py-1 rounded-full text-xs font-black flex items-center gap-1 shadow">
                              ✔ Verificado
                            </span>
                          )}
                        </div>

                        <div className="absolute bottom-4 left-4 right-4 bg-gradient-to-t from-slate-950 via-slate-950/70 to-transparent pt-10 pb-2 px-2">
                          <h2 className="text-2xl font-black text-white flex items-center gap-2 drop-shadow">
                            {currentCandidate.name}, {currentCandidate.age || 25}
                            {currentCandidate.kycVerified && <span className="text-sky-400 text-lg" title="Identidad Verificada">✔</span>}
                          </h2>
                          <p className="text-xs text-amber-400 font-medium drop-shadow">
                            📍 {currentCandidate.location || 'Oberá'} • 📏 A aprox. <b>{computedDist} km</b>
                          </p>
                        </div>
                      </div>

                      <div className="p-6 space-y-4">
                        <div className="bg-rose-500/10 border border-rose-500/30 p-3.5 rounded-2xl">
                          <p className="text-[10px] uppercase font-bold text-rose-500 mb-1">💬 Descripción para Citas:</p>
                          <p className={`text-xs italic ${textColor}`}>"{currentCandidate.datingBio || currentCandidate.bio || 'Amante del buen cine y buscando conectar.'}"</p>
                        </div>
                        
                        <div className="flex justify-center gap-6 pt-2">
                          <button onClick={() => setCurrentIndex(prev => prev + 1)} className={`w-14 h-14 rounded-full ${subCardBg} text-rose-500 flex items-center justify-center text-xl font-bold shadow transition-all hover:scale-105`}>✖</button>
                          <button onClick={() => { handleMatchUser(currentCandidate); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20 hover:scale-110 transition-all">🍿</button>
                        </div>
                      </div>
                    </div>
                  );
                })() : (
                  <div className={`text-center py-20 space-y-4 max-w-md ${cardBg} p-8 rounded-3xl`}>
                    <div className="text-4xl">🎟️</div>
                    <h3 className={`text-xl font-bold ${textColor}`}>No hay más perfiles con estos filtros.</h3>
                    <button onClick={() => setCurrentIndex(0)} className={`${subCardBg} ${textColor} px-4 py-2 rounded-xl text-xs font-bold`}>Reiniciar Radar</button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <h2 className={`text-2xl font-black ${textColor}`}>💬 Chats & Matches</h2>

                <div className={`grid grid-cols-1 md:grid-cols-3 gap-6 ${cardBg} rounded-3xl p-4 min-h-[450px]`}>
                  <div className={`border-r ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pr-3 space-y-2`}>
                    <h3 className="text-xs font-bold text-amber-500 uppercase px-2">{t.activeChats}</h3>
                    {chatsList.length === 0 ? (
                      <p className={`text-xs ${mutedText} p-2`}>{t.noChats}</p>
                    ) : (
                      chatsList.map(chat => (
                        <div 
                          key={chat.id} 
                          onClick={() => { setActiveChat(chat); setShowEmojiPicker(false); setShowStickerPicker(false); }}
                          className={`flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all ${activeChat?.id === chat.id ? 'bg-amber-500/20 border border-amber-500/50' : `${isDarkMode ? 'hover:bg-slate-800/60' : 'hover:bg-slate-100'}`}`}
                        >
                          <img src={chat.userAvatar} alt={chat.userName} className="w-12 h-12 rounded-full object-cover border border-amber-500/30" />
                          <div className="overflow-hidden flex-1">
                            <h4 className={`font-bold ${textColor} text-xs truncate`}>{chat.userName}</h4>
                            <p className={`text-[10px] ${mutedText} truncate`}>
                              {chat.messages[chat.messages.length - 1]?.isSticker || chat.messages[chat.messages.length - 1]?.text?.startsWith('STCK:') ? '🎬 [Sticker Cinéfilo]' : (chat.messages[chat.messages.length - 1]?.text || 'Match')}
                            </p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className={`md:col-span-2 flex flex-col justify-between ${subCardBg} rounded-2xl border p-4 relative`}>
                    {activeChat ? (
                      <>
                        <div className={`flex items-center justify-between border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                          <div className="flex items-center gap-3">
                            <img src={activeChat.userAvatar} alt={activeChat.userName} className="w-10 h-10 rounded-full object-cover" />
                            <div>
                              <h3 className={`font-bold ${textColor} text-sm`}>{activeChat.userName}</h3>
                              <span className="text-[10px] text-emerald-500 font-bold">🟢 Online Cloud Sync</span>
                            </div>
                          </div>
                          <button 
                            onClick={() => handleDeleteChat(activeChat.id)}
                            className="bg-rose-500/25 hover:bg-rose-500/40 text-rose-400 border border-rose-500/40 text-[10px] font-bold px-3 py-1.5 rounded-xl transition-all shadow"
                            title="Eliminar chat"
                          >
                            🗑️ Borrar Chat
                          </button>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 py-4 max-h-[260px] px-1">
                          {(activeChat.messages || []).map(msg => {
                            const isMe = msg.sender === currentUser?.name;
                            const isStickerMsg = msg.isSticker || msg.text?.startsWith('STCK:');
                            const stickerEmoji = isStickerMsg ? msg.text.replace('STCK:', '') : null;

                            return (
                              <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                {isStickerMsg ? (

          {showInstallGuideModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl`}>
                <div className="text-4xl">📱✨</div>
                <h3 className="text-xl font-black text-amber-500">Instalar Plottwisme</h3>
                <p className={`text-xs ${mutedText} leading-relaxed text-left ${subCardBg} p-4 rounded-2xl border`}>
                  <b>🌐 Android:</b> Abre el menú del navegador <b>( ⋮ )</b> y toca <b>"Instalar aplicación"</b>.<br/><br/>
                  <b>🍏 iPhone:</b> Toca el botón <b>Compartir</b> y selecciona <b>"Agregar a Inicio"</b>.
                </p>
                <button onClick={() => setShowInstallGuideModal(false)} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">
                  Entendido
                </button>
              </div>
            </div>
          )}

          {showNewTopicModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative`}>
                <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                  <h3 className={`text-lg font-black ${textColor}`}>✍️ Crear Nuevo Debate</h3>
                  <button onClick={() => setShowNewTopicModal(false)} className={`${mutedText} font-bold text-lg`}>✕</button>
                </div>
                <form onSubmit={handleCreateTopic} className="space-y-4 text-xs">
                  <div>
                    <label className={`block mb-1 ${mutedText} font-bold`}>Título:</label>
                    <input type="text" value={newTopicTitle} onChange={(e) => setNewTopicTitle(e.target.value)} placeholder="Ej: ¿Cuál es el mejor final?" className={`w-full ${inputBg} rounded-xl p-3`} required />
                  </div>
                  <div>
                    <label className={`block mb-1 ${mutedText} font-bold`}>Categoría:</label>
                    <select value={newTopicCategory} onChange={(e) => setNewTopicCategory(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                      <option value="Cine de Autor">Cine de Autor</option>
                      <option value="Debates Clásicos">Debates Clásicos</option>
                      <option value="Ciencia Ficción">Ciencia Ficción</option>
                      <option value="Estrenos">Estrenos</option>
                      <option value="Plot Twists">Plot Twists</option>
                    </select>
                  </div>
                  <div>
                    <label className={`block mb-1 ${mutedText} font-bold`}>Contenido:</label>
                    <textarea rows="4" value={newTopicContent} onChange={(e) => setNewTopicContent(e.target.value)} placeholder="Escribe tu propuesta..." className={`w-full ${inputBg} rounded-xl p-3`} required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                    Publicar Debate
                  </button>
                </form>
              </div>
            </div>
          )}

          {showMatchModal && matchedUser && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl`}>
                <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 p-1">
                  <img src={matchedUser.photos?.[0] || matchedUser.avatar} alt="Match" className="w-full h-full rounded-full object-cover" />
                </div>
                <div>
                  <h3 className="text-2xl font-black text-amber-500">{t.matchTitle}</h3>
                </div>
                <div className="flex flex-col gap-2 pt-2">
                  <button onClick={() => { setShowMatchModal(false); const chat = chatsList.find(c => c.userId === matchedUser.id); if (chat) setActiveChat(chat); setActiveTab('chats'); }} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">
                    {t.openChatNow}
                  </button>
                  <button onClick={() => setShowMatchModal(false)} className={`w-full ${subCardBg} ${textColor} font-bold py-2.5 rounded-xl text-xs`}>
                    {t.keepSearching}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto`}>
                <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                  <h3 className={`text-lg font-black ${textColor}`}>
                    {authMode === 'signup' && '✨ Crear Cuenta'}
                    {authMode === 'login' && '🔑 Iniciar Sesión'}
                    {authMode === 'forgot' && '🔄 Recuperar Contraseña'}
                  </h3>
                  <button onClick={() => { setShowAuthModal(false); setResetStep(1); }} className={`${mutedText} font-bold text-lg`}>✕</button>
                </div>

                {authMode === 'signup' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Nombre Completo:</label>
                      <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} placeholder="Ej: Juan Pérez" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Fecha Nacimiento (+18):</label>
                        <input type="date" value={authBirthdate} onChange={(e) => setAuthBirthdate(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                      </div>
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Mi Género:</label>
                        <select value={authSex} onChange={(e) => setAuthSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                          {SEXUALITIES_OPTIONS.map(opt => (
                            <option key={opt} value={opt}>{opt}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Interesado en (Radar de Citas):</label>
                      <select value={authInterestedIn} onChange={(e) => setAuthInterestedIn(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                        {SEEKING_SEXUALITIES_OPTIONS.map(opt => (
                          <option key={opt} value={opt}>{opt}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block mb-1 text-amber-500 font-bold">Biografía Pública:</label>
                      <textarea rows="2" value={authPublicBio} onChange={(e) => setAuthPublicBio(e.target.value)} placeholder="Tus gustos generales..." className={`w-full ${inputBg} rounded-xl p-3`} />
                    </div>

                    <div>
                      <label className="block mb-1 text-rose-500 font-bold">Biografía de Citas:</label>
                      <textarea rows="2" value={authDatingBio} onChange={(e) => setAuthDatingBio(e.target.value)} placeholder="Lo que buscas para citas..." className={`w-full ${inputBg} rounded-xl p-3`} />
                    </div>
                    
                    <div className={`${subCardBg} border p-3 rounded-xl flex items-center justify-between`}>
                      <div>
                        <p className={`font-bold ${textColor}`}>¿Solicitar Insignia de Crítico?</p>
                        <p className={`text-[10px] ${mutedText}`}>Permite publicar reseñas de cine.</p>
                      </div>
                      <input type="checkbox" checked={authWantCritic} onChange={(e) => setAuthWantCritic(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" />
                    </div>

                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>

                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Contraseña:</label>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                      Registrarme
                    </button>
                  </form>
                )}

                {authMode === 'login' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className={`${mutedText} font-bold`}>Contraseña:</label>
                        <button type="button" onClick={() => { setAuthMode('forgot'); setResetStep(1); }} className="text-amber-500 font-bold hover:underline text-[11px]">¿Olvidaste tu contraseña?</button>
                      </div>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                      Ingresar
                    </button>
                  </form>
                )}

                {authMode === 'forgot' && (
                  <form onSubmit={handleForgotSubmit} className="space-y-4 text-xs">
                    {resetStep === 1 ? (
                      <>
                        <p className={`${mutedText} leading-relaxed`}>Ingresa tu correo para restablecer tu contraseña.</p>
                        <div>
                          <label className={`block mb-1 ${mutedText} font-bold`}>Correo Electrónico:</label>
                          <input type="email" value={forgotEmail} onChange={(e) => setForgotEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className={`w-full ${inputBg} rounded-xl p-3`} required />
                        </div>
                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                          Verificar Correo
                        </button>
                      </>
                    ) : (
                      <>
                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-emerald-300">
                          ✅ ¡Solicitud enviada para <b>{forgotEmail}</b>!
                        </div>
                        <button type="button" onClick={() => { setAuthMode('login'); setResetStep(1); }} className={`w-full ${subCardBg} ${textColor} font-bold py-2.5 rounded-xl text-xs`}>
                          Volver al inicio de sesión
                        </button>
                      </>
                    )}
                  </form>
                )}

                <div className={`text-center pt-2 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} text-xs`}>
                  {authMode === 'signup' && (
                    <p className={mutedText}>¿Ya tienes cuenta? <button onClick={() => { setAuthMode('login'); setResetStep(1); }} className="text-amber-500 font-bold underline">Inicia Sesión</button></p>
                  )}
                  {authMode === 'login' && (
                    <p className={mutedText}>¿No tienes cuenta? <button onClick={() => { setAuthMode('signup'); setResetStep(1); }} className="text-amber-500 font-bold underline">Regístrate gratis</button></p>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) { console.error(e); }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./pwabuilder-sw.js')
          .then(reg => {
            console.log('Service Worker registrado con éxito:', reg.scope);
          })
          .catch(err => {
            console.log('Error al registrar el Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
