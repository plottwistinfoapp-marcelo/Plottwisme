      const [editPhotos, setEditPhotos] = useState([]);

      const [editTv, setEditTv] = useState('');

      useEffect(() => {
        if (!window.db) return;
        const { collection, onSnapshot } = window.FirebaseFns;

        const unsubUsers = onSnapshot(collection(window.db, "users"), (snapshot) => {
          let loadedUsers = [];
          snapshot.forEach(docSnap => {
            loadedUsers.push({ id: docSnap.id, ...docSnap.data() });
          });

          const adminExists = loadedUsers.some(u => u.email?.toLowerCase() === 'marbuttice@gmail.com');
          if (!adminExists) {
            const defaultAdmin = {
              id: 'u1',
              name: 'Marcelo Buttice',
              email: 'marbuttice@gmail.com',
              age: 57,
              sex: 'Masculino',
              lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
              location: 'Oberá, Misiones, Argentina',
              distanceKm: 2.5,
              role: 'admin',
              roleLabel: 'Administrador General',
              isPremium: true,
              isCritic: true,
              verified: true,
              bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
              photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],

          setUsersList(loadedUsers);

          if (window.auth?.currentUser) {
            const currentDoc = loadedUsers.find(u => u.email?.toLowerCase() === window.auth.currentUser.email.toLowerCase());
            if (currentDoc) {
              if (currentDoc.email.toLowerCase() === 'marbuttice@gmail.com') {
                currentDoc.role = 'admin';
                currentDoc.roleLabel = 'Administrador General';
                currentDoc.isCritic = true;
                currentDoc.isPremium = true;
              }
              setCurrentUser(currentDoc);
            }
          }
        });

        const unsubForums = onSnapshot(collection(window.db, "forums"), (snapshot) => {
          let loadedForums = [];
          snapshot.forEach(docSnap => {
            loadedForums.push({ id: docSnap.id, ...docSnap.data() });
          });
          setForumTopics(loadedForums);
        });

        const unsubReviews = onSnapshot(collection(window.db, "reviews"), (snapshot) => {
          let loadedReviews = [];
          snapshot.forEach(docSnap => {
            loadedReviews.push({ id: docSnap.id, ...docSnap.data() });
          });
          setReviewsList(loadedReviews);
        });

        return () => {
          unsubUsers();
          unsubForums();
          unsubReviews();
        };
      }, []);

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              try {
                const { latitude, longitude } = position.coords;
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
                const data = await response.json();
                const city = data.address.city || data.address.town || data.address.village || data.address.county || 'Buenos Aires';
                const countryCode = data.address.country_code ? data.address.country_code.toUpperCase() : 'AR';
                
                setUserCity(city);
                if (COUNTRY_CODES.some(c => c.code === countryCode)) {
                  setUserCountryCode(countryCode);
                }
              } catch (e) {
                setUserCity('Buenos Aires');
              }
            },
            () => { setUserCity('Buenos Aires'); }
          );
        } else {
          setUserCity('Buenos Aires');
        }
      }, []);

      useEffect(() => {
        if (currentUser) {
          setEditBio(currentUser.bio || '');
          setEditPhotos(currentUser.photos || (currentUser.avatar ? [currentUser.avatar] : []));
          setEditRadio(currentUser.socialLinks?.radio || '');
          setEditTv(currentUser.socialLinks?.tv || '');
        }
      }, [currentUser]);

      const getCountryName = () => {
        const found = COUNTRY_CODES.find(c => c.code === userCountryCode);
        return found ? found.name.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}]/gu, '').trim() : '';
      };

      const openGoogleEngine = (customQueryFormat = 'cartelera de cines en {city} {country}') => {
        const cleanCity = userCity.trim() || 'Buenos Aires';
        const country = getCountryName();
        const query = customQueryFormat
          .replace('{city}', cleanCity)
          .replace('{country}', country)
          .replace('{radius}', searchRadiusKm);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}&cs=2&hl=${lang}`, '_blank');
      };

      const handleMatchUser = (candidate) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        setMatchedUser(candidate);
        setShowMatchModal(true);

        const existingChat = chatsList.find(c => c.userId === candidate.id);
        if (!existingChat) {
          const newChat = {
            id: 'chat_' + candidate.id,
            userId: candidate.id,
            userName: candidate.name,
            userAvatar: candidate.avatar,
            messages: [
              { id: 'm_init', sender: candidate.name, text: `¡Hola ${currentUser.name}! Match para Cita 🍿🍷`, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) }
            ]
          };
          setChatsList([newChat, ...chatsList]);
        }
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessageText.trim() || !activeChat) return;

        const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const newMsg = {
          id: 'msg_' + Date.now(),
          sender: currentUser.name,
          text: newMessageText,
          time: timeStr
        };

        const updatedChats = chatsList.map(chat => {
          if (chat.id === activeChat.id) {
            const updated = { ...chat, messages: [...chat.messages, newMsg] };
            setActiveChat(updated);
            return updated;
          }
          return chat;
        });

        setChatsList(updatedChats);
        setNewMessageText('');
      };

      const handleFileSelected = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const maxPhotosAllowed = currentUser?.isPremium ? 10 : 3;
        if (editPhotos.length >= maxPhotosAllowed) {
          alert(`⚠️ Máximo ${maxPhotosAllowed} fotos permitidas.`);
          return;
        }

        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 600;
            const MAX_HEIGHT = 600;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
            setEditPhotos([...editPhotos, compressedDataUrl]);
          };
          img.src = uploadEvent.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleRemovePhoto = (indexToRemove) => {
        setEditPhotos(editPhotos.filter((_, idx) => idx !== indexToRemove));
      };

      const handleDeleteUser = async (userId) => {
        if (window.confirm('⚠️ ¿Expulsar / eliminar este usuario de la nube permanentemente?')) {
          try {
            await window.FirebaseFns.deleteDoc(window.FirebaseFns.doc(window.db, "users", userId));

          } catch (err) {
            alert('Error al eliminar usuario.');
          }
        }
      };

        if (window.confirm('🗑️ ¿Eliminar esta foto por inapropiada?')) {
          const targetUser = usersList.find(u => u.id === userId);

            const updatedPhotos = (targetUser.photos || [targetUser.avatar]).filter((_, i) => i !== photoIndex);
            const newAvatar = updatedPhotos[0] || 'https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=500&auto=format&fit=crop&q=80';
            try {
              await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "users", userId), {

                avatar: newAvatar
              });
              alert('✅ Foto moderada y eliminada.');
            } catch (err) {
              alert('Error al actualizar fotos.');
            }
          }
        }
      };

        const targetUser = usersList.find(u => u.id === userId);

          const nextVal = !targetUser.isCritic;

        e.preventDefault();
        const cleanEmail = authEmail.toLowerCase().trim();
        const isAdminEmail = cleanEmail === 'marbuttice@gmail.com';

        try {
          if (authMode === 'signup') {
            if (isAdminEmail) {
              const adminUser = {
                id: 'u1',
                name: authName || 'Marcelo Buttice',
                email: 'marbuttice@gmail.com',
                age: 57,
                sex: 'Masculino',
                lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
                location: 'Oberá, Misiones, Argentina',
                distanceKm: 2.5,
                role: 'admin',
                roleLabel: 'Administrador General',

                bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
                photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',

            try {
              userCred = await window.FirebaseFns.signInWithEmailAndPassword(window.auth, cleanEmail, authPassword);
            } catch (authErr) {
              if (isAdminEmail) {
                const adminUser = {
                  id: 'u1',
                  name: 'Marcelo Buttice',
                  email: 'marbuttice@gmail.com',
                  age: 57,
                  sex: 'Masculino',
                  lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
                  location: 'Oberá, Misiones, Argentina',
                  distanceKm: 2.5,
                  role: 'admin',
                  roleLabel: 'Administrador General',
                  isPremium: true,
                  isCritic: true,
                  verified: true,
                  bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
                  photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80'],
                  avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
                  socialLinks: { radio: 'Frecuencia Cine', tv: 'Canal 12 Misiones' }
                };
                await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "users", "u1"), adminUser, { merge: true });
                setCurrentUser(adminUser);
                alert('🛡️ ¡Bienvenido administrador!');
                setShowAuthModal(false);
                setAuthEmail('');
                setAuthPassword('');
                return;
              } else {
                throw authErr;
              }
            }

            const uid = userCred.user.uid;
            const docSnap = await window.FirebaseFns.getDoc(window.FirebaseFns.doc(window.db, "users", uid));
            if (docSnap.exists()) {
              let loggedData = docSnap.data();
              if (cleanEmail === 'marbuttice@gmail.com') {
                loggedData.role = 'admin';
                loggedData.roleLabel = 'Administrador General';
                loggedData.isCritic = true;
                loggedData.isPremium = true;
              }
              setCurrentUser(loggedData);
              alert(`👋 ¡Bienvenido de nuevo, ${loggedData.name}!`);
            } else {
              alert('❌ Perfil no encontrado en la base de datos.');
            }
          }
          setShowAuthModal(false);
          setAuthEmail('');
          setAuthPassword('');
        } catch (err) {
          alert('⚠️ Error de autenticación: ' + (err.message || 'Verifica tus datos.'));
        }
      };

      const handleForgotSubmit = async (e) => {
        e.preventDefault();
        if (resetStep === 1) {
          const found = usersList.find(u => u.email.toLowerCase() === forgotEmail.toLowerCase());
          if (!found && forgotEmail.toLowerCase().trim() !== 'marbuttice@gmail.com') {
            alert('❌ Email not found.');
            return;
          }
          setResetStep(2);
        } else {
          alert('✅ Solicitud procesada.');
          setShowAuthModal(false);
          setAuthMode('login');
          setResetStep(1);
          setForgotEmail('');
        }
      };

      const handleLogout = async () => {
        try {
          await window.FirebaseFns.signOut(window.auth);
        } catch(e){}
        setCurrentUser(null);
        setActiveTab('cinema');
        alert('Sesión cerrada.');
      };

      // FILTRADO DE DISTANCIA INTELIGENTE PARA EL RADAR (Respeta el slider y la membresía)
      const filteredCandidates = useMemo(() => {
        const others = usersList.filter(u => u.email !== currentUser?.email);
        
        const emailCheck = currentUser?.email?.toLowerCase().trim();
        const isAdmin = emailCheck === 'marbuttice@gmail.com' || currentUser?.role === 'admin';
        
        // Límite máximo permitido según el rol
        const maxLimit = isAdmin ? 10000 : (currentUser?.isPremium ? 500 : 100);

        // La distancia efectiva es el mínimo entre el slider elegido por el usuario y su límite máximo
        const effectiveRadius = Math.min(searchRadiusKm, maxLimit);

        return others.filter(u => {
          if (isAdmin) return true;
          const dist = u.distanceKm !== undefined ? u.distanceKm : Math.floor(Math.random() * 150) + 5;
          return dist <= effectiveRadius;
        });
      }, [usersList, currentUser, searchRadiusKm]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleUpgradePlan = async (isPrem) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "users", currentUser.id), {
            isPremium: isPrem,
            roleLabel: isPrem ? 'Cinéfilo Premium ⭐' : 'Cinéfilo Estándar'
          });
          setShowSubscriptionModal(false);
          alert(isPrem ? '⭐ ¡Actualizado a Premium! Ahora puedes ajustar tu radar y cartelera hasta 500 km.' : 'Cambiado a Estándar.');
        } catch(err) {
          alert('Error al actualizar plan.');
        }
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        const primaryAvatar = editPhotos.length > 0 ? editPhotos[0] : 'https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=500&auto=format&fit=crop&q=80';
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "users", currentUser.id), {
            bio: editBio,
            photos: editPhotos,
            avatar: primaryAvatar,
            socialLinks: { radio: editRadio, tv: editTv }
          });
          alert('✅ ¡Perfil y fotos guardados en la nube con éxito!');
        } catch(err) {
          alert('Error al guardar perfil.');
        }
      };

      const handlePublishReview = async (e) => {
        e.preventDefault();
        if (!currentUser?.isCritic) return;
        if (!newReviewMovie || !newReviewText) return;
        const newRev = {
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: currentUser.socialLinks?.radio || currentUser.socialLinks?.tv || currentUser.roleLabel,
          date: new Date().toISOString().split('T')[0],
          likes: 0,
          likedBy: []
        };
        try {
          await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "reviews", 'r_' + Date.now()), newRev);
          setNewReviewMovie('');
          setNewReviewText('');
          alert('📝 ¡Reseña publicada en la nube!');
        } catch(err) {
          alert('Error al publicar reseña.');
        }
      };

      const handleLikeReview = async (rev) => {
        if (!currentUser) { setShowAuthModal(true); return; }
        const likedBy = rev.likedBy || [];
        const alreadyLiked = likedBy.includes(currentUser.email);
        const newLikedBy = alreadyLiked ? likedBy.filter(e => e !== currentUser.email) : [...likedBy, currentUser.email];
        const newLikes = alreadyLiked ? (rev.likes || 1) - 1 : (rev.likes || 0) + 1;

        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "reviews", rev.id), {
            likes: newLikes,
            likedBy: newLikedBy
          });
        } catch(e) {}
      };

      const handleCreateTopic = async (e) => {
        e.preventDefault();
        if (!currentUser) { setShowAuthModal(true); return; }
        if (!newTopicTitle || !newTopicContent) return;
        const topicId = 'f_' + Date.now();
        const newTopic = {
          title: newTopicTitle,
          category: newTopicCategory,
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          repliesCount: 0,
          content: newTopicContent,
          comments: [],
          likes: 0,
          likedBy: []
        };
        try {
          await window.FirebaseFns.setDoc(window.FirebaseFns.doc(window.db, "forums", topicId), newTopic);
          setNewTopicTitle('');
          setNewTopicContent('');
          setShowNewTopicModal(false);
          alert('💬 ¡Debate creado con éxito!');
        } catch(err) {
          alert('Error al crear debate.');
        }
      };

      const handleLikeTopic = async (topic) => {
        if (!currentUser) { setShowAuthModal(true); return; }
        const likedBy = topic.likedBy || [];
        const alreadyLiked = likedBy.includes(currentUser.email);
        const newLikedBy = alreadyLiked ? likedBy.filter(e => e !== currentUser.email) : [...likedBy, currentUser.email];
        const newLikes = alreadyLiked ? (topic.likes || 1) - 1 : (topic.likes || 0) + 1;

        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "forums", topic.id), {
            likes: newLikes,
            likedBy: newLikedBy
          });
        } catch(e) {}
      };

      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!currentUser || !newCommentText || !activeTopic) return;
        const comment = {
          id: 'c_' + Date.now(),
          author: currentUser.name,
          date: new Date().toISOString().split('T')[0],
          text: newCommentText
        };
        const updatedComments = [...(activeTopic.comments || []), comment];
        try {
          await window.FirebaseFns.updateDoc(window.FirebaseFns.doc(window.db, "forums", activeTopic.id), {
            comments: updatedComments,
            repliesCount: updatedComments.length
          });
          setActiveTopic({ ...activeTopic, comments: updatedComments, repliesCount: updatedComments.length });
          setNewCommentText('');
        } catch(err) {
          alert('Error al responder.');
        }
      };

      const isAdmin = currentUser?.email?.toLowerCase().trim() === 'marbuttice@gmail.com' || currentUser?.role === 'admin';
      const maxAllowedSlider = isAdmin ? 1000 : (currentUser?.isPremium ? 500 : 100);

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
              
              <div className="flex items-center justify-between w-full lg:w-auto gap-4">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }}>
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                  <div>
                    <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                    <p className="text-[10px] uppercase text-slate-400 font-bold">
                      {currentUser ? (isAdmin ? '🛡️ Admin Dating' : currentUser.isPremium ? '⭐ Premium (Máx 500km)' : '👤 Standard (Máx 100km)') : '🌐 Guest (Máx 100km)'}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 px-2 py-1 rounded-xl">
                  <span className="text-xs">🌐</span>
                  <select 
                    value={lang} 
                    onChange={(e) => setLang(e.target.value)}
                    className="bg-transparent text-amber-400 text-xs font-bold focus:outline-none cursor-pointer"
                  >
                    <option value="es" className="bg-slate-900">Español 🇪🇸</option>
                    <option value="en" className="bg-slate-900">English 🇺🇸</option>
                    <option value="pt" className="bg-slate-900">Português 🇧🇷</option>
                  </select>
                </div>
              </div>

              {/* Selector de Ciudad + Control Deslizante de Kilómetros */}
              <div className="flex flex-wrap items-center gap-3 bg-amber-500/10 border border-amber-500/30 px-3 py-2 rounded-2xl text-xs w-full lg:w-auto justify-center">
                <div className="flex items-center gap-1.5">
                  <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ciudad:</span>
                  <input 
                    type="text" 
                    value={userCity} 
                    onChange={(e) => setUserCity(e.target.value)} 
                    placeholder={t.cityPlaceholder}
                    className="bg-transparent border-b border-amber-500/50 px-1 py-0.5 font-bold w-28 text-amber-300 focus:outline-none capitalize text-xs" 
                  />
                </div>

                <div className="flex items-center gap-2 border-l border-amber-500/30 pl-3">
                  <span className="text-amber-400 font-bold whitespace-nowrap">🎯 Radio: <b className="text-white">{searchRadiusKm} km</b></span>
                  <input 
                    type="range" 
                    min="10" 
                    max={maxAllowedSlider} 
                    step="10"
                    value={searchRadiusKm} 
                    onChange={(e) => setSearchRadiusKm(Number(e.target.value))}
                    className="w-24 sm:w-28 accent-amber-500 cursor-pointer"
                    title={`Ajustar radio (Máx: ${maxAllowedSlider} km)`}
                  />
                </div>

                {isAdmin && (
                  <>
                    <span className="text-slate-600">|</span>
                    <select 
                      value={userCountryCode} 
                      onChange={(e) => setUserCountryCode(e.target.value)}
                      className="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer"
                    >
                      {COUNTRY_CODES.map(c => (
                        <option key={c.code} value={c.code}>{c.name}</option>
                      ))}
                    </select>
                  </>
                )}
              </div>

              <nav className="flex flex-wrap items-center justify-center gap-1.5 p-1.5 rounded-2xl border border-slate-800 bg-slate-900">
                <button onClick={() => { setActiveTab('cinema'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.cinema}</button>
                <button onClick={() => { setActiveTab('forums'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'forums' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.forums}</button>
                <button onClick={() => { setActiveTab('radar'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.radar}</button>
                <button onClick={() => { setActiveTab('chats'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'chats' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.chats} ({chatsList.length})</button>
                <button onClick={() => { setActiveTab('critics'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.critics}</button>
                
                {currentUser && (
                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.profile}</button>
                )}

                {isAdmin && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950' : 'bg-amber-500/20 text-amber-300 border border-amber-500/50'}`}>
                    🛡️ Panel Admin
                  </button>
                )}

                {currentUser ? (
                  <button onClick={handleLogout} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">
                    {t.logout}
                  </button>
                ) : (
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => { setAuthMode('login'); setResetStep(1); setShowAuthModal(true); }} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-amber-400 border border-amber-500/30 hover:bg-slate-700 whitespace-nowrap">
                      {t.login}
                    </button>
                    <button onClick={() => { setAuthMode('signup'); setResetStep(1); setShowAuthModal(true); }} className="px-3 py-1.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 hover:bg-amber-400 whitespace-nowrap">
                      {t.signup}
                    </button>
                  </div>
                )}
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {activeTab === 'cinema' && (
              <div className="space-y-8">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500/20 via-slate-900 to-slate-900 border border-amber-500/30 p-8 shadow-2xl">
                  <div className="max-w-2xl space-y-4">
                    <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-3 py-1 rounded-md uppercase tracking-wider">
                      {t.engineTitle} • Radio actual: {searchRadiusKm} km
                    </span>
                    <h2 className="text-3xl font-black text-white leading-tight">
                      {t.cinemaRealtime} <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                    </h2>
                    <p className="text-sm text-slate-300 leading-relaxed">
                      {t.cinemaSubtitle}
                    </p>
                    <div className="pt-2">
                      <button 
                        onClick={() => openGoogleEngine('cartelera cines {city} {country} radio {radius}km')} 
                        className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-sm transition-all shadow-xl shadow-amber-500/20 flex items-center gap-3 hover:scale-105"
                      >
                        <span>🏛️ {t.openCinema} {userCity || 'tu ciudad'} ({searchRadiusKm} km)</span>
                        <span>↗</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-black text-white flex items-center gap-2">
                    <span>⚡ {t.directSearch}</span>
                    <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {SEARCH_CATEGORIES.map(cat => (
                      <div 
                        key={cat.id} 
                        onClick={() => openGoogleEngine(cat.queryFormat)}
                        className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all hover:-translate-y-1 shadow-lg group flex flex-col justify-between space-y-4"
                      >
                        <div>
                          <h4 className="font-bold text-white group-hover:text-amber-400 transition-colors text-sm">{cat.label}</h4>
                          <p className="text-xs text-slate-400 mt-1">Radio: {searchRadiusKm} km</p>
                        </div>
                        <div className="text-xs font-bold text-amber-500 flex items-center justify-between pt-2 border-t border-slate-800">
                          <span>{t.consultGoogle}</span>
                          <span>↗</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className="bg-slate-900 border border-slate-800 text-amber-400 hover:text-amber-300 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                      <span>← Volver</span>
                    </button>

                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <span className="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {activeTopic.category}
                        </span>
                        <span className="text-xs text-slate-400">Por <b>{activeTopic.author}</b> • {activeTopic.date}</span>
                      </div>
                      <h2 className="text-2xl font-black text-white">{activeTopic.title}</h2>
                      <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-line">{activeTopic.content}</p>
                      
                      <div className="flex items-center gap-4 pt-2">
                        <button onClick={() => handleLikeTopic(activeTopic)} className="flex items-center gap-1.5 bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs font-bold text-amber-400 hover:bg-slate-800">
                          <span>🍿</span> <span>{activeTopic.likes || 0} Me gusta</span>
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">💬 Respuestas ({activeTopic.comments?.length || 0})</h3>

                      {(activeTopic.comments || []).map(c => (
                        <div key={c.id} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-400">
                            <span className="font-bold text-white">{c.author}</span>
                            <span>{c.date}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <textarea rows="3" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder="Escribe tu respuesta..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required disabled={!currentUser} />
                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          Publicar
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                      <div>
                        <h2 className="text-2xl font-black text-white">💬 Foros de Discusión</h2>
                        <p className="text-xs text-slate-400 mt-1">Comparte tus teorías con cinéfilos y valora con 🍿.</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        ✍️ Nuevo Debate
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.length === 0 ? (
                        <p className="text-xs text-slate-400 text-center py-6">Aún no hay debates. ¡Sé el primero en abrir uno!</p>
                      ) : (
                        forumTopics.map(topic => (
                          <div key={topic.id} className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl transition-all space-y-3 group">
                            <div className="flex justify-between items-center text-xs">
                              <span className="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{topic.category}</span>
                              <span className="text-slate-500 text-[10px]">{topic.date}</span>
                            </div>
                            <h3 onClick={() => setActiveTopic(topic)} className="text-base font-bold text-white group-hover:text-amber-400 transition-colors cursor-pointer">{topic.title}</h3>
                            <div className="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-800">
                              <span>Por <b>{topic.author}</b></span>
                              <div className="flex items-center gap-3">
                                <button onClick={() => handleLikeTopic(topic)} className="flex items-center gap-1 hover:text-amber-400 font-bold">
                                  <span>🍿</span> <span>{topic.likes || 0}</span>
                                </button>
                                <span className="text-amber-500 font-bold cursor-pointer" onClick={() => setActiveTopic(topic)}>💬 {topic.repliesCount || 0}</span>
                              </div>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}
              </div>

                  </h3>
                  <button onClick={() => { setShowAuthModal(false); setResetStep(1); }} className="text-slate-400 font-bold text-lg">✖</button>
                </div>

                {authMode === 'signup' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className="block mb-1 text-slate-400 font-bold">Nombre Completo:</label>
                      <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} placeholder="Ej: Juan Pérez" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block mb-1 text-slate-400 font-bold">Edad (+18):</label>
                        <input type="number" min="18" max="99" value={authAge} onChange={(e) => setAuthAge(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                      </div>
                      <div>
                        <label className="block mb-1 text-slate-400 font-bold">Género / Sexualidad:</label>
                        <select value={authSex} onChange={(e) => setAuthSex(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200">
                          {SEXUALITIES_OPTIONS.map(opt => (
                            <option key={opt} value={opt}>{opt}</option>
                          ))}
                        </select>
                      </div>
                    </div>
                    
                    <div className="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
                      <div>
                        <p className="font-bold text-white">¿Solicitar Insignia de Crítico?</p>
                        <p className="text-[10px] text-slate-400">Permite postularte para publicar reseñas oficiales.</p>
                      </div>
                      <input type="checkbox" checked={authWantCritic} onChange={(e) => setAuthWantCritic(e.target.checked)} className="w-4 h-4 accent-amber-500 cursor-pointer" />
                    </div>

                    <div>
                      <label className="block mb-1 text-slate-400 font-bold">Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>

                    <div>
                      <label className="block mb-1 text-slate-400 font-bold">Contraseña:</label>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                      Registrarme en la Nube
                    </button>
                  </form>
                )}

                {authMode === 'login' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className="block mb-1 text-slate-400 font-bold">Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>

                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-slate-400 font-bold">Contraseña:</label>
                        <button type="button" onClick={() => { setAuthMode('forgot'); setResetStep(1); }} className="text-amber-400 font-bold hover:underline text-[11px]">¿Olvidaste tu contraseña?</button>
                      </div>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>

                    <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                      Ingresar a la Nube
                    </button>
                  </form>
                )}

                {authMode === 'forgot' && (
                  <form onSubmit={handleForgotSubmit} className="space-y-4 text-xs">
                    {resetStep === 1 ? (
                      <>
                        <p className="text-slate-300 leading-relaxed">Ingresa el correo electrónico asociado a tu cuenta para restablecer tu contraseña.</p>
                        <div>
                          <label className="block mb-1 text-slate-400 font-bold">Correo Electrónico:</label>
                          <input type="email" value={forgotEmail} onChange={(e) => setForgotEmail(e.target.value)} placeholder="tuemail@ejemplo.com" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                        </div>
                        <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase tracking-wider transition-all">
                          Verificar Correo
                        </button>
                      </>
                    ) : (
                      <>
                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-xl text-emerald-300">
                          ✅ ¡Solicitud enviada para <b>{forgotEmail}</b>!
                        </div>
                        <button type="button" onClick={() => { setAuthMode('login'); setResetStep(1); }} className="w-full bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-xs">
                          Volver al inicio de sesión
                        </button>
                      </>
                    )}

                    <div className="text-center pt-2">
                      <button type="button" onClick={() => { setAuthMode('login'); setResetStep(1); }} className="text-slate-400 hover:text-white font-bold underline">
                        ← Volver al inicio de sesión
                      </button>
                    </div>
                  </form>
                )}

                <div className="text-center pt-2 border-t border-slate-800 text-xs">
                  {authMode === 'signup' && (
                    <p className="text-slate-400">¿Ya tienes cuenta? <button onClick={() => { setAuthMode('login'); setResetStep(1); }} className="text-amber-400 font-bold underline">Inicia Sesión</button></p>
                  )}
                  {authMode === 'login' && (
                    <p className="text-slate-400">¿No tienes cuenta? <button onClick={() => { setAuthMode('signup'); setResetStep(1); }} className="text-amber-400 font-bold underline">Regístrate gratis</button></p>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</body>
</html>
