<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function App() {
      const [activeTab, setActiveTab] = useState('cartelera');
      const [cityName, setCityName] = useState('Posadas');
      const [cartelera, setCartelera] = useState([]);

      useEffect(() => {
        const fetchMovies = async () => {
          try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1&region=AR`);
            const data = await res.json();
            if (data.results) {
              setCartelera(data.results.slice(0, 8).map(m => ({
                id: m.id,
                title: m.title,
                rating: m.vote_average ? m.vote_average.toFixed(1) : 'N/A',
                overview: m.overview ? m.overview.substring(0, 90) + '...' : 'Sin descripción.',
                poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : null
              })));
            }
          } catch (e) { console.error(e); }
        };
        fetchMovies();
      }, []);

      return (
        <div className="min-h-screen bg-slate-950 p-4 md:p-8">
          {/* BARRA DE NAVEGACIÓN LIMPIA */}
          <header className="max-w-6xl mx-auto flex flex-wrap justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 className="font-black text-2xl text-amber-500 tracking-wider">PLOTTWISME 🌐</h1>
            <nav className="flex gap-2 text-xs font-bold uppercase mt-4 md:mt-0">
              {['Cartelera', 'Radar Cines', 'Watch Parties', 'Match', 'Perfil'].map(tab => (
                <button 
                  key={tab} 
                  onClick={() => setActiveTab(tab.toLowerCase())}
                  className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.toLowerCase() ? 'bg-amber-500 text-slate-950' : 'hover:bg-slate-800'}`}
                >
                  {tab}
                </button>
              ))}
            </nav>
          </header>

          <main className="max-w-6xl mx-auto">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-black text-amber-500">Cartelera</h2>
              <input 
                type="text" value={cityName} onChange={(e) => setCityName(e.target.value)} 
                className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1 text-xs text-amber-400" 
              />
            </div>

            {/* GRILLA DE PELÍCULAS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
              {cartelera.map(film => (
                <div key={film.id} className="p-4 bg-slate-900 border border-slate-800 rounded-3xl flex flex-col gap-3 hover:border-slate-700 transition-all">
                  <img src={film.poster} className="w-full h-72 object-cover rounded-2xl" />
                  <h3 className="font-bold text-sm text-white">{film.title}</h3>
                  
                  {/* Botones principales */}
                  <a href="#" className="w-full bg-amber-500 text-slate-950 font-black py-2 rounded-xl text-xs text-center uppercase">
                    Ver Salas y Horarios 🎟️
                  </a>
                  
                  <div className="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center text-[10px] font-bold text-slate-400">
                    WATCH PARTY EN PLATAFORMAS
                  </div>
                  
                  <button className="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold py-2 rounded-xl text-xs uppercase border border-slate-700">
                    Buscar Compañero 🤝
                  </button>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
