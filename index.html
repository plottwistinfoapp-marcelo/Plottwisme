<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('radar');
      const [matches, setMatches] = useState([]);
      const [inviteCount, setInviteCount] = useState(0);
      const [isPremium, setIsPremium] = useState(false);
      const [location, setLocation] = useState('Detectar mi ubicación');
      
      // Filtros de Preferencias
      const [genreFilter, setGenreFilter] = useState('Todos');

      const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

      const getGeoLocation = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            () => setLocation('Ubicación detectada (Cerca de ti)'),
            () => setLocation('Ubicación no disponible')
          );
        }
      };

      const handleInvite = () => {
        const newCount = inviteCount + 1;
        setInviteCount(newCount);
        if (newCount >= 10) setIsPremium(true);
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          {/* BARRA DE NAVEGACIÓN COMPLETA */}
          <header className={`border-b p-4 sticky top-0 z-50 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90 backdrop-blur'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider">PLOTTWISME</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'radar', label: '🎯 Radar' },
                  { id: 'cartelera', label: '🎬 Cartelera' },
                  { id: 'criticos', label: '✍️ Críticos' },
                  { id: 'recomienda', label: '💡 Recomendaciones' },
                  { id: 'foros', label: '💬 Foros' },
                  { id: 'matches', label: '🍿 Matches' },
                  { id: 'perfil', label: '👤 Mi Perfil' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg transition-all ${
                      activeTab === tab.id 
                        ? 'bg-amber-500 text-slate-950 font-black shadow' 
                        : 'hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>

              <button onClick={toggleTheme} className="p-2 bg-slate-800 text-white rounded-xl text-sm">🌓</button>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-6">
            
            {/* RADAR & GEOLOCALIZACIÓN */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <div className={`p-6 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <h2 className="font-bold text-lg mb-2">📍 Cine cerca de ti</h2>
                  <p className="text-xs text-slate-400 mb-4">Usa la geolocalización para descubrir personas y funciones en tu zona.</p>
                  <button onClick={getGeoLocation} className="bg-amber-500 text-slate-950 px-4 py-2 rounded-xl font-bold text-xs">
                    {location}
                  </button>
                </div>
              </div>
            )}

            {/* SECCIÓN DE CRÍTICOS DE CINE */}
            {activeTab === 'criticos' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">Críticas Certificadas</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className={`p-5 rounded-2xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-10 h-10 rounded-full bg-amber-500 text-slate-950 font-black flex items-center justify-center">CR</div>
                      <div>
                        <h4 className="font-bold text-sm">Carlos Ruiz ★★★★☆</h4>
                        <span className="text-xs text-amber-500 font-semibold">Crítico Certificado</span>
                      </div>
                    </div>
                    <p className="text-xs text-slate-400 italic">"Dune 2 es un triunfo visual sin precedentes. Villeneuve logra mantener el ritmo sin perder la complejidad política de la obra."</p>
                  </div>
                </div>
              </div>
            )}

            {/* RECOMENDACIONES & PREFERENCIAS CINEMATOGRÁFICAS */}
            {activeTab === 'recomienda' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-black text-amber-500">Recomendaciones para ti</h2>
                  <select 
                    onChange={(e) => setGenreFilter(e.target.value)}
                    className="bg-slate-800 text-white text-xs p-2 rounded-xl border border-slate-700"
                  >
                    <option value="Todos">Todos los géneros</option>
                    <option value="Sci-Fi">Ciencia Ficción</option>
                    <option value="Drama">Drama</option>
                    <option value="Terror">Terror</option>
                  </select>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  {['Oppenheimer', 'Blade Runner 2049', 'The Substance', 'Parasite'].map((title, i) => (
                    <div key={i} className={`p-4 rounded-2xl border text-center ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="h-36 bg-slate-800 rounded-xl mb-2 flex items-center justify-center text-xs text-slate-500">Poster</div>
                      <h4 className="font-bold text-xs">{title}</h4>
                      <p className="text-[10px] text-amber-500 mt-1">98% Coincidencia</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FOROS DE DISCUSIÓN */}
            {activeTab === 'foros' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">Foros de Discusión Cinéfila</h2>
                <div className="space-y-3">
                  {[
                    { title: '¿Es Denis Villeneuve el mejor director de la década?', replies: 42, category: 'Debate' },
                    { title: 'Teorías sobre el final de Inception (El Origen)', replies: 128, category: 'Teorías' },
                    { title: 'Cine de autor independiente: Recomendaciones 2026', replies: 19, category: 'Recomendaciones' }
                  ].map((forum, index) => (
                    <div key={index} className={`p-4 rounded-2xl border flex justify-between items-center ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div>
                        <span className="text-[10px] font-bold uppercase bg-amber-500/20 text-amber-500 px-2 py-0.5 rounded-md">{forum.category}</span>
                        <h4 className="font-bold text-sm mt-1">{forum.title}</h4>
                      </div>
                      <span className="text-xs text-slate-400 font-mono">{forum.replies} resp.</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MATCHES */}
            {activeTab === 'matches' && (
              <div className="space-y-4">
                <h2 className="text-2xl font-black text-amber-500">Tus Matches Cinéfilos</h2>
                <p className="text-xs text-slate-400">Aún no hay coincidencias activas. ¡Explora en el Radar!</p>
              </div>
            )}

            {/* PERFIL & INVITACIONES PREMIUM */}
            {activeTab === 'perfil' && (
              <div className="space-y-6">
                <div className={`p-8 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <h3 className="text-xl font-black mb-2">Estado: {isPremium ? '👑 PREMIUM' : 'Usuario Estándar'}</h3>
                  {!isPremium && (
                    <div className="space-y-4">
                      <p className="text-xs text-slate-400">Invita a 10 amigos para desbloquear la versión Premium sin costo.</p>
                      <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div className="bg-amber-500 h-full" style={{ width: `${(inviteCount / 10) * 100}%` }}></div>
                      </div>
                      <button onClick={handleInvite} className="bg-amber-500 text-slate-950 font-black px-6 py-2 rounded-xl text-xs uppercase">
                        Invitar Amigo ({inviteCount}/10)
                      </button>
                    </div>
                  )}
                  <div className="mt-8 text-xs text-slate-400">
                    <p className="font-bold mb-1 text-slate-200">Condiciones Premium:</p>
                    <ul className="list-disc pl-4 space-y-1">
                      <li>Matches ilimitados diarios.</li>
                      <li>Acceso a foros privados con directores y críticos.</li>
                      <li>Experiencia 100% libre de anuncios.</li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
