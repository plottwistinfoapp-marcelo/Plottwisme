<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila Mundial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'plottwist.infoapp@gmail.com';
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function obtenerLinkCine(nombreCine, ciudad) {
      const nombre = nombreCine.toLowerCase();
      if (nombre.includes('cinemark') || nombre.includes('hoyts')) return 'https://www.cinemarkhoyts.com.ar';
      if (nombre.includes('cinepolis') || nombre.includes('cinépolis')) return 'https://www.cinepolis.com.ar';
      if (nombre.includes('showcase')) return 'https://www.todosloscines.com.ar';
      if (nombre.includes('cinemacenter')) return 'https://www.cinemacenter.com.ar';
      if (nombre.includes('atlas')) return 'https://www.cinesatlas.com.ar';
      if (nombre.includes('multiplex')) return 'https://www.cinesmultiplex.com.ar';
      
      return `https://www.google.com/search?q=cartelera+de+cine+horarios+cerca+de+${encodeURIComponent(nombreCine)}+${encodeURIComponent(ciudad)}`;
    }

    function obtenerLinkStreaming(titulo, plataforma) {
      const p = plataforma ? plataforma.toLowerCase() : '';
      if (p.includes('netflix')) return `https://www.netflix.com/search?q=${encodeURIComponent(titulo)}`;
      if (p.includes('disney')) return `https://www.disneyplus.com/search?q=${encodeURIComponent(titulo)}`;
      if (p.includes('hbo') || p.includes('max')) return `https://www.max.com/search?q=${encodeURIComponent(titulo)}`;
      if (p.includes('prime')) return `https://www.primevideo.com/search?phrase=${encodeURIComponent(titulo)}`;
      if (p.includes('apple')) return `https://tv.apple.com/search?term=${encodeURIComponent(titulo)}`;
      if (p.includes('mubi')) return `https://mubi.com/search?q=${encodeURIComponent(titulo)}`;
      
      return `https://www.google.com/search?q=donde+ver+${encodeURIComponent(titulo)}+online+streaming`;
    }

    function App() {
      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('cartelera'); 
      const [locationStatus, setLocationStatus] = useState('Detectar mi ubicación');
      const [userCoords, setUserCoords] = useState(null);
      const [countryCode, setCountryCode] = useState('AR'); 
      const [cityName, setCityName] = useState('');
      const [searchCityInput, setSearchCityInput] = useState('');

      // Opciones inclusivas de Identidad y Preferencias
      const opcionesGenero = ['Hombre', 'Mujer', 'No Binarie', 'Género Fluido', 'Transgénero', 'Otro'];
      const opcionesBusqueda = ['Hombres', 'Mujeres', 'Personas No Binarias', 'Todos / Sin preferencia'];

      const [currentUser, setCurrentUser] = useState({
        name: 'Marcelo Catan',
        email: 'marcelo@plottwisme.com',
        genres: 'Cine de Autor, Sci-Fi, Thriller, Clásicos',
        lookingFor: 'Compañeros para ir al cine y debates con café de por medio',
        usageMode: 'dating', // 'community', 'friends', 'dating'
        
        // Apartado Privado / Citas
        genderIdentity: 'Hombre',
        interestedIn: 'Mujeres',
        datingBio: 'Busco compartir funciones nocturnas, buenas charlas filosóficas y analizar los giros del guion después de la película.',
        
        privatePreferences: { hideExactLocation: false, hideDatingIntent: false, hideAge: false },
        bio: 'Apasionado por el cine analógico y los giros de guión inesperados.',
        isPremium: false,
        isCritic: false,
        isAdmin: false,
        photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'],
        avatarIndex: 0
      });

      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      const [cartelera, setCartelera] = useState([]);
      const [cargandoCartelera, setCargandoCartelera] = useState(false);

      const [cinesGlobales, setCinesGlobales] = useState([]);
      const [cargandoCines, setCargandoCines] = useState(false);

      const [streamingFilter, setStreamingFilter] = useState('Todos');
      const [streamingReleases, setStreamingReleases] = useState([]);
      const [cargandoStreaming, setCargandoStreaming] = useState(false);

      // Estado de Chat en tiempo real opcional
      const [chatOpen, setChatOpen] = useState(false);
      const [activeChatRoom, setActiveChatRoom] = useState('General');
      const [chatMessages, setChatMessages] = useState([
        { id: 1, user: 'Sofía', text: '¿Alguien para ver la nueva de Sci-Fi este finde?', time: '18:30' },
        { id: 2, user: 'Lucas', text: '¡Yo me sumo! Estaba buscando grupo para el Sunstar.', time: '18:32' }
      ]);
      const [newMessage, setNewMessage] = useState('');

      const streamingPlatforms = [
        { name: 'Netflix', id: 8, color: 'bg-red-600', logo: '🎬 N' },
        { name: 'HBO Max', id: 1899, color: 'bg-purple-600', logo: '🟣 Max' },
        { name: 'Disney+', id: 337, color: 'bg-blue-600', logo: '✨ D+' },
        { name: 'Prime Video', id: 119, color: 'bg-sky-500', logo: '📦 PV' },
        { name: 'Apple TV+', id: 350, color: 'bg-slate-700', logo: '🍏 TV+' },
        { name: 'MUBI', id: 11, color: 'bg-amber-600', logo: '🎥 MUBI' }
      ];

      // Usuarios simulados para el Match con intenciones claras
      const mockMatches = [
        {
          id: 101,
          name: 'Valeria R.',
          age: 38,
          photo: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80',
          distanceKm: 4.2,
          usageMode: 'dating',
          genderIdentity: 'Mujer',
          interestedIn: 'Hombres',
          datingBio: 'Fan de Kubrick y A24. Busco a alguien apasionado por el cine para ir al cine los viernes y tomar una copa a la salida.',
          genres: 'Cine Independiente, Drama, Terror Psicológico'
        },
        {
          id: 102,
          name: 'Martín G.',
          age: 42,
          photo: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80',
          distanceKm: 8.5,
          usageMode: 'friends',
          genderIdentity: 'Hombre',
          interestedIn: 'Todos / Sin preferencia',
          datingBio: '',
          genres: 'Ciencia Ficción, Acción, Clásicos'
        }
      ];

      const cargarCarteleraEnCines = async (region = 'AR') => {
        setCargandoCartelera(true);
        try {
          let url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1&region=${region}`;
          let res = await fetch(url);
          let data = await res.json();

          if (!data.results || data.results.length === 0) {
            url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1`;
            res = await fetch(url);
            data = await res.json();
          }

          if (data.results && data.results.length > 0) {
            const formateados = data.results.slice(0, 8).map(item => ({
              id: item.id,
              title: item.title,
              rating: item.vote_average ? item.vote_average.toFixed(1) : 'N/A',
              overview: item.overview ? item.overview.substring(0, 110) + '...' : 'Sin descripción disponible.',
              poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null,
              releaseDate: item.release_date,
              imdbSearchUrl: `https://www.imdb.com/find?q=${encodeURIComponent(item.title)}`
            }));
            setCartelera(formateados);
          } else {
            setCartelera([]);
          }
        } catch (err) {
          console.error("Error cargando cartelera:", err);
        } finally {
          setCargandoCartelera(false);
        }
      };

      const cargarEstrenosStreaming = async (providerId = null) => {
        setCargandoStreaming(true);
        try {
          let providerParam = providerId ? `&with_watch_providers=${providerId}` : '';
          const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&language=es-ES&sort_by=popularity.desc&page=1${providerParam}`;

          const res = await fetch(url);
          const data = await res.json();

          if (data.results && data.results.length > 0) {
            const formateados = data.results.slice(0, 9).map(item => ({
              id: item.id,
              title: item.title || item.name,
              rating: item.vote_average ? item.vote_average.toFixed(1) : 'N/A',
              overview: item.overview ? item.overview.substring(0, 90) + '...' : 'Sin descripción disponible.',
              poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null,
              releaseDate: item.release_date || item.first_air_date,
              imdbSearchUrl: `https://www.imdb.com/find?q=${encodeURIComponent(item.title || item.name)}`
            }));
            setStreamingReleases(formateados);
          } else {
            setStreamingReleases([]);
          }
        } catch (err) {
          console.error("Error en streaming:", err);
        } finally {
          setCargandoStreaming(false);
        }
      };

      useEffect(() => {
        cargarCarteleraEnCines(countryCode);
      }, [countryCode]);

      useEffect(() => {
        if (activeTab === 'streaming') {
          const plataforma = streamingPlatforms.find(p => p.name === streamingFilter);
          cargarEstrenosStreaming(plataforma ? plataforma.id : null);
        }
      }, [activeTab, streamingFilter, countryCode]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;
        const msg = {
          id: Date.now(),
          user: currentUser.name,
          text: newMessage,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setChatMessages([...chatMessages, msg]);
        setNewMessage('');
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          {/* HEADER */}
          <header className={`border-b p-4 sticky top-0 z-40 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90 backdrop-blur'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider cursor-pointer" onClick={() => setActiveTab('cartelera')}>PLOTTWISME 🌐</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'cartelera', label: '🍿 Cartelera en Cines' },
                  { id: 'radar', label: '🎯 Radar Cines' },
                  { id: 'streaming', label: '📺 Streaming / Debates' },
                  { id: 'match', label: '🔥 Match' },
                  { id: 'perfil', label: '👤 Perfil & Citas' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-800 hover:text-white'}`}>{tab.label}</button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setChatOpen(!chatOpen)} className="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded-xl text-xs border border-slate-700 flex items-center gap-1.5">
                  💬 Chat {chatOpen ? '✓' : ''}
                </button>
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2 bg-slate-800 text-white rounded-xl text-sm">🌓</button>
              </div>
            </div>
          </header>

          {/* CHAT EN TIEMPO REAL OPCIONAL (FLOTANTE O DESPLEGABLE) */}
          {chatOpen && (
            <div className="max-w-5xl mx-auto px-6 pt-4">
              <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 shadow-2xl space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h3 className="text-xs font-black uppercase text-amber-500">Chat en Vivo Cinéfilo - {activeChatRoom}</h3>
                  </div>
                  <button onClick={() => setChatOpen(false)} className="text-xs text-slate-400 hover:text-white font-bold">✕ Cerrar</button>
                </div>

                <div className="h-40 overflow-y-auto space-y-2 pr-2 text-xs">
                  {chatMessages.map(msg => (
                    <div key={msg.id} className={`p-2 rounded-xl max-w-md ${msg.user === currentUser.name ? 'bg-amber-500/20 border border-amber-500/30 ml-auto text-right' : 'bg-slate-950 border border-slate-800 text-left'}`}>
                      <span className="font-bold text-amber-400 text-[10px] block">{msg.user} • {msg.time}</span>
                      <span className="text-slate-200">{msg.text}</span>
                    </div>
                  ))}
                </div>

                <form onSubmit={handleSendMessage} className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Escribe un mensaje en tiempo real..." 
                    value={newMessage}
                    onChange={(e) => setNewMessage(e.target.value)}
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-amber-500"
                  />
                  <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase">
                    Enviar
                  </button>
                </form>
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-6">
            
            {/* CARTELERA */}
            {activeTab === 'cartelera' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center flex-wrap gap-3">
                  <div>
                    <h2 className="text-2xl font-black text-amber-500">🍿 Cartelera de Estrenos</h2>
                    <p className="text-xs text-slate-400">Funciones y salas activas cerca de ti.</p>
                  </div>
                </div>

                {cargandoCartelera ? (
                  <div className="p-12 text-center text-amber-400 bg-slate-900 rounded-3xl border border-slate-800 animate-pulse">🎬 Actualizando estrenos...</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                    {cartelera.map((film) => (
                      <div key={film.id} className={`p-4 rounded-3xl border flex flex-col justify-between space-y-3 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                        {film.poster ? <img src={film.poster} alt={film.title} className="w-full h-64 object-cover rounded-2xl" /> : <div className="w-full h-64 bg-slate-800 rounded-2xl flex items-center justify-center text-4xl">🍿</div>}
                        <div className="space-y-1 flex-1">
                          <h3 className="font-black text-sm text-white pt-1">{film.title}</h3>
                          <p className="text-[11px] text-slate-400 leading-snug">{film.overview}</p>
                        </div>
                        <button onClick={() => setActiveTab('match')} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs uppercase">
                          Buscar Compañero 🤝
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* RADAR CINES */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <h2 className="font-bold text-xl text-amber-500">🎯 Radar de Cines Locales</h2>
                <p className="text-xs text-slate-400">Encuentra salas cercanas y consulta la función exacta.</p>
              </div>
            )}

            {/* STREAMING */}
            {activeTab === 'streaming' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">📺 Cine en Casa & Streaming</h2>
                <p className="text-xs text-slate-400">Selecciona una película para ver directo en la plataforma o inicia un debate en el chat.</p>
              </div>
            )}

            {/* MATCH CON APARTADO DE PAREJA / PREFERENCIAS */}
            {activeTab === 'match' && (
              <div className="space-y-6">
                <div>
                  <h2 className="text-2xl font-black text-amber-500">🔥 Match & Conexiones Cinéfilas</h2>
                  <p className="text-xs text-slate-400">Conecta con personas según tus intereses de amistad o citas románticas.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {mockMatches.map(person => (
                    <div key={person.id} className={`p-6 rounded-3xl border space-y-4 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="flex items-center gap-4">
                        <img src={person.photo} className="w-16 h-16 rounded-2xl object-cover border-2 border-amber-500" />
                        <div>
                          <div className="flex items-center gap-2">
                            <h3 className="font-bold text-base text-white">{person.name}, {person.age}</h3>
                            <span className="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded-full font-bold">📍 {person.distanceKm} km</span>
                          </div>
                          <span className={`inline-block mt-1 text-[10px] px-2 py-0.5 rounded font-black uppercase ${person.usageMode === 'dating' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-blue-500/20 text-blue-400'}`}>
                            {person.usageMode === 'dating' ? '❤️ Buscando Pareja' : '🤝 Solo Amigos'}
                          </span>
                        </div>
                      </div>

                      {/* APARTADO EXCLUSIVO PARA MATCH: Si busca pareja se muestran sus preferencias y bio específica */}
                      {person.usageMode === 'dating' && person.datingBio && (
                        <div className="p-4 bg-rose-950/20 border border-rose-500/20 rounded-2xl space-y-2">
                          <div className="flex justify-between items-center text-[10px] text-rose-300 font-bold">
                            <span>Identidad: {person.genderIdentity}</span>
                            <span>Busca: {person.interestedIn}</span>
                          </div>
                          <p className="text-xs text-slate-200 italic">"{person.datingBio}"</p>
                        </div>
                      )}

                      <div>
                        <span className="text-[10px] text-slate-400 font-bold uppercase block">Géneros favoritos:</span>
                        <p className="text-xs text-amber-400">{person.genres}</p>
                      </div>

                      <div className="flex gap-2">
                        <button onClick={() => { setChatOpen(true); setActiveChatRoom(`Privado con ${person.name}`); }} className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase">
                          Iniciar Chat 💬
                        </button>
                        <button className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs">
                          Invitar al Cine 🎟️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PERFIL & CONFIGURACIÓN DE CITAS / PREFERENCIAS */}
            {activeTab === 'perfil' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className={`p-8 rounded-3xl border space-y-6 ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  
                  <div className="flex items-center gap-5 border-b border-slate-800 pb-6">
                    <img src={currentUser.photos[currentUser.avatarIndex] || currentUser.photos[0]} className="w-20 h-20 rounded-2xl object-cover border-2 border-amber-500" />
                    <div>
                      <h3 className="text-2xl font-black">{currentUser.name}</h3>
                      <p className="text-xs text-slate-400">{currentUser.email}</p>
                    </div>
                  </div>

                  {/* MODALIDAD DE USO */}
                  <div className="p-5 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                    <h4 className="font-black text-xs uppercase text-amber-500">🎯 Propósito en Plottwisme</h4>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'community', label: '🍿 Solo Cine' },
                        { id: 'friends', label: '🤝 Amigos' },
                        { id: 'dating', label: '❤️ Citas / Pareja' }
                      ].map(mode => (
                        <button 
                          key={mode.id} 
                          onClick={() => setCurrentUser({ ...currentUser, usageMode: mode.id })} 
                          className={`py-2 rounded-xl text-xs font-bold transition-all ${currentUser.usageMode === mode.id ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}
                        >
                          {mode.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* APARTADO CONFIGURABLE DE PAREJA (SE MUESTRA SOLO SI ACTIVA MODO CITAS) */}
                  {currentUser.usageMode === 'dating' && (
                    <div className="p-5 bg-rose-950/20 border border-rose-500/30 rounded-2xl space-y-4">
                      <div className="flex items-center justify-between">
                        <h4 className="font-black text-xs uppercase text-rose-400 flex items-center gap-2">
                          ❤️ Ficha de Citas (Visible únicamente en Match)
                        </h4>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Mi Identidad de Género:</label>
                          <select 
                            value={currentUser.genderIdentity}
                            onChange={(e) => setCurrentUser({ ...currentUser, genderIdentity: e.target.value })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-rose-500"
                          >
                            {opcionesGenero.map(g => <option key={g} value={g}>{g}</option>)}
                          </select>
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1">Me interesa conectar con:</label>
                          <select 
                            value={currentUser.interestedIn}
                            onChange={(e) => setCurrentUser({ ...currentUser, interestedIn: e.target.value })}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-rose-500"
                          >
                            {opcionesBusqueda.map(b => <option key={b} value={b}>{b}</option>)}
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-400 font-bold mb-1 text-xs">Descripción para citas (qué buscas en una pareja cinéfila):</label>
                        <textarea 
                          rows="3"
                          value={currentUser.datingBio}
                          onChange={(e) => setCurrentUser({ ...currentUser, datingBio: e.target.value })}
                          placeholder="Ej: Me gusta conversar sobre el significado de las películas después de la función..."
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-rose-500"
                        ></textarea>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
