<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila & Citas</title>
  
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plottwisme" />
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="icon-512x512.png">
  <link rel="apple-touch-icon" href="icon-512x512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHdoWQUZDNjxfvq7Rfl4Hvgpp8z-DoDMo",
      authDomain: "plottwisme-c3124.firebaseapp.com",
      projectId: "plottwisme-c3124",
      storageBucket: "plottwisme-c3124.firebasestorage.app",
      messagingSenderId: "571052328665",
      appId: "1:571052328665:web:f1374ddb467313181ca0c8",
      measurementId: "G-KYYQV3PN5F"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.FirebaseFns = {
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged,
      collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .map-dark-mode { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  </style>
</head>
<body class="antialiased selection:bg-amber-500 selection:text-slate-950 bg-slate-950 text-slate-100 min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen text-amber-500 font-bold text-sm">
      ⏳ Sintonizando Plottwisme...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const QUICK_EMOJIS = ['🍿', '🍷', '🎬', '⭐', '❤️', '🔥', '😂', '👏', '🎟️', '🍕', '😎', '🎉'];

    const COUNTRY_CODES = [
      { code: 'AR', name: 'Argentina 🇦🇷', defaultCity: 'Buenos Aires', lat: -34.6037, lon: -58.3816 },
      { code: 'US', name: 'Estados Unidos 🇺🇸', defaultCity: 'New York', lat: 40.7128, lon: -74.0060 },
      { code: 'ES', name: 'España 🇪🇸', defaultCity: 'Madrid', lat: 40.4168, lon: -3.7038 },
      { code: 'MX', name: 'México 🇲🇽', defaultCity: 'Ciudad de México', lat: 19.4326, lon: -99.1332 },
      { code: 'CO', name: 'Colombia 🇨🇴', defaultCity: 'Bogotá', lat: 4.7110, lon: -74.0721 }
    ];

    function CinemaMapComponent({ userCity }) {
      const encodedQuery = encodeURIComponent(`cines en ${userCity || 'Buenos Aires'}`);
      const mapSrc = `https://www.google.com/maps?q=${encodedQuery}&output=embed`;

      return (
        <div className="bg-slate-900 border border-slate-800 p-4 rounded-3xl shadow-xl space-y-3">
          <div className="flex items-center justify-between">
            <h3 className="font-black text-slate-100 text-sm flex items-center gap-2">
              <span>🗺️ Google Maps - Cines en <span className="text-amber-500 capitalize">{userCity || 'Buenos Aires'}</span></span>
            </h3>
            <span className="text-[10px] bg-amber-500/20 text-amber-500 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">
              ✔ Oficial
            </span>
          </div>
          <div className="w-full h-64 rounded-2xl overflow-hidden border border-slate-800">
            <iframe title="Google Maps Cines" src={mapSrc} className="w-full h-full border-0 map-dark-mode" loading="lazy"></iframe>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [activeTab, setActiveTab] = useState('cinema');
      const [userCity, setUserCity] = useState('Buenos Aires');

      useEffect(() => {
        const checkAuthInterval = setInterval(() => {
          if (window.auth && window.FirebaseFns) {
            clearInterval(checkAuthInterval);
            window.FirebaseFns.onAuthStateChanged(window.auth, (currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
          }
        }, 200);

        const timer = setTimeout(() => {
          setLoading(false);
        }, 3000);

        return () => {
          clearInterval(checkAuthInterval);
          clearTimeout(timer);
        };
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        try {
          if (isRegistering) {
            await window.FirebaseFns.createUserWithEmailAndPassword(window.auth, email, password);
          } else {
            await window.FirebaseFns.signInWithEmailAndPassword(window.auth, email, password);
          }
        } catch (err) {
          setErrorMsg("Error: " + err.message);
        }
      };

      const handleLogout = async () => {
        try {
          await window.FirebaseFns.signOut(window.auth);
        } catch (err) {
          console.error(err);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 text-amber-500 font-bold text-sm">
            ⏳ Cargando Plottwisme Cloud...
          </div>
        );
      }

      const isAdmin = user && user.email === 'marbuttice@gmail.com';

      // Si no ha iniciado sesión, mostramos la pantalla de acceso limpia
      if (!user) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
            <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <h1 className="text-3xl font-black font-brand text-amber-500">Plottwisme</h1>
                <p className="text-slate-400 text-sm">Red Social Cinéfila & Citas</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                {errorMsg && (
                  <div className="bg-rose-500/20 border border-rose-500/50 p-3 rounded-2xl text-xs text-rose-300">
                    {errorMsg}
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Correo electrónico</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm"
                    placeholder="tucorreo@email.com"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Contraseña</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm"
                    placeholder="••••••••"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm"
                >
                  {isRegistering ? "✨ Registrarse" : "🔑 Iniciar Sesión"}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => setIsRegistering(!isRegistering)}
                    className="text-xs text-slate-400 hover:text-amber-400 underline transition"
                  >
                    {isRegistering ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí"}
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col pb-20">
          {/* Header de navegación */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
              {isAdmin && (
                <span className="bg-amber-500/20 text-amber-400 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-amber-500/30">
                  🛡️ Admin
                </span>
              )}
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-400 hidden sm:inline">{user.email}</span>
              <button
                onClick={handleLogout}
                className="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-rose-500/30 transition"
              >
                Salir
              </button>
            </div>
          </header>

          {/* Menú inferior o pestañas principales */}
          <nav className="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar">
            <button
              onClick={() => setActiveTab('cinema')}
              className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
            >
              🎬 Cartelera IA
            </button>
            <button
              onClick={() => setActiveTab('radar')}
              className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
            >
              🎯 Radar Citas
            </button>
            <button
              onClick={() => setActiveTab('forums')}
              className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${activeTab === 'forums' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
            >
              💬 Foros Cine
            </button>
            {isAdmin && (
              <button
                onClick={() => setActiveTab('admin')}
                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${activeTab === 'admin' ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20' : 'bg-slate-800 text-amber-400 hover:bg-slate-700'}`}
              >
                🛡️ Panel Admin Pro
              </button>
            )}
          </nav>

          {/* Contenido dinámico según la pestaña activa */}
          <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
            {activeTab === 'cinema' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <h2 className="text-lg font-black text-slate-100">Cartelera Inteligente en Tiempo Real</h2>
                      <p className="text-xs text-slate-400">Consulta los cines, horarios y estrenos según tu ubicación.</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <input
                        type="text"
                        value={userCity}
                        onChange={(e) => setUserCity(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"
                        placeholder="Tu ciudad..."
                      />
                    </div>
                  </div>
                </div>

                <CinemaMapComponent userCity={userCity} />
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-4">
                <h2 className="text-lg font-black text-amber-500">🎯 Radar de Citas Cinéfilas</h2>
                <p className="text-sm text-slate-300">Conecta con otros amantes del cine que comparten tus mismos gustos en la gran pantalla.</p>
                <div className="p-8 bg-slate-950 border border-slate-800 rounded-2xl text-slate-400 text-sm">
                  Buscando cinéfilos cercanos en <span className="text-amber-400 font-bold capitalize">{userCity}</span>... ¡Pronto aparecerán perfiles compatibles!
                </div>
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                <h2 className="text-lg font-black text-amber-500">💬 Foros y Debates de Películas</h2>
                <p className="text-xs text-slate-400">Comparte reseñas, teorías y comentarios sobre tus últimas funciones.</p>
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-2xl space-y-2">
                  <p className="text-xs font-bold text-slate-300">🍿 Comunidad Plottwisme</p>
                  <p className="text-xs text-slate-400">El foro está activo. ¡Crea el primer debate del día!</p>
                </div>
              </div>
            )}

            {activeTab === 'admin' && isAdmin && (
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4">
                <h2 className="text-lg font-black text-amber-500">🛡️ Panel de Control del Administrador</h2>
                <p className="text-xs text-slate-400">Herramientas globales de gestión y supervisión de la plataforma.</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-1">
                    <p className="text-xs font-bold text-amber-400">📊 Estado de Base de Datos</p>
                    <p className="text-[11px] text-slate-400">Firebase Firestore y Auth conectados correctamente.</p>
                  </div>
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-1">
                    <p className="text-xs font-bold text-emerald-400">⚡ Vercel & IONOS</p>
                    <p className="text-[11px] text-slate-400">Despliegue operativo en producción.</p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
