<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plottwisme - Red Social Cinéfila, Cartelera & Comunidad</title>
  
  <!-- CDN Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Carlos Ruiz',
        age: 26,
        location: 'Madrid Centro',
        distanceKm: 2.4,
        role: 'critic',
        roleLabel: 'Crítico Certificado',
        verified: true,
        bio: 'Devoto del cine de autor y la ciencia ficción dura. Siempre listo para debatir sobre Villeneuve y Nolan con un buen café antes de la función.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        topMovies: ['Dune: Parte 2', 'Blade Runner 2049', 'Oppenheimer'],
        favoriteGenres: ['Sci-Fi', 'Thriller', 'Drama'],
        affinity: 97
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        age: 24,
        location: 'Salamanca / Retiro',
        distanceKm: 3.8,
        role: 'director',
        roleLabel: 'Cineasta Indie',
        verified: true,
        bio: 'Directora de cortos amateur. Me apasionan el montaje expresivo, las bandas sonoras y el cine coreano.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        topMovies: ['Parasite', 'Perfect Blue', 'Drive My Car'],
        favoriteGenres: ['Psicológico', 'Misterio', 'Anime'],
        affinity: 93
      }
    ];

    const INITIAL_BILLBOARD = [
      {
        id: 'm1',
        title: 'Dune: Parte Dos',
        director: 'Denis Villeneuve',
        genre: 'Ciencia Ficción',
        duration: '166 min',
        rating: '9.4',
        poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80',
        theater: 'Cine Capitol • Sala IMAX',
        showtimes: ['17:30', '20:15', '22:45'],
        synopsis: 'Paul Atreides se une a Chani y a los Fremen mientras busca venganza contra los conspiradores.'
      },
      {
        id: 'm2',
        title: 'The Substance',
        director: 'Coralie Fargeat',
        genre: 'Body Horror',
        duration: '141 min',
        rating: '8.9',
        poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80',
        theater: 'Cines Callao',
        showtimes: ['18:00', '20:30'],
        synopsis: 'Una celebridad en declive decide usar una droga que replica una versión más joven de sí misma.'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('radar');
      const [candidates, setCandidates] = useState(INITIAL_USERS);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [matches, setMatches] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [authForm, setAuthForm] = useState({ email: '', password: '', name: '', role: 'Cinéfilo Entusiasta' });

      const currentCandidate = candidates[currentIndex];

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const user = {
          name: authForm.name || authForm.email.split('@')[0],
          email: authForm.email,
          role: authForm.role || 'Cinéfilo Entusiasta'
        };
        setCurrentUser(user);
        setShowAuthModal(false);
      };

      return (
        <div class="flex flex-col min-h-screen bg-slate-950 text-slate-100">

          {/* BARRA SUPERIOR */}
          <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              <div class="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('radar')}>
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-slate-950 font-black font-brand text-lg">
                  P
                </div>
                <h1 class="text-xl font-black font-brand tracking-tight bg-gradient-to-r from-amber-400 to-rose-400 bg-clip-text text-transparent">
                  Plottwisme
                </h1>
              </div>

              {/* NAVEGACIÓN */}
              <nav class="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
                {[
                  { id: 'radar', label: 'Radar', icon: '🎯' },
                  { id: 'cinema', label: 'Cartelera', icon: '🎬' },
                  { id: 'profile', label: 'Mi Perfil', icon: '👤' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    class={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      activeTab === tab.id ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    {tab.icon} {tab.label}
                  </button>
                ))}
              </nav>

              {/* BOTÓN SESIÓN / CREAR CUENTA */}
              <div>
                {currentUser ? (
                  <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span class="text-white">{currentUser.name}</span>
                    <button onClick={() => setCurrentUser(null)} class="text-slate-500 hover:text-rose-400 ml-1">🚪</button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase tracking-wider shadow-lg transition-all"
                  >
                    Crear Cuenta / Entrar
                  </button>
                )}
              </div>

            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">

            {/* TAB: RADAR */}
            {activeTab === 'radar' && (
              <div class="flex flex-col items-center">
                {currentCandidate ? (
                  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                    <div class="relative h-80 w-full">
                      <img src={currentCandidate.avatar} class="w-full h-full object-cover" />
                      <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent"></div>
                      <div class="absolute bottom-4 left-4">
                        <h2 class="text-xl font-black text-white">{currentCandidate.name}, {currentCandidate.age}</h2>
                        <p class="text-xs text-amber-400">📍 {currentCandidate.location}</p>
                      </div>
                    </div>
                    <div class="p-5 space-y-4">
                      <p class="text-xs text-slate-300 italic">"{currentCandidate.bio}"</p>
                      <div class="flex justify-center gap-4 pt-2">
                        <button onClick={() => setCurrentIndex(prev => prev + 1)} class="w-12 h-12 rounded-full bg-slate-800 text-rose-400 text-lg flex items-center justify-center">✖</button>
                        <button onClick={() => { setMatches([currentCandidate, ...matches]); setCurrentIndex(prev => prev + 1); }} class="w-14 h-14 rounded-full bg-amber-500 text-slate-950 text-xl font-bold flex items-center justify-center">🍿</button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div class="text-center py-12 bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6">
                    <p class="text-sm font-bold text-white mb-4">¡Has visto todos los perfiles!</p>
                    <button onClick={() => setCurrentIndex(0)} class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs uppercase">Reiniciar Radar</button>
                  </div>
                )}
              </div>
            )}

            {/* TAB: CARTELERA */}
            {activeTab === 'cinema' && (
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                {INITIAL_BILLBOARD.map(m => (
                  <div key={m.id} class="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex gap-4">
                    <img src={m.poster} class="w-24 h-36 object-cover rounded-xl" />
                    <div class="space-y-1 text-xs">
                      <h3 class="text-base font-bold text-white">{m.title}</h3>
                      <p class="text-amber-400">{m.genre} • {m.duration}</p>
                      <p class="text-slate-400">{m.theater}</p>
                      <div class="flex gap-1 pt-2">
                        {m.showtimes.map(t => (
                          <span key={t} class="bg-slate-800 px-2 py-1 rounded font-mono font-bold text-slate-200">{t}</span>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: MI PERFIL */}
            {activeTab === 'profile' && (
              <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md mx-auto space-y-4 text-xs">
                <h2 class="text-lg font-black text-white">Mi Perfil Cinéfilo</h2>
                <p class="text-slate-400">Si no has iniciado sesión, crea tu cuenta con el botón superior para personalizar tus datos.</p>
                <button onClick={() => setShowAuthModal(true)} class="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">
                  Registrarse / Iniciar Sesión
                </button>
              </div>
            )}

          </main>

          {/* MODAL CREAR CUENTA / LOGIN */}
          {showAuthModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 relative shadow-2xl">
                <button onClick={() => setShowAuthModal(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white font-bold">✖</button>
                
                <div class="text-center">
                  <h3 class="text-lg font-black text-white">
                    {authMode === 'login' ? 'Iniciar Sesión' : 'Crear Perfil Cinéfilo'}
                  </h3>
                </div>

                <form onSubmit={handleAuthSubmit} class="space-y-3 text-xs">
                  {authMode === 'register' && (
                    <div>
                      <label class="block text-slate-400 mb-1">Nombre Completo:</label>
                      <input
                        type="text"
                        placeholder="Ej. Sofia Valdés"
                        value={authForm.name}
                        onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })}
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-amber-500"
                        required
                      />
                    </div>
                  )}

                  <div>
                    <label class="block text-slate-400 mb-1">Correo Electrónico:</label>
                    <input
                      type="email"
                      placeholder="tu@email.com"
                      value={authForm.email}
                      onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-amber-500"
                      required
                    />
                  </div>

                  <div>
                    <label class="block text-slate-400 mb-1">Contraseña:</label>
                    <input
                      type="password"
                      placeholder="••••••••"
                      value={authForm.password}
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white focus:outline-none focus:border-amber-500"
                      required
                    />
                  </div>

                  <button type="submit" class="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase tracking-wider shadow-md">
                    {authMode === 'login' ? 'Entrar' : 'Crear Cuenta'}
                  </button>
                </form>

                <div class="text-center pt-2 border-t border-slate-800 text-xs">
                  {authMode === 'login' ? (
                    <p class="text-slate-400">
                      ¿No tienes cuenta?{' '}
                      <button onClick={() => setAuthMode('register')} class="text-amber-400 font-bold hover:underline">
                        Regístrate aquí
                      </button>
                    </p>
                  ) : (
                    <p class="text-slate-400">
                      ¿Ya tienes cuenta?{' '}
                      <button onClick={() => setAuthMode('login')} class="text-amber-400 font-bold hover:underline">
                        Inicia sesión
                      </button>
                    </p>
                  )}
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
