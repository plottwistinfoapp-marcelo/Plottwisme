<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function App() {
      const [activeTab, setActiveTab] = useState('cartelera');
      const [cityName, setCityName] = useState('Posadas');
      const [cartelera, setCartelera] = useState([]);

      // Estado de Autenticación / Modal
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      // Perfil de usuario principal (isAdmin en false por defecto para seguridad)
      const [currentUser, setCurrentUser] = useState({
        id: 'usr-001',
        name: 'Cinéfilo Invitado',
        email: 'invitado@plottwisme.com',
        orientation: 'Heterosexual',
        lookingFor: 'Compañeros de cine',
        usageMode: 'community',
        plan: 'regular',
        isAdmin: false, // Por defecto NO es admin
        privatePreferences: {
          hideLocation: false,
          hideSexualOrientation: false,
          hideAge: false
        },
        photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80']
      });

      const [newPhotoUrl, setNewPhotoUrl] = useState('');

      // Lista simulada de usuarios de la comunidad para administración
      const [communityUsers, setCommunityUsers] = useState([
        { id: 'usr-101', name: 'Laura Gómez', email: 'laura@cinema.com', plan: 'regular' },
        { id: 'usr-102', name: 'Marcos Ruiz', email: 'mruiz@movies.org', plan: 'premium' },
        { id: 'usr-103', name: 'Sofía Martinez', email: 'sofi@film.com', plan: 'regular' },
        { id: 'usr-104', name: 'Diego Torres', email: 'dtorres@gmail.com', plan: 'regular' }
      ]);

      const [adminSearch, setAdminSearch] = useState('');
      const [forumCategory, setForumCategory] = useState('peliculas');

      // Límites de fotos según el plan
      const maxPhotos = currentUser.plan === 'premium' ? 10 : 3;

      useEffect(() => {
        const fetchMovies = async () => {
          try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1&region=AR`);
            const data = await res.json();
            if (data.results) {
              setCartelera(data.results.slice(0, 8).map(m => ({
                id: m.id,
                title: m.title,
                rating: m.vote_average ? m.vote_average.toFixed(1) : 'N/A',
                overview: m.overview ? m.overview.substring(0, 90) + '...' : 'Sin descripción.',
                poster: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : null
              })));
            }
          } catch (e) { console.error(e); }
        };
        fetchMovies();
      }, []);

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        
        // Asignación estricta de Admin según email registrado
        const isUserAdmin = authForm.email.toLowerCase() === 'admin@plottwisme.com';

        setCurrentUser({ 
          ...currentUser,
          name: authForm.name || authForm.email.split('@')[0], 
          email: authForm.email,
          isAdmin: isUserAdmin
        });
        
        setShowAuthModal(false);
        setActiveTab('perfil');
      };

      // Cargar archivo local de foto respetando límites del plan
      const handleFileUpload = (e) => {
        if (currentUser.photos.length >= maxPhotos) {
          alert(`Tu plan ${currentUser.plan === 'premium' ? 'Premium' : 'Básico'} permite un máximo de ${maxPhotos} fotos.`);
          return;
        }

        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setCurrentUser(prev => ({
              ...prev,
              photos: [...prev.photos, reader.result]
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      // Añadir foto por URL respetando límites del plan
      const handleAddPhotoUrl = () => {
        if (currentUser.photos.length >= maxPhotos) {
          alert(`Tu plan ${currentUser.plan === 'premium' ? 'Premium' : 'Básico'} permite un máximo de ${maxPhotos} fotos.`);
          return;
        }

        if (newPhotoUrl.trim() !== '') {
          setCurrentUser(prev => ({
            ...prev,
            photos: [...prev.photos, newPhotoUrl.trim()]
          }));
          setNewPhotoUrl('');
        }
      };

      const handleRemovePhoto = (index) => {
        if (currentUser.photos.length <= 1) {
          alert("Debes conservar al menos una foto de perfil.");
          return;
        }
        setCurrentUser(prev => ({
          ...prev,
          photos: prev.photos.filter((_, i) => i !== index)
        }));
      };

      const toggleUserPremium = (userId) => {
        setCommunityUsers(communityUsers.map(user => {
          if (user.id === userId) {
            return { ...user, plan: user.plan === 'premium' ? 'regular' : 'premium' };
          }
          return user;
        }));
      };

      return (
        <div className="min-h-screen bg-slate-950 p-4 md:p-8">
          
          {/* BARRA DE NAVEGACIÓN */}
          <header className="max-w-6xl mx-auto flex flex-wrap justify-between items-center mb-8 border-b border-slate-800 pb-4 gap-4">
            <h1 className="font-black text-2xl text-amber-500 tracking-wider cursor-pointer" onClick={() => setActiveTab('cartelera')}>
              PLOTTWISME 🌐
            </h1>
            
            <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
              {[
                { id: 'cartelera', label: '🍿 Cartelera' },
                { id: 'radar', label: '🎯 Radar' },
                { id: 'criticos', label: '✍️ Críticos' },
                { id: 'foros', label: '💬 Foros' },
                { id: 'match', label: '🔥 Match' },
                { id: 'perfil', label: '👤 Perfil' }
              ].map(tab => (
                <button 
                  key={tab.id} 
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black' : 'hover:bg-slate-800 text-slate-300'}`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>

            <button 
              onClick={() => setShowAuthModal(true)} 
              className="flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow"
            >
              <img src={currentUser.photos[0]} className="w-5 h-5 rounded-full object-cover border border-slate-950" alt="avatar" />
              <span>{currentUser.email === 'invitado@plottwisme.com' ? 'Crear Perfil / Login' : currentUser.name}</span>
            </button>
          </header>

          <main className="max-w-6xl mx-auto">

            {/* SECCIÓN CARTELERA */}
            {activeTab === 'cartelera' && (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <div>
                    <h2 className="text-2xl font-black text-amber-500">Cartelera en Cines</h2>
                    <p className="text-xs text-slate-400">Cartelera adaptada a tu zona de influencia.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400 font-bold">Zona:</span>
                    <input 
                      type="text" value={cityName} onChange={(e) => setCityName(e.target.value)} 
                      className="bg-slate-900 border border-slate-800 rounded-xl px-3 py-1 text-xs text-amber-400 font-bold outline-none focus:border-amber-500" 
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                  {cartelera.map(film => (
                    <div key={film.id} className="p-4 bg-slate-900 border border-slate-800 rounded-3xl flex flex-col gap-3 hover:border-slate-700 transition-all">
                      <img src={film.poster} className="w-full h-72 object-cover rounded-2xl" alt={film.title} />
                      
                      <div className="flex flex-col gap-2 flex-grow justify-between">
                        <div>
                          <h3 className="font-bold text-sm text-white leading-tight">{film.title}</h3>
                          <span className="text-[10px] text-amber-400 font-bold">⭐ {film.rating}</span>
                        </div>
                        
                        <a 
                          href={`https://www.google.com/search?q=cartelera+horarios+pelicula+${encodeURIComponent(film.title)}+en+${encodeURIComponent(cityName)}`} 
                          target="_blank" 
                          rel="noreferrer" 
                          className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs text-center uppercase transition-all shadow"
                        >
                          Ver Salas y Horarios 🎟️
                        </a>
                        
                        <button onClick={() => setActiveTab('match')} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs uppercase border border-slate-700">
                          Buscar Compañero 🤝
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SECCIÓN CRÍTICOS */}
            {activeTab === 'criticos' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">✍️ Críticas Especializadas</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-2">
                    <span className="text-xs text-amber-400 font-bold">⭐ 4.9/5 - Reseña Destacada</span>
                    <h3 className="font-bold text-white">Análisis de los estrenos de la semana</h3>
                    <p className="text-xs text-slate-400">Las producciones cinematográficas de este mes destacan por su innovación visual y narrativas complejas.</p>
                  </div>
                  <div className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-2">
                    <span className="text-xs text-amber-400 font-bold">⭐ 4.5/5 - Crítica de Autor</span>
                    <h3 className="font-bold text-white">El resurgir del cine independiente</h3>
                    <p className="text-xs text-slate-400">Un repaso por las obras maestras presentadas en los últimos festivales internacionales.</p>
                  </div>
                </div>
              </div>
            )}

            {/* SECCIÓN FOROS */}
            {activeTab === 'foros' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">💬 Foros de Debate</h2>
                <div className="flex gap-2 border-b border-slate-800 pb-3">
                  {[
                    { id: 'peliculas', label: '🎬 Películas' },
                    { id: 'series', label: '📺 Series' },
                    { id: 'plataformas', label: '🍿 Plataformas' }
                  ].map(cat => (
                    <button 
                      key={cat.id} 
                      onClick={() => setForumCategory(cat.id)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold ${forumCategory === cat.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'}`}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>

                <div className="space-y-3">
                  <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-sm text-white">¿Cuál es el mejor Plot Twist de la historia del cine?</h4>
                      <p className="text-xs text-slate-400">Iniciado por @Cinephile99 • 42 comentarios</p>
                    </div>
                    <button className="bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700">Unirse</button>
                  </div>
                  <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-sm text-white">Debate: ¿Netflix, Max o Disney+? ¿Cuál conviene este mes?</h4>
                      <p className="text-xs text-slate-400">Iniciado por @StreamMaster • 18 comentarios</p>
                    </div>
                    <button className="bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700">Unirse</button>
                  </div>
                </div>
              </div>
            )}

            {/* SECCIÓN MATCH */}
            {activeTab === 'match' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <h2 className="text-2xl font-black text-amber-500">🔥 Match Cinéfilo & Privacidad</h2>
                
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-3xl space-y-4">
                  <h3 className="font-bold text-sm text-amber-400 uppercase tracking-wider">Configuración de Perfil Match</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Orientación Sexual / Sexualidad:</label>
                      <select 
                        value={currentUser.orientation} 
                        onChange={(e) => setCurrentUser({ ...currentUser, orientation: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                      >
                        <option value="Heterosexual">Heterosexual</option>
                        <option value="Homosexual">Homosexual</option>
                        <option value="Bisexual">Bisexual</option>
                        <option value="Pansexual">Pansexual</option>
                        <option value="Asexual">Asexual</option>
                        <option value="Otro">Otro / Prefiero no decir</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">¿Qué estás buscando?:</label>
                      <select 
                        value={currentUser.lookingFor} 
                        onChange={(e) => setCurrentUser({ ...currentUser, lookingFor: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white"
                      >
                        <option value="Compañeros de cine">Solo ir al cine 🍿</option>
                        <option value="Amistad cinéfila">Amistad y debates 🤝</option>
                        <option value="Citas">Citas / Pareja ❤️</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-800 space-y-2">
                    <h4 className="font-bold text-xs text-slate-300">Opciones Privadas:</h4>
                    <label className="flex items-center gap-2 text-xs text-slate-400">
                      <input 
                        type="checkbox" 
                        checked={currentUser.privatePreferences.hideSexualOrientation} 
                        onChange={(e) => setCurrentUser({
                          ...currentUser, 
                          privatePreferences: { ...currentUser.privatePreferences, hideSexualOrientation: e.target.checked }
                        })}
                        className="rounded accent-amber-500"
                      />
                      Ocultar mi orientación sexual en el perfil público
                    </label>
                    <label className="flex items-center gap-2 text-xs text-slate-400">
                      <input 
                        type="checkbox" 
                        checked={currentUser.privatePreferences.hideLocation} 
                        onChange={(e) => setCurrentUser({
                          ...currentUser, 
                          privatePreferences: { ...currentUser.privatePreferences, hideLocation: e.target.checked }
                        })}
                        className="rounded accent-amber-500"
                      />
                      Ocultar mi ubicación exacta
                    </label>
                  </div>
                </div>
              </div>
            )}

            {/* SECCIÓN PERFIL, FOTOS Y SUSCRIPCIÓN */}
            {activeTab === 'perfil' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-black text-amber-500">👤 Mi Cuenta y Suscripción</h2>
                  <button 
                    onClick={() => setShowAuthModal(true)} 
                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs"
                  >
                    ✏️ Editar Perfil
                  </button>
                </div>

                {/* DETALLES DEL USUARIO Y GESTIÓN DE FOTOS */}
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-3xl space-y-6">
                  <div className="flex items-center gap-4">
                    <img src={currentUser.photos[0]} className="w-16 h-16 rounded-2xl object-cover border-2 border-amber-500" alt="Principal" />
                    <div>
                      <h3 className="font-bold text-lg text-white">{currentUser.name}</h3>
                      <p className="text-xs text-slate-400">{currentUser.email}</p>
                      {currentUser.isAdmin && (
                        <span className="inline-block mt-1 bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[9px] font-black px-2 py-0.5 rounded-full uppercase">
                          👑 Administrador
                        </span>
                      )}
                    </div>
                  </div>

                  {/* SECCIÓN CARGAR Y ADMINISTRAR FOTOS */}
                  <div className="pt-4 border-t border-slate-800 space-y-3">
                    <div className="flex justify-between items-center">
                      <h4 className="font-bold text-xs uppercase text-amber-500 tracking-wider">📷 Mis Fotografías de Perfil</h4>
                      <span className="text-[11px] font-bold text-slate-400">
                        {currentUser.photos.length} de {maxPhotos} fotos permitidas
                      </span>
                    </div>
                    
                    {/* GRILLA DE FOTOS DEL USUARIO */}
                    <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                      {currentUser.photos.map((photo, idx) => (
                        <div key={idx} className="relative group rounded-2xl overflow-hidden border border-slate-800 aspect-square">
                          <img src={photo} className="w-full h-full object-cover" alt={`foto-${idx}`} />
                          {idx === 0 && (
                            <span className="absolute top-1 left-1 bg-amber-500 text-slate-950 text-[9px] font-black px-1.5 py-0.5 rounded">
                              Principal
                            </span>
                          )}
                          <button 
                            onClick={() => handleRemovePhoto(idx)}
                            className="absolute top-1 right-1 bg-red-600 hover:bg-red-500 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                            title="Eliminar foto"
                          >
                            ✕
                          </button>
                        </div>
                      ))}
                    </div>

                    {/* CONTROLES PARA SUBIR O AÑADIR NUEVA FOTO */}
                    {currentUser.photos.length < maxPhotos ? (
                      <div className="pt-2 flex flex-col sm:flex-row gap-2 text-xs">
                        <label className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 px-3 rounded-xl cursor-pointer text-center border border-slate-700">
                          📁 Cargar Imagen desde Dispositivo
                          <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                        </label>
                        
                        <div className="flex flex-1 gap-2">
                          <input 
                            type="text" 
                            placeholder="O pega URL de imagen..." 
                            value={newPhotoUrl}
                            onChange={(e) => setNewPhotoUrl(e.target.value)}
                            className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-white outline-none focus:border-amber-500"
                          />
                          <button 
                            onClick={handleAddPhotoUrl}
                            className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-2 rounded-xl"
                          >
                            Añadir
                          </button>
                        </div>
                      </div>
                    ) : (
                      <p className="text-xs text-amber-400 font-bold bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 text-center">
                        ⚠️ Has alcanzado el límite de {maxPhotos} fotos para tu {currentUser.plan === 'premium' ? 'Plan Premium' : 'Plan Básico'}.
                      </p>
                    )}
                  </div>

                  {/* SELECTOR DE PLANES */}
                  <div className="space-y-3 pt-4 border-t border-slate-800">
                    <h4 className="font-bold text-xs uppercase text-amber-500 tracking-wider">Elige tu Plan de Suscripción:</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      
                      {/* PLAN REGULAR */}
                      <div 
                        onClick={() => setCurrentUser({ ...currentUser, plan: 'regular' })}
                        className={`p-4 rounded-2xl border cursor-pointer transition-all ${currentUser.plan === 'regular' ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-950'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-slate-400 uppercase">Plan Básico</span>
                          <span className="text-[10px] font-bold bg-slate-800 text-amber-400 px-2 py-0.5 rounded">Hasta 50 km 📍</span>
                        </div>
                        <h5 className="font-black text-lg text-white mt-1">Gratis</h5>
                        <ul className="text-[11px] text-slate-400 mt-2 space-y-1">
                          <li>• Acceso a Cartelera y Búsqueda de Salas.</li>
                          <li>• Alcance de Match cercano (hasta 50 km).</li>
                          <li>• <strong>Hasta 3 fotos de perfil.</strong></li>
                        </ul>
                      </div>

                      {/* PLAN PREMIUM */}
                      <div 
                        onClick={() => setCurrentUser({ ...currentUser, plan: 'premium' })}
                        className={`p-4 rounded-2xl border cursor-pointer transition-all ${currentUser.plan === 'premium' ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-950'}`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-amber-500 uppercase">Plan Premium</span>
                          <span className="text-[10px] font-black bg-amber-500 text-slate-950 px-2 py-0.5 rounded">Hasta 500 km 🌍</span>
                        </div>
                        <h5 className="font-black text-lg text-white mt-1">$4.99 / mes</h5>
                        <ul className="text-[11px] text-slate-400 mt-2 space-y-1">
                          <li>• Rango expandido (hasta 500 km).</li>
                          <li>• <strong>Hasta 10 fotos de perfil.</strong></li>
                          <li>• Match Ilimitado y Filtros Avanzados.</li>
                        </ul>
                      </div>

                    </div>
                  </div>
                </div>

                {/* CONSOLA DE ADMINISTRADOR: VISIBLE ÚNICAMENTE SI ES ADMIN */}
                {currentUser.isAdmin && (
                  <div className="p-6 bg-slate-900 border border-amber-500/30 rounded-3xl space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="font-bold text-base text-amber-400">👑 Gestión de Suscripciones (Modo Admin)</h3>
                        <p className="text-xs text-slate-400">Otorga o revoca el Plan Premium directamente a usuarios de la plataforma.</p>
                      </div>
                    </div>

                    <input 
                      type="text"
                      placeholder="Buscar usuario por nombre o correo..."
                      value={adminSearch}
                      onChange={(e) => setAdminSearch(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-white outline-none focus:border-amber-500"
                    />

                    <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                      {communityUsers
                        .filter(u => u.name.toLowerCase().includes(adminSearch.toLowerCase()) || u.email.toLowerCase().includes(adminSearch.toLowerCase()))
                        .map(user => (
                          <div key={user.id} className="p-3 bg-slate-950 border border-slate-800 rounded-xl flex justify-between items-center">
                            <div>
                              <p className="text-xs font-bold text-white">{user.name}</p>
                              <p className="text-[10px] text-slate-400">{user.email}</p>
                            </div>

                            <div className="flex items-center gap-3">
                              <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${user.plan === 'premium' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'bg-slate-800 text-slate-400'}`}>
                                {user.plan === 'premium' ? 'PREMIUM (500 km / 10 fotos)' : 'BÁSICO (50 km / 3 fotos)'}
                              </span>
                              
                              <button 
                                onClick={() => toggleUserPremium(user.id)}
                                className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${user.plan === 'premium' ? 'bg-red-500/20 text-red-400 hover:bg-red-500/30' : 'bg-amber-500 hover:bg-amber-400 text-slate-950'}`}
                              >
                                {user.plan === 'premium' ? 'Quitar Premium' : 'Regalar Premium 🎁'}
                              </button>
                            </div>
                          </div>
                        ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* SECCIÓN RADAR */}
            {activeTab === 'radar' && (
              <div className="p-6 bg-slate-900 border border-slate-800 rounded-3xl">
                <h2 className="text-xl font-bold text-amber-500">🎯 Radar de Cines cerca de {cityName}</h2>
                <p className="text-xs text-slate-400 mt-2">
                  Alcance activo: <strong className="text-amber-400">{currentUser.plan === 'premium' ? '500 km (Premium)' : '50 km (Básico)'}</strong>
                </p>
              </div>
            )}

          </main>

          {/* MODAL CREAR / EDITAR PERFIL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 relative">
                <button 
                  onClick={() => setShowAuthModal(false)} 
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>
                <h3 className="text-lg font-black text-center text-white">Crear / Editar Perfil</h3>
                <p className="text-[11px] text-slate-400 text-center">Para probar la consola de administración, usa:<br/><strong className="text-amber-400">admin@plottwisme.com</strong></p>
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Nombre o Apodo:</label>
                    <input 
                      type="text" 
                      required 
                      value={authForm.name} 
                      onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} 
                      placeholder="Ej. Carlos Cinéfilo" 
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-500" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Correo Electrónico:</label>
                    <input 
                      type="email" 
                      required 
                      value={authForm.email} 
                      onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} 
                      placeholder="tu@email.com" 
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-500" 
                    />
                  </div>
                  <div>
                    <label className="block text-slate-400 mb-1 font-bold">Contraseña:</label>
                    <input 
                      type="password" 
                      required 
                      value={authForm.password} 
                      onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} 
                      placeholder="••••••••" 
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white outline-none focus:border-amber-500" 
                    />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl uppercase transition-all shadow mt-2">
                    Guardar Perfil
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
