      const [candidates, setCandidates] = useState(() => {

});
useEffect(() => {

  }, [candidates]);
      const [matches, setMatches] = useState([]);

      const [selectedThread, setSelectedThread] = useState(null);
      const [newThreadTitle, setNewThreadTitle] = useState('');
      const [newThreadContent, setNewThreadContent] = useState('');
      const [newThreadMovie, setNewThreadMovie] = useState('Dune: Parte Dos');
      const [newThreadSpoilers, setNewThreadSpoilers] = useState(false);
      const [replyText, setReplyText] = useState('');

      // Salas & Chat State
      const [chatRooms, setChatRooms] = useState(INITIAL_ROOMS);
      const [activeRoomId, setActiveRoomId] = useState(INITIAL_ROOMS[0].id);
      const [roomInput, setRoomInput] = useState('');

      // Perfil de Usuario Propio
      const [myProfile, setMyProfile] = useState({
        name: 'Alex Rivera',
        age: 25,
        location: 'Madrid, España',
        role: 'Cinéfilo Entusiasta',
        bio: 'Amante de las bandas sonoras orquestales, el cyberpunk y las películas que te hacen pensar durante días después de salir de la sala.',
        topMovies: ['Interstellar', 'Arrival', 'Whiplash'],
        favoriteGenres: ['Sci-Fi', 'Drama', 'Thriller', 'Misterio']
      });

      const currentCandidate = candidates[currentIndex];
      const activeRoom = useMemo(() => chatRooms.find(r => r.id === activeRoomId) || chatRooms[0], [chatRooms, activeRoomId]);

      // Handlers de Match
      const handleSwipe = (direction) => {
        if (!currentCandidate) return;
        if (direction === 'like') {
          if (likesAvailable <= 0) {
            alert('¡Has alcanzado tu límite de likes semanal! Invita a un amigo o desbloquea tu insignia de crítico.');
            return;
          }
          setLikesAvailable(prev => prev - 1);
          setMatches(prev => [currentCandidate, ...prev]);
          setShowMatchModal(currentCandidate);
        }
        setCurrentIndex(prev => prev + 1);
      };

      // Handler para publicar nuevo debate
      const handleCreateThread = (e) => {
        e.preventDefault();
        if (!newThreadTitle.trim() || !newThreadContent.trim()) return;
        const newThread = {
          id: 'f_' + Date.now(),
          author: myProfile.name,
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80',
          role: myProfile.role,
          tag: 'Comunidad',
          movieTitle: newThreadMovie,
          hasSpoilers: newThreadSpoilers,
          title: newThreadTitle,
          content: newThreadContent,
          likes: 1,
          replies: 0,
          createdAt: 'Justo ahora',
          comments: []
        };
        setForumThreads([newThread, ...forumThreads]);
        setNewThreadTitle('');
        setNewThreadContent('');
        setNewThreadSpoilers(false);
      };

      // Handler para responder a debate
      const handleAddReply = (threadId) => {
        if (!replyText.trim()) return;
        const newComment = {
          id: 'c_' + Date.now(),
          author: myProfile.name,
          text: replyText,
          time: 'Justo ahora'
        };
        setForumThreads(forumThreads.map(t => {
          if (t.id === threadId) {
            return {
              ...t,
              replies: t.replies + 1,
              comments: [...t.comments, newComment]
            };
          }
          return t;
        }));
        setReplyText('');
      };

        e.preventDefault();
        if (!roomInput.trim()) return;
        const msg = {
          id: Date.now(),
          sender: myProfile.name,
          role: myProfile.role,
          text: roomInput
        };

          if (r.id === activeRoomId) {
            return { ...r, messages: [...r.messages, msg] };
          }
          return r;
        }));
        setRoomInput('');

                          </button>
                        </div>
                      </div>

                    </div>
                  ) : (
                    <div class="text-center py-16 px-6 bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full shadow-xl">
                      <div class="text-5xl mb-4">🎟️</div>
                      <h3 class="text-xl font-bold text-white mb-2">¡Has visto todos los perfiles de tu radar!</h3>
                      <p class="text-xs text-slate-400 mb-6 leading-relaxed">Pronto se sumarán más cinéfilos en tu zona y cerca de tus salas de cine preferidas.</p>
                      <button
                        onClick={() => { setCandidates(INITIAL_USERS); setCurrentIndex(0); }}
                        class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md shadow-amber-500/20"
                      >
                        Reiniciar Radar
                      </button>
                    </div>
                  )}
                </div>

                {/* LISTA LATERAL DE MATCHES & CITAS */}
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                  <div class="flex items-center justify-between">
                    <h3 class="font-bold text-sm text-white flex items-center gap-2">
                      <span>✨ Mis Matches Cinéfilos</span>
                    </h3>
                    <span class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full font-bold">
                      {matches.length}
                    </span>
                  </div>

                  {matches.length === 0 ? (
                    <div class="text-center py-10 px-4 text-slate-500 text-xs leading-relaxed">
                      Aún no tienes matches activos. Haz clic en 🍿 cuando encuentres a alguien con afinidad cinéfila.
                    </div>
                  ) : (
                    <div class="space-y-3 max-h-[420px] overflow-y-auto pr-1">
                      {matches.map(m => (
                        <div key={m.id} class="flex items-center gap-3 bg-slate-950 p-3 rounded-2xl border border-slate-800 hover:border-amber-500/40 transition-all">
                          <img src={m.avatar} alt={m.name} class="w-12 h-12 rounded-xl object-cover" />
                          <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-bold text-white truncate">{m.name}</h4>
                            <p class="text-[10px] text-amber-400 truncate">Afinidad: {m.affinity}% • {m.topMovies[0]}</p>
                          </div>
                          <button
                            onClick={() => setActiveTab('rooms')}
                            class="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs px-2.5 py-1.5 rounded-xl text-slate-200 font-bold transition-all"
                          >
                            Chat
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB 2: CARTELERA Y HORARIOS DE CINE */}
            {activeTab === 'cinema' && (
              <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div>
                    <h2 class="text-2xl font-black text-white">🎬 Cartelera y Salas en tu Ciudad</h2>
                    <p class="text-xs text-slate-400">Funciones disponibles hoy con formatos especiales (IMAX Láser, V.O.S.E.)</p>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {INITIAL_BILLBOARD.map(movie => (
                    <div key={movie.id} class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col justify-between hover:border-slate-700 transition-all shadow-xl">
                      <div>
                        <div class="h-52 w-full overflow-hidden relative">
                          <img src={movie.poster} alt={movie.title} class="w-full h-full object-cover" />
                          <div class="absolute top-3 right-3 bg-slate-950/85 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-black text-amber-400 border border-amber-500/30">
                            ★ {movie.rating}
                          </div>
                        </div>

                        <div class="p-5 space-y-3">
                          <div>
                            <span class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">{movie.genre} • {movie.duration}</span>
                            <h3 class="text-lg font-black text-white">{movie.title}</h3>
                            <p class="text-xs text-slate-400">Dirección: {movie.director}</p>
                          </div>

                          <p class="text-xs text-slate-300 leading-relaxed line-clamp-2">{movie.synopsis}</p>

                          <div class="p-3 bg-slate-950 rounded-2xl border border-slate-800">
                            <div class="flex items-center justify-between text-[11px] text-slate-300 font-medium mb-2">
                              <span>📍 {movie.theater}</span>
                              <span class="text-amber-400">{movie.distance}</span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                              {movie.showtimes.map(time => (
                                <span key={time} class="bg-slate-800 border border-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-lg font-mono font-bold">
                                  {time}
                                </span>
                              ))}
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="p-5 pt-0">
                        <button
                          onClick={() => setActiveTab('rooms')}
                          class="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2"
                        >
                          <span>🍿 Proponer Cita Cinéfila</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: CATÁLOGO STREAMING */}
            {activeTab === 'streaming' && (
              <div class="space-y-6">
                <div>
                  <h2 class="text-2xl font-black text-white">📺 Recomendaciones de Streaming</h2>
                  <p class="text-xs text-slate-400">Series y cine de autor recomendados por críticos certificados</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {INITIAL_STREAMING.map(item => (
                    <div key={item.id} class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden flex flex-col justify-between hover:border-slate-700 transition-all shadow-xl">
                      <div>
                        <div class="h-44 w-full overflow-hidden relative">
                          <img src={item.cover} alt={item.title} class="w-full h-full object-cover" />
                          <div class="absolute top-3 left-3 bg-amber-500 text-slate-950 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase">
                            {item.tag}
                          </div>
                          <div class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-bold text-amber-300">
                            ★ {item.rating}
                          </div>
                        </div>

                        <div class="p-5 space-y-2">
                          <span class="text-[10px] font-mono text-indigo-400 font-bold uppercase">{item.platform} • {item.type}</span>
                          <h3 class="text-base font-bold text-white">{item.title}</h3>
                          <p class="text-xs text-slate-300 leading-relaxed">{item.synopsis}</p>
                        </div>
                      </div>

                      <div class="p-5 pt-0">
                        <button
                          onClick={() => {
                            setNewThreadMovie(item.title);
                            setActiveTab('forums');
                          }}
                          class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 rounded-xl text-xs transition-all"
                        >
                          💬 Iniciar Debate en Foros
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: FOROS Y CRÍTICA */}
            {activeTab === 'forums' && (
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                {/* LISTA DE DEBATES */}
                <div class="lg:col-span-2 space-y-4">
                  <div>
                    <h2 class="text-2xl font-black text-white">💬 Foros de Debate & Teorías</h2>
                    <p class="text-xs text-slate-400">Análisis sin censura, opiniones técnicas y debates con aviso de spoilers</p>
                  </div>

                  <div class="space-y-4">
                    {forumThreads.map(thread => (
                      <div key={thread.id} class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                          <div class="flex items-center gap-3">
                            <img src={thread.avatar} alt={thread.author} class="w-10 h-10 rounded-full object-cover" />
                            <div>
                              <div class="flex items-center gap-2">
                                <h4 class="text-xs font-bold text-white">{thread.author}</h4>
                                <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">{thread.role}</span>
                              </div>
                              <p class="text-[10px] text-amber-400 font-mono">Película: {thread.movieTitle} • {thread.createdAt}</p>
                            </div>
                          </div>
                          {thread.hasSpoilers && (
                            <span class="bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] px-2.5 py-0.5 rounded-full font-bold">
                              ⚠️ CONTIENE SPOILERS
                            </span>
                          )}
                        </div>

                        <h3 class="text-base font-bold text-white">{thread.title}</h3>
                        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">{thread.content}</p>

                        {/* RESPUESTAS AL DEBATE */}
                        {thread.comments && thread.comments.length > 0 && (
                          <div class="bg-slate-950 p-3.5 rounded-2xl space-y-2 border border-slate-800/80">
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Respuestas recientes:</p>
                            {thread.comments.map(c => (
                              <div key={c.id} class="text-xs text-slate-300 border-l-2 border-amber-500/60 pl-2.5 py-0.5">
                                <span class="font-bold text-white">{c.author}: </span>
                                {c.text}
                              </div>
                            ))}
                          </div>
                        )}

                        {/* INPUT PARA RESPONDER */}
                        <div class="flex gap-2 pt-2 border-t border-slate-800">
                          <input
                            type="text"
                            placeholder="Escribe tu opinión en este debate..."
                            value={selectedThread === thread.id ? replyText : ''}
                            onFocus={() => setSelectedThread(thread.id)}
                            onChange={(e) => setReplyText(e.target.value)}
                            class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                          />
                          <button
                            onClick={() => handleAddReply(thread.id)}
                            class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-2 rounded-xl text-xs transition-all"
                          >
                            Responder
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* FORMULARIO CREAR DEBATE */}
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 h-fit shadow-xl">
                  <h3 class="font-bold text-sm text-white">✍️ Iniciar Nuevo Debate</h3>
                  <form onSubmit={handleCreateThread} class="space-y-3.5 text-xs">
                    <div>
                      <label class="block text-slate-400 mb-1">Película / Título:</label>
                      <input
                        type="text"
                        value={newThreadMovie}
                        onChange={(e) => setNewThreadMovie(e.target.value)}
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"
                        required
                      />
                    </div>

                    <div>
                      <label class="block text-slate-400 mb-1">Título del Tema:</label>
                      <input
                        type="text"
                        placeholder="Ej. ¿Qué opinan del montaje sonoro?"
                        value={newThreadTitle}
                        onChange={(e) => setNewThreadTitle(e.target.value)}
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"
                        required
                      />
                    </div>

                    <div>
                      <label class="block text-slate-400 mb-1">Tu Análisis o Pregunta:</label>
                      <textarea
                        rows="4"
                        placeholder="Escribe tus argumentos y teoría..."
                        value={newThreadContent}
                        onChange={(e) => setNewThreadContent(e.target.value)}
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"
                        required
                      ></textarea>
                    </div>

                    <div class="flex items-center gap-2">
                      <input
                        type="checkbox"
                        id="spoilersCheck"
                        checked={newThreadSpoilers}
                        onChange={(e) => setNewThreadSpoilers(e.target.checked)}
                        class="rounded bg-slate-950 border-slate-800 text-amber-500 focus:ring-0"
                      />
                      <label htmlFor="spoilersCheck" class="text-slate-300 cursor-pointer">
                        Este tema contiene Spoilers
                      </label>
                    </div>

                    <button
                      type="submit"
                      class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl uppercase tracking-wider transition-all shadow-md shadow-amber-500/20"
                    >
                      Publicar en Foros
                    </button>
                  </form>
                </div>

              </div>
            )}

            {/* TAB 5: SALAS EN VIVO */}
            {activeTab === 'rooms' && (
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-[580px]">
                
                {/* LISTA DE SALAS */}
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 space-y-3 overflow-y-auto shadow-xl">
                  <h3 class="font-bold text-xs uppercase tracking-wider text-slate-400 mb-2">Salas de Debate Activas</h3>
                  {chatRooms.map(room => (
                    <div
                      key={room.id}
                      onClick={() => setActiveRoomId(room.id)}
                      class={`p-3.5 rounded-2xl cursor-pointer transition-all border ${
                        activeRoomId === room.id
                          ? 'bg-slate-950 border-amber-500 shadow-md'
                          : 'bg-slate-950/60 border-slate-800 hover:border-slate-700'
                      }`}
                    >
                      <div class="flex items-center justify-between mb-1">
                        <h4 class="text-xs font-bold text-white truncate">{room.name}</h4>
                        <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded font-bold">
                          {room.activeBadge}
                        </span>
                      </div>
                      <p class="text-[11px] text-slate-400 line-clamp-1">{room.topic}</p>
                      <span class="text-[10px] text-amber-400 mt-2 block font-mono">👥 {room.members} miembros</span>
                    </div>
                  ))}
                </div>

                {/* ÁREA DE MENSAJES Y CHAT */}
                <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl flex flex-col justify-between overflow-hidden shadow-xl">
                  
                  {/* HEADER */}
                  <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                    <div>
                      <h3 class="text-sm font-bold text-white">{activeRoom.name}</h3>
                      <p class="text-xs text-slate-400">{activeRoom.topic}</p>
                    </div>
                  </div>

                  {/* MENSAJES */}
                  <div class="p-4 flex-1 overflow-y-auto space-y-3">
                    {activeRoom.messages.map(msg => (
                      <div key={msg.id} class={`flex flex-col ${msg.sender === myProfile.name ? 'items-end' : 'items-start'}`}>
                        <div class="flex items-center gap-1.5 mb-0.5">
                          <span class="text-[10px] text-slate-400 font-bold">{msg.sender}</span>
                          <span class="text-[9px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded">{msg.role}</span>
                        </div>
                        <div class={`text-xs px-3.5 py-2 rounded-2xl max-w-[80%] ${
                          msg.sender === myProfile.name
                            ? 'bg-amber-500 text-slate-950 font-semibold'
                            : 'bg-slate-800 text-slate-200'
                        }`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* INPUT */}
                  <form onSubmit={handleSendMessage} class="p-3 bg-slate-950 border-t border-slate-800 flex items-center gap-2">
                    <input
                      type="text"
                      placeholder="Escribe tu mensaje en la sala..."
                      value={roomInput}
                      onChange={(e) => setRoomInput(e.target.value)}
                      class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                    />
                    <button
                      type="submit"
                      class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-all"
                    >
                      Enviar
                    </button>
                  </form>

                </div>

              </div>
            )}

            {/* TAB 6: PERFIL PROPIO */}
            {activeTab === 'profile' && (
              <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-2xl bg-amber-500 text-slate-950 font-black text-2xl flex items-center justify-center shadow-lg">
                    {myProfile.name.charAt(0)}
                  </div>
                  <div>
                    <h2 class="text-xl font-black text-white">{myProfile.name}, {myProfile.age}</h2>
                    <p class="text-xs text-amber-400">{myProfile.role} • 📍 {myProfile.location}</p>
                  </div>
                </div>

                <div class="space-y-4 text-xs">
                  <div>
                    <label class="block text-slate-400 mb-1 font-bold">Biografía Cinéfila:</label>
                    <textarea
                      rows="3"
                      value={myProfile.bio}
                      onChange={(e) => setMyProfile({ ...myProfile, bio: e.target.value })}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-amber-500"
                    ></textarea>
                  </div>

                  <div>
                    <label class="block text-slate-400 mb-1 font-bold">Top 3 Películas Favoritas (separadas por coma):</label>
                    <input
                      type="text"
                      value={myProfile.topMovies.join(', ')}
                      onChange={(e) => setMyProfile({ ...myProfile, topMovies: e.target.value.split(',').map(s => s.trim()) })}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label class="block text-slate-400 mb-1 font-bold">Géneros Preferidos (separados por coma):</label>
                    <input
                      type="text"
                      value={myProfile.favoriteGenres.join(', ')}
                      onChange={(e) => setMyProfile({ ...myProfile, favoriteGenres: e.target.value.split(',').map(s => s.trim()) })}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div class="pt-2">
                    <button
                      onClick={() => alert('¡Tu perfil cinéfilo ha sido actualizado!')}
                      class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl uppercase tracking-wider transition-all"
                    >
                      Guardar Cambios
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL MATCH CELEBRATION */}
          {showMatchModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-amber-500/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                <div class="text-4xl animate-bounce">🍿✨</div>
                <h3 class="text-xl font-black text-white">¡Match Cinéfilo Encontrado!</h3>
                <p class="text-xs text-slate-300 leading-relaxed">
                  Tú y <b>{showMatchModal.name}</b> comparten una afinidad del <b>{showMatchModal.affinity}%</b> y adoran películas similares.
                </p>
                <div class="flex gap-2 pt-2">
                  <button
                    onClick={() => {
                      setShowMatchModal(null);
                      setActiveTab('rooms');
                    }}
                    class="flex-1 bg-gradient-to-r from-amber-500 to-rose-500 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase transition-all shadow-lg"
                  >
                    Abrir Chat
                  </button>
                  <button
                    onClick={() => setShowMatchModal(null)}
                    class="bg-slate-800 text-slate-300 font-bold py-2.5 px-4 rounded-xl text-xs hover:bg-slate-700"
                  >
                    Seguir
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="border-t border-slate-900 bg-slate-950 py-4 px-6 text-center text-xs text-slate-500">
            Plottwisme • Plataforma Cinéfila Unificada • Todos los derechos reservados
          </footer>

        </div>
      );
    }

    // MONTAJE FINAL EN EL DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
