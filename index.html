<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila Mundial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'plottwist.infoapp@gmail.com';

    // Fórmula Haversine para cálculo de distancia global en km
    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function App() {
      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('radar');
      const [locationStatus, setLocationStatus] = useState('Detectar mi ubicación mundial');
      const [userCoords, setUserCoords] = useState(null);
      const [searchCity, setSearchCity] = useState('');
      const [lastSync, setLastSync] = useState(new Date().toLocaleTimeString());
      
      const [currentUser, setCurrentUser] = useState(null);
      const [userGenres, setUserGenres] = useState('Cine de Autor, Sci-Fi, Drama');
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('register');
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      // Cines detectados dinámicamente según la posición del usuario
      const [cinesGlobales, setCinesGlobales] = useState([]);
      const [cargandoCines, setCargandoCines] = useState(false);

      const [usersList, setUsersList] = useState([
        { id: 1, name: 'Carlos Ruiz', email: 'carlos@cine.com', isCritic: true, isPremium: true, genres: 'Sci-Fi, Thriller', distance: '12 km' },
        { id: 2, name: 'Laura Gómez', email: 'laura@cine.com', isCritic: false, isPremium: false, genres: 'Drama, Romance', distance: '45 km' }
      ]);

      const [criticsReviews, setCriticsReviews] = useState([
        { author: 'Carlos Ruiz', role: 'Crítico Certificado', text: 'Excelente experiencia de cine global.', rating: '★★★★☆' }
      ]);

      useEffect(() => {
        const interval = setInterval(() => {
          setLastSync(new Date().toLocaleTimeString());
        }, 30000);
        return () => clearInterval(interval);
      }, []);

      const toggleTheme = () => setTheme(theme === 'dark' ? 'light' : 'dark');

      // Geolocalización internacional por GPS
      const getGeoLocation = () => {
        setLocationStatus('Obteniendo GPS...');
        setCargandoCines(true);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setUserCoords({ lat, lng });
              const radio = currentUser?.isPremium ? 500 : 100;
              setLocationStatus(`Ubicación GPS activa (Radio: ${radio} km)`);
              buscarCinesMundiales(lat, lng);
            },
            () => {
              setLocationStatus('GPS no disponible. Ingresa una ciudad manualmente.');
              setCargandoCines(false);
            }
          );
        } else {
          setLocationStatus('Navegador sin soporte de geolocalización.');
          setCargandoCines(false);
        }
      };

      // Búsqueda remota de cines vía OpenStreetMap / Overpass API (Mundial y Gratuito)
      const buscarCinesMundiales = async (lat, lng) => {
        setCargandoCines(true);
        const radioMetros = (currentUser?.isPremium ? 500 : 100) * 1000;
        
        try {
          // Consulta Overpass API para cines en cualquier parte del planeta
          const query = `[out:json];node["amenity"="cinema"](around:${radioMetros},${lat},${lng});out 15;`;
          const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
          const data = await response.json();

          if (data.elements && data.elements.length > 0) {
            const resultados = data.elements.map(cine => {
              const dist = calcularDistanciaKm(lat, lng, cine.lat, cine.lon);
              return {
                id: cine.id,
                nombre: cine.tags.name || "Cine / Sala de Proyección",
                direccion: cine.tags["addr:street"] ? `${cine.tags["addr:street"]} ${cine.tags["addr:housenumber"] || ''}` : "Dirección disponible en Google Maps",
                lat: cine.lat,
                lng: cine.lon,
                distanciaKm: dist,
                cartelera: [
                  { titulo: "Consulte cartelera local / sitio oficial", horarios: "Varias funciones" }
                ]
              };
            }).sort((a, b) => a.distanciaKm - b.distanciaKm);

            setCinesGlobales(resultados);
          } else {
            setCinesGlobales([]);
          }
        } catch (error) {
          console.error("Error al buscar cines mundiales:", error);
        } finally {
          setCargandoCines(false);
        }
      };

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const isAdmin = authForm.email.toLowerCase() === ADMIN_EMAIL;
        const newUser = { 
          name: authForm.name || authForm.email.split('@')[0], 
          email: authForm.email, 
          genres: userGenres,
          isPremium: isAdmin,
          isCritic: isAdmin,
          isAdmin: isAdmin
        };
        setCurrentUser(newUser);
        setShowAuthModal(false);
      };

      const radioMaximoKm = currentUser?.isPremium ? 500 : 100;

      return (
        <div className={`min-h-screen transition-colors duration-300 ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          <header className={`border-b p-4 sticky top-0 z-40 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90 backdrop-blur'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider">PLOTTWISME 🌐</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'radar', label: '🎯 Radar y Cines Mundiales' },
                  { id: 'match', label: '🔥 Match Cinéfilo' },
                  { id: 'criticos', label: '✍️ Críticos' },
                  { id: 'perfil', label: '👤 Mi Perfil' },
                  ...(currentUser?.isAdmin ? [{ id: 'admin', label: '⚡ Panel Admin' }] : [])
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-800 hover:text-white'}`}>{tab.label}</button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={toggleTheme} className="p-2 bg-slate-800 text-white rounded-xl text-sm">🌓</button>
                {currentUser ? (
                  <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold">
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span className="text-white">{currentUser.name}</span>
                  </div>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase tracking-wider shadow">Iniciar Sesión</button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto p-6">
            
            {/* RADAR Y CINES MUNDIALES */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <div className={`p-6 rounded-3xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                  <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                    <div>
                      <h2 className="font-bold text-lg">🌍 Radar de Cines Global</h2>
                      <p className="text-xs text-slate-400">
                        {currentUser?.isPremium ? 'Modo Premium Internacional: Radio de 500 km' : 'Modo Estándar: Radio de 100 km'}
                      </p>
                    </div>
                    <button onClick={getGeoLocation} className="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl font-bold text-xs transition-all">
                      📍 {locationStatus}
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-black text-amber-500">🎬 Cines Detectados en Tiempo Real</h3>
                  <span className="text-[10px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                    🟢 Red Global Activa
                  </span>
                </div>

                {cargandoCines && (
                  <div className="p-8 text-center text-amber-400 bg-slate-900 rounded-2xl border border-slate-800 animate-pulse">
                    🔍 Buscando cines en la red global cerca de tu posición...
                  </div>
                )}

                {!cargandoCines && cinesGlobales.length === 0 && (
                  <div className="p-8 text-center text-slate-400 bg-slate-900 rounded-2xl border border-slate-800">
                    Haz clic en <strong>"📍 Detectar mi ubicación mundial"</strong> para escanear las salas de cine en tu zona dentro de un radio de {radioMaximoKm} km.
                  </div>
                )}

                <div className="space-y-4">
                  {cinesGlobales.map((cine) => (
                    <div key={cine.id} className={`p-5 rounded-2xl border ${theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-gray-200'}`}>
                      <div className="flex justify-between items-start mb-3 flex-wrap gap-2">
                        <div>
                          <h4 className="font-bold text-lg text-amber-500">{cine.nombre}</h4>
                          <p className="text-xs text-slate-400">{cine.direccion}</p>
                        </div>
                        <span className="bg-slate-800 text-amber-400 text-xs px-3 py-1 rounded-full font-mono font-bold border border-slate-700">
                          📍 {cine.distanciaKm.toFixed(1)} km
                        </span>
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center flex-wrap gap-2">
                        <span className="text-xs text-slate-400">Coordenadas: {cine.lat.toFixed(4)}, {cine.lng.toFixed(4)}</span>
                        <a 
                          href={`https://www.google.com/maps/search/?api=1&query=${cine.lat},${cine.lng}`}
                          target="_blank" 
                          rel="noreferrer"
                          className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 transition-all shadow"
                        >
                          🗺️ Abrir Ruta en Google Maps
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* DEMÁS SECCIONES DE LA APP... */}
            {activeTab === 'perfil' && (
              <div className="p-8 rounded-3xl border bg-slate-900 border-slate-800 max-w-xl mx-auto">
                <h3 className="text-lg font-bold mb-2">Perfil de Usuario Global</h3>
                <p className="text-xs text-slate-400 mb-4">Configuración de cobertura y rango de geolocalización.</p>
                <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                  <p><strong>Plan Actual:</strong> {currentUser?.isPremium ? '👑 Premium (500 km global)' : '🆓 Estándar (100 km)'}</p>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
