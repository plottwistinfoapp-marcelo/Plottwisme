<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila Mundial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const ADMIN_EMAIL = 'plottwist.infoapp@gmail.com';
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function App() {
      const [theme, setTheme] = useState('dark');
      const [activeTab, setActiveTab] = useState('cartelera'); 
      const [locationStatus, setLocationStatus] = useState('Detectar mi ubicación');
      const [userCoords, setUserCoords] = useState(null);
      const [countryCode, setCountryCode] = useState('AR'); 
      const [cityName, setCityName] = useState('');
      const [searchCityInput, setSearchCityInput] = useState('');

      // Opciones inclusivas de Identidad y Preferencias
      const opcionesGenero = ['Hombre', 'Mujer', 'No Binarie', 'Género Fluido', 'Transgénero', 'Otro'];
      const opcionesBusqueda = ['Hombres', 'Mujeres', 'Personas No Binarias', 'Todos / Sin preferencia'];

      // Usuario Activo
      const [currentUser, setCurrentUser] = useState({
        name: 'Marcelo Catan',
        email: 'invitado@plottwisme.com',
        genres: 'Cine de Autor, Sci-Fi, Thriller, Clásicos',
        lookingFor: 'Compañeros para ir al cine y debates',
        usageMode: 'dating', // 'community', 'friends', 'dating'
        
        // Apartado Privado / Citas
        genderIdentity: 'Hombre',
        interestedIn: 'Mujeres',
        datingBio: 'Busco compartir funciones nocturnas y analizar los giros del guion después de la película.',
        
        isPremium: false,
        isVerifiedCritic: false,
        isAdmin: false,
        photos: ['https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'],
        avatarIndex: 0
      });

      // Base de usuarios para gestión del Admin
      const [usersList, setUsersList] = useState([
        { id: 1, name: 'Valeria R.', email: 'valeria@cinema.com', isPremium: false, isVerifiedCritic: false },
        { id: 2, name: 'Martín G.', email: 'martin@cinefilos.com', isPremium: true, isVerifiedCritic: false },
        { id: 3, name: 'Lucía M.', email: 'lucia.critica@film.com', isPremium: true, isVerifiedCritic: true }
      ]);

      // Estado de Registro / Iniciar Sesión por Email
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isRegisterMode, setIsRegisterMode] = useState(false);
      const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });

      // Estado Módulo de Críticas
      const [reviews, setReviews] = useState([
        { id: 1, author: 'Lucía M.', isCritic: true, movie: 'Dune: Parte 2', rating: '5/5', text: 'Una obra maestra del cine de ciencia ficción moderno. Dirección de arte y sonido impecables.' },
        { id: 2, author: 'Carlos R.', isCritic: false, movie: 'Oppenheimer', rating: '4.5/5', text: 'Ritmo vertiginoso para ser un drama biográfico. La escena del ensayo Trinity es inolvidable.' }
      ]);
      const [newReview, setNewReview] = useState({ movie: '', rating: '5/5', text: '' });

      // Cartelera y Cines
      const [cartelera, setCartelera] = useState([]);
      const [cargandoCartelera, setCargandoCartelera] = useState(false);
      const [cinesGlobales, setCinesGlobales] = useState([]);
      const [cargandoCines, setCargandoCines] = useState(false);

      // Chat en Vivo
      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { id: 1, user: 'Sofía', text: '¿Alguien para ver la nueva función del fin de semana?', time: '18:30' }
      ]);
      const [newMessage, setNewMessage] = useState('');

      // Autenticación por Correo (Login / Registro)
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        const isAdmin = authForm.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
        
        const updatedUser = {
          ...currentUser,
          name: authForm.name || authForm.email.split('@')[0],
          email: authForm.email,
          isAdmin: isAdmin,
          isPremium: isAdmin ? true : currentUser.isPremium,
          isVerifiedCritic: isAdmin ? true : currentUser.isVerifiedCritic
        };

        setCurrentUser(updatedUser);
        setShowAuthModal(false);
        setAuthForm({ name: '', email: '', password: '' });

        if (isAdmin) {
          alert('🔑 Sesión iniciada como ADMINISTRADOR MASTER (plottwist.infoapp@gmail.com). Tienes control total de usuarios y permisos.');
        } else {
          alert(`¡Bienvenido a Plottwisme, ${updatedUser.name}!`);
        }
      };

      // Funciones Admin: Otorgar Crítico / Premium
      const toggleVerifiedCritic = (userId) => {
        setUsersList(usersList.map(u => {
          if (u.id === userId) {
            const nextStatus = !u.isVerifiedCritic;
            return { 
              ...u, 
              isVerifiedCritic: nextStatus,
              isPremium: nextStatus ? true : u.isPremium // Si es crítico verificado, obtiene Premium de por vida
            };
          }
          return u;
        }));
      };

      const togglePremiumStatus = (userId) => {
        setUsersList(usersList.map(u => {
          if (u.id === userId) {
            return { ...u, isPremium: !u.isPremium };
          }
          return u;
        }));
      };

      // Cargar Cartelera desde TMDB
      const cargarCarteleraEnCines = async (region = 'AR') => {
        setCargandoCartelera(true);
        try {
          const url = `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1&region=${region}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            setCartelera(data.results.slice(0, 8).map(item => ({
              id: item.id,
              title: item.title,
              rating: item.vote_average ? item.vote_average.toFixed(1) : 'N/A',
              overview: item.overview ? item.overview.substring(0, 110) + '...' : 'Sin descripción.',
              poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null
            })));
          }
        } catch (e) {
          console.error(e);
        } finally {
          setCargandoCartelera(false);
        }
      };

      // Buscar Cines con rango según membresía (100 km Gratis vs 500 km Premium)
      const buscarCinesMundiales = async (lat, lng) => {
        setCargandoCines(true);
        const radioKm = (currentUser.isPremium || currentUser.isAdmin || currentUser.isVerifiedCritic) ? 500 : 100;
        const radioMetros = radioKm * 1000;

        try {
          const query = `[out:json];node["amenity"="cinema"](around:${radioMetros},${lat},${lng});out 15;`;
          const response = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
          const data = await response.json();

          if (data.elements && data.elements.length > 0) {
            const resultados = data.elements.map(cine => ({
              id: cine.id,
              nombre: cine.tags.name || "Cine Local",
              direccion: cine.tags["addr:street"] ? `${cine.tags["addr:street"]} ${cine.tags["addr:housenumber"] || ''}` : "Ver en mapa",
              lat: cine.lat,
              lng: cine.lon,
              distanciaKm: calcularDistanciaKm(lat, lng, cine.lat, cine.lon)
            })).sort((a, b) => a.distanciaKm - b.distanciaKm);

            setCinesGlobales(resultados);
          } else {
            setCinesGlobales([]);
          }
        } catch (e) {
          console.error(e);
        } finally {
          setCargandoCines(false);
        }
      };

      const getGeoLocation = () => {
        setLocationStatus('Obteniendo GPS...');
        setCargandoCines(true);
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            setUserCoords({ lat, lng });
            setLocationStatus(`GPS Activo (${lat.toFixed(2)}, ${lng.toFixed(2)})`);
            buscarCinesMundiales(lat, lng);
          }, () => {
            setLocationStatus('GPS no disponible');
            setCargandoCines(false);
          });
        }
      };

      useEffect(() => {
        cargarCarteleraEnCines(countryCode);
      }, [countryCode]);

      const handleAddReview = (e) => {
        e.preventDefault();
        if (!newReview.movie || !newReview.text) return;
        const reviewObj = {
          id: Date.now(),
          author: currentUser.name,
          isCritic: currentUser.isVerifiedCritic,
          movie: newReview.movie,
          rating: newReview.rating,
          text: newReview.text
        };
        setReviews([reviewObj, ...reviews]);
        setNewReview({ movie: '', rating: '5/5', text: '' });
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!newMessage.trim()) return;
        setChatMessages([...chatMessages, {
          id: Date.now(),
          user: currentUser.name,
          text: newMessage,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
        setNewMessage('');
      };

      return (
        <div className={`min-h-screen ${theme === 'dark' ? 'bg-slate-950 text-slate-100' : 'bg-gray-100 text-slate-900'}`}>
          
          {/* HEADER */}
          <header className={`border-b p-4 sticky top-0 z-40 ${theme === 'dark' ? 'border-slate-800 bg-slate-950/90 backdrop-blur' : 'border-gray-300 bg-white/90'}`}>
            <div className="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider cursor-pointer" onClick={() => setActiveTab('cartelera')}>PLOTTWISME 🌐</h1>
              
              <nav className="flex flex-wrap gap-2 text-xs font-bold uppercase">
                {[
                  { id: 'cartelera', label: '🍿 Cartelera' },
                  { id: 'radar', label: '🎯 Radar Cines' },
                  { id: 'criticos', label: '✍️ Críticos' },
                  { id: 'match', label: '🔥 Match' },
                  { id: 'perfil', label: '👤 Perfil & Subscripción' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-800 hover:text-white'}`}>{tab.label}</button>
                ))}
              </nav>

              <div className="flex items-center gap-3">
                <button onClick={() => setChatOpen(!chatOpen)} className="bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold px-3 py-1.5 rounded-xl text-xs border border-slate-700">
                  💬 Chat
                </button>
                <button onClick={() => setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow flex items-center gap-2">
                  <span>{currentUser.email === 'invitado@plottwisme.com' ? 'Iniciar Sesión / Registro' : currentUser.name}</span>
                  {currentUser.isVerifiedCritic && <span title="Crítico Verificado">✍️</span>}
                  {currentUser.isPremium && <span title="Suscripción Premium">⭐</span>}
                </button>
              </div>
            </div>
          </header>

          {/* CHAT EN TIEMPO REAL */}
          {chatOpen && (
            <div className="max-w-5xl mx-auto px-6 pt-4">
              <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-4 space-y-3">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="text-xs font-black uppercase text-amber-500">💬 Sala de Chat Cinéfila</h3>
                  <button onClick={() => setChatOpen(false)} className="text-xs text-slate-400">✕</button>
                </div>
                <div className="h-32 overflow-y-auto space-y-2 text-xs">
                  {chatMessages.map(m => (
                    <div key={m.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800">
                      <span className="font-bold text-amber-400">{m.user}: </span>
                      <span>{m.text}</span>
                    </div>
                  ))}
                </div>
                <form onSubmit={handleSendMessage} className="flex gap-2">
                  <input type="text" value={newMessage} onChange={(e) => setNewMessage(e.target.value)} placeholder="Escribe un mensaje..." className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white" />
                  <button type="submit" className="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs">Enviar</button>
                </form>
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-6">

            {/* CARTELERA */}
            {activeTab === 'cartelera' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🍿 Cartelera en Cines</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                  {cartelera.map(film => (
                    <div key={film.id} className="p-4 bg-slate-900 border border-slate-800 rounded-3xl space-y-3">
                      {film.poster ? <img src={film.poster} className="w-full h-64 object-cover rounded-2xl" /> : <div className="w-full h-64 bg-slate-800 rounded-2xl"></div>}
                      <h3 className="font-bold text-sm text-white">{film.title}</h3>
                      <p className="text-[11px] text-slate-400">{film.overview}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* RADAR CINES (CON LÓGICA DE ALCANCE KM) */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <div className="p-6 bg-slate-900 border border-slate-800 rounded-3xl flex justify-between items-center flex-wrap gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-amber-500">🎯 Radar de Cines Locales</h2>
                    <p className="text-xs text-slate-400">
                      Rango de búsqueda actual: <strong className="text-amber-400">{(currentUser.isPremium || currentUser.isAdmin || currentUser.isVerifiedCritic) ? '500 km (Premium/Crítico)' : '100 km (Gratuito)'}</strong>
                    </p>
                  </div>
                  <button onClick={getGeoLocation} className="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs">
                    📍 {locationStatus}
                  </button>
                </div>

                {cinesGlobales.map(cine => (
                  <div key={cine.id} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex justify-between items-center">
                    <div>
                      <h4 className="font-bold text-amber-400">{cine.nombre}</h4>
                      <p className="text-xs text-slate-400">{cine.direccion}</p>
                    </div>
                    <span className="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full text-amber-500">📍 {cine.distanciaKm.toFixed(1)} km</span>
                  </div>
                ))}
              </div>
            )}

            {/* CRÍTICOS Y RESEÑAS */}
            {activeTab === 'criticos' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-black text-amber-500">✍️ Comunidad de Críticos</h2>
                    <p className="text-xs text-slate-400">Lee y comparte análisis cinéfilos sin spoilers.</p>
                  </div>
                  {currentUser.isVerifiedCritic && (
                    <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-xl font-bold">
                      ✍️ Tienes insignia de Crítico Verificado
                    </span>
                  )}
                </div>

                {/* Formulario de Publicación */}
                <form onSubmit={handleAddReview} className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-3">
                  <h3 className="text-xs font-black uppercase text-amber-500">Escribir una Reseña</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" placeholder="Título de la Película" value={newReview.movie} onChange={(e) => setNewReview({ ...newReview, movie: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" />
                    <select value={newReview.rating} onChange={(e) => setNewReview({ ...newReview, rating: e.target.value })} className="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                      <option value="5/5">⭐⭐⭐⭐⭐ (5/5)</option>
                      <option value="4/5">⭐⭐⭐⭐ (4/5)</option>
                      <option value="3/5">⭐⭐⭐ (3/5)</option>
                      <option value="2/5">⭐⭐ (2/5)</option>
                      <option value="1/5">⭐ (1/5)</option>
                    </select>
                  </div>
                  <textarea rows="3" placeholder="Escribe tu crítica analítica..." value={newReview.text} onChange={(e) => setNewReview({ ...newReview, text: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white"></textarea>
                  <button type="submit" className="bg-amber-500 text-slate-950 font-black px-4 py-2 rounded-xl text-xs uppercase">Publicar Crítica ✍️</button>
                </form>

                {/* Lista de Reseñas */}
                <div className="space-y-4">
                  {reviews.map(r => (
                    <div key={r.id} className="p-5 bg-slate-900 border border-slate-800 rounded-3xl space-y-2">
                      <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-sm text-white">{r.author}</span>
                          {r.isCritic && <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded">CRÍTICO VERIFICADO ✍️</span>}
                        </div>
                        <span className="text-xs text-amber-400 font-bold">{r.rating}</span>
                      </div>
                      <h4 className="font-black text-amber-500 text-xs uppercase">{r.movie}</h4>
                      <p className="text-xs text-slate-300 italic">"{r.text}"</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MATCH */}
            {activeTab === 'match' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-black text-amber-500">🔥 Match & Conexiones</h2>
                <p className="text-xs text-slate-400">Encuentra tu compañero ideal para ir a las salas de cine.</p>
              </div>
            )}

            {/* PERFIL, PLANES PREMIUM Y PANEL DE ADMINISTRACIÓN MASTER */}
            {activeTab === 'perfil' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <div className="p-8 bg-slate-900 border border-slate-800 rounded-3xl space-y-6">
                  
                  {/* Info Perfil */}
                  <div className="flex items-center gap-4 border-b border-slate-800 pb-6">
                    <img src={currentUser.photos[0]} className="w-20 h-20 rounded-2xl object-cover border-2 border-amber-500" />
                    <div>
                      <h3 className="text-2xl font-black">{currentUser.name}</h3>
                      <p className="text-xs text-slate-400">{currentUser.email}</p>
                      <div className="flex gap-2 mt-2">
                        {currentUser.isVerifiedCritic && <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded">CRÍTICO VERIFICADO (PREMIUM DE POR VIDA)</span>}
                        {currentUser.isPremium && !currentUser.isVerifiedCritic && <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded">MIEMBRO PREMIUM ⭐</span>}
                        {currentUser.isAdmin && <span className="bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded">ADMINISTRADOR MASTER ⚡</span>}
                      </div>
                    </div>
                  </div>

                  {/* Planes Gratis vs Premium */}
                  <div className="p-5 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                    <h4 className="font-black text-xs uppercase text-amber-500">⭐ Membresía de Radar</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                      <div className={`p-4 rounded-xl border ${!currentUser.isPremium ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-900'}`}>
                        <h5 className="font-bold text-white">Plan Gratuito</h5>
                        <p className="text-slate-400 text-[11px] mt-1">Busca salas de cine hasta en un radio de <strong>100 km</strong>.</p>
                      </div>
                      <div className={`p-4 rounded-xl border ${currentUser.isPremium ? 'border-amber-500 bg-amber-500/10' : 'border-slate-800 bg-slate-900'}`}>
                        <h5 className="font-bold text-amber-400">Plan Premium</h5>
                        <p className="text-slate-400 text-[11px] mt-1">Sintoniza salas de cine hasta en un radio de <strong>500 km</strong> y acceso prioritario.</p>
                      </div>
                    </div>
                  </div>

                  {/* PANEL EXCLUSIVO ADMIN MASTER (plottwist.infoapp@gmail.com) */}
                  {currentUser.isAdmin && (
                    <div className="p-6 bg-red-950/20 border border-red-500/40 rounded-3xl space-y-4">
                      <div className="flex items-center justify-between">
                        <h4 className="font-black text-xs uppercase text-red-400">⚡ Panel de Control Máster (Gestión de Permisos)</h4>
                        <span className="text-[10px] text-red-300 font-mono">plottwist.infoapp@gmail.com</span>
                      </div>
                      
                      <p className="text-xs text-slate-300">Como administrador puedes otorgar insignias de Crítico Verificado (con Premium de por vida) o activar suscripciones Premium a usuarios seleccionados:</p>

                      <div className="space-y-3">
                        {usersList.map(user => (
                          <div key={user.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                            <div>
                              <span className="font-bold text-white block">{user.name}</span>
                              <span className="text-[10px] text-slate-400">{user.email}</span>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => toggleVerifiedCritic(user.id)} className={`px-3 py-1 rounded-lg text-[10px] font-black uppercase ${user.isVerifiedCritic ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-amber-400'}`}>
                                {user.isVerifiedCritic ? '✍️ Crítico Verificado' : '+ Otorgar Crítico'}
                              </button>
                              <button onClick={() => togglePremiumStatus(user.id)} className={`px-3 py-1 rounded-lg text-[10px] font-black uppercase ${user.isPremium ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>
                                {user.isPremium ? '⭐ Premium Activo' : '+ Otorgar Premium'}
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </main>

          {/* MODAL AUTENTICACIÓN / REGISTRO POR CORREO */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-6 space-y-4 relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                <h3 className="text-lg font-black text-center text-white">{isRegisterMode ? 'Crear Perfil en Plottwisme' : 'Iniciar Sesión'}</h3>
                
                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {isRegisterMode && (
                    <input type="text" required value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} placeholder="Nombre Completo" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  )}
                  <input type="email" required value={authForm.email} onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })} placeholder="Correo Electrónico" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  <input type="password" required value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} placeholder="Contraseña" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                  
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">
                    {isRegisterMode ? 'Registrarme' : 'Ingresar'}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-slate-800">
                  <button onClick={() => setIsRegisterMode(!isRegisterMode)} className="text-xs text-amber-400 font-bold">
                    {isRegisterMode ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate gratis'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
