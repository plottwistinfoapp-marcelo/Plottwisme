<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const TMDB_API_KEY = 'b14cd670ad1a16c2145f78d11d5b0e40';

    function App() {
      const [activeTab, setActiveTab] = useState('cartelera');
      const [cityName, setCityName] = useState('Oberá');
      const [cartelera, setCartelera] = useState([]);

      // Definición de plataformas con su ID para filtrar
      const allPlatforms = [
        { id: 'netflix', name: 'Netflix', color: 'bg-red-600' },
        { id: 'hbo', name: 'Max (HBO)', color: 'bg-purple-700' },
        { id: 'disney', name: 'Disney+', color: 'bg-blue-600' },
        { id: 'prime', name: 'Prime', color: 'bg-cyan-600' }
      ];

      // Simulamos la carga de datos (En una app real, aquí filtrarías según datos de TMDB)
      useEffect(() => {
        const fetchMovies = async () => {
          const res = await fetch(`https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_API_KEY}&language=es-ES&page=1`);
          const data = await res.json();
          
          // Simulación de "Disponibilidad" para el ejemplo
          const processed = data.results.map((movie, index) => ({
            ...movie,
            // Lógica aleatoria para simular disponibilidad de plataformas
            availablePlatforms: index % 2 === 0 ? ['netflix', 'hbo'] : ['disney', 'prime'],
            poster: `https://image.tmdb.org/t/p/w500${movie.poster_path}`
          }));
          setCartelera(processed.slice(0, 4));
        };
        fetchMovies();
      }, []);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          
          {/* HEADER CON NUEVA BARRA DE CRÍTICOS */}
          <header className="border-b border-slate-800 p-4 sticky top-0 z-40 bg-slate-950/90 backdrop-blur">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <h1 className="font-black text-2xl text-amber-500 tracking-wider">PLOTTWISME</h1>
              
              <nav className="flex gap-1 text-xs font-bold uppercase">
                {[
                  { id: 'cartelera', label: '🍿 Cartelera' },
                  { id: 'radar', label: '🎯 Radar' },
                  { id: 'watchparty', label: '🎉 Watch Parties' },
                  { id: 'criticos', label: '✍️ Críticos' }, // NUEVO
                  { id: 'match', label: '🔥 Match' },
                  { id: 'perfil', label: '👤 Perfil' }
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                    className={`px-3 py-1.5 rounded-lg transition-all ${activeTab === tab.id ? 'bg-amber-500 text-slate-950' : 'hover:bg-slate-800'}`}>
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6">
            
            {activeTab === 'cartelera' && (
              <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                {cartelera.map(film => (
                  <div key={film.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col gap-3">
                    <img src={film.poster} className="w-full h-64 object-cover rounded-2xl" alt={film.title} />
                    <h3 className="font-bold text-sm leading-tight">{film.title}</h3>
                    
                    {/* Botón Salas Local */}
                    <button className="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-bold border border-slate-700">
                      Ver Salas y Horarios Local 🎟️
                    </button>

                    {/* LÓGICA DE PLATAFORMAS CONTEXTUALES */}
                    <div className="space-y-1.5">
                      <span className="text-[9px] uppercase text-slate-500 font-bold tracking-widest">Disponible en:</span>
                      <div className="flex flex-wrap gap-1">
                        {film.availablePlatforms.map(pId => {
                          const platform = allPlatforms.find(a => a.id === pId);
                          return (
                            <button key={pId} className={`${platform.color} px-2 py-1 rounded-md text-[10px] font-bold text-white`}>
                              {platform.name}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <button className="w-full bg-amber-500 text-slate-950 font-black py-2 rounded-xl text-xs uppercase mt-auto">
                      Buscar Compañero 🤝
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* SECCIÓN CRÍTICOS */}
            {activeTab === 'criticos' && (
              <div className="text-center py-20">
                <h2 className="text-3xl font-black text-amber-500">✍️ Sección de Críticos</h2>
                <p className="text-slate-400 mt-2">Próximamente: Las mejores reseñas de la comunidad.</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
