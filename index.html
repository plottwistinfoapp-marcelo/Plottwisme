<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila & Cartelera Global</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
    .font-brand { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="antialiased bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TMDB_KEY = "15d102713cd16ba5f3293f49ae858a76";

    const INITIAL_USERS = [
      {
        id: 'u1',
        name: 'Marcelo Buttice',
        email: 'marbuttice@gmail.com',
        age: 57,
        sex: 'Masculino',
        lookingFor: 'Cita / Pareja & Amigos Cinéfilos',
        location: 'Oberá, Misiones, Argentina',
        distanceKm: 2.5,
        role: 'admin',
        roleLabel: 'Administrador General',
        isPremium: true,
        isCritic: true,
        verified: true,
        bio: 'Devoto del cine de autor, ciencia ficción y análisis cinematográfico. Creador de Plottwisme.',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@marbuttice', radio: 'Frecuencia Cine', tv: 'Canal 12 Misiones' },
        receivedLikes: 14
      },
      {
        id: 'u2',
        name: 'Elena Montero',
        email: 'elena@gmail.com',
        age: 24,
        sex: 'Femenino',
        lookingFor: 'Amigos Cinéfilos',
        location: 'Posadas, Misiones, Argentina',
        distanceKm: 85.0,
        role: 'general',
        roleLabel: 'Cinéfila Pro & Crítica',
        isPremium: false,
        isCritic: true,
        verified: true,
        bio: 'Directora de cortos amateur y crítica de cine asiático y de autor.',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&auto=format&fit=crop&q=80',
        socialLinks: { twitter: '@elenamonterok', radio: 'Columnista Radio LT3', tv: 'Canal 12 Misiones' },
        receivedLikes: 29
      }
    ];

    const FEATURED_MOVIES = [
      {
        id: 101,
        title: "Spider-Man: Brand New Day",
        overview: "Nuevas aventuras y enfrentamientos épicos en la gran pantalla. Consulta salas y horarios disponibles.",
        poster_path: "https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=600&auto=format&fit=crop&q=80",
        vote_average: "8.8",
        genre: "Acción / Aventura"
      },
      {
        id: 102,
        title: "Yo, Narciso",
        overview: "Una mirada profunda al drama psicológico y las relaciones contemporáneas.",
        poster_path: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&auto=format&fit=crop&q=80",
        vote_average: "7.9",
        genre: "Romance / Comedia"
      }
    ];

    const INITIAL_REVIEWS = [
      {
        id: 'r1',
        author: 'Elena Montero',
        movieTitle: 'Spider-Man: Brand New Day',
        rating: 9,
        content: 'Una propuesta visualmente impactante y con gran ritmo narrativo.',
        mediaOutlet: 'Columnista Radio LT3 / Canal 12 Misiones',
        date: '2026-08-31'
      }
    ];

    const COUNTRY_CODES = [
      { code: 'US', name: 'Estados Unidos 🇺🇸' },
      { code: 'AR', name: 'Argentina 🇦🇷' },
      { code: 'ES', name: 'España 🇪🇸' },
      { code: 'MX', name: 'México 🇲🇽' },
      { code: 'CL', name: 'Chile 🇨🇱' },
      { code: 'CO', name: 'Colombia 🇨🇴' },
      { code: 'PY', name: 'Paraguay 🇵🇾' },
      { code: 'UY', name: 'Uruguay 🇺🇾' },
      { code: 'BR', name: 'Brasil 🇧🇷' }
    ];

    const LANGUAGES = [
      { code: 'es-ES', label: 'Español AR/MX/ES 🇪🇸' },
      { code: 'en-US', label: 'English US/UK 🇺🇸' },
      { code: 'pt-BR', label: 'Português BR 🇧🇷' }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => INITIAL_USERS[0]);
      const [activeTab, setActiveTab] = useState('cinema');
      const [currentIndex, setCurrentIndex] = useState(0);

      const [userCity, setUserCity] = useState('Austin, Texas');
      const [userCountryCode, setUserCountryCode] = useState('US');
      const [userLanguage, setUserLanguage] = useState('es-ES');

      const [moviesList, setMoviesList] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [showSubscriptionModal, setShowSubscriptionModal] = useState(false);

      const [usersList, setUsersList] = useState(INITIAL_USERS);
      const [reviewsList, setReviewsList] = useState(INITIAL_REVIEWS);

      const [newReviewMovie, setNewReviewMovie] = useState('');
      const [newReviewRating, setNewReviewRating] = useState(10);
      const [newReviewText, setNewReviewText] = useState('');

      const [editBio, setEditBio] = useState(currentUser.bio);
      const [editAvatar, setEditAvatar] = useState(currentUser.avatar);
      const [editRadio, setEditRadio] = useState(currentUser.socialLinks.radio);
      const [editTv, setEditTv] = useState(currentUser.socialLinks.tv);
      const [editTwitter, setEditTwitter] = useState(currentUser.socialLinks.twitter);

      // Carga resiliente con sistema de respaldo (Fallback)
      useEffect(() => {
        const fetchMovies = async () => {
          setIsLoading(true);

          try {
            // Intento 1: Buscar por región del país e idioma seleccionado
            let res = await fetch(
              `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_KEY}&language=${userLanguage}&region=${userCountryCode}&page=1`
            );
            let data = await res.json();

            // Intento 2: Si el país no tiene datos regionales cargados en TMDb, buscar cartelera general en ese idioma
            if (!data.results || data.results.length === 0) {
              res = await fetch(
                `https://api.themoviedb.org/3/movie/now_playing?api_key=${TMDB_KEY}&language=${userLanguage}&page=1`
              );
              data = await res.json();
            }

            // Intento 3: Si aún está vacío, traer las películas populares de la semana
            if (!data.results || data.results.length === 0) {
              res = await fetch(
                `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_KEY}&language=${userLanguage}`
              );
              data = await res.json();
            }

            if (data.results && data.results.length > 0) {
              const formatted = data.results.slice(0, 9).map(m => ({
                id: m.id,
                title: m.title || m.original_title,
                overview: m.overview || (userLanguage.startsWith('es') 
                  ? 'Consulta horarios y funciones en tu ciudad.' 
                  : 'Check showtimes and schedules in your city.'),
                poster_path: m.poster_path 
                  ? `https://image.tmdb.org/t/p/w500${m.poster_path}` 
                  : 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600&auto=format&fit=crop&q=80',
                vote_average: m.vote_average ? m.vote_average.toFixed(1) : '8.0',
                genre: userLanguage.startsWith('es') ? 'En Cartelera' : 'Now Playing'
              }));
              setMoviesList(formatted);
            } else {
              setMoviesList(FEATURED_MOVIES);
            }
          } catch (err) {
            console.error("Error al consultar TMDb:", err);
            setMoviesList(FEATURED_MOVIES);
          } finally {
            setIsLoading(false);
          }
        };

        fetchMovies();
      }, [userCountryCode, userLanguage]);

      const openCitySchedule = (movieTitle = '') => {
        const cleanCity = userCity.trim().toLowerCase();
        const query = movieTitle 
          ? `cartelera cine ${movieTitle} en ${cleanCity}` 
          : `cartelera de cines en ${cleanCity}`;
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
      };

      const maxDistance = currentUser.isPremium ? 500 : 100;
      const filteredCandidates = useMemo(() => {
        return usersList.filter(u => u.email !== currentUser.email && u.distanceKm <= maxDistance);
      }, [usersList, currentUser, maxDistance]);

      const currentCandidate = filteredCandidates[currentIndex];

      const handleUpgradePlan = (isPrem) => {
        const updated = { 
          ...currentUser, 
          isPremium: isPrem, 
          roleLabel: isPrem ? 'Cinéfilo Premium ⭐' : 'Cinéfilo Estándar' 
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        setShowSubscriptionModal(false);
      };

      const handleSaveProfile = (e) => {
        e.preventDefault();
        const updated = {
          ...currentUser,
          bio: editBio,
          avatar: editAvatar,
          socialLinks: { radio: editRadio, tv: editTv, twitter: editTwitter }
        };
        setCurrentUser(updated);
        setUsersList(usersList.map(u => u.email === updated.email ? updated : u));
        alert('✅ ¡Perfil actualizado correctamente!');
      };

      const handlePublishReview = (e) => {
        e.preventDefault();
        if (!newReviewMovie || !newReviewText) return;
        const newRev = {
          id: 'r_' + Date.now(),
          author: currentUser.name,
          movieTitle: newReviewMovie,
          rating: Number(newReviewRating),
          content: newReviewText,
          mediaOutlet: currentUser.socialLinks.radio || currentUser.roleLabel,
          date: new Date().toISOString().split('T')[0]
        };
        setReviewsList([newRev, ...reviewsList]);
        setNewReviewMovie('');
        setNewReviewText('');
        alert('📝 ¡Reseña publicada!');
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* HEADER CON SELECCIÓN DE CIUDAD, PAÍS E IDIOMA */}
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-3">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('cinema')}>
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center font-bold text-xl text-slate-950">P</div>
                <div>
                  <h1 className="text-xl font-black font-brand text-amber-500">Plottwisme</h1>
                  <p className="text-[10px] uppercase text-slate-400 font-bold">{currentUser.isPremium ? '⭐ Plan Premium (500 km)' : '👤 Plan Estándar (100 km)'}</p>
                </div>
              </div>

              {/* BARRA DE CONFIGURACIÓN REGIONAL */}
              <div className="flex flex-wrap items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-2xl text-xs w-full lg:w-auto justify-center">
                <span className="text-amber-500 font-bold whitespace-nowrap">📍 Ubicación:</span>
                <input 
                  type="text" 
                  value={userCity} 
                  onChange={(e) => setUserCity(e.target.value)} 
                  className="bg-transparent border-b border-amber-500/50 px-1 py-0.5 font-bold w-32 text-amber-300 focus:outline-none capitalize text-xs" 
                  placeholder="Ciudad..." 
                />
                
                <span className="text-slate-600">|</span>
                
                {/* Selector de País (Región) */}
                <select 
                  value={userCountryCode} 
                  onChange={(e) => setUserCountryCode(e.target.value)}
                  className="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer"
                >
                  {COUNTRY_CODES.map(c => (
                    <option key={c.code} value={c.code}>{c.name}</option>
                  ))}
                </select>

                <span className="text-slate-600">|</span>

                {/* Selector de Idioma de la App */}
                <span className="text-amber-500 font-bold whitespace-nowrap">🗣️ Idioma:</span>
                <select 
                  value={userLanguage} 
                  onChange={(e) => setUserLanguage(e.target.value)}
                  className="bg-slate-900 text-amber-300 font-bold rounded-lg px-2 py-1 text-xs border border-amber-500/30 focus:outline-none cursor-pointer"
                >
                  {LANGUAGES.map(l => (
                    <option key={l.code} value={l.code}>{l.label}</option>
                  ))}
                </select>
              </div>

              {/* NAVEGACIÓN */}
              <nav className="flex items-center gap-1 p-1 rounded-2xl border border-slate-800 bg-slate-900 overflow-x-auto max-w-full">
                <button onClick={() => setActiveTab('cinema')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'cinema' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎬 Cartelera</button>
                <button onClick={() => setActiveTab('radar')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>🎯 Radar</button>
                <button onClick={() => setActiveTab('critics')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>📰 Críticos</button>
                <button onClick={() => setActiveTab('profile')} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>👤 Mi Perfil</button>
                
                <button onClick={() => setShowSubscriptionModal(true)} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-600/20 text-rose-300 border border-rose-500/40 hover:bg-rose-600 hover:text-white transition-all whitespace-nowrap">
                  💳 Planes
                </button>

                {currentUser.role === 'admin' && (
                  <button onClick={() => setActiveTab('admin')} className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950' : 'bg-amber-500/20 text-amber-300 border border-amber-500/50'}`}>
                    🛡️ Admin
                  </button>
                )}
              </nav>

            </div>
          </header>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {/* TAB CARTELERA */}
            {activeTab === 'cinema' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-amber-500/10 via-slate-900 to-slate-900 border border-amber-500/30 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <h2 className="text-lg font-black text-amber-400">
                      🏛️ Cartelera de Cine ({COUNTRY_CODES.find(c => c.code === userCountryCode)?.name || userCountryCode})
                    </h2>
                    <p className="text-xs text-slate-300 mt-1">
                      Películas en cartelera. Seleccioná cualquiera para consultar salas y funciones directas en <b className="capitalize text-white">{userCity}</b>.
                    </p>
                  </div>
                  <button 
                    onClick={() => openCitySchedule()} 
                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs whitespace-nowrap transition-all shadow-lg shadow-amber-500/20 flex items-center gap-2"
                  >
                    <span>Ver Funciones en {userCity} (Google)</span>
                    <span>↗</span>
                  </button>
                </div>

                {/* CARGANDO O GRILLA DE PELÍCULAS */}
                {isLoading ? (
                  <div className="text-center py-20 text-amber-400 font-bold text-sm">
                    ⏳ Obteniendo películas de cartelera...
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {moviesList.map(m => (
                      <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden p-4 flex flex-col justify-between space-y-4 shadow-xl hover:border-amber-500/50 transition-all">
                        <div className="space-y-3">
                          <div className="relative h-72 rounded-2xl overflow-hidden bg-slate-950 cursor-pointer" onClick={() => openCitySchedule(m.title)}>
                            <img src={m.poster_path} alt={m.title} className="w-full h-full object-cover hover:scale-105 transition-all duration-300" />
                            <span className="absolute top-2 right-2 bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md shadow">
                              ★ {m.vote_average}
                            </span>
                          </div>
                          <div>
                            <span className="text-[10px] font-bold text-rose-500 uppercase">{m.genre}</span>
                            <h3 className="text-base font-black text-white cursor-pointer hover:text-amber-400 transition-colors" onClick={() => openCitySchedule(m.title)}>
                              {m.title}
                            </h3>
                            <p className="text-xs text-slate-400 line-clamp-3 pt-1">{m.overview}</p>
                          </div>
                        </div>

                        <button 
                          onClick={() => openCitySchedule(m.title)} 
                          className="w-full bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-amber-400 font-bold py-2.5 rounded-xl text-xs transition-all border border-slate-700 flex items-center justify-center gap-2"
                        >
                          <span>Horarios en {userCity}</span>
                          <span>↗</span>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB RADAR */}
            {activeTab === 'radar' && (
              <div className="flex flex-col items-center">
                <div className="mb-4 bg-amber-500/10 border border-amber-500/30 px-4 py-2 rounded-2xl text-xs text-amber-500 text-center flex items-center gap-2 flex-wrap justify-center">
                  <span>🎯 Buscando cinéfilos cerca de <b className="capitalize">{userCity}</b></span>
                  <span className="bg-amber-500/20 px-2 py-0.5 rounded-lg border border-amber-500/40">Radio: <b>{currentUser.isPremium ? '500 km' : '100 km'}</b></span>
                </div>

                {currentCandidate ? (
                  <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                    <div className="relative h-96 w-full bg-slate-950">
                      <img src={currentCandidate.avatar} alt={currentCandidate.name} className="w-full h-full object-cover" />
                      <div className="absolute top-4 left-4 bg-rose-600 px-3 py-1 rounded-full text-xs font-bold text-white">{currentCandidate.lookingFor}</div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <h
