    ];

    const calculateDistanceKm = (lat1, lon1, lat2, lon2) => {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c * 10) / 10;
    };

    function CinemaMapComponent({ userCity, userCoords, targetCoords, maxAllowedRadius, isDarkMode, cardBg, textColor }) {
      const distanceToSelected = (userCoords && targetCoords) 
        ? calculateDistanceKm(userCoords.lat, userCoords.lon, targetCoords.lat, targetCoords.lon)
        : 0;

      const isWithinLimit = distanceToSelected <= maxAllowedRadius;
      const encodedQuery = encodeURIComponent(`cines en ${userCity}`);
      const mapSrc = `https://www.google.com/maps?q=${encodedQuery}&output=embed`;

          </div>

            <iframe
              title="Google Maps Cines"
              src={mapSrc}
              className={`w-full h-full border-0 ${isDarkMode ? 'map-dark-mode' : ''}`}
              loading="lazy"
            ></iframe>
          </div>
        </div>
      );
    }

      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      
      const [activeTab, setActiveTab] = useState('cinema');
      const [userCity, setUserCity] = useState('Buenos Aires');
      const [lang, setLang] = useState('es');
      const t = TRANSLATIONS[lang] || TRANSLATIONS.es;

      useEffect(() => {
        setLang(getBrowserLang());
        const checkAuthInterval = setInterval(() => {
          if (window.auth && window.FirebaseFns) {
            clearInterval(checkAuthInterval);
            window.FirebaseFns.onAuthStateChanged(window.auth, (currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
          }
        }, 200);

        const timer = setTimeout(() => {
          setLoading(false);
        }, 3000);

        return () => {
          clearInterval(checkAuthInterval);
          clearTimeout(timer);
        };
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        try {
          if (isRegistering) {
            await window.FirebaseFns.createUserWithEmailAndPassword(window.auth, email, password);
          } else {
            await window.FirebaseFns.signInWithEmailAndPassword(window.auth, email, password);
          }
        } catch (err) {
          setErrorMsg("Error: " + err.message);
        }
      };

      const handleLogout = async () => {
        try {
          await window.FirebaseFns.signOut(window.auth);
        } catch (err) {
          console.error(err);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 text-amber-500 font-bold text-sm">
            ⏳ Sintonizando Plottwisme Admin Cloud Pro...
          </div>
        );
      }

      const isAdmin = user && user.email === 'marbuttice@gmail.com';

      // Pantalla de autenticación estándar y limpia
      if (!user) {
        return (
