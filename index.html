<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plottwisme</title>

  <!-- PWA & Favicon Config -->
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png">
  <link rel="apple-touch-icon" href="/icon-512x512.png">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Manifest JSON embebido directamente para garantizar la detección del ícono -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Plottwisme",
    "short_name": "Plottwisme",
    "start_url": "/",
    "display": "standalone",
    "background_color": "#000000",
    "theme_color": "#000000",
    "icons": [
      {
        "src": "/icon-512x512.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any maskable"
      }
    ]
  }'>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 0 25px rgba(186, 85, 211, 0.5);
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #e0aaff, #c77dff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #a0a0a0;
      font-size: 0.95rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <img src="/icon-512x512.png" alt="Plottwisme Logo" class="logo">
    <h1>PLOTTWISME</h1>
    <p>Cine & Match</p>
  </div>

  <script>
    // Registro del Service Worker para soporte PWA e instalación
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // El Service Worker se activará al disponer del script sw.js en producción
        });
      });
    }
  </script>
</body>
</html>
