<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plottwisme - Red Social Cinéfila & Citas</title>
  
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plottwisme" />
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="icon-512x512.png">
  <link rel="apple-touch-icon" href="icon-512x512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHdoWQUZDNjxfvq7Rfl4Hvgpp8z-DoDMo",
      authDomain: "plottwisme-c3124.firebaseapp.com",
      projectId: "plottwisme-c3124",
      storageBucket: "plottwisme-c3124.firebasestorage.app",
      messagingSenderId: "571052328665",
      appId: "1:571052328665:web:f1374ddb467313181ca0c8",
      measurementId: "G-KYYQV3PN5F"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.FirebaseFns = {
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged,
      collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot, query, serverTimestamp
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Outfit', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased selection:bg-amber-500 selection:text-slate-950 bg-slate-950 text-slate-100 min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen text-amber-500 font-bold text-sm">
      ⏳ Sintonizando Plottwisme...
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);

      useEffect(() => {
        const checkAuthInterval = setInterval(() => {
          if (window.auth && window.FirebaseFns) {
            clearInterval(checkAuthInterval);
            window.FirebaseFns.onAuthStateChanged(window.auth, (currentUser) => {
              setUser(currentUser);
              setLoading(false);
            });
          }
        }, 200);

        const timer = setTimeout(() => {
          setLoading(false);
        }, 3000);

        return () => {
          clearInterval(checkAuthInterval);
          clearTimeout(timer);
        };
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        try {
          if (isRegistering) {
            await window.FirebaseFns.createUserWithEmailAndPassword(window.auth, email, password);
          } else {
            await window.FirebaseFns.signInWithEmailAndPassword(window.auth, email, password);
          }
        } catch (err) {
          setErrorMsg("Error: " + err.message);
        }
      };

      const handleLogout = async () => {
        try {
          await window.FirebaseFns.signOut(window.auth);
        } catch (err) {
          console.error(err);
        }
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 text-amber-500 font-bold text-sm">
            ⏳ Cargando Plottwisme Cloud...
          </div>
        );
      }

      // Verificamos si el usuario actual es el administrador mediante su correo
      const isAdmin = user && user.email === 'marbuttice@gmail.com';

      return (
        <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
          <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
            <div className="text-center space-y-2">
              <h1 className="text-3xl font-black font-brand text-amber-500">Plottwisme</h1>
              <p className="text-slate-400 text-sm">Red Social Cinéfila & Citas</p>
            </div>

            {user ? (
              <div className="space-y-4 text-center">
                <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
                  <p className="text-sm text-slate-300">Sesión iniciada como:</p>
                  <p className="font-bold text-amber-400 truncate">{user.email}</p>
                  
                  {isAdmin ? (
                    <span className="inline-block bg-amber-500/20 border border-amber-500/40 text-amber-400 text-xs font-extrabold px-3 py-1 rounded-full">
                      🛡️ Panel de Administrador Activo
                    </span>
                  ) : (
                    <span className="inline-block bg-slate-700/50 text-slate-300 text-xs px-3 py-1 rounded-full">
                      👤 Usuario Cinéfilo
                    </span>
                  )}
                </div>

                {isAdmin && (
                  <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-left text-xs text-amber-200 space-y-2">
                    <p className="font-bold">✨ Controles de Admin:</p>
                    <p>• Tienes acceso total a la moderación, gestión de la cartelera y herramientas del sistema.</p>
                  </div>
                )}

                <button
                  onClick={handleLogout}
                  className="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-rose-600/20"
                >
                  🚪 Cerrar Sesión
                </button>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                {errorMsg && (
                  <div className="bg-rose-500/20 border border-rose-500/50 p-3 rounded-2xl text-xs text-rose-300">
                    {errorMsg}
                  </div>
                )}
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Correo electrónico</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm"
                    placeholder="tucorreo@email.com"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-400 mb-1">Contraseña</label>
                  <input
                    type="password"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm"
                    placeholder="••••••••"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-lg shadow-amber-500/20 text-sm"
                >
                  {isRegistering ? "✨ Registrarse" : "🔑 Iniciar Sesión"}
                </button>

                <div className="text-center pt-2">
                  <button
                    type="button"
                    onClick={() => setIsRegistering(!isRegistering)}
                    className="text-xs text-slate-400 hover:text-amber-400 underline transition"
                  >
                    {isRegistering ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí"}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
