                <button onClick={() => { setActiveTab('forums'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'forums' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.forums}</button>
                <button onClick={() => { setActiveTab('radar'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'radar' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.radar}</button>
                <button onClick={() => { setActiveTab('chats'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'chats' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.chats} ({chatsList.length})</button>
                <button onClick={() => { setActiveTab('critics'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'critics' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.critics}</button>
                
                {currentUser && (
                  <button onClick={() => { setActiveTab('profile'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${activeTab === 'profile' ? 'bg-amber-500 text-slate-950' : 'text-slate-300'}`}>{t.profile}</button>
                )}

                {currentUser?.role === 'admin' && (
                  <button onClick={() => { setActiveTab('admin'); setActiveTopic(null); }} className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap ${activeTab === 'admin' ? 'bg-amber-400 text-slate-950' : 'bg-amber-500/20 text-amber-300 border border-amber-500/50'}`}>
                    {t.admin}
                  </button>
                )}

                {currentUser ? (
                  <button onClick={handleLogout} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap">
                    {t.logout}
                  </button>
                ) : (
                  <button onClick={() => { setAuthMode('signup'); setResetStep(1); setShowAuthModal(true); }} className="px-3 py-1.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 hover:bg-amber-400 whitespace-nowrap">
                    {t.signup}
                  </button>
                )}
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            
            {activeTab === 'cinema' && (
              <div className="space-y-8">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500/20 via-slate-900 to-slate-900 border border-amber-500/30 p-8 shadow-2xl">
                  <div className="max-w-2xl space-y-4">
                    <span className="bg-amber-500 text-slate-950 font-black text-[10px] px-3 py-1 rounded-md uppercase tracking-wider">
                      {t.engineTitle}
                    </span>
                    <h2 className="text-3xl font-black text-white leading-tight">
                      {t.cinemaRealtime} <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                    </h2>
                    <p className="text-sm text-slate-300 leading-relaxed">
                      {t.cinemaSubtitle}
                    </p>
                    <div className="pt-2">
                      <button 
                        onClick={() => openGoogleEngine()} 
                        className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-8 py-4 rounded-2xl text-sm transition-all shadow-xl shadow-amber-500/20 flex items-center gap-3 hover:scale-105"
                      >
                        <span>🏛️ {t.openCinema} {userCity || 'tu ciudad'}</span>
                        <span>↗</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div className="space-y-4">
                  <h3 className="text-lg font-black text-white flex items-center gap-2">
                    <span>⚡ {t.directSearch}</span>
                    <span className="text-amber-400 capitalize">{userCity || 'tu ciudad'}</span>
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {SEARCH_CATEGORIES.map(cat => (
                      <div 
                        key={cat.id} 
                        onClick={() => openGoogleEngine(cat.queryFormat)}
                        className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all hover:-translate-y-1 shadow-lg group flex flex-col justify-between space-y-4"
                      >
                        <div>
                          <h4 className="font-bold text-white group-hover:text-amber-400 transition-colors text-sm">{cat.label}</h4>
                          <p className="text-xs text-slate-400 mt-1">Real-time sync.</p>
                        </div>
                        <div className="text-xs font-bold text-amber-500 flex items-center justify-between pt-2 border-t border-slate-800">
                          <span>{t.consultGoogle}</span>
                          <span>↗</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'forums' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {activeTopic ? (
                  <div className="space-y-6">
                    <button onClick={() => setActiveTopic(null)} className="bg-slate-900 border border-slate-800 text-amber-400 hover:text-amber-300 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition-all">
                      <span>← Volver</span>
                    </button>

                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl space-y-4 shadow-xl">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
                        <span className="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase">
                          {activeTopic.category}
                        </span>
                        <span className="text-xs text-slate-400">Por <b>{activeTopic.author}</b> • {activeTopic.date}</span>
                      </div>
                      <h2 className="text-2xl font-black text-white">{activeTopic.title}</h2>
                      <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-line">{activeTopic.content}</p>
                    </div>

                    <div className="space-y-4">
                      <h3 className="text-lg font-black text-amber-500">💬 Respuestas ({activeTopic.comments.length})</h3>

                      {activeTopic.comments.map(c => (
                        <div key={c.id} className="bg-slate-900/80 border border-slate-800/80 p-4 rounded-2xl space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-400">
                            <span className="font-bold text-white">{c.author}</span>
                            <span>{c.date}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">{c.text}</p>
                        </div>
                      ))}

                      <form onSubmit={handleAddComment} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                        <textarea rows="3" value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder="Escribe tu respuesta..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500" required disabled={!currentUser} />
                        <button type="submit" disabled={!currentUser} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider disabled:opacity-50">
                          Publicar
                        </button>
                      </form>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                      <div>
                        <h2 className="text-2xl font-black text-white">💬 Foros de Discusión</h2>
                        <p className="text-xs text-slate-400 mt-1">Comparte tus teorías con cinéfilos del mundo.</p>
                      </div>
                      <button onClick={() => currentUser ? setShowNewTopicModal(true) : setShowAuthModal(true)} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-500/20 whitespace-nowrap">
                        ✍️ Nuevo Debate
                      </button>
                    </div>

                    <div className="space-y-4">
                      {forumTopics.map(topic => (
                        <div key={topic.id} onClick={() => setActiveTopic(topic)} className="bg-slate-900 border border-slate-800 hover:border-amber-500/60 p-5 rounded-2xl cursor-pointer transition-all space-y-3 group">
                          <div className="flex justify-between items-center text-xs">
                            <span className="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">{topic.category}</span>
                            <span className="text-slate-500 text-[10px]">{topic.date}</span>
                          </div>
                          <h3 className="text-base font-bold text-white group-hover:text-amber-400 transition-colors">{topic.title}</h3>
                          <div className="flex justify-between items-center text-xs text-slate-400 pt-1 border-t border-slate-800">
                            <span>Por <b>{topic.author}</b></span>
                            <span className="text-amber-500 font-bold">💬 {topic.repliesCount}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'radar' && (
              <div className="flex flex-col items-center space-y-4">
                <div className="bg-slate-900 border border-amber-500/30 px-4 py-2 rounded-xl text-xs text-amber-400 font-bold">
                  📡 Radar: {currentUser?.isPremium ? '500 km (Premium ⭐)' : '100 km (Standard 👤)'}
                </div>

                {currentCandidate ? (
                  <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                    <div className="relative h-96 w-full bg-slate-950">
                      <img src={currentCandidate.avatar} alt={currentCandidate.name} className="w-full h-full object-cover" />
                      <div className="absolute top-4 left-4 bg-rose-600 px-3 py-1 rounded-full text-xs font-bold text-white">{currentCandidate.lookingFor}</div>
                      <div className="absolute bottom-4 left-4 right-4">
                        <h2 className="text-2xl font-black text-white">{currentCandidate.name}, {currentCandidate.age}</h2>
                        <p className="text-xs text-amber-300 font-medium">📍 {currentCandidate.location} • {currentCandidate.distanceKm} km</p>
                      </div>
                    </div>
                    <div className="p-6 space-y-4">
                      <p className="text-xs italic text-slate-300">"{currentCandidate.bio}"</p>
                      <div className="flex justify-center gap-6 pt-4 border-t border-slate-800">
                        <button onClick={() => setCurrentIndex(prev => prev + 1)} className="w-14 h-14 rounded-full bg-slate-800 text-rose-400 flex items-center justify-center text-xl font-bold">✖</button>
                        <button onClick={() => { handleMatchUser(currentCandidate); setCurrentIndex(prev => prev + 1); }} className="w-16 h-16 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg shadow-amber-500/20 hover:scale-110 transition-all">🍿</button>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="text-center py-20 space-y-4 max-w-md bg-slate-900 border border-slate-800 p-8 rounded-3xl">
                    <div className="text-4xl">🎟️</div>
                    <h3 className="text-xl font-bold">No hay más perfiles cercanos.</h3>
                    <button onClick={() => setCurrentIndex(0)} className="bg-slate-800 text-slate-200 px-4 py-2 rounded-xl text-xs font-bold">Reiniciar</button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'chats' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <h2 className="text-2xl font-black text-white">💬 Chats & Matches</h2>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900 border border-slate-800 rounded-3xl p-4 min-h-[450px]">
                  <div className="border-r border-slate-800 pr-3 space-y-2">
                    <h3 className="text-xs font-bold text-amber-500 uppercase px-2">{t.activeChats}</h3>
                    {chatsList.length === 0 ? (
                      <p className="text-xs text-slate-400 p-2">{t.noChats}</p>
                    ) : (
                      chatsList.map(chat => (
                        <div 
                          key={chat.id} 
                          onClick={() => setActiveChat(chat)}
                          className={`flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all ${activeChat?.id === chat.id ? 'bg-amber-500/20 border border-amber-500/50' : 'hover:bg-slate-800/60'}`}
                        >
                          <img src={chat.userAvatar} alt={chat.userName} className="w-12 h-12 rounded-full object-cover border border-amber-500/30" />
                          <div className="overflow-hidden flex-1">
                            <h4 className="font-bold text-white text-xs truncate">{chat.userName}</h4>
                            <p className="text-[10px] text-slate-400 truncate">{chat.messages[chat.messages.length - 1]?.text || 'Match'}</p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="md:col-span-2 flex flex-col justify-between bg-slate-950 rounded-2xl border border-slate-800 p-4">
                    {activeChat ? (
                      <>
                        <div className="flex items-center gap-3 border-b border-slate-800 pb-3">
                          <img src={activeChat.userAvatar} alt={activeChat.userName} className="w-10 h-10 rounded-full object-cover" />
                          <div>
                            <h3 className="font-bold text-white text-sm">{activeChat.userName}</h3>
                            <span className="text-[10px] text-emerald-400 font-bold">🟢 Online</span>
                          </div>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 py-4 max-h-[300px] px-1">
                          {activeChat.messages.map(msg => {
                            const isMe = msg.sender === currentUser?.name;
                            return (
                              <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                <div className={`max-w-[75%] p-3 rounded-2xl text-xs leading-relaxed ${isMe ? 'bg-amber-500 text-slate-950 font-medium' : 'bg-slate-900 border border-slate-800 text-slate-100'}`}>
                                  {msg.text}
                                </div>
                                <span className="text-[9px] text-slate-500 mt-1 px-1">{msg.time}</span>
                              </div>
                            );
                          })}
                        </div>

                        <form onSubmit={handleSendMessage} className="flex gap-2 pt-3 border-t border-slate-800">
                          <input 
                            type="text" 
                            value={newMessageText} 
                            onChange={(e) => setNewMessageText(e.target.value)} 
                            placeholder={t.sendPlaceholder} 
                            className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500" 
                            required 
                          />
                          <button type="submit" className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider">
                            {t.sendBtn}
                          </button>
                        </form>
                      </>
                    ) : (
                      <div className="flex flex-col items-center justify-center h-full text-center py-20 space-y-2">
                        <div className="text-3xl">🍿</div>
                        <p className="text-xs text-slate-400">Selecciona un chat.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'critics' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <h2 className="text-2xl font-black">📰 Críticos & Medios</h2>
                
                {currentUser?.isCritic ? (
                  <form onSubmit={handlePublishReview} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4 shadow-xl">
                    <h3 className="text-sm font-black text-amber-500">✍️ Publicar Reseña (🌟)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="block mb-1 text-slate-400">Película:</label>
                        <input type="text" value={newReviewMovie} onChange={(e) => setNewReviewMovie(e.target.value)} placeholder="Película..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" required />
                      </div>
                      <div>
                        <label className="block mb-1 text-slate-400">Puntaje (1-10):</label>
                        <input type="number" min="1" max="10" value={newReviewRating} onChange={(e) => setNewReviewRating(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200" required />
                      </div>
                    </div>
                    <div className="text-xs">
                      <label className="block mb-1 text-slate-400">Análisis:</label>
                      <textarea rows="3" value={newReviewText} onChange={(e) => setNewReviewText(e.target.value)} placeholder="Escribe..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">Publicar</button>
                  </form>
                ) : (
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center space-y-2 text-xs">
                    <p className="text-amber-400 font-bold">🔒 Requiere Insignia de Crítico.</p>
                  </div>
                )}

                <div className="space-y-4 pt-2">
                  {reviewsList.map(rev => (
                    <div key={rev.id} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-3">
                      <div className="flex justify-between items-start text-xs">
                        <div>
                          <span className="font-bold text-amber-500 flex items-center gap-1">
                            {rev.author} <span className="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">🌟 Crítico</span>
                          </span>
                          <p className="text-[10px] text-slate-400">🎙️ {rev.mediaOutlet}</p>
                        </div>
                        <span className="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs">★ {rev.rating}/10</span>
                      </div>
                      <h4 className="text-base font-black">{rev.movieTitle}</h4>
                      <p className="text-xs text-slate-300 leading-relaxed">{rev.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'profile' && currentUser && (
              <div className="max-w-xl mx-auto space-y-6">
                <form onSubmit={handleSaveProfile} className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-xl">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-xl font-black">{currentUser.name}</h2>
                      <p className="text-xs text-amber-500">{currentUser.roleLabel}</p>
                    </div>
                    <button type="button" onClick={() => setShowSubscriptionModal(true)} className="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs shadow">
                      {currentUser.isPremium ? '⭐ Premium' : '🚀 Planes'}
                    </button>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div>
                      <div className="flex justify-between items-center mb-2">
                        <label className="font-bold text-amber-400">
                          📸 Fotos ({editPhotos.length} / {currentUser?.isPremium ? '10' : '3'}):
                        </label>
                      </div>

                      <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                        {editPhotos.map((photo, idx) => (
                          <div key={idx} className="relative group aspect-square rounded-2xl overflow-hidden border border-slate-800 bg-slate-950">
                            <img src={photo} alt="Foto" className="w-full h-full object-cover" />
                            <button type="button" onClick={() => handleRemovePhoto(idx)} className="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">✕</button>
                          </div>
                        ))}

                        {editPhotos.length < (currentUser?.isPremium ? 10 : 3) && (
                          <label className="aspect-square rounded-2xl border-2 border-dashed border-slate-700 hover:border-amber-500 bg-slate-950/50 flex flex-col items-center justify-center cursor-pointer text-slate-400 hover:text-amber-400">
                            <span className="text-2xl font-bold">+</span>
                            <input type="file" accept="image/*" onChange={handleImageCompressionAndAdd} className="hidden" />
                          </label>
                        )}
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1 text-slate-400">Biografía:</label>
                      <textarea rows="3" value={editBio} onChange={(e) => setEditBio(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">Guardar</button>
                  </div>
                </form>
              </div>
            )}

            {activeTab === 'admin' && currentUser?.role === 'admin' && (
              <div className="max-w-4xl mx-auto bg-slate-900 border border-amber-500/40 rounded-3xl p-6 space-y-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h2 className="text-2xl font-black text-white">🛡️ Admin</h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {usersList.map(u => (
                    <div key={u.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col gap-3">
                      <div className="flex gap-3 items-start">
                        <img src={u.avatar} alt="Avatar" className="w-14 h-14 rounded-xl object-cover" />
                        <div>
                          <p className="font-bold text-white text-sm">{u.name} {u.isCritic && '🌟'}</p>
                          <p className="text-xs text-amber-400">{u.roleLabel}</p>
                        </div>
                      </div>
                      <button onClick={() => handleToggleCriticBadge(u.id)} className="w-full text-[10px] font-bold py-1.5 rounded-lg border bg-slate-800 text-slate-300 border-slate-700">
                        {u.isCritic ? '🌟 Quitar Crítico' : '✨ Dar Crítico'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {showMatchModal && matchedUser && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl">
                <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 p-1">
                  <img src={matchedUser.avatar} alt="Match" className="w-full h-full rounded-full object-cover" />
                </div>
                <div>
                  <h3 className="text-2xl font-black text-amber-400">{t.matchTitle}</h3>
                </div>
                <div className="flex flex-col gap-2 pt-2">
                  <button onClick={() => { setShowMatchModal(false); const chat = chatsList.find(c => c.userId === matchedUser.id); if (chat) setActiveChat(chat); setActiveTab('chats'); }} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">
                    {t.openChatNow}
                  </button>
                  <button onClick={() => setShowMatchModal(false)} className="w-full bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs">
                    {t.keepSearching}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSubscriptionModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white">🚀 Planes</h3>
                  <button onClick={() => setShowSubscriptionModal(false)} className="text-slate-400 font-bold">✖</button>
                </div>
                <div className="space-y-4 text-xs">
                  <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-bold text-slate-300 text-sm">Estándar (Gratis)</h4>
                    <button onClick={() => handleUpgradePlan(false)} className="w-full mt-2 bg-slate-800 text-slate-300 font-bold py-2 rounded-xl">Elegir</button>
                  </div>
                  <div className="bg-amber-500/20 border border-amber-500/50 p-4 rounded-2xl">
                    <h4 className="font-bold text-amber-400 text-sm">⭐ Premium ($4.99/mes)</h4>
                    <button onClick={() => handleUpgradePlan(true)} className="w-full mt-2 bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl uppercase">Obtener</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-black text-white">{authMode === 'signup' ? 'Registro' : 'Ingreso'}</h3>
                  <button onClick={() => setShowAuthModal(false)} className="text-slate-400 font-bold">✖</button>
                </div>
                <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block mb-1 text-slate-400">Nombre:</label>
                      <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                    </div>
                  )}
                  <div>
                    <label className="block mb-1 text-slate-400">Email:</label>
                    <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>
                  <div>
                    <label className="block mb-1 text-slate-400">Contraseña:</label>
                    <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200" required />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">Enviar</button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</body>
</html>
