                <div className={`grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 ${cardBg} rounded-3xl p-2 md:p-4 md:min-h-[560px]`}>
                  <div className={`${activeChat ? 'hidden md:block' : 'block'} md:border-r ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} md:pr-3 space-y-2 p-2 md:p-0`}>
                    <h3 className="text-xs font-bold text-amber-500 uppercase px-2">{t.activeChats}</h3>
                    {chatsList.length === 0 ? (
                      <p className={`text-xs ${mutedText} p-2`}>{t.noChats}</p>
                    ) : (
                      chatsList.map(chat => (
                        <div 
                          key={chat.id} 
                          onClick={() => { setActiveChat(chat); setShowEmojiPicker(false); setShowStickerPicker(false); }}
                          className={`flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition-all ${activeChat?.id === chat.id ? 'bg-amber-500/20 border border-amber-500/50' : `${isDarkMode ? 'hover:bg-slate-800/60' : 'hover:bg-slate-100'}`}`}
                        >
                          <img src={peerOf(chat).avatar} alt={peerOf(chat).name} className="w-12 h-12 rounded-full object-cover border border-amber-500/30" />
                          <div className="overflow-hidden flex-1">
                            <h4 className={`${isChatUnread(chat) ? 'font-black' : 'font-bold'} ${textColor} text-sm truncate`}>{peerOf(chat).name}{isChatUnread(chat) && <span className="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-rose-500 align-middle"></span>}</h4>
                            <p className={`text-xs ${mutedText} truncate`}>
                              {chat.messages[chat.messages.length - 1]?.isSticker || chat.messages[chat.messages.length - 1]?.text?.startsWith('STCK:') ? '🎬 [Sticker Cinéfilo]' : (chat.messages[chat.messages.length - 1]?.text || 'Match')}
                            </p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className={`md:col-span-2 ${activeChat ? 'flex' : 'hidden md:flex'} flex-col justify-between ${subCardBg} rounded-2xl border p-3 md:p-4 relative h-[calc(100dvh-150px)] md:h-[540px]`}>
                    {activeChat ? (
                      <>
                        <div className={`flex items-center justify-between gap-2 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                          <div className="flex items-center gap-3 min-w-0">
                            <button type="button" onClick={() => { setActiveChat(null); setShowEmojiPicker(false); setShowStickerPicker(false); }} className={`md:hidden shrink-0 ${cardBg} w-9 h-9 rounded-full text-lg font-black ${textColor}`} aria-label="Volver">←</button>
                            <img src={peerOf(activeChat).avatar} alt={peerOf(activeChat).name} className="w-10 h-10 rounded-full object-cover shrink-0" />
                            <div className="min-w-0">
                              <h3 className={`font-bold ${textColor} text-sm truncate`}>{peerOf(activeChat).name}</h3>
                              <span className="text-[10px] text-emerald-500 font-bold">🟢 En línea</span>
                            </div>
                          </div>
                          <button onClick={() => { if (window.confirm('¿Borrar este chat?')) handleDeleteChat(activeChat.id); }} className="shrink-0 bg-rose-500/25 hover:bg-rose-500/40 text-rose-400 border border-rose-500/40 text-[10px] font-bold px-3 py-1.5 rounded-xl transition-all shadow" aria-label="Borrar chat">
                            🗑️<span className="hidden sm:inline"> Borrar Chat</span>
                          </button>
                        </div>

                        <div className="flex-1 overflow-y-auto space-y-3 py-4 px-1">
                          {(activeChat.messages || []).map(msg => {
                            const isMe = msg.sender === currentUser?.name;
                            const isStickerMsg = msg.isSticker || msg.text?.startsWith('STCK:');
                            const sk = isStickerMsg ? parseSticker(msg.text) : null;

                            return (
                              <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                {isStickerMsg ? (
                                  <div className={`px-6 py-4 rounded-3xl border border-white/20 shadow-xl flex flex-col items-center justify-center gap-2 bg-gradient-to-br ${sk.grad} min-w-[130px] max-w-[75%] select-none`}>
                                    <span className="text-7xl leading-none" style={{ filter: 'drop-shadow(0 4px 6px rgba(0,0,0,.35))' }}>{sk.emoji}</span>
                                    {sk.caption && <span className="text-sm font-extrabold text-white text-center leading-tight" style={{ textShadow: '0 1px 3px rgba(0,0,0,.6)' }}>{sk.caption}</span>}
                                  </div>
                                ) : (
                                  <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words ${isMe ? 'bg-amber-500 text-slate-950 font-medium rounded-br-md' : `${cardBg} ${textColor} rounded-bl-md`}`}>
                                    {msg.text}
                                  </div>
                                )}
                                <span className="text-[10px] text-slate-400 mt-1 px-1">{msg.time}</span>
                              </div>
                            );
                          })}
                          <div id="chat-end"></div>
                        </div>

                        {showEmojiPicker && (
                          <div className={`absolute bottom-20 left-4 ${cardBg} p-3 rounded-2xl shadow-2xl grid grid-cols-6 gap-2 z-20`}>
                            {QUICK_EMOJIS.map(em => (
                              <button key={em} type="button" onClick={() => setNewMessageText(prev => prev + em)} className="text-xl hover:scale-125 transition-transform p-1">{em}</button>
                            ))}
                          </div>
                        )}

                        {showStickerPicker && (
                          <div className={`absolute bottom-20 left-3 right-3 ${cardBg} border border-amber-500/40 p-4 rounded-2xl shadow-2xl z-20 max-h-[55%] overflow-y-auto`}>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-sm font-bold text-amber-500">🍿 Stickers cinéfilos</span>
                              <button onClick={() => setShowStickerPicker(false)} className={`${mutedText} text-xs font-bold`}>✕ Cerrar</button>
                            </div>
                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
                              {CINE_STICKERS.map(st => (
                                <div key={st.id} onClick={() => handleSendMessage(null, st.url, true)} className={`bg-gradient-to-br ${st.grad} border border-white/20 p-2 rounded-2xl cursor-pointer text-center transition-all active:scale-95 hover:scale-105 flex flex-col items-center justify-center gap-1 min-h-[88px]`}>
                                  <span className="text-4xl leading-none">{st.emoji}</span>
                                  <p className="text-[11px] font-bold text-white leading-tight" style={{ textShadow: '0 1px 2px rgba(0,0,0,.6)' }}>{st.caption}</p>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}

                        <form onSubmit={(e) => handleSendMessage(e)} className={`flex items-center gap-2 pt-3 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                          <button type="button" onClick={() => { setShowEmojiPicker(!showEmojiPicker); setShowStickerPicker(false); }} className={`shrink-0 ${cardBg} w-10 h-10 rounded-xl text-base`} aria-label="Emojis">😀</button>
                          <button type="button" onClick={() => { setShowStickerPicker(!showStickerPicker); setShowEmojiPicker(false); }} className={`shrink-0 ${cardBg} h-10 px-3 rounded-xl text-xs font-bold text-amber-500`} aria-label="Stickers">🍿<span className="hidden sm:inline"> Stickers</span></button>

                          <input
                            type="text"
                            value={newMessageText}
                            onChange={(e) => setNewMessageText(e.target.value)}
                            placeholder={t.sendPlaceholder}
                            className={`flex-1 min-w-0 ${inputBg} rounded-xl px-3 h-10 text-sm focus:outline-none focus:border-amber-500`}
                          />
                          <button type="submit" className="shrink-0 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black w-10 h-10 sm:w-auto sm:px-4 rounded-xl text-base sm:text-xs uppercase tracking-wider" aria-label="Enviar">
                            <span className="sm:hidden">➤</span><span className="hidden sm:inline">{t.sendBtn}</span>
                          </button>
                        </form>
                      </>
                    ) : (
                      <div className="flex flex-col items-center justify-center h-full text-center py-20 space-y-2">
                        <div className="text-3xl">🍿</div>
                        <p className={`text-xs ${mutedText}`}>Selecciona un chat.</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'critics' && (
              <div className="space-y-6 max-w-3xl mx-auto">
                <h2 className={`text-2xl font-black ${textColor}`}>📰 Críticos & Medios</h2>
                
                {currentUser?.isCritic ? (
                  <form onSubmit={handlePublishReview} className={`${cardBg} rounded-3xl p-6 space-y-4 shadow-xl`}>
                    <h3 className="text-sm font-black text-amber-500">✍️ Publicar Reseña Oficial (Insignia 🌟)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className={`block mb-1 ${mutedText}`}>Película:</label>
                        <input type="text" value={newReviewMovie} onChange={(e) => setNewReviewMovie(e.target.value)} placeholder="Ej: Oppenheimer..." className={`w-full ${inputBg} rounded-xl p-2.5`} required />
                      </div>
                      <div>
                        <label className={`block mb-1 ${mutedText}`}>Puntaje (1-10):</label>
                        <input type="number" min="1" max="10" value={newReviewRating} onChange={(e) => setNewReviewRating(e.target.value)} className={`w-full ${inputBg} rounded-xl p-2.5`} required />
                      </div>
                    </div>
                    <div className="text-xs">
                      <label className={`block mb-1 ${mutedText}`}>Análisis / Reseña:</label>
                      <textarea rows="3" value={newReviewText} onChange={(e) => setNewReviewText(e.target.value)} placeholder="Escribe tu análisis..." className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">Publicar Reseña Cloud</button>
                  </form>
                ) : (
                  <div className={`${cardBg} p-6 rounded-2xl text-center space-y-2 text-xs`}>
                    <p className="text-amber-500 font-bold">🔒 Necesitas la Insignia de Crítico para publicar reseñas.</p>
                  </div>
                )}

                <div className="space-y-4 pt-2">
                  {reviewsList.map(rev => (
                    <div key={rev.id} className={`${cardBg} rounded-3xl p-6 space-y-3`}>
                      <div className="flex justify-between items-start text-xs">
                        <div>
                          <span className="font-bold text-amber-500 flex items-center gap-1">
                            {rev.author} <span className="text-[10px] bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded">🌟 Crítico</span>
                          </span>
                          <p className={`text-[10px] ${mutedText}`}>🎙️ Medio: {rev.mediaOutlet || 'Independiente'}</p>
                        </div>
                        <span className="bg-amber-500 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs">★ {rev.rating}/10</span>
                      </div>
                      <h4 className={`text-base font-black ${textColor}`}>{rev.movieTitle}</h4>
                      <p className={`text-xs ${mutedText} leading-relaxed`}>{rev.content}</p>

                      <div className={`flex items-center gap-4 pt-2 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-100'} text-xs`}>
                        <button onClick={() => handleLikeReview(rev)} className={`flex items-center gap-1.5 ${subCardBg} px-3 py-1.5 rounded-xl border font-bold text-amber-500`}>
                          <span>🍿</span> <span>{rev.likes || 0} Me gusta</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'profile' && currentUser && (
              <div className="max-w-xl mx-auto space-y-6">
                <div className={`${cardBg} rounded-3xl p-6 space-y-4 shadow-xl`}>
                  <h3 className={`font-black ${textColor} text-base`}>🔔 Notificaciones Push</h3>
                  <div className={`flex items-center justify-between ${subCardBg} border p-3 rounded-2xl text-xs`}>
                    <span className={`font-bold ${textColor}`}>Silenciar Notificaciones</span>
                    <input type="checkbox" checked={editMuteNotifications} onChange={(e) => setEditMuteNotifications(e.target.checked)} className="w-5 h-5 accent-amber-500 cursor-pointer" />
                  </div>
                </div>

                <div className={`${cardBg} rounded-3xl p-6 space-y-3 shadow-xl`}>
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className={`font-black ${textColor} text-base`}>🛡️ Identidad Verificada</h3>
                      <p className={`text-xs ${mutedText} mt-1`}>{currentUser.kycVerified ? "Perfil verificado con tilde azul." : "Obtén el tilde azul verificando tu identidad."}</p>
                    </div>
                    {currentUser.kycVerified ? (
                      <span className="bg-sky-500/20 text-sky-400 border border-sky-500/40 text-xs font-black px-3 py-1.5 rounded-xl">✔ VERIFICADO</span>
                    ) : (
                      <button onClick={handleStartKycProcess} className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow-lg shadow-sky-500/20">🪪 Verificar DNI</button>
                    )}
                  </div>
                </div>

                <div className={`${cardBg} border border-amber-500/40 rounded-3xl p-6 space-y-4 shadow-xl`}>
                  <h3 className="text-base font-black text-amber-500">🚀 Plan de Usuario</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div className={`p-4 rounded-2xl border transition-all ${!currentUser.isPremium ? 'bg-amber-500/10 border-amber-500 text-amber-600 font-bold' : `${subCardBg}${mutedText}`}`}>
                      <div className="flex justify-between items-center mb-1">
                        <span className={`font-bold text-sm ${textColor}`}>Free</span>
                        {!currentUser.isPremium && <span className="bg-amber-500 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-md uppercase">ACTIVO</span>}
                      </div>
                      <p className={`text-[11px] ${mutedText} mt-2`}><b>Radar:</b> hasta 100 km</p>
                      <button type="button" onClick={() => handleUpgradePlan(false)} disabled={!currentUser.isPremium} className={`w-full mt-3 ${subCardBg} disabled:opacity-40 font-bold py-2 rounded-xl text-xs`}>
                        {currentUser.isPremium ? "Cambiar a Free" : "Plan Actual"}
                      </button>
                    </div>

                    <div className={`p-4 rounded-2xl border transition-all ${currentUser.isPremium ? 'bg-amber-500/20 border-amber-500 text-amber-500 shadow-lg' : `${subCardBg}${textColor}`}`}>
                      <div className="flex justify-between items-center mb-1">
                        <span className="font-bold text-sm text-amber-500">⭐ Premium</span>
                        {currentUser.isPremium && <span className="bg-amber-500 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-md uppercase">ACTIVO</span>}
                      </div>
                      <p className="text-xs font-black text-amber-500">u$d 4.99 / mes</p>
                      <p className={`text-[11px] ${mutedText} mt-1`}><b>Radar:</b> hasta 500 km</p>
                      <button type="button" onClick={() => handleUpgradePlan(true)} disabled={currentUser.isPremium} className="w-full mt-3 bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-slate-950 font-black py-2 rounded-xl text-xs uppercase">
                        {currentUser.isPremium ? "Plan Actual" : "Obtener Premium"}
                      </button>
                    </div>
                  </div>
                </div>

                {profileSavedMsg && (
                  <div className="bg-emerald-500/15 border border-emerald-500/50 text-emerald-500 font-black text-sm rounded-2xl px-4 py-3 text-center">{profileSavedMsg}</div>
                )}

                {!profileEditing && (
                  <div className={`${cardBg} rounded-3xl p-6 space-y-5 shadow-xl`}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0">
                        <h2 className={`text-xl font-black ${textColor} flex items-center gap-2`}>
                          {currentUser.name} {currentUser.kycVerified && <span className="text-sky-400 text-sm">✔</span>}
                        </h2>
                        <p className="text-xs text-amber-500">{currentUser.roleLabel}</p>
                        <p className={`text-xs ${mutedText} mt-1`}>{currentUser.sex || '—'} • Busca: {currentUser.interestedIn || 'Todos / Cualquiera'}</p>
                      </div>
                      <button type="button" onClick={() => { setProfileEditing(true); setProfileSavedMsg(''); }} className="shrink-0 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs shadow">✏️ Editar perfil</button>
                    </div>
                    {(currentUser.photos || []).length > 0 && (
                      <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                        {(currentUser.photos || []).map((photo, idx) => (
                          <div key={idx} className="aspect-square rounded-2xl overflow-hidden border border-amber-500/30">
                            <img src={photo} alt="Foto" className="w-full h-full object-cover" />
                          </div>
                        ))}
                      </div>
                    )}
                    <div>
                      <p className="text-xs font-bold text-amber-500 mb-1">Biografía pública</p>
                      <p className={`text-sm ${textColor}`}>{currentUser.publicBio || currentUser.bio || 'Sin biografía todavía.'}</p>
                    </div>
                    <div>
                      <p className="text-xs font-bold text-rose-500 mb-1">Biografía de citas</p>
                      <p className={`text-sm ${textColor}`}>{currentUser.datingBio || 'Sin biografía de citas todavía.'}</p>
                    </div>
                  </div>
                )}

                {profileEditing && (
                <form onSubmit={handleSaveProfile} className={`${cardBg} rounded-3xl p-6 space-y-5 shadow-xl`}>
                  <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-4`}>
                    <div>
                      <h2 className={`text-xl font-black ${textColor} flex items-center gap-2`}>
                        {currentUser.name} {currentUser.kycVerified && <span className="text-sky-400 text-sm">✔</span>}
                      </h2>
                      <p className="text-xs text-amber-500">{currentUser.roleLabel}</p>
                    </div>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-amber-500 block mb-2">Mis Fotos Reales ({editPhotos.length} / {currentUser?.isPremium ? '10' : '3'}):</label>
                      <div className="grid grid-cols-3 sm:grid-cols-4 gap-3 mb-3">
                        {editPhotos.map((photo, idx) => (
                          <div key={idx} className={`relative group aspect-square rounded-2xl overflow-hidden border ${isDarkMode ? 'border-slate-800 bg-slate-950' : 'border-slate-300 bg-white'}`}>
                            <img src={photo} alt="Foto real" className="w-full h-full object-cover" />
                            <button type="button" onClick={() => handleRemovePhoto(idx, false)} className="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">✕</button>
                          </div>
                        ))}
                      </div>
                      <label className="block cursor-pointer bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 px-4 rounded-xl text-center text-xs shadow-md">
                        📁 Seleccionar Foto de la Galería
                        <input type="file" accept="image/*" onChange={(e) => handleFileSelected(e, false)} className="hidden" />
                      </label>
                    </div>

                    <div className="grid grid-cols-2 gap-3 pt-2">
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Mi Género:</label>
                        <select value={editSex} onChange={(e) => setEditSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                          {SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Quiero relacionarme con:</label>
                        <select value={editInterestedIn} onChange={(e) => setEditInterestedIn(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                          {SEEKING_SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block mb-1 text-amber-500 font-bold">Biografía Pública:</label>
                      <textarea rows="2" value={editPublicBio} onChange={(e) => setEditPublicBio(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} />
                    </div>

                    <div>
                      <label className="block mb-1 text-rose-500 font-bold">Biografía de Citas:</label>
                      <textarea rows="2" value={editDatingBio} onChange={(e) => setEditDatingBio(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} />
                    </div>

                    <div className="flex gap-3">
                      <button type="button" onClick={() => { setProfileEditing(false); setEditPhotos(currentUser.photos || []); setEditPublicBio(currentUser.publicBio || currentUser.bio || ''); setEditDatingBio(currentUser.datingBio || currentUser.bio || ''); }} className={`flex-1 ${subCardBg} border ${textColor} font-black py-3 rounded-xl uppercase`}>Cancelar</button>
                      <button type="submit" className="flex-[2] bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl uppercase shadow-lg">Guardar Perfil</button>
                    </div>
                  </div>
                </form>
                )}
              </div>
            )}

            {activeTab === 'admin' && isAdmin && (
              <div className={`max-w-4xl mx-auto ${cardBg} border border-amber-500/40 rounded-3xl p-6 space-y-6 shadow-2xl`}>
                <div className={`flex items-center justify-between border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-4`}>
                  <div>
                    <h2 className={`text-2xl font-black ${textColor}`}>🛡️ Panel Administrador Cloud</h2>
                    <p className={`text-xs text-amber-500 mt-1`}>Gestión de usuarios y verificaciones.</p>
                  </div>
                  <span className="bg-amber-500/25 border border-amber-500/50 text-amber-500 px-3 py-1 rounded-xl text-xs font-bold">
                    Total: {usersList.length}
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {usersList.map(u => {
                    const userPhotos = u.photos || [u.avatar];
                    return (
                      <div key={u.id} className={`${subCardBg} border p-4 rounded-xl flex flex-col gap-3`}>
                        <div className="flex gap-3 items-start">
                          <img src={u.avatar} alt="Avatar" className="w-16 h-16 rounded-xl object-cover border border-slate-700" />
                          <div className="overflow-hidden flex-1">
                            <p className={`font-bold ${textColor} text-sm truncate flex items-center gap-1`}>
                              {u.name} {u.kycVerified && <span className="text-sky-400 text-xs">✔</span>} {u.isCritic && '🌟'} {u.isPremium && '⭐'}
                            </p>
                            <p className="text-xs text-amber-500">{u.roleLabel}</p>
                            <p className={`text-[10px] ${mutedText} break-all`}>{u.email}</p>
                          </div>
                        </div>

                        <div className={`flex flex-col gap-2 border-t ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pt-3`}>
                          <button onClick={() => handleToggleKycAdmin(u.id)} className={`w-full text-[10px] font-bold py-1.5 rounded-lg border ${u.kycVerified ? 'bg-sky-500/20 text-sky-300 border-sky-500/40' : `${subCardBg}${textColor} border-slate-700`}`}>
                            {u.kycVerified ? '✔ Quitar Verificación' : '🪪 Otorgar Verificación'}
                          </button>
                          <button onClick={() => handleToggleCriticBadge(u.id)} className={`w-full text-[10px] font-bold py-1.5 rounded-lg border ${u.isCritic ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : `${subCardBg}${textColor} border-slate-700`}`}>
                            {u.isCritic ? '🌟 Quitar Crítico' : '✨ Otorgar Crítico'}
                          </button>
                          <button onClick={() => handleToggleAdminPremium(u.id)} className={`w-full text-[10px] font-bold py-1.5 rounded-lg border ${u.isPremium ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40' : `${subCardBg}${textColor} border-slate-700`}`}>
                            {u.isPremium ? '⭐ Quitar Premium' : '⭐ Otorgar Premium'}
                          </button>
                          {u.email.toLowerCase() !== 'marbuttice@gmail.com' && (
                            <button onClick={() => handleDeleteUser(u.id)} className="w-full bg-rose-500/20 text-rose-500 hover:bg-rose-500/30 text-[10px] font-bold py-1.5 rounded-lg border border-rose-500/30">
                              🗑️ Eliminar Usuario
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          {showKycModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-sky-500/50 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl`}>
                <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                  <h3 className="text-lg font-black text-sky-400">🪪 Verificación de Identidad</h3>
                  <button onClick={() => setShowKycModal(false)} className={`${mutedText} font-bold`}>✕</button>
                </div>

                {kycProcessing ? (
                  <div className="text-center py-10 space-y-4">
                    <div className="w-12 h-12 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p className="text-sm font-bold text-sky-300">Validando datos biométricos...</p>
                  </div>
                ) : (
                  <div className="space-y-4 text-xs">
                    <p className={`${mutedText} leading-relaxed`}>Sube una foto de tu documento y una selfie para obtener el tilde azul.</p>
                    <div className="space-y-3">
                      <div className={`${subCardBg} border p-3 rounded-2xl flex items-center justify-between`}>
                        <p className={`font-bold ${textColor}`}>1. DNI (Frente):</p>
                        <label className="bg-sky-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl cursor-pointer">
                          {kycDocFront ? "✔ Cargado" : "Subir"}
                          <input type="file" accept="image/*" onChange={(e) => handleSimulateKycUpload('front', e)} className="hidden" />
                        </label>
                      </div>
                      <div className={`${subCardBg} border p-3 rounded-2xl flex items-center justify-between`}>
                        <p className={`font-bold ${textColor}`}>2. Selfie:</p>
                        <label className="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl cursor-pointer">
                          {kycSelfie ? "✔ Capturada" : "Tomar"}
                          <input type="file" accept="image/*" onChange={(e) => handleSimulateKycUpload('selfie', e)} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <button onClick={handleFinalizeKycVerification} className="w-full bg-sky-500 text-slate-950 font-black py-3 rounded-xl uppercase shadow-lg">Enviar Verificación</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {showMatchModal && matchedUser && (
            <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/50 rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl`}>
                <div className="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-amber-500 to-rose-500 p-1">
                  <img src={matchedUser.photos?.[0] || matchedUser.avatar} alt="Match" className="w-full h-full rounded-full object-cover" />
                </div>
                <h3 className="text-2xl font-black text-amber-500">{t.matchTitle}</h3>
                <div className="flex flex-col gap-2 pt-2">
                  <button onClick={() => { setShowMatchModal(false); const chat = chatsList.find(c => (c.participants || []).includes(matchedUser.email)); if (chat) setActiveChat(chat); setActiveTab('chats'); }} className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl text-xs uppercase">{t.openChatNow}</button>
                  <button onClick={() => setShowMatchModal(false)} className={`w-full ${subCardBg} ${textColor} font-bold py-2.5 rounded-xl text-xs`}>{t.keepSearching}</button>
                </div>
              </div>
            </div>
          )}

          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className={`${cardBg} border border-amber-500/40 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto`}>
                <div className={`flex justify-between items-center border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} pb-3`}>
                  <h3 className={`text-lg font-black ${textColor}`}>{authMode === 'signup' ? '✨ Crear Cuenta' : (authMode === 'login' ? '🔑 Iniciar Sesión' : '🔄 Recuperar Contraseña')}</h3>
                  <button onClick={() => { setShowAuthModal(false); setResetStep(1); }} className={`${mutedText} font-bold text-lg`}>✕</button>
                </div>

                {authMode === 'signup' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Nombre Completo:</label>
                      <input type="text" value={authName} onChange={(e) => setAuthName(e.target.value)} placeholder="Ej: Juan Pérez" className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className="block mb-1 text-amber-500 font-bold">Fotos de Perfil:</label>
                      <div className="grid grid-cols-3 gap-2 mb-2">
                        {authPhotos.map((photo, idx) => (
                          <div key={idx} className="relative aspect-square rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                            <img src={photo} alt="Foto" className="w-full h-full object-cover" />
                            <button type="button" onClick={() => handleRemovePhoto(idx, true)} className="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">✕</button>
                          </div>
                        ))}
                      </div>
                      <label className="block w-full text-center bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl cursor-pointer">
                        📁 Agregar Foto de Perfil
                        <input type="file" accept="image/*" onChange={(e) => handleFileSelected(e, true)} className="hidden" />
                      </label>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Fecha Nacimiento (+18):</label>
                        <input type="date" value={authBirthdate} onChange={(e) => setAuthBirthdate(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                      </div>
                      <div>
                        <label className={`block mb-1 ${mutedText} font-bold`}>Mi Género:</label>
                        <select value={authSex} onChange={(e) => setAuthSex(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                          {SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Interesado en (Radar):</label>
                      <select value={authInterestedIn} onChange={(e) => setAuthInterestedIn(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`}>
                        {SEEKING_SEXUALITIES_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Contraseña:</label>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">Registrarme</button>
                  </form>
                )}

                {authMode === 'login' && (
                  <form onSubmit={handleAuthSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className={`block mb-1 ${mutedText} font-bold`}>Correo Electrónico:</label>
                      <input type="email" value={authEmail} onChange={(e) => setAuthEmail(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <div>
                      <label className={`${mutedText} font-bold block mb-1`}>Contraseña:</label>
                      <input type="password" value={authPassword} onChange={(e) => setAuthPassword(e.target.value)} className={`w-full ${inputBg} rounded-xl p-3`} required />
                    </div>
                    <button type="submit" className="w-full bg-amber-500 text-slate-950 font-black py-3 rounded-xl uppercase">Ingresar</button>
                  </form>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) { console.error(e); }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./pwabuilder-sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
