name: Build Android APK with Bubblewrap

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate TWA Android Project
      run: |
        npx @bubblewrap/cli init --manifest=https://plottwistinfoapp-marcelo.github.io/Plottwisme/manifest.json --directory=android-app --skipAsking

    - name: Build APK
      run: |
        cd android-app
        npx @bubblewrap/cli build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android-app/*.apk
