name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare Web Directory
      run: |
        mkdir -p www
        cp index.html www/

    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Add Android Platform
      run: |
        npx cap add android || true

    - name: Set Version Code to 15
      run: |
        if [ -f "android/app/build.gradle" ]; then
          sed -i 's/versionCode [0-9]*/versionCode 15/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.15"/g' android/app/build.gradle
        fi

    - name: Fix Kotlin Duplicate Classes Conflict
      run: |
        if [ -f "android/build.gradle" ]; then
          echo 'subprojects { configurations.all { resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22" } }' >> android/build.gradle
        fi

    - name: Sync Assets
      run: npx cap sync android

    - name: Build Release AAB via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease --no-daemon

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/**/*.aab
